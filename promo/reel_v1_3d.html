<style>

</div>
<script type="module">
/* ==================================================================================================
   COOPIX — рилс «Апокалипсис»: 3D-анимация на Three.js по таймлайну озвучки.
   Сцены: 1 хук (руины, 7%) · 2 Телеграм → маркет · 3 свайп + скачать · 4 офлайн · 5 экшен Stick Fight
          6 Серёга идёт за водой · 7 показали игры · 8 мультиплеер по QR · 9 время идёт · 10 скелеты (панчлайн) · 11 концовка
   Кадр собирается в 2D-холсте #out (3D + субтитры + плашки), его и пишет MediaRecorder вместе со звуком.
   ================================================================================================== */
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

const W = 1080, H = 1920, SPEED = 1.08; // ускорение озвучки
const out = document.getElementById("out"), ox = out.getContext("2d");
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => (t = clamp(t, 0, 1), t * t * (3 - 2 * t)), easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

/* ---------------- таймлайн из длительностей озвучки ---------------- */
const LINES = await (await fetch("vo/lines.json")).json();
const PAD = { l05: 3.2, l07: .6, l10: 1.4, l11: 1.6 }; // лишние секунды без слов: экшен, пауза перед панчлайном, концовка
const SC = []; let acc = .3;
for (const l of LINES) { const d = l.dur / SPEED + .25 + (PAD[l.id] || 0); SC.push({ id: l.id, a: acc, b: acc + d, vo: acc + .05, dur: l.dur / SPEED, text: l.text }); acc += d; }
const TOTAL = acc + .4;
const scAt = (t) => SC.find((s) => t >= s.a && t < s.b) || SC[SC.length - 1];

/* ---------------- рендер ---------------- */
const gl = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
gl.setPixelRatio(1); gl.setSize(W, H); gl.domElement.id = "gl"; document.body.append(gl.domElement);
gl.toneMapping = THREE.ACESFilmicToneMapping; gl.outputColorSpace = THREE.SRGBColorSpace; gl.shadowMap.enabled = true;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(50, W / H, .05, 400);
const composer = new EffectComposer(gl); composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .9, .55, .72); composer.addPass(bloom);

const hemi = new THREE.HemisphereLight(0xffb27a, 0x1a0c18, 1.1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xff8a50, 2.2); sun.position.set(-8, 10, 6); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); scene.add(sun);
const phoneLight = new THREE.PointLight(0x9fd0ff, 0, 3.5); scene.add(phoneLight);

const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .8, ...o });
const glow = (c, i = 2.5) => new THREE.MeshStandardMaterial({ color: 0x000000, emissive: c, emissiveIntensity: i });

/* ---------------- мир апокалипсиса ---------------- */
const world = new THREE.Group(); scene.add(world);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), M(0x2a1b16)); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; world.add(ground);
{ // руины: коробки-дома с «дырами», обломки
  const rnd = mulberry(7);
  for (let i = 0; i < 70; i++) {
    const w = 1.5 + rnd() * 4, h = 2 + rnd() * 14, d = 1.5 + rnd() * 4, a = rnd() * Math.PI * 2, r = 10 + rnd() * 50;
    const bx = Math.cos(a) * r, bz = Math.sin(a) * r - 10; if (Math.abs(bx) < 10 && bz > -8) continue; /* дома не ставим на площадку с героями */
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(new THREE.Color().setHSL(.05, .2, .08 + rnd() * .08)));
    b.position.set(bx, h / 2 - rnd() * 1.5, bz); b.rotation.set((rnd() - .5) * .15, rnd() * 3, (rnd() - .5) * .2); b.castShadow = true; world.add(b);
    for (let k = 0; k < 6; k++) { const win = new THREE.Mesh(new THREE.PlaneGeometry(.5, .7), rnd() < .12 ? glow(0xff7a2a, 1.4) : M(0x050304)); win.position.set(b.position.x + (rnd() - .5) * w * .7, 1 + rnd() * (h - 1.5), b.position.z + d / 2 + .02); win.rotation.y = b.rotation.y; }
  }
  for (let i = 0; i < 60; i++) { const x = (rnd() - .5) * 22, z = (rnd() - .5) * 14 - 3; if (Math.abs(x) < 7 && z > -3.5) continue; /* площадка с героями свободна от обломков */
    const r = new THREE.Mesh(new THREE.DodecahedronGeometry(.2 + rnd() * .6), M(0x3a2a22)); r.position.set(x, .1, z); r.castShadow = true; world.add(r); }
  const car = new THREE.Group(); /* машина-руина справа за героями */ const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, .7, 1.1), M(0x5a2a1a)); body.position.y = .55; const top = new THREE.Mesh(new THREE.BoxGeometry(1.2, .5, 1), M(0x4a2216)); top.position.set(-.2, 1.1, 0);
  car.add(body, top); car.position.set(3.4, 0, -2.5); car.rotation.set(.2, .7, .35); car.traverse((o) => o.castShadow = true); world.add(car);
}
const fire = new THREE.PointLight(0xff5a1a, 6, 12); fire.position.set(3.2, 1, -2.2); world.add(fire);
const keyL = new THREE.PointLight(0xffd2a8, 9, 9); keyL.position.set(-.8, 2.6, 2.6); world.add(keyL); // тёплый свет «на героев», чтобы их было видно
const rimL = new THREE.PointLight(0x6a9cff, 6, 7); rimL.position.set(1.5, 2.2, -1.6); world.add(rimL);
const ashGeo = new THREE.BufferGeometry(), ashN = 1600, ashP = new Float32Array(ashN * 3);
for (let i = 0; i < ashN; i++) { ashP[i * 3] = (Math.random() - .5) * 30; ashP[i * 3 + 1] = Math.random() * 14; ashP[i * 3 + 2] = (Math.random() - .5) * 20; }
ashGeo.setAttribute("position", new THREE.BufferAttribute(ashP, 3));
const ash = new THREE.Points(ashGeo, new THREE.PointsMaterial({ color: 0xffb08a, size: .05, transparent: true, opacity: .75 })); world.add(ash);
const skyCol = new THREE.Color(0x4a1a12); scene.background = skyCol.clone(); scene.fog = new THREE.Fog(0x4a1a12, 8, 60);
const sunBall = new THREE.Mesh(new THREE.SphereGeometry(4, 32, 16), glow(0xff6a2a, 3)); sunBall.position.set(-30, 12, -70); world.add(sunBall);
const moon = new THREE.Mesh(new THREE.SphereGeometry(2.4, 32, 16), glow(0xdfe8ff, 1.6)); moon.position.set(30, -20, -70); world.add(moon);

/* ---------------- человечки: суставы — группы, позы задаются углами ---------------- */
function person({ color = 0x2457c5, skin = 0xf3e6d6, hat = 0xe33b2e, neon = false } = {}) {
  const mat = neon ? glow(color, .85) : M(color), sk = neon ? glow(color, .85) : M(skin), r = .055;
  const cyl = (len, m) => { const g = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), m); g.position.y = -len / 2; g.castShadow = true; return g; };
  const root = new THREE.Group(), hips = new THREE.Group(); hips.position.y = .9; root.add(hips);
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.3, r * 1.3, .65, 8), mat); torso.position.y = .33; torso.castShadow = true; hips.add(torso);
  const neck = new THREE.Group(); neck.position.y = .66; hips.add(neck);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.17, 20, 14), sk); head.position.y = .2; head.castShadow = true; neck.add(head);
  if (!neon) {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(.175, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), M(hat)); cap.position.y = .22; neck.add(cap);
    const pom = new THREE.Mesh(new THREE.SphereGeometry(.05, 10, 8), M(hat)); pom.position.y = .4; neck.add(pom);
    for (const x of [-.06, .06]) { const e = new THREE.Mesh(new THREE.SphereGeometry(.022, 8, 6), M(0x111111)); e.position.set(x, .21, .155); neck.add(e); }
    const scarf = new THREE.Mesh(new THREE.TorusGeometry(.09, .03, 6, 12), M(hat)); scarf.rotation.x = Math.PI / 2; scarf.position.y = .04; neck.add(scarf);
  }
  const limb = (x, y, l1, l2, m) => { const s = new THREE.Group(); s.position.set(x, y, 0); s.add(cyl(l1, m)); const j = new THREE.Group(); j.position.y = -l1; s.add(j); j.add(cyl(l2, m)); hips.add(s); return [s, j]; };
  const [sL, eL] = limb(-.12, .6, .32, .3, mat), [sR, eR] = limb(.12, .6, .32, .3, mat), [hL, kL] = limb(-.08, 0, .44, .44, neon ? mat : M(0x22252b)), [hR, kR] = limb(.08, 0, .44, .44, neon ? mat : M(0x22252b));
  const hand = new THREE.Group(); hand.position.y = -.3; eR.add(hand);
  return { root, hips, neck, head, sL, eL, sR, eR, hL, kL, hR, kR, hand, mats: [mat, sk] };
}
function pose(p, name, t = 0) {
  const set = (g, x = 0, y = 0, z = 0) => g.rotation.set(x, y, z);
  p.hips.position.y = .9; set(p.hips); set(p.neck);
  if (name === "stand") { set(p.sL, 0, 0, .15); set(p.sR, 0, 0, -.15); set(p.eL); set(p.eR); set(p.hL); set(p.hR); set(p.kL); set(p.kR); p.hips.position.y = .9 + Math.sin(t * 2) * .01; }
  if (name === "walk" || name === "run") { const k = name === "run" ? 1.6 : 1, s = Math.sin(t * (name === "run" ? 11 : 6.5)) * .55 * k;
    set(p.hL, s); set(p.hR, -s); set(p.kL, Math.max(0, -s) * 1.2); set(p.kR, Math.max(0, s) * 1.2); set(p.sL, -s * .8, 0, .12); set(p.sR, s * .8, 0, -.12); set(p.eL, -.3); set(p.eR, -.3); p.hips.position.y = .9 + Math.abs(Math.cos(t * 6.5)) * .03 * k; set(p.hips, name === "run" ? .2 : .05); }
  if (name === "phone") { set(p.sL, -.9, .35, .1); set(p.eL, -1.1); set(p.sR, -.9, -.35, -.1); set(p.eR, -1.1); set(p.hL); set(p.hR); set(p.kL); set(p.kR); set(p.neck, .45); }
  if (name === "sitPhone") { pose(p, "phone"); p.hips.position.y = .42; set(p.hL, -1.5, 0, -.12); set(p.hR, -1.5, 0, .12); set(p.kL, 1.45); set(p.kR, 1.45); set(p.neck, .55 + Math.sin(t * 3) * .03); }
  if (name === "shoot") { set(p.sR, -1.57, 0, 0); set(p.eR); set(p.sL, -1.3, 0, .4); set(p.eL, -.5); set(p.hL, .25); set(p.hR, -.35); set(p.kL); set(p.kR, .5); }
  if (name === "jump") { set(p.hL, -1.1); set(p.kL, 1.6); set(p.hR, -.4); set(p.kR, .9); set(p.sR, -1.57); set(p.sL, -2.6, 0, .3); }
  if (name === "dead") { pose(p, "sitPhone"); set(p.neck, 1.05); set(p.hips, .25); }
}
function phoneMesh() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(.36, .72, .03), M(0x111216, { roughness: .35, metalness: .6 })); g.add(body);
  const cv = document.createElement("canvas"); cv.width = 540; cv.height = 1080; const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(.33, .66), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false })); scr.position.z = .016; g.add(scr);
  return { g, cv, cx: cv.getContext("2d"), tex };
}

/* ---------------- персонажи ---------------- */
const hero = person({ color: 0x2457c5, hat: 0xe33b2e }); world.add(hero.root);
const heroPhone = phoneMesh(); world.add(heroPhone.g);
const sereg = person({ color: 0x3d7a3a, hat: 0x2a2a2a, skin: 0xf0dcc8 }); world.add(sereg.root);
const pack = new THREE.Mesh(new THREE.BoxGeometry(.32, .42, .18), M(0x6a4a2a)); pack.position.set(0, .35, -.13); sereg.hips.add(pack);
const bucket = new THREE.Mesh(new THREE.CylinderGeometry(.13, .1, .22, 12, 1, true), M(0x9aa2aa, { side: THREE.DoubleSide, metalness: .6 })); bucket.position.y = -.12; sereg.hand.add(bucket);
const seregPhone = phoneMesh(); world.add(seregPhone.g);
const bones = new THREE.MeshStandardMaterial({ color: 0xece4d2, roughness: .6 });
const ribs = (p) => { for (let i = 0; i < 4; i++) { const r = new THREE.Mesh(new THREE.TorusGeometry(.1, .012, 5, 12, Math.PI), bones); r.rotation.set(Math.PI / 2, 0, 0); r.position.set(0, .2 + i * .1, .02); r.visible = false; r.userData.rib = 1; p.hips.add(r); } };
ribs(hero); ribs(sereg);
function skeleton(p, k) { // k 0..1: от живого к скелету
  p.root.traverse((o) => { if (o.userData.rib) o.visible = k > .5; });
  for (const m of p.mats) { if (!m.userData.c0) m.userData.c0 = m.color.clone(); m.color.copy(m.userData.c0).lerp(new THREE.Color(0xece4d2), k); }
}

/* ---------------- неоновая арена Stick Fight ---------------- */
const arena = new THREE.Group(); arena.position.set(0, 0, -300); scene.add(arena);
{
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), M(0x0b0618)); fl.rotation.x = -Math.PI / 2; arena.add(fl);
  const grid = new THREE.GridHelper(60, 60, 0xa56bff, 0x3a2370); grid.position.y = .01; arena.add(grid);
  for (const [x, y, w] of [[-4, 2.2, 4], [4, 2.2, 4], [0, 4.2, 5], [-7, 3.2, 3], [7, 3.4, 3]]) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(w, .25, 1.6), M(0x2a1a66)); p.position.set(x, y, 0); arena.add(p);
    const e = new THREE.Mesh(new THREE.BoxGeometry(w, .05, 1.62), glow(0xa56bff, 1.4)); e.position.set(x, y + .14, 0); arena.add(e);
  }
}
const fighters = [person({ color: 0x4df3ff, neon: true }), person({ color: 0xff4fa3, neon: true }), person({ color: 0xff4fa3, neon: true }), person({ color: 0xff4fa3, neon: true })];
fighters.forEach((f) => { arena.add(f.root); const gun = new THREE.Mesh(new THREE.BoxGeometry(.06, .22, .08), glow(0xdfe6ff, 1.5)); gun.position.y = -.1; f.hand.add(gun); });
const bullets = [], sparks = [];
const bGeo = new THREE.BoxGeometry(.05, .05, .5);
function fire3(from, dir, col) { const b = new THREE.Mesh(bGeo, glow(col, 2.5)); b.position.copy(from); b.lookAt(from.clone().add(dir)); b.userData.v = dir.clone().multiplyScalar(22); b.userData.l = .7; arena.add(b); bullets.push(b); }
function boom(at, col, n = 40) { for (let i = 0; i < n; i++) { const s = new THREE.Mesh(new THREE.BoxGeometry(.07, .07, .07), glow(col, 2)); s.position.copy(at); s.userData.v = new THREE.Vector3((Math.random() - .5) * 7, Math.random() * 7, (Math.random() - .5) * 7); s.userData.l = .9 + Math.random() * .5; arena.add(s); sparks.push(s); } }
const flash = new THREE.PointLight(0xffffff, 0, 8); arena.add(flash);

/* ---------------- QR-луч и цифровой декор ---------------- */
const beam = new THREE.Mesh(new THREE.CylinderGeometry(.02, .02, 1, 8), glow(0x4df3ff, 5)); beam.visible = false; world.add(beam);

/* ---------------- экран телефона: интерфейс рисуется в 2D ---------------- */
const PAL = { bg: "#0b0618", card: "#1a1040", acc: "#a56bff", y: "#ffd84d", c: "#4df3ff", p: "#ff4fa3" };
function rr(x, cx, cy, w, h, r) { x.beginPath(); x.moveTo(cx + r, cy); x.arcTo(cx + w, cy, cx + w, cy + h, r); x.arcTo(cx + w, cy + h, cx, cy + h, r); x.arcTo(cx, cy + h, cx, cy, r); x.arcTo(cx, cy, cx + w, cy, r); x.closePath(); }
function statusBar(x, bat, net = true, plane = false) {
  x.fillStyle = "#000"; x.fillRect(0, 0, 540, 54); x.fillStyle = "#fff"; x.font = "600 26px system-ui"; x.textAlign = "left"; x.fillText("23:59", 28, 38);
  x.textAlign = "right"; x.fillText((plane ? "✈ " : net ? "▂▄▆ " : "✕ ") + bat + "%", 470, 38);
  x.strokeStyle = bat < 10 ? "#ff3b3b" : "#fff"; x.lineWidth = 3; x.strokeRect(478, 18, 40, 22); x.fillStyle = bat < 10 ? "#ff3b3b" : "#7dff9a"; x.fillRect(481, 21, 34 * bat / 100 + 1, 16);
}
function cardRow(x, y, title, col, item, opts = {}) {
  x.save(); x.translate(opts.dx || 0, 0);
  rr(x, 24, y, 492, 150, 26); x.fillStyle = col + "33"; x.fill(); x.lineWidth = 4; x.strokeStyle = col; x.stroke();
  x.fillStyle = col; rr(x, 50, y + 28, 92, 94, 12); x.fill(); x.fillStyle = "#0b0618"; x.font = "900 54px system-ui"; x.textAlign = "center"; x.fillText(item, 96, y + 94);
  x.fillStyle = "#fff"; x.font = "800 34px system-ui"; x.textAlign = "left"; x.fillText(title, 164, y + 70); x.fillStyle = PAL.y; x.font = "28px system-ui"; x.fillText("★★★★★", 164, y + 112);
  rr(x, 404, y + 40, 90, 70, 16); x.fillStyle = opts.fav ? col : "#0b0618"; x.fill(); x.strokeStyle = col; x.stroke(); x.fillStyle = opts.fav ? "#0b0618" : col; x.beginPath(); x.moveTo(438, y + 56); x.lineTo(438, y + 94); x.lineTo(468, y + 75); x.fill();

  if (opts.heart) { const k = opts.heart; x.save(); x.globalAlpha = Math.min(1, k * 1.4); x.fillStyle = "#ff4f8b"; x.translate(470, y + 75); x.scale(.6 + k * .5, .6 + k * .5); heart(x); x.restore(); }
}
function heart(x) { x.beginPath(); x.moveTo(0, 22); x.bezierCurveTo(-46, -8, -22, -46, 0, -20); x.bezierCurveTo(22, -46, 46, -8, 0, 22); x.fill(); }

function screenUI(ph, mode, t, bat) {
  const x = ph.cx; x.fillStyle = PAL.bg; x.fillRect(0, 0, 540, 1080);
  if (mode === "off") { x.fillStyle = "#000"; x.fillRect(0, 0, 540, 1080); }
  else if (mode === "battery") { statusBar(x, bat, false); x.fillStyle = "#ff3b3b"; x.font = "900 120px system-ui"; x.textAlign = "center"; x.fillText(bat + "%", 270, 560); x.font = "700 34px system-ui"; x.fillStyle = "#fff"; x.fillText("Нет сети", 270, 630); }
  else if (mode === "tg") { // чат с ботом → кнопка «Маркет»
    statusBar(x, bat, true); x.fillStyle = "#17212b"; x.fillRect(0, 54, 540, 1026); x.fillStyle = "#232e3c"; x.fillRect(0, 54, 540, 100);
    x.fillStyle = PAL.acc; x.beginPath(); x.arc(70, 104, 32, 0, 7); x.fill(); x.fillStyle = "#fff"; x.font = "800 30px system-ui"; x.textAlign = "left"; x.fillText("Coopix Market", 120, 98); x.font = "22px system-ui"; x.fillStyle = "#8fa3b8"; x.fillText("бот · игры бесплатно", 120, 130);
