  if (s.id === "c6") { // «не дошёл»: сидит рядом и играет, ведро валяется; потом «прошла неделя» — облёт и скелеты
    pose(hero, "sitPhone", t); sereg.root.position.set(1.1, 0, .3); sereg.root.rotation.y = -1.4; pose(sereg, "sitPhone", t); bucket.visible = false; dropped.visible = true; seregPhone.g.visible = true; mode = "game";
    if (lt < .45) { camPos = V(.6, 1.45, lerp(3.6, 3.1, ease(lt / .45))); look = V(.6, .75, 0); }
    else { const k = seg(lt, .45, 1), sk = seg(k, .35, 1); skeleton(hero, sk); skeleton(sereg, sk); pack.visible = sk < .5; const a = k * 2.6; camPos = V(.55 + Math.sin(a) * 3.4, 1.7, Math.cos(a) * 3.4); look = V(.55, .6, 0); } }
  if (s.id === "c7") { pose(hero, "dead", t); sereg.root.position.set(1.1, 0, .3); sereg.root.rotation.y = -1.4; pose(sereg, "dead", t); skeleton(hero, 1); skeleton(sereg, 1); bucket.visible = false; pack.visible = false; dropped.visible = true; seregPhone.g.visible = true;
    camPos = V(.55, lerp(1.7, 1.3, ease(lt)), lerp(3.9, 2.8, ease(lt))); look = V(.55, .6, 0); mode = "lose"; sMode = "lose"; }

  ox.textAlign = "center"; ox.font = "900 150px 'Arial Black', Impact, system-ui"; ox.lineJoin = "round"; ox.lineWidth = 26; ox.strokeStyle = "#140a28";
  ox.save(); ox.translate(W / 2, H * .36); ox.scale(.7 + a * .3, .7 + a * .3); ox.strokeText("COOPIX", 0, 0); ox.fillStyle = "#a56bff"; ox.fillText("COOPIX", 0, 0); ox.strokeText("MARKET", 0, 150); ox.fillStyle = "#fff"; ox.fillText("MARKET", 0, 150); ox.restore();
  ox.font = "800 54px system-ui"; ["Игры прямо в Телеграме", "Бесплатно · без интернета", "Мультиплеер до 7 друзей"].forEach((l, i) => { ox.globalAlpha = a * easeOut(seg(k, .2 + i * .12, .35 + i * .12)); ox.fillStyle = ["#fff", "#7dff9a", "#4df3ff"][i]; ox.fillText(l, W / 2, H * .56 + i * 80); });

/* ---------------- проигрывание и запись ---------------- */
let raf = 0, start = 0, rec = null;

  if (record) { const st = out.captureStream(30); dest.stream.getAudioTracks().forEach((tr) => st.addTrack(tr));
    const mime = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find((m) => MediaRecorder.isTypeSupported(m)), chunks = [];
    rec = new MediaRecorder(st, { mimeType: mime, videoBitsPerSecond: 12e6 }); rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" })); a.download = "coopix_reel_apocalypse.webm"; a.click(); $("#rec").disabled = $("#play").disabled = false; };
    rec.start(500); $("#rec").disabled = $("#play").disabled = true; }
  const loop = () => { const t = AC.currentTime - start; frame(Math.max(0, t)); $("#tm").textContent = Math.max(0, t).toFixed(1) + " / " + TOTAL.toFixed(1) + " с · " + scAt(Math.max(0, t)).id;
    if (t < TOTAL) raf = requestAnimationFrame(loop); else { if (rec && rec.state === "recording") rec.stop(); rec = null; } };

$("#play").onclick = () => run(false); $("#rec").onclick = () => run(true);
$("#play").disabled = $("#rec").disabled = false; $("#tm").textContent = "готово · " + TOTAL.toFixed(1) + " с · голос: " + (LINES[0].file || "").split(".").pop();
