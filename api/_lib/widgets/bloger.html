<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#0d0d14}canvas{width:100%;display:block;touch-action:none}</style></head><body><canvas id="c" width="320" height="200"></canvas><script>
const c=document.getElementById("c"),x=c.getContext("2d");let S=1;
const fit=()=>{const w=c.getBoundingClientRect().width||320;c.width=w;c.height=Math.round(w*5/8);S=w/320};
const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)/S,(e.clientY-r.top)/S]};
const T=(t,a,b,s,f,al)=>{x.font="bold "+s+"px monospace";x.fillStyle=f;x.textAlign=al||"center";x.fillText(t,a,b)};
/* симулятор блогера: снимай ролики, копи лайки, качай камеру, свет и монтаж, ловь залёты в рекомендации */
const K="blog.v1";let g;try{g=JSON.parse(localStorage.getItem(K))}catch(e){}if(!g||g.subs==null)g={subs:0,likes:0,lv:[0,0,0],vids:[]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(g))}catch(e){}};
const UP=[["КАМЕРА","#ff4d8d"],["СВЕТ","#ffd23a"],["МОНТАЖ","#4dd2ff"]],cost=i=>Math.round(30*Math.pow(2.2,g.lv[i]));
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":""+Math.floor(n);
const TOP=["Танец с котом","Пранк над другом","Обзор шаурмы","Я съел 100 перцев","Как стать блогером","Утро миллионера","ASMR ложкой","Реакция на мемы","Челлендж: 24 часа"];
let fx=[],shoot=0,msg="";
function film(){if(shoot)return;shoot=30;const q=1+g.lv[0]*.6+g.lv[1]*.4+g.lv[2]*.8,viral=Math.random()<.07;
  const v=Math.round((10+g.subs*.35)*q*(.4+Math.random())*(viral?12:1)),l=Math.round(v*(.06+Math.random()*.06)),s=Math.round(v*(.015+Math.random()*.02));
  g.likes+=l;g.subs+=s;g.vids.unshift({t:TOP[Math.random()*TOP.length|0],v,viral});g.vids.length=Math.min(3,g.vids.length);
  msg=viral?"Ролик залетел в рекомендации!":"+"+fmt(s)+" подписчиков";fx.push({t:"♥ +"+fmt(l),y:110,l:50});save()}
c.addEventListener("pointerdown",e=>{e.preventDefault();const[px,py]=pos(e);
  if(px<150&&py>40&&py<170){film();return}
  if(py>172){const i=px/107|0,k=cost(i);if(g.likes>=k){g.likes-=k;g.lv[i]++;msg=UP[i][0]+" улучшена!";save()}else msg="Нужно ♥ "+fmt(k)}});
function draw(t){x.setTransform(S,0,0,S,0,0);x.fillStyle="#0d0d14";x.fillRect(0,0,320,200);
  T("СИМУЛЯТОР БЛОГЕРА",8,18,12,"#fff","left");T(fmt(g.subs)+" подп.",312,18,12,"#4dd2ff","right");T("♥ "+fmt(g.likes),312,32,11,"#ff4d8d","right");
  const r=shoot?.9+.1*Math.cos(shoot):1;x.fillStyle="#1c1c2a";x.fillRect(16,42,118,124);
  x.save();x.translate(75,104);x.scale(r,r);x.fillStyle=shoot?"#ff2e5a":"#ff4d8d";x.beginPath();x.arc(0,0,38,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.moveTo(-10,-16);x.lineTo(18,0);x.lineTo(-10,16);x.fill();x.restore();
  T(shoot?"СНИМАЕМ…":"СНЯТЬ РОЛИК",75,160,11,"#fff");if(shoot)shoot--;
  T("Мои ролики",150,52,10,"#9a9ab0","left");
  g.vids.forEach((v,i)=>{const Y=58+i*34;x.fillStyle=v.viral?"#3a1530":"#1c1c2a";x.fillRect(148,Y,164,30);x.fillStyle=["#ff4d8d","#ffd23a","#4dd2ff"][i];x.fillRect(150,Y+2,20,26);
    T(v.t.slice(0,17),174,Y+13,9,"#fff","left");T((v.viral?"★ ":"")+fmt(v.v)+" просм.",174,Y+25,9,v.viral?"#ff9a3c":"#9a9ab0","left")});
  if(!g.vids.length)T("Сними первый ролик!",230,90,10,"#9a9ab0");
  T(msg,230,166,9,"#ffd84a");
  UP.forEach((u,i)=>{const k=cost(i),ok=g.likes>=k;x.fillStyle=ok?u[1]:"#2a2a3a";x.fillRect(i*107+4,174,99,22);T(u[0]+" "+(g.lv[i]+1),i*107+53,184,9,ok?"#111":"#777");T("♥"+fmt(k),i*107+53,194,8,ok?"#111":"#777")});
  for(const f of fx){T(f.t,75,f.y,13,"#ff4d8d");f.y-=.8;f.l--}fx=fx.filter(f=>f.l>0);
  requestAnimationFrame(draw)}
try{new ResizeObserver(fit).observe(c)}catch(e){}fit();requestAnimationFrame(draw);
</script></body></html>
