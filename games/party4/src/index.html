  bmode(d) { if (G.spinning) return; setcv('bmode', d.m); G.kind = null; render(); },
  b_spin() {
    if (G.spinning) return; audio();
    G.spinning = true; G.target = null; G.kind = null; G.task = null; G.fxdone = false;
    const n = G.ps.length; let t; do { t = rnd(n); } while (t === G.turn && n > 1);
    const sector = 360 / n, tg = t * sector + (Math.random() - .5) * sector * .5, cur = G.angle;
    G.angle = cur + (((tg - cur) % 360) + 360) % 360 + 360 * (4 + rnd(3));
    $('#bottle').style.transform = `translate(-50%,-50%) rotate(${G.angle}deg)`;
    $('#bpanel').innerHTML = bPanel();
    FX.emitter('trail', () => { const b = $('#bottle'); if (!b || !G.spinning) return; const [x, y] = FX.center(b); FX.spark(x + rr(-30, 30), y + rr(-30, 30), 1, ['#7df9ff', '#ffffff', '#ff6bd9']); });
    for (let i = 0; i < 14; i++) later(() => beep(500 + i * 25, .03, .06, 'triangle'), 250 * i * (1 + i * .07));
    later(() => { G.spinning = false; FX.emitter('trail', null); G.target = t; chime(); vibrate(60); render(); }, 4300);
  },
  b_kind(d) { G.kind = d.k; G.task = pick(d.k === 'truth' ? TRUTH : DARE); render(); },
  b_done(d) { if (d.ok === '1') { addScore(G.ps[G.target], 'bottle', 1); fxAt('.pc', (x, y) => FX.burst(x, y, 24)); chime(); } A.b_next(); },
  b_next() { G.turn = (G.turn + 1) % G.ps.length; G.target = null; G.kind = null; G.task = null; G.fxdone = false; render(); },
  /* шпион */
  spy_min(d) { setcv('spyMin', Math.max(1, Math.min(30, cv('spyMin', 8) + +d.d))); render(); },
  spy_n(d) { const n = players().length; setcv('spyN', Math.max(1, Math.min(Math.max(1, Math.floor(n / 3)), cv('spyN', 1) + +d.d))); render(); },
  spy_go() { spyStart(); },
  s_vote() { ask('Перейти к голосованию?', () => { G.phase = 'vote'; render(); }); },
  s_acc(d) { ask('Обвинить игрока ' + P(d.id).name + '?', () => { G.acc = d.id; G.outcome = G.spies.includes(d.id) ? 'town' : 'spy'; G.phase = 'result'; render(); }); },
  s_flip() { G.outcome = G.outcome === 'town' ? 'spy' : 'town'; render(); },
  s_again() { spyScore(); spyStart(); }, s_home() { spyScore(); go('home'); },
  /* мафия */
  mf_n(d) { const n = players().length; setcv('mN', Math.max(1, Math.min(mafiaMax(n), (cv('mN', 0) || mafiaAuto(n)) + +d.d))); render(); },
  mf_doc(d) { setcv('mDoc', d.v === '1'); render(); }, mf_sher(d) { setcv('mSher', d.v === '1'); render(); },
  mf_go() { if (players().length < 4) { toast('Для мафии нужно минимум 4 игрока'); return; } mafiaStart(); },
  m_night() { G.phase = 'night'; G.si = 0; G.sel = null; G.res = null; G.night = {}; render(); },
  m_pick(d) { G.sel = d.id; beep(700, .05, .08, 'triangle'); render(); },
  m_ok() {
    const role = G.steps[G.si];
    if (role === 'mafia' && mAliveOf('mafia').length) G.night.kill = G.sel;
    if (role === 'doc' && mAliveOf('doc').length) G.night.heal = G.sel;
    if (role === 'sheriff') { G.res = { id: G.sel, m: G.roles[G.sel] === 'mafia' }; render(); return; }
    A.m_next();
  },
  m_next() { G.res = null; G.sel = null; G.si++; if (G.si >= G.steps.length) mResolve(); else render(); },
  m_day() { const w = mWinner(); if (w) { mEnd(w); return; } G.phase = 'vote'; G.sel = null; render(); },
  m_exile() { G.exiled = G.sel; G.alive = G.alive.filter(x => x !== G.exiled); G.sel = null; G.phase = 'exiled'; render(); },
  m_none() { G.exiled = null; G.sel = null; G.phase = 'exiled'; render(); },
  m_cont() { const w = mWinner(); if (w) { mEnd(w); return; } G.round++; G.phase = 'nightIntro'; render(); },
  m_again() { mafiaStart(); }, m_home() { go('home'); },
  /* бомба */
  bm_fuse(d) { setcv('bFuse', d.f); render(); },
  bm_go() { bombStart(); },
  bm_who(d) { G.hi = Math.max(0, G.ps.indexOf(d.id)); G.ps.filter(id => id !== d.id).forEach(id => addScore(id, 'bomb', 1)); G.phase = 'boom'; render(); },
  bm_topic() { G.topic = bTopic(); render(); },
  bm_again() { bombStart(); }, bm_home() { go('home'); },
  /* команды */
  t_move(d) { const i = G.teams.findIndex(t => t.includes(d.id)); G.teams[i] = G.teams[i].filter(x => x !== d.id); G.teams[(i + 1) % G.teams.length].push(d.id); beep(700, .05, .08, 'triangle'); render(); },
  t_shuffle() { G.teams = makeTeams(G.teams.length); chime(); render(); },
  t_n(d) { const n = Math.max(2, Math.min(4, Math.floor(players().length / 2), G.teams.length + +d.d)); G.teams = makeTeams(n); setcv('tN', n); render(); },
  t_again() { const teams = G.teams; go(route, { phase: 'setup', teams }); },
  t_home() { go('home'); },
  /* элиас */
  e_time(d) { setcv('eTime', Math.max(30, Math.min(180, cv('eTime', 60) + 10 * d.d))); render(); },
  e_goal(d) { setcv('eGoal', Math.max(10, Math.min(100, cv('eGoal', 30) + 5 * d.d))); render(); },
  e_pen(d) { setcv('ePen', d.v === '1'); render(); },
  e_go() { teamStart({}); },
  e_start() { audio(); G.phase = 'play'; G.total = cv('eTime', 60) * 1000; G.end = Date.now() + G.total; G.log = []; G.word = deckNext(ELIAS_W); render(); runTimer(() => { G.phase = 'review'; render(); }); },
  e_ok() { G.log.push({ w: G.word, ok: true }); G.word = deckNext(ELIAS_W); beep(1100, .08, .12, 'triangle'); vibrate(20); render(); fxAt('.wcard', (x, y) => FX.burst(x, y, 14, ['#b9e87c', '#ffffff', '#7df9ff'])); },
  e_skip() { G.log.push({ w: G.word, ok: false }); G.word = deckNext(ELIAS_W); beep(300, .1, .1, 'sawtooth'); render(); },
  e_flip(d) { const x = G.log[+d.i]; x.ok = !x.ok; render(); },
  e_commit() { const ok = G.log.filter(x => x.ok).length, no = G.log.length - ok; G.score[G.cur] += ok - (cv('ePen', true) ? no : 0); teamNext(cv('eGoal', 30)); },
  /* крокодил */
  c_time(d) { setcv('cTime', Math.max(30, Math.min(180, cv('cTime', 90) + 15 * d.d))); render(); },
  c_goal(d) { setcv('cGoal', Math.max(3, Math.min(30, cv('cGoal', 10) + +d.d))); render(); },
  c_diff(d) { setcv('cDiff', d.d); render(); },
  c_go() { teamStart({ diff: cv('cDiff', 'e') }); },
  c_peek() { G.word = deckNext(CROC_W[G.diff]); G.phase = 'peek'; render(); },
  c_swap() { G.word = deckNext(CROC_W[G.diff]); render(); },
  c_start() { audio(); G.phase = 'play'; G.show = false; G.total = cv('cTime', 90) * 1000; G.end = Date.now() + G.total; render(); runTimer(() => { G.ok = false; G.phase = 'res'; render(); }); },
  c_eye() { G.show = !G.show; render(); },
  c_ok() { G.ok = true; G.score[G.cur]++; G.phase = 'res'; render(); },
  c_fail() { G.ok = false; G.phase = 'res'; render(); },
  c_next() { teamNext(cv('cGoal', 10)); }
};

});
