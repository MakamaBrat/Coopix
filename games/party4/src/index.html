*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#04050c}
html,body{margin:0;color:var(--cream);font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{-webkit-user-select:none;user-select:none;overflow-x:hidden;overscroll-behavior-y:contain;
  --sky1:#050818;--sky2:#0d1342;--sky3:#2b1b4c;--t1:#161d4e;--t2:#0b1030;--t3:#05060f}
body[data-mood=night]{--sky1:#02030c;--sky2:#060a24;--sky3:#140e30;--t1:#0b1030;--t2:#070a20;--t3:#030409}
body[data-mood=day]{--sky1:#2c3f86;--sky2:#c0668a;--sky3:#ffb978;--t1:#4b2a60;--t2:#2d1a42;--t3:#150b22}
body[data-mood=tense]{--sky1:#04141c;--sky2:#0a2c3a;--sky3:#1d3c3a;--t1:#0e2c36;--t2:#081d27;--t3:#030b10}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit}
img{-webkit-user-drag:none;user-select:none}
svg{display:block}

/* ================= СЦЕНА (векторный фон) ================= */
#scene{position:fixed;inset:0;z-index:-2;overflow:hidden;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 58%,var(--sky3) 100%);transition:--sky1 1.4s,--sky2 1.4s,--sky3 1.4s,--t1 1.4s,--t2 1.4s,--t3 1.4s}
#scene canvas{position:absolute;inset:0;width:100%;height:100%}
#scene .milky{position:absolute;left:-25%;top:-6%;width:150%;height:62%;background:radial-gradient(ellipse 50% 16% at 52% 50%,rgba(140,115,240,.2),transparent 72%),radial-gradient(ellipse 34% 9% at 40% 53%,rgba(255,170,210,.12),transparent 72%),radial-gradient(ellipse 64% 26% at 50% 50%,rgba(90,80,200,.12),transparent 72%);transform:rotate(-22deg);filter:blur(46px);animation:drift 70s ease-in-out infinite alternate}
#scene .fl{position:absolute;left:-7%;right:-7%;bottom:-2px;height:68vh;transform:translate3d(calc(var(--px)*var(--k)*1px),calc(var(--py)*var(--k)*.3px),0);will-change:transform}
#scene .fl svg{width:100%;height:100%;overflow:visible}
#scene .fl.b svg{filter:drop-shadow(0 -1.5px 0 rgba(255,170,90,.16))}
#scene .fl.a svg{filter:drop-shadow(0 -1px 0 rgba(150,140,255,.12))}
#scene .fl.a{--k:-10;height:60vh}
#scene .fl.b{--k:-24;height:64vh}
#scene .fl.c{--k:-46;height:70vh}
#scene .moon{position:absolute;right:13%;top:9%;width:min(11vmin,120px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fffbe6 0 28%,#efe4b8 60%,#c9bd92 100%);box-shadow:0 0 40px 10px rgba(255,244,200,.35),0 0 140px 50px rgba(150,140,255,.2);transform:translate3d(calc(var(--px)*-6px),calc(var(--py)*-3px),0);transition:opacity 1.2s;animation:moonPulse 8s ease-in-out infinite}
#scene .moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 60%,rgba(120,110,80,.28) 0 9%,transparent 10%),radial-gradient(circle at 30% 66%,rgba(120,110,80,.22) 0 6%,transparent 7%),radial-gradient(circle at 56% 28%,rgba(120,110,80,.2) 0 5%,transparent 6%)}
body[data-mood=day] #scene .moon{opacity:0}
@keyframes moonPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
#scene .ground{position:absolute;left:0;right:0;bottom:0;height:14vh;background:linear-gradient(transparent,rgba(3,3,7,.92))}
#scene .mist{position:absolute;left:-30%;width:160%;height:34vh;bottom:6vh;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(130,120,200,.17),transparent 72%);animation:mist 46s linear infinite;pointer-events:none}
#scene .mist.m2{bottom:14vh;animation-duration:70s;animation-direction:reverse;opacity:.7}
#scene .fire{position:absolute;left:50%;bottom:-14vh;width:80vmin;height:50vh;transform:translateX(-50%);background:radial-gradient(ellipse 50% 50% at 50% 60%,rgba(255,140,40,.34),transparent 70%);animation:flick 2.6s infinite ease-in-out;pointer-events:none}
#scene::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 38%,rgba(2,3,8,.72) 100%);pointer-events:none}
#fx0{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* ================= АНИМАЦИИ ================= */
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes popIn{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.07);opacity:1}100%{transform:scale(1)}}
@keyframes seatIn{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(45deg)}}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes flame{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(1.03,1.07) rotate(.9deg)}60%{transform:scale(.98,1.03) rotate(-.9deg)}}
@keyframes flick{0%,100%{opacity:.6;transform:translateX(-50%) scale(1)}30%{opacity:1;transform:translateX(-50%) scale(1.06)}60%{opacity:.75}}
@keyframes flk{0%,100%{opacity:.75}30%{opacity:1}60%{opacity:.6}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 3px #ff9a2a66) brightness(1)}50%{filter:drop-shadow(0 0 14px #ffb04aee) brightness(1.18)}}
@keyframes flipIn{0%{transform:perspective(800px) rotateY(-90deg) scale(.8);opacity:0}100%{transform:perspective(800px) rotateY(0) scale(1);opacity:1}}
@keyframes stamp{0%{transform:scale(3) rotate(-25deg);opacity:0}55%{transform:scale(.85) rotate(4deg);opacity:1}75%{transform:scale(1.08) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
@keyframes shine{0%{background-position:-160% 0}60%,100%{background-position:260% 0}}
@keyframes ringPulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes sheetUp{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes bomb-in{0%{transform:scale(.1) rotate(-30deg);opacity:0}50%{transform:scale(1.4) rotate(6deg);opacity:1}100%{transform:scale(1)}}
@keyframes flashov{0%{opacity:.95}100%{opacity:0}}
@keyframes jit{0%{transform:translate(calc(var(--sh,0)*1px),0)}25%{transform:translate(0,calc(var(--sh,0)*-1px))}50%{transform:translate(calc(var(--sh,0)*-1px),0)}75%{transform:translate(0,calc(var(--sh,0)*1px))}100%{transform:translate(calc(var(--sh,0)*1px),0)}}
@keyframes pl{0%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes bl{50%{opacity:.4}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-14px,6px)}40%{transform:translate(12px,-8px)}60%{transform:translate(-10px,-6px)}80%{transform:translate(8px,8px)}}
@keyframes cry{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(6px) rotate(4deg)}}
@keyframes dropBanner{0%{transform:translateY(-120%) rotate(-6deg);opacity:0}60%{transform:translateY(8%) rotate(2deg);opacity:1}100%{transform:none}}
@keyframes drift{from{transform:rotate(-22deg) translateX(-3%)}to{transform:rotate(-20deg) translateX(3%)}}
@keyframes mist{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
@keyframes sparkle{from{transform:scale(.8) rotate(0)}to{transform:scale(1.25) rotate(25deg)}}
@keyframes beam{to{transform:rotate(360deg)}}
@keyframes logoIn{0%{transform:translateY(-40px) scale(.7);opacity:0;filter:blur(10px)}60%{transform:translateY(6px) scale(1.04);opacity:1;filter:none}100%{transform:none}}

#view>*{animation:rise .55s cubic-bezier(.2,.9,.3,1.1) backwards;animation-delay:calc(var(--i,0)*70ms)}
#view.still>*{animation:none}

/* ================= БАЗОВЫЕ ЭЛЕМЕНТЫ ================= */
.mut{color:var(--mut)}.small{font-size:12px}.center{text-align:center}.pad{padding:10px 0}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:10px}.wrap{flex-wrap:wrap}
h1,h2,h3{margin:0;color:var(--gold);font-family:var(--hf);font-weight:400;letter-spacing:.4px;text-shadow:0 2px 0 #140a04,0 0 18px #ff9a2a33}
h1{font-size:30px}h2{font-size:23px}h3{font-size:21px;margin-bottom:10px}
.hint{font-size:13px;color:var(--mut);margin:6px 0}
.plank{position:relative;display:inline-flex;align-items:center;gap:10px;padding:8px 30px;border-radius:14px;font-family:var(--hf);letter-spacing:.5px;color:var(--gold);text-shadow:0 2px 0 #1a0e05,0 0 14px #ff9a2a44;white-space:nowrap;
  background:var(--wood);border:3px solid #a2692a;box-shadow:inset 0 0 0 2px #1a0e05,inset 0 2px 0 #ffd98a44,0 6px 16px #000b}
.plank::before,.plank::after{content:"";position:absolute;top:50%;width:24px;height:14px;background:linear-gradient(135deg,#a8c443,#46631a);border-radius:0 100% 0 100%;border:1px solid #1a2608;box-shadow:0 2px 4px #0008}
.plank::before{left:-22px;transform:translateY(-70%) rotate(-25deg)}.plank::after{right:-22px;transform:translateY(-70%) scaleX(-1) rotate(-25deg)}
.plank .gi{width:30px;height:30px;margin-left:-14px;animation:bob 2.6s ease-in-out infinite}
.gi{display:inline-block;flex:none}.gi svg{width:100%;height:100%}
.win{position:relative;border-radius:22px;padding:18px 16px;margin:0 0 16px;border:3px solid #6b4318;background:var(--wood);
  box-shadow:inset 0 0 0 1px #d7a55a66,inset 0 0 0 4px #140a04,inset 0 0 0 5px #c99a4b33,inset 0 14px 30px #0006,0 14px 44px #000c}
.win::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at 14px 14px,#ffe6a4 0 2.5px,#8a5a22 3.5px,transparent 4.5px) top left,radial-gradient(circle at calc(100% - 14px) 14px,#ffe6a4 0 2.5px,#8a5a22 3.5px,transparent 4.5px) top right,radial-gradient(circle at 14px calc(100% - 14px),#ffe6a4 0 2.5px,#8a5a22 3.5px,transparent 4.5px) bottom left,radial-gradient(circle at calc(100% - 14px) calc(100% - 14px),#ffe6a4 0 2.5px,#8a5a22 3.5px,transparent 4.5px) bottom right;background-size:30px 30px;background-repeat:no-repeat}
.rb{position:relative;width:52px;height:52px;border-radius:50%;border:3px solid #d29a3a;background:radial-gradient(circle at 50% 30%,#4a2e16,#140a05);color:var(--gold);cursor:pointer;box-shadow:inset 0 0 0 2px #0d0602,inset 0 2px 0 #ffd98a44,0 5px 14px #000b;flex:none;padding:0;display:grid;place-items:center;transition:transform .12s,box-shadow .2s}
.rb svg{width:26px;height:26px;filter:drop-shadow(0 1px 0 #000)}
.rb:hover{box-shadow:inset 0 0 0 2px #0d0602,0 0 0 3px #ffb04a55,0 0 22px #ffb04a88}.rb:active{transform:scale(.9)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:15px;border:2px solid #5d3410;cursor:pointer;font-family:var(--hf);font-size:18px;letter-spacing:.5px;color:#2b1707;text-shadow:0 1px 0 #ffe2a088;
  background:linear-gradient(#ffd27a 0%,#f2a93f 48%,#d27a1c 52%,#e8952e 100%);box-shadow:inset 0 2px 0 #fff3c4cc,inset 0 -3px 0 #a85d10,0 6px 0 #6d3a0c,0 10px 20px #000b;transition:transform .1s,box-shadow .1s,filter .2s}
.btn:not(.ghost):not(.danger)::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);background-size:60% 100%;background-repeat:no-repeat;background-position:-160% 0;animation:shine 3.6s infinite;pointer-events:none}
.btn:hover{filter:brightness(1.1)}

.btn.danger{background:linear-gradient(#6a2519,#3d130b);border-color:#9b3a28;color:#ffbfae;text-shadow:none;box-shadow:inset 0 0 0 2px #140a04,0 6px 0 #1d0a05,0 10px 20px #000b}

.av{width:var(--s,48px);height:var(--s,48px);border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;font-size:calc(var(--s,48px)*.5);font-weight:900;color:#fff4d0;flex:none;border:3px solid #d29a3a;box-shadow:inset 0 0 0 2px #1a0e05,0 0 0 2px #1a0e05,0 4px 10px #000b}

.hero{display:block;margin:0 auto 6px;max-width:min(88%,400px);max-height:190px;object-fit:contain;animation:floaty 4s ease-in-out infinite;filter:drop-shadow(0 8px 16px #000c)}
/*TOASTTOP*/
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-24px);background:var(--wood);color:var(--cream);border:2px solid var(--gold2);padding:6px 14px;border-radius:12px;font-weight:800;font-size:13px;line-height:1.25;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:86vw;text-align:center;box-shadow:0 3px 10px #000a}

  background:radial-gradient(circle at 0% 50%,rgba(var(--ac),.22),transparent 60%),var(--wood);box-shadow:inset 0 0 0 1px #d7a55a55,inset 0 0 0 4px #140a04,0 12px 28px #000c;
  transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s,box-shadow .25s,border-color .2s;animation:rise .55s backwards;animation-delay:calc(var(--k)*90ms + .35s)}

.bomb svg,.bm svg,.sad svg{width:100%;height:100%;display:block;overflow:visible}
.bm .b1{transform-origin:100px 100px;animation:spinSlow 9s linear infinite}.bm .b2{transform-origin:100px 100px;animation:spinRev 6s linear infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:sparkle .22s ease-in-out infinite alternate}
.boomwrap{position:relative;height:210px;display:grid;place-items:center;margin-bottom:-14px}
.boomwrap .bm{width:200px;height:200px;animation:bomb-in .7s cubic-bezier(.2,.9,.3,1.1) both;filter:drop-shadow(0 0 30px #ff7a1a)}
.boomwrap .rg{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px;border-radius:50%;border:5px solid #ffb04a;animation:ringPulse 1.1s ease-out both}
.boomwrap .rg:nth-child(2){animation-delay:.18s}.boomwrap .rg:nth-child(3){animation-delay:.36s}
.boom h1,.boom p,.boom .pc{position:relative;z-index:2}
.sad{width:110px;height:121px;animation:cry 1.6s ease-in-out infinite;display:block;margin:0 auto}
.flashov{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:45;animation:flashov .7s ease-out forwards}
.boom{animation:shake .5s}
.mini{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0}

<script>
'use strict';
/* ================= утилиты и хранилище ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => Math.floor(Math.random() * n);
const rr = (a, b) => a + Math.random() * (b - a);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const hue = s => { let h = 0; s = String(s); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; };
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const fmt = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const setVh = () => document.documentElement.style.setProperty('--vh', (window.innerHeight / 100) + 'px');
setVh(); addEventListener('resize', setVh); addEventListener('orientationchange', () => setTimeout(setVh, 200));
const sp = n => `img/s/${n}.webp`;
const spi = (n, cls = '', st = '') => `<img class="${cls}" src="${sp(n)}" style="${st}" alt="">`;

const LITE = !!window.__LITE; let ULTRA = false;
const setHeat = v => { const b = document.getElementById('bview'); if (b) b.style.setProperty('--heat', v); };
const KEY = 'party4_v1';
const GAMES = [
  { id:'spy',    name:'Шпион',     min:3 },
  { id:'mafia',  name:'Мафия',     min:4 },
  { id:'bottle', name:'Бутылочка', min:2 },
  { id:'bomb',   name:'Бомбочка',  min:2 }
];
let S = loadState();
function loadState() {
  try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && Array.isArray(r.players)) return Object.assign({ sound:true, cfg:{} }, r); } catch (e) {}
  return { players: [], sound: true, cfg: {} };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Память браузера переполнена — уменьши фото'); } }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
const cv = (k, d) => (S.cfg && S.cfg[k] !== undefined) ? S.cfg[k] : d;
const setcv = (k, v) => { (S.cfg = S.cfg || {})[k] = v; save(); };
const players = () => S.players.filter(p => p.on !== false);
const P = id => S.players.find(p => p.id === id) || { id, name: '?' };
const total = p => Object.values(p.scores || {}).reduce((a, b) => a + b, 0);
function addScore(id, game, d) { const p = S.players.find(x => x.id === id); if (!p) return; p.scores = p.scores || {}; p.scores[game] = (p.scores[game] || 0) + d; save(); }

/* ================= ВЕКТОРНАЯ ГРАФИКА (чёткая на любом экране) ================= */
const IC = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>',
  spk: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9.5v5h4l5 4.2V5.3L7 9.5H3z"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  spkoff: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9.5v5h4l5 4.2V5.3L7 9.5H3z"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  crown: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4.5 4L12 4.5 16.5 12 21 8l-2 11H5L3 8z"/><rect x="5" y="20" width="14" height="2" rx="1"/></svg>',
  dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>'
};
const STAR = '<path d="M10 0Q10.8 9.2 20 10Q10.8 10.8 10 20Q9.2 10.8 0 10Q9.2 9.2 10 0Z" fill="#ffe08a"/>';
const GLYPH = {
  mafia: '<path d="M50 24 58 60 50 68 42 60Z" fill="#fff"/><rect x="38" y="66" width="24" height="5" rx="2.5" fill="#ffd36a"/><rect x="46.5" y="71" width="7" height="14" rx="3.5" fill="#ffd36a"/>',
  det: '<polygon points="50,24 57,44 78,44 61,57 67,78 50,65 33,78 39,57 22,44 43,44" fill="#ffe9a8" stroke="#7a4a10" stroke-width="2" stroke-linejoin="round"/>',
  doc: '<rect x="41" y="28" width="18" height="56" rx="4" fill="#fff"/><rect x="22" y="47" width="56" height="18" rx="4" fill="#fff"/>',
  civ: '<circle cx="37" cy="46" r="9" fill="#ffe9a8"/><path d="M21 80c0-15 7-24 16-24s16 9 16 24z" fill="#ffe9a8"/><circle cx="63" cy="46" r="9" fill="#ffc95a"/><path d="M47 80c0-15 7-24 16-24s16 9 16 24z" fill="#ffc95a"/>',
  spy: '<ellipse cx="50" cy="64" rx="29" ry="8" fill="#140a04"/><path d="M31 62c0-20 8-32 19-32s19 12 19 32z" fill="#2b1a0e"/><rect x="31" y="53" width="38" height="7" fill="#f2b04e"/><path d="M40 72l-8 8M60 72l8 8" stroke="#ffd36a" stroke-width="3" stroke-linecap="round"/>'
};
const GRAD = { mafia: 'gRed', det: 'gBlue', doc: 'gGreen', civ: 'gBrown', spy: 'gPurple' };
function badge(kind, s = 120) {
  return `<svg class="bdg" width="${s}" height="${Math.round(s * 1.1)}" viewBox="0 0 100 110" aria-hidden="true"><path d="M50 3 95 18V56C95 83 75 99 50 107 25 99 5 83 5 56V18Z" fill="url(#gGold)"/><path d="M50 10 88 23V56C88 78 70 92 50 100 30 92 12 78 12 56V23Z" fill="url(#${GRAD[kind]})" stroke="#1a0c04" stroke-width="2"/><path d="M50 10 88 23V42C70 34 30 34 12 42V23Z" fill="#fff" opacity=".13"/>${GLYPH[kind]}</svg>`;
}
const gi = (id, s = 30) => `<span class="gi" style="width:${s}px;height:${s}px">${id === 'bomb' ? bombSVG('e0') : id === 'bottle' ? bottleSVG() : badge(id === 'spy' ? 'spy' : 'mafia', s)}</span>`;
function medal(i) {
  const g = ['gGold', 'gSilver', 'gBronze'][i];
  return `<svg viewBox="0 0 40 44"><circle cx="20" cy="24" r="16" fill="url(#${g})" stroke="#5a3208" stroke-width="2"/><circle cx="20" cy="24" r="11.5" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="20" y="30.5" text-anchor="middle" font-family="Marmelad,Nunito,sans-serif" font-size="17" fill="#3a1d06">${i + 1}</text>${i === 0 ? '<path d="M9 12l4 4 7-8 7 8 4-4-2 8H11z" fill="url(#gGold)" stroke="#6a3d10" stroke-width="1.4" stroke-linejoin="round"/>' : ''}</svg>`;
}
function laurel() {
  let L = '';
  for (let side = 0; side < 2; side++) for (let i = 0; i < 9; i++) {
    const a = .35 + i * .22, x = 50 + (side ? 1 : -1) * 38 * Math.sin(a), y = 58 + 34 * Math.cos(a) - i * 2, rot = (side ? 1 : -1) * (a * 57 - 10);
    L += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="5.5" ry="11" transform="rotate(${(side ? rot : rot).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="url(#gGold)" stroke="#7a4a10" stroke-width="1"/>`;
  }
  return `<svg class="laurel" viewBox="0 0 100 100"><path d="M50 98C24 92 10 70 14 38M50 98c26-6 40-28 36-60" fill="none" stroke="#b8761c" stroke-width="2.5" stroke-linecap="round"/>${L}<path d="M50 30l5 10 11 1.5-8 8 2 11-10-5.500-10 5.500 2-11-8-8 11-1.500z" fill="url(#gGold)" stroke="#7a4a10" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function pine(cx, base, h, w, r) {
  const n = 9, th = h * .86 / n * 1.5, L = [], R = [];

    L.push([cx - hw, y + th * .14], [cx - hw * .38, y - th * .72]); R.unshift([cx + hw * .38, y - th * .72], [cx + hw * (.9 + .2 * r()), y + th * .14]);
  }
  const pts = [[cx - 3, base], [cx - 3, base - h * .1], ...L, [cx, base - h], ...R, [cx + 3, base - h * .1], [cx + 3, base]];
  return 'M' + pts.map(p => p[0].toFixed(0) + ' ' + p[1].toFixed(0)).join('L') + 'Z';
}

function mLog0(r) { return `<div style="margin:12px 0">${avatar(P(r.id), 90)}<h1 style="margin:10px 0">${esc(P(r.id).name)}</h1><div class="emb sm">${badge(r.m ? 'mafia' : 'civ', 100)}</div><h2 style="margin-top:6px">${r.m ? 'МАФИЯ' : 'Не мафия'}</h2></div>`; }

}

/* ================= 4. БОМБОЧКА ================= */
const FUSES = { s: [10, 25, 'Короткий'], m: [20, 45, 'Средний'], l: [35, 70, 'Длинный'] };
const bTopic = () => pick(TOPICS).replace('{L}', LETTERS[rnd(LETTERS.length)]);
const bEmo = frac => frac < .3 ? 'e0' : frac < .62 ? 'e2' : 'e3';
VIEWS.bomb = () => {
  const ph = G.phase;
  if (ph === 'setup') {
    const f = cv('bFuse', 'm');
    return `<div class="split"><div class="l">${spi('b_logo', 'hero')}<div class="bomb" style="width:150px;height:165px;animation:floaty 3s ease-in-out infinite">${bombSVG('e0')}</div></div>
    <div class="r"><section class="win"><p class="mut" style="margin-top:0">Бомба тикает и взорвётся в случайный момент. Передавайте телефон из рук в руки и называйте слова на тему — ничего нажимать не нужно. Когда рванёт, укажешь, у кого она взорвалась.</p>
    <b style="color:var(--cream);font-size:17px">Длина фитиля</b><div class="seg">${Object.entries(FUSES).map(([k, v]) => `<button class="${f === k ? 'on' : ''}" data-a="bm_fuse" data-f="${k}">${v[2]}</button>`).join('')}</div></section>

  }

    <section class="win" style="margin-bottom:4px;padding:14px"><div class="mut small">Тема</div><div style="font-size:26px;font-family:var(--hf);margin-top:4px;color:var(--cream)">${esc(G.topic)}</div></section>
    <div class="bomb big" id="bomb" data-e="e0">${bombSVG('e0')}</div>
    <p class="mut" style="margin:6px 0 0;font-size:16px;font-weight:700">Передавайте телефон из рук в руки<br>и называйте слова на тему 🔥</p>
    <button class="btn sm ghost" style="margin-top:14px" data-a="bm_topic">↻ Другая тема</button></div>`;
  if (ph === 'who') return `<div class="center pad boom"><div class="flashov"></div><div class="boomwrap"><i class="rg"></i><i class="rg"></i><i class="rg"></i><div class="bm">${boomSVG()}</div></div><h1 style="color:var(--bad);font-size:46px">БАХ!</h1>
    <h2 style="margin-top:4px">У кого взорвалась бомба?</h2><p class="mut" style="margin:4px 0">Нажми на того, кто держал телефон</p>${playerGrid(G.ps, null, 'bm_who')}</div>`;
  if (ph === 'boom') { const l = P(G.ps[G.hi]), others = G.ps.filter(id => id !== G.ps[G.hi]).map(P); return `<div class="center pad">
    <div class="mut">Бомба взорвалась у</div>${pcard(l, 190)}<div class="sad">${bombSVG('e4')}</div>
    <div class="mini">${others.map(p => `<div class="m">${avatar(p, 44)}<span class="sg">${bombSVG('e5')}</span></div>`).join('')}</div>
    <div class="hint">Остальные получили +1 очко</div>
    <button class="btn big" data-a="bm_again">Ещё раунд</button><button class="btn ghost wide" data-a="bm_home">В меню</button></div>`; }
};
function bombStart() {
  audio();
  const f = FUSES[cv('bFuse', 'm')], ms = (f[0] + Math.random() * (f[1] - f[0])) * 1000, ps = shuffle(players().map(p => p.id));
  G = { phase: 'run', ps, hi: 0, topic: bTopic(), fuse: ms, start: Date.now(), end: Date.now() + ms };
  lastKey = ''; render();
}
AFTER.bomb = () => {
  if (G.phase === 'who') { later(() => fxAt('.boomwrap', (x, y) => FX.explode(x, y)), 60); return; }
  if (G.phase === 'boom') { later(() => sad(), 200); return; }
  if (G.phase === 'run' && !G.ticking) {
    G.ticking = true; bombTick();
    FX.emitter('fuse', dt => {
      const b = $('#bomb'); if (!b || G.phase !== 'run') return;
      const frac = 1 - (G.end - Date.now()) / G.fuse, r = b.getBoundingClientRect();
      G.acc = (G.acc || 0) + dt * (10 + frac * 50);
      while (G.acc > 1) { G.acc--; FX.spark(r.left + r.width * .75, r.top + r.height * .08, 1); }
    });
  }
};
function bombTick() {
  if (route !== 'bomb' || G.phase !== 'run') return;
  const rem = G.end - Date.now();
  if (rem <= 0) { bombBoom(); return; }
  const frac = 1 - rem / G.fuse, el = $('#bomb');
  setHeat(frac.toFixed(2));
  beep(frac > .75 ? 1200 : 900, .05, .18); vibrate(frac > .75 ? 40 : 15);
  if (el) {
    const em = bEmo(frac); if (el.dataset.e !== em) { el.dataset.e = em; el.innerHTML = bombSVG(em); }
    el.style.setProperty('--sh', frac > .55 ? ((frac - .55) * 14).toFixed(1) : 0);
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  }
  later(bombTick, Math.max(120, 850 - frac * 730));
}
function bombBoom() {
  G.phase = 'who'; G.ticking = false; FX.emitter('fuse', null);
  setHeat(0);
  boomSound(); vibrate([300, 100, 300, 100, 500]); render();
}

/* ================= обработчики действий ================= */
const A = {
  back() { if (midGame() && !confirm('Выйти из игры? Прогресс раунда пропадёт.')) return; go('home'); },
  snd() { S.sound = !S.sound; save(); render(); if (S.sound) beep(660, .08); },

  players() { go('players'); }, score() { go('score'); },

    go(g.id, d.g === 'bottle' ? bottleInit() : { phase: 'setup' });
  },
  padd() { openEditor(''); }, pedit(d) { openEditor(d.id); },
  pic(d) { E.pic = d.p; E.img = ''; E.emoji = ''; refreshEditor(); },
  emo(d) { E.emoji = d.e; E.img = ''; E.pic = ''; $('#prev').innerHTML = avatar(E, 96); document.querySelectorAll('.pics button').forEach(b => b.classList.remove('on')); },
  mclose() { closeModal(); render(); },
  psave() {
    const name = $('#pname').value.trim();
    if (!name) { toast('Напиши имя'); return; }
    if (E.id) { const p = S.players.find(x => x.id === E.id); Object.assign(p, { name, img: E.img, emoji: E.emoji, pic: E.pic }); }
    else S.players.push({ id: uid(), name, img: E.img, emoji: E.emoji, pic: E.pic, on: true, scores: {} });
    save(); closeModal(); render(); chime();
  },
  pdel() { if (!confirm('Удалить друга вместе с его очками?')) return; S.players = S.players.filter(p => p.id !== E.id); save(); closeModal(); render(); },
  adjust(d) { openModal(adjustHtml(d.id)); },
  adj(d) { addScore(d.id, d.g, +d.d); openModal(adjustHtml(d.id)); $('.sheet').style.animation = 'none'; },
  resetscore() { if (!confirm('Обнулить очки всех игроков?')) return; S.players.forEach(p => p.scores = {}); save(); closeModal(); render(); },
  d_show() { G.rev = true; render(); },
  d_hide() { G.rev = false; G.di++; if (G.di >= G.order.length) G.after(); else render(); },
  /* бутылочка */
  bmode(d) { if (G.spinning) return; setcv('bmode', d.m); G.kind = null; render(); },
  b_spin() {
    if (G.spinning) return; audio();
    G.spinning = true; G.target = null; G.kind = null; G.task = null; G.fxdone = false;
    const n = G.ps.length; let t; do { t = rnd(n); } while (t === G.turn && n > 1);
    const sector = 360 / n, tg = t * sector + (Math.random() - .5) * sector * .5, cur = G.angle;
    G.angle = cur + (((tg - cur) % 360) + 360) % 360 + 360 * (4 + rnd(3));
    $('#bottle').style.transform = `translate(-50%,-50%) rotate(${G.angle}deg)`;
    $('#bpanel').innerHTML = bPanel();
    FX.emitter('trail', () => { const b = $('#bottle'); if (!b || !G.spinning) return; const [x, y] = FX.center(b); FX.spark(x + rr(-30, 30), y + rr(-30, 30), 1, ['#ffd36a', '#fff1b0', '#ff7a8a']); });
    for (let i = 0; i < 14; i++) later(() => beep(500 + i * 25, .03, .06, 'triangle'), 250 * i * (1 + i * .07));
    later(() => { G.spinning = false; FX.emitter('trail', null); G.target = t; chime(); vibrate(60); render(); }, 4300);
  },
  b_kind(d) { G.kind = d.k; G.task = pick(d.k === 'truth' ? TRUTH : DARE); render(); },
  b_done(d) { if (d.ok === '1') { addScore(G.ps[G.target], 'bottle', 1); fxAt('.pc', (x, y) => FX.burst(x, y, 24)); chime(); } A.b_next(); },
  b_next() { G.turn = (G.turn + 1) % G.ps.length; G.target = null; G.kind = null; G.task = null; G.fxdone = false; render(); },
  /* шпион */
  spy_min(d) { setcv('spyMin', Math.max(1, Math.min(30, cv('spyMin', 8) + +d.d))); render(); },
  spy_n(d) { const n = players().length; setcv('spyN', Math.max(1, Math.min(Math.max(1, Math.floor(n / 3)), cv('spyN', 1) + +d.d))); render(); },
  spy_go() { spyStart(); },
  s_vote() { if (confirm('Перейти к голосованию?')) { G.phase = 'vote'; render(); } },
  s_acc(d) { if (!confirm('Обвинить игрока ' + P(d.id).name + '?')) return; G.acc = d.id; G.outcome = G.spies.includes(d.id) ? 'town' : 'spy'; G.phase = 'result'; render(); },
  s_flip() { G.outcome = G.outcome === 'town' ? 'spy' : 'town'; render(); },
  s_again() { spyScore(); spyStart(); }, s_home() { spyScore(); go('home'); },
  /* мафия */
  mf_n(d) { const n = players().length; setcv('mN', Math.max(1, Math.min(mafiaMax(n), (cv('mN', 0) || mafiaAuto(n)) + +d.d))); render(); },
  mf_doc(d) { setcv('mDoc', d.v === '1'); render(); }, mf_sher(d) { setcv('mSher', d.v === '1'); render(); },
  mf_go() { if (players().length < 4) { toast('Для мафии нужно минимум 4 игрока'); return; } mafiaStart(); },
  m_night() { G.phase = 'night'; G.si = 0; G.sel = null; G.res = null; G.night = {}; render(); },
  m_pick(d) { G.sel = d.id; beep(700, .05, .08, 'triangle'); render(); },
  m_ok() {

  m_again() { mafiaStart(); }, m_home() { go('home'); },

  bm_who(d) { G.hi = Math.max(0, G.ps.indexOf(d.id)); G.ps.filter(id => id !== d.id).forEach(id => addScore(id, 'bomb', 1)); G.phase = 'boom'; render(); },

  }
  const steps = {
    home() { render(); }, score() { go('score'); }, players() { go('players'); }, menu() { render(); A.menu(); }, editor() { render(); A.padd(); },
    bottle() { A.start({ g: 'bottle' }); }, 'bottle-spun'() { A.start({ g: 'bottle' }); A.b_spin(); },
    spy() { A.start({ g: 'spy' }); }, 'spy-deal'() { A.start({ g: 'spy' }); A.spy_go(); },
    'spy-role'() { A.start({ g: 'spy' }); A.spy_go(); while (!G.spies.includes(G.order[G.di])) { A.d_show(); A.d_hide(); } A.d_show(); },
    'spy-play'() { A.start({ g: 'spy' }); A.spy_go(); for (let i = 0; i < 6; i++) { A.d_show(); A.d_hide(); } },
    mafia() { A.start({ g: 'mafia' }); }, 'mafia-role'() { A.start({ g: 'mafia' }); A.mf_go(); A.d_show(); },
    'mafia-night'() { A.start({ g: 'mafia' }); A.mf_go(); for (let i = 0; i < 6; i++) { A.d_show(); A.d_hide(); } },
    'mafia-pick'() { steps['mafia-night'](); A.m_night(); },
    bomb() { A.start({ g: 'bomb' }); }, 'bomb-run'() { A.start({ g: 'bomb' }); setcv('bFuse', 'l'); A.bm_go(); G.end = Date.now() + 40000; G.fuse = 46000; },
    'bomb-who'() { A.start({ g: 'bomb' }); A.bm_go(); G.end = Date.now() + 300; }
  };
  (steps[arg] || steps.home)();
  const fin = () => document.getAnimations().forEach(a => { try { if (a.effect.getTiming().iterations !== Infinity) a.finish(); } catch (e) {} });
  [900, 2200, 4500, 7000].forEach(t => setTimeout(fin, t));
})();
</script>
