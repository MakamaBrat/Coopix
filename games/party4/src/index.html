<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07031a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boards Games">
<title>Boards Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<script>/*PERF_PATCH*/
(function(){var q=location.search,l;try{var m=matchMedia('(pointer:coarse)').matches;l=/lite=0/.test(q)?false:/lite=1/.test(q)?true:!!(m||innerWidth<900||(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=4)}catch(e){l=true}
window.__LITE=l;document.documentElement.classList.toggle('lite',l)})();
</script>
<style>
:root{--vh:1vh;--heat:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#04050c}
html,body{margin:0;color:var(--cream);font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{-webkit-user-select:none;user-select:none;overflow-x:hidden;overscroll-behavior:none}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit}
img{-webkit-user-drag:none;user-select:none}
svg{display:block}

/* ================= СЦЕНА (векторный фон) ================= */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* ================= АНИМАЦИИ ================= */
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes popIn{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.07);opacity:1}100%{transform:scale(1)}}
@keyframes seatIn{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(45deg)}}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes flame{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(1.03,1.07) rotate(.9deg)}60%{transform:scale(.98,1.03) rotate(-.9deg)}}
@keyframes flick{0%,100%{opacity:.6;transform:translateX(-50%) scale(1)}30%{opacity:1;transform:translateX(-50%) scale(1.06)}60%{opacity:.75}}
@keyframes flk{0%,100%{opacity:.75}30%{opacity:1}60%{opacity:.6}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 3px #ff9a2a66) brightness(1)}50%{filter:drop-shadow(0 0 14px #ffb04aee) brightness(1.18)}}
@keyframes flipIn{0%{transform:perspective(800px) rotateY(-90deg) scale(.8);opacity:0}100%{transform:perspective(800px) rotateY(0) scale(1);opacity:1}}
@keyframes stamp{0%{transform:scale(3) rotate(-25deg);opacity:0}55%{transform:scale(.85) rotate(4deg);opacity:1}75%{transform:scale(1.08) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
@keyframes shine{0%{background-position:-160% 0}60%,100%{background-position:260% 0}}
@keyframes ringPulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes sheetUp{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes bomb-in{0%{transform:scale(.1) rotate(-30deg);opacity:0}50%{transform:scale(1.4) rotate(6deg);opacity:1}100%{transform:scale(1)}}
@keyframes flashov{0%{opacity:.95}100%{opacity:0}}
@keyframes jit{0%{transform:translate(calc(var(--sh,0)*1px),0)}25%{transform:translate(0,calc(var(--sh,0)*-1px))}50%{transform:translate(calc(var(--sh,0)*-1px),0)}75%{transform:translate(0,calc(var(--sh,0)*1px))}100%{transform:translate(calc(var(--sh,0)*1px),0)}}
@keyframes pl{0%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes bl{50%{opacity:.4}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-14px,6px)}40%{transform:translate(12px,-8px)}60%{transform:translate(-10px,-6px)}80%{transform:translate(8px,8px)}}
@keyframes cry{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(6px) rotate(4deg)}}
@keyframes dropBanner{0%{transform:translateY(-120%) rotate(-6deg);opacity:0}60%{transform:translateY(8%) rotate(2deg);opacity:1}100%{transform:none}}
@keyframes drift{from{transform:rotate(-22deg) translateX(-3%)}to{transform:rotate(-20deg) translateX(3%)}}
@keyframes mist{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
@keyframes sparkle{from{transform:scale(.8) rotate(0)}to{transform:scale(1.25) rotate(25deg)}}
@keyframes beam{to{transform:rotate(360deg)}}
@keyframes logoIn{0%{transform:translateY(-40px) scale(.7);opacity:0;filter:blur(10px)}60%{transform:translateY(6px) scale(1.04);opacity:1;filter:none}100%{transform:none}}

#view>*{animation:rise .55s cubic-bezier(.2,.9,.3,1.1) backwards;animation-delay:calc(var(--i,0)*70ms)}
#view.still>*{animation:none}

/* ================= БАЗОВЫЕ ЭЛЕМЕНТЫ ================= */
.mut{color:var(--mut)}.small{font-size:12px}.center{text-align:center}.pad{padding:10px 0}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:10px}.wrap{flex-wrap:wrap}
h1,h2,h3{margin:0;color:var(--gold);font-family:var(--hf);font-weight:400;letter-spacing:.4px;text-shadow:0 2px 0 #140a04,0 0 18px #ff9a2a33}
h1{font-size:30px}h2{font-size:23px}h3{font-size:21px;margin-bottom:10px}
.hint{font-size:13px;color:var(--mut);margin:6px 0}
.plank{position:relative;display:inline-flex;align-items:center;gap:10px;padding:8px 30px;border-radius:14px;font-family:var(--hf);letter-spacing:.5px;color:var(--gold);text-shadow:0 2px 0 #1a0e05,0 0 14px #ff9a2a44;white-space:nowrap;
  background:var(--wood);border:3px solid #a2692a;box-shadow:inset 0 0 0 2px #1a0e05,inset 0 2px 0 #ffd98a44,0 6px 16px #000b}
.plank::before,.plank::after{content:"";position:absolute;top:50%;width:24px;height:14px;background:linear-gradient(135deg,#a8c443,#46631a);border-radius:0 100% 0 100%;border:1px solid #1a2608;box-shadow:0 2px 4px #0008}
.plank::before{left:-22px;transform:translateY(-70%) rotate(-25deg)}.plank::after{right:-22px;transform:translateY(-70%) scaleX(-1) rotate(-25deg)}
.plank .gi{width:30px;height:30px;margin-left:-14px;animation:bob 2.6s ease-in-out infinite}
.gi{display:inline-block;flex:none}.gi svg{width:100%;height:100%}
.win{position:relative;border-radius:22px;padding:18px 16px;margin:0 0 16px;border:3px solid #6b4318;background:var(--wood);
  box-shadow:inset 0 0 0 1px #d7a55a66,inset 0 0 0 4px #140a04,inset 0 0 0 5px #c99a4b33,inset 0 14px 30px #0006,0 14px 44px #000c}
.win::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at 14px 14px,#ffe6a4 0 2.5px,#8a5a22 3.5px,transparent 4.5px) top left,radial-gradient(circle at calc(100% - 14px) 14px,#ffe6a4 0 2.5px,#8a5a22 3.5px,transparent 4.5px) top right,radial-gradient(circle at 14px calc(100% - 14px),#ffe6a4 0 2.5px,#8a5a22 3.5px,transparent 4.5px) bottom left,radial-gradient(circle at calc(100% - 14px) calc(100% - 14px),#ffe6a4 0 2.5px,#8a5a22 3.5px,transparent 4.5px) bottom right;background-size:30px 30px;background-repeat:no-repeat}
.rb{position:relative;width:52px;height:52px;border-radius:50%;border:3px solid #d29a3a;background:radial-gradient(circle at 50% 30%,#4a2e16,#140a05);color:var(--gold);cursor:pointer;box-shadow:inset 0 0 0 2px #0d0602,inset 0 2px 0 #ffd98a44,0 5px 14px #000b;flex:none;padding:0;display:grid;place-items:center;transition:transform .12s,box-shadow .2s}
.rb svg{width:26px;height:26px;filter:drop-shadow(0 1px 0 #000)}
.rb:hover{box-shadow:inset 0 0 0 2px #0d0602,0 0 0 3px #ffb04a55,0 0 22px #ffb04a88}.rb:active{transform:scale(.9)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:15px;border:2px solid #5d3410;cursor:pointer;font-family:var(--hf);font-size:18px;letter-spacing:.5px;color:#2b1707;text-shadow:0 1px 0 #ffe2a088;
  background:linear-gradient(#ffd27a 0%,#f2a93f 48%,#d27a1c 52%,#e8952e 100%);box-shadow:inset 0 2px 0 #fff3c4cc,inset 0 -3px 0 #a85d10,0 6px 0 #6d3a0c,0 10px 20px #000b;transition:transform .1s,box-shadow .1s,filter .2s}
.btn:not(.ghost):not(.danger)::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);background-size:60% 100%;background-repeat:no-repeat;background-position:-160% 0;animation:shine 3.6s infinite;pointer-events:none}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(5px);box-shadow:inset 0 2px 0 #fff3c4cc,inset 0 -3px 0 #a85d10,0 1px 0 #6d3a0c,0 4px 10px #000b}
.btn.sm{min-height:40px;padding:0 16px;font-size:15px;border-radius:12px}
.btn.big{min-height:64px;font-size:23px;width:100%;margin-top:18px}
.btn.wide{width:100%;margin-top:12px}
.btn.ghost{color:var(--cream);text-shadow:0 2px 0 #140a04;background:linear-gradient(#3b2512,#22140a);border-color:#8a5a22;box-shadow:inset 0 1px 0 #ffd98a33,inset 0 0 0 2px #140a04,0 6px 0 #0d0602,0 10px 20px #000b}
.btn.ghost:active{box-shadow:inset 0 0 0 2px #140a04,0 1px 0 #0d0602}
.btn.ok{background:linear-gradient(#b9e87c 0%,#78bb3a 48%,#4f9022 52%,#68a82e 100%);border-color:#2a5a0e;color:#0f2406;text-shadow:0 1px 0 #e6ffc088;box-shadow:inset 0 2px 0 #e4ffc4cc,inset 0 -3px 0 #3d7416,0 6px 0 #24480a,0 10px 20px #000b}
.btn.danger{background:linear-gradient(#6a2519,#3d130b);border-color:#9b3a28;color:#ffbfae;text-shadow:none;box-shadow:inset 0 0 0 2px #140a04,0 6px 0 #1d0a05,0 10px 20px #000b}
.btn[disabled]{opacity:.35;pointer-events:none}
.av{width:var(--s,48px);height:var(--s,48px);border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;font-size:calc(var(--s,48px)*.5);font-weight:900;color:#fff4d0;flex:none;border:3px solid #d29a3a;box-shadow:inset 0 0 0 2px #1a0e05,0 0 0 2px #1a0e05,0 4px 10px #000b}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:#2b1a0c;border:1px solid #6d4416;font-size:12px;font-weight:800;color:var(--gold)}
.tag.bad{background:#4a170f;border-color:#a3402c;color:#ffb9a8}.tag.ok{background:#1f3410;border-color:#4d7a25;color:#c4f09a}
.seg{display:flex;background:#120a05;border:2px solid #4a2d12;border-radius:15px;padding:3px;gap:3px;margin-top:12px;box-shadow:inset 0 3px 8px #000a}
.seg button{flex:1;border:0;border-radius:11px;height:40px;background:transparent;color:var(--mut);font-weight:800;font-size:14px;cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:linear-gradient(#ffd27a,#d27a1c);color:#2b1707;box-shadow:0 2px 6px #000a}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.stepper .c{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:13px;border:2px solid #8a5a22;background:linear-gradient(#3b2512,#22140a);color:var(--gold);font-size:24px;font-weight:900;cursor:pointer;box-shadow:inset 0 1px 0 #ffd98a33,0 3px 0 #0d0602}
.stepper button:active{transform:translateY(3px);box-shadow:none}
.stepper b.v{min-width:44px;text-align:center;font-size:26px;font-family:var(--hf);font-weight:400;color:var(--cream)}
.inp{width:100%;height:52px;border-radius:14px;border:2px solid #6d4416;background:#110a05;color:var(--cream);padding:0 16px;font-size:18px;margin:12px 0;font-family:inherit;font-weight:800;box-shadow:inset 0 3px 8px #000a}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:inset 0 3px 8px #000a,0 0 16px #ffb04a55}
.hero{display:block;margin:0 auto 6px;max-width:min(88%,400px);max-height:190px;object-fit:contain;animation:floaty 4s ease-in-out infinite;filter:drop-shadow(0 8px 16px #000c)}
/*TOASTTOP*/
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-24px);background:var(--wood);color:var(--cream);border:2px solid var(--gold2);padding:6px 14px;border-radius:12px;font-weight:800;font-size:13px;line-height:1.25;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:86vw;text-align:center;box-shadow:0 3px 10px #000a}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#000a,#000e);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.show{display:flex;animation:fadeIn .25s}
/*KB*/
#modal.kb{align-items:flex-start;padding:48px 8px 0}
#modal.kb .sheet{border-radius:22px;border-bottom:3px solid #8a5a22;padding:12px 14px;max-height:100%;animation:none}
#modal.kb .sheet>h3,#modal.kb .sheet .pics,#modal.kb .sheet .hint{display:none}
#modal.kb .sheet #prev{transform:scale(.7);transform-origin:center top;height:70px}
.sheet{width:100%;max-width:540px;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;border:3px solid #8a5a22;border-bottom:0;background:var(--wood);box-shadow:0 -10px 50px #000c;animation:sheetUp .4s cubic-bezier(.2,.9,.3,1.05)}
#prev{display:flex;justify-content:center}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.emojis button{font-size:22px;background:#2b1a0c;border:2px solid #4a2d12;border-radius:10px;height:40px;cursor:pointer}
.pics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.pics button{padding:0;border:3px solid #4a2d12;border-radius:50%;aspect-ratio:1;background-size:cover;background-position:center;cursor:pointer;transition:transform .15s,box-shadow .2s}
.pics button:hover{transform:scale(1.08)}
.pics button.on{border-color:var(--gold);transform:scale(1.14);box-shadow:0 0 16px #ff9a2a}
.adj{display:flex;align-items:center;gap:10px;padding:8px 0}.adj .n{flex:1;display:flex;align-items:center;gap:10px;font-weight:800}
.adj .n .gi{width:30px;height:30px}.adj b{min-width:30px;text-align:center;font-size:22px;font-family:var(--hf);font-weight:400}
.adj button{width:42px;height:42px;border-radius:12px;border:2px solid #8a5a22;background:linear-gradient(#3b2512,#22140a);color:var(--gold);font-size:22px;font-weight:900;cursor:pointer}

/* ================= ГЛАВНЫЙ ЭКРАН ================= */
#app.home{position:relative;z-index:2;min-height:calc(var(--vh)*100);overflow-x:clip}
.hgrid{position:relative;max-width:540px;margin:0 auto;padding:calc(66px + env(safe-area-inset-top)) 16px 56px;display:flex;flex-direction:column;align-items:center}
.hcenter{position:relative;width:100%;display:flex;flex-direction:column;align-items:center}
.hlogo{position:relative;z-index:3;width:min(90%,430px);height:auto;display:block;animation:logoIn 1s cubic-bezier(.2,.9,.3,1.1) both,floaty 5s 1s ease-in-out infinite;filter:drop-shadow(0 8px 22px #000d)}
.hero2{position:relative;z-index:1;width:min(88vw,420px);aspect-ratio:1;margin-top:-34px}
.spk{position:absolute;width:var(--s,18px);height:var(--s,18px);animation:twinkle 3s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 0 6px #7df9ff)}
.hcol{position:relative;z-index:2;width:100%}
.hp{position:relative;margin-top:30px;border-radius:22px;border:3px solid #6b4318;padding:36px 12px 12px;animation:popIn .7s .1s cubic-bezier(.2,.9,.3,1.1) backwards;background:var(--wood);
  box-shadow:inset 0 0 0 1px #d7a55a66,inset 0 0 0 4px #140a04,inset 0 0 0 5px #c99a4b33,0 16px 44px #000d}
.hp .plank{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:20px}
.hp .plank small{font-size:.65em;color:var(--mut);font-family:"Nunito",sans-serif;font-weight:800}
.hp-list{max-height:min(250px,34vh);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#7a4c1d transparent;margin-bottom:8px;padding-right:2px}
.hrow{display:flex;align-items:center;gap:12px;height:56px;padding:0 10px;margin-bottom:8px;border-radius:14px;background:linear-gradient(#2d1a0c,#1e1209);border:1px solid #4d3014;box-shadow:inset 0 1px 0 #ffd98a1a;cursor:pointer;animation:rise .45s backwards;animation-delay:calc(var(--k,0)*70ms + .3s);transition:opacity .25s,transform .1s,border-color .2s,background .2s}
.hrow:hover{border-color:#b97b30;background:linear-gradient(#3a2411,#26160a)}.hrow:active{transform:scale(.98)}
.hrow.off{opacity:.4}.hrow.off .av{filter:grayscale(1)}
.hrow .av{--s:42px}
.hrow .nm{flex:1;min-width:0;font-size:17px;font-weight:800;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .st{font-size:16px;font-weight:900;color:var(--gold);white-space:nowrap}
.dots{width:36px;height:36px;border-radius:10px;border:2px solid #7a4c1d;background:#1a0f07;color:var(--gold);cursor:pointer;flex:none;padding:0;display:grid;place-items:center}
.dots svg{width:18px;height:18px}.dots:hover{border-color:var(--gold)}
.addb{width:100%;height:50px;border-radius:14px;border:2px solid #8a5a22;background:linear-gradient(#3b2512,#22140a);color:var(--cream);font-family:var(--hf);font-size:17px;letter-spacing:.5px;cursor:pointer;box-shadow:inset 0 1px 0 #ffd98a33,inset 0 0 0 2px #140a04,0 4px 0 #0d0602;transition:border-color .2s,transform .1s}
.addb:hover{border-color:var(--gold)}.addb:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px #140a04}
.empty{padding:22px 10px;text-align:center;color:var(--mut);font-size:15px}
.gcards{display:grid;gap:12px;margin-top:24px;width:100%}
.gcard{--ac:255,150,50;position:relative;display:flex;align-items:center;gap:14px;padding:10px 14px 10px 12px;border-radius:20px;border:3px solid #6b4318;color:var(--cream);text-align:left;cursor:pointer;overflow:hidden;
  background:radial-gradient(circle at 0% 50%,rgba(var(--ac),.22),transparent 60%),var(--wood);box-shadow:inset 0 0 0 1px #d7a55a55,inset 0 0 0 4px #140a04,0 12px 28px #000c;
  transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s,box-shadow .25s,border-color .2s;animation:rise .55s backwards;animation-delay:calc(var(--k)*90ms + .35s)}
.gcard::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,30%) var(--my,50%),rgba(255,226,160,.26),transparent 55%);opacity:0;transition:opacity .25s;pointer-events:none}
.gcard:hover{border-color:var(--gold);box-shadow:inset 0 0 0 1px #d7a55a,inset 0 0 0 4px #140a04,0 18px 38px #000d,0 0 30px rgba(var(--ac),.4)}
.gcard:hover::before{opacity:1}.gcard:active{transform:scale(.97)}
/*CARDS*/
.gl{position:relative;flex:0 0 38%;height:72px}
.gl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px #000b)}
.gi2{flex:1;min-width:0}.gi2 b{display:block;font-family:var(--hf);font-weight:400;font-size:23px;color:var(--gold);text-shadow:0 2px 0 #140a04;letter-spacing:.4px}
.gi2 small{display:block;color:var(--mut);font-size:13px;margin-top:2px;line-height:1.25;font-weight:700}
.go{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid #d29a3a;display:grid;place-items:center;color:var(--gold);background:radial-gradient(circle at 50% 30%,#4a2e16,#140a05);transition:transform .2s,box-shadow .2s}
.go svg{width:18px;height:18px;margin-left:2px}
.gcard:hover .go{transform:scale(1.12);box-shadow:0 0 18px #ffb04a99}
.hnote{margin:12px 0 0;text-align:center;font-size:12px;color:var(--mut);font-weight:700}

/* ================= ВНУТРЕННИЕ ЭКРАНЫ ================= */
#app.inner{overflow-x:clip;position:relative;z-index:2;width:100%;max-width:560px;margin:0 auto;min-height:calc(var(--vh)*100);display:flex;flex-direction:column;padding-bottom:calc(var(--dk) + 86px)}
/*BOTBAR*/
/*DOCK*/
:root{--dk:max(env(safe-area-inset-bottom),40px)}
#bot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dk) + 10px);z-index:30;display:flex;align-items:center;gap:8px;width:max-content;max-width:94vw;padding:7px 8px;border-radius:999px;background:linear-gradient(#4a2e16ee,#1d1109f2);border:2px solid #b87a30;box-shadow:inset 0 1px 0 #ffd98a55,0 8px 22px #000b;pointer-events:auto;touch-action:manipulation}
#bot .rb{width:auto;min-width:50px;height:50px;padding:0 18px;border-radius:999px;border:2px solid #d29a3a;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:var(--hf);font-size:17px;letter-spacing:.3px;color:var(--cream);background:linear-gradient(#6a4220,#2d1a0b);box-shadow:inset 0 1px 0 #ffd98a55,0 2px 0 #140a04}
#bot .rb svg{width:22px;height:22px;flex:none}
#bot .rb span{white-space:nowrap}
#bot .rb.ico{padding:0;width:50px}
#bot .rb:active{transform:scale(.94);background:linear-gradient(#8a5a2a,#3c2410)}
.inner #view{flex:1;padding:calc(14px + env(safe-area-inset-top)) 14px 12px}
body.is-home #decor{display:none}
.th{display:flex;align-items:center;gap:10px;padding:4px 6px 8px;font-size:12px;color:var(--mut);font-weight:800;border-bottom:1px solid #4d3014;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 8px;margin-bottom:6px;border-radius:14px;background:linear-gradient(#2d1a0c,#1e1209);border:1px solid #4d3014;box-shadow:inset 0 1px 0 #ffd98a1a;cursor:pointer;animation:rise .45s backwards;animation-delay:calc(var(--k,0)*60ms + .15s);transition:border-color .2s,transform .1s}
.prow:hover{border-color:#b97b30}.prow:active{transform:scale(.98)}
.prow .nm{flex:1;min-width:0;font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--cream)}
.prow .sub{display:flex;gap:10px;font-size:12px;color:var(--mut);margin-top:3px;font-weight:800}
.prow .sub span{display:flex;align-items:center;gap:4px}.prow .sub .gi{width:16px;height:16px}
.pts{font-weight:900;font-size:20px;color:var(--gold);min-width:60px;text-align:right}
.rank{width:44px;display:grid;place-items:center;font-family:var(--hf);font-size:22px;color:var(--gold)}.rank svg{width:42px;height:42px;animation:bob 2.4s ease-in-out infinite}
.laurel{width:110px;margin:0 auto 4px;animation:floaty 3.4s ease-in-out infinite;filter:drop-shadow(0 0 14px #ffb04a88)}
/* карточка игрока */
.pc{position:relative;width:var(--w,180px);aspect-ratio:1;margin:0 auto;animation:popIn .55s cubic-bezier(.2,.9,.3,1.2)}
.pc>img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.pc-ph{position:absolute;left:26.4%;top:6.8%;width:44.6%;aspect-ratio:1;border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;font-size:calc(var(--w)*.22);font-weight:900;color:#fff4d0;z-index:1}
.pc-nm{position:absolute;left:14%;right:14%;top:54%;text-align:center;font-family:var(--hf);font-size:calc(var(--w)*.105);color:#ffd77a;text-shadow:0 2px 0 #140a04,0 0 8px #000;z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-st{position:absolute;left:25%;right:25%;top:69.5%;height:11.5%;border-radius:8px;background:linear-gradient(#2a1608,#1c0f06);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--w)*.075);color:var(--gold);z-index:3}
/* бутылочка */
.bgrid{display:block}
.tw{position:relative;width:min(92vw,440px);margin:14px auto 44px}
.ring{position:relative;width:100%;aspect-ratio:900/771;}
.tw .lights{position:absolute;left:-3%;top:-15%;width:106%;z-index:0;pointer-events:none;animation:flk 3s infinite}
.tw .cand{position:absolute;left:-3%;bottom:-8%;width:17%;z-index:4;pointer-events:none}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .3s;animation:seatIn .5s cubic-bezier(.2,.9,.3,1.3) backwards;animation-delay:calc(var(--k)*80ms + .2s)}
.seat span{font-size:calc(11px*var(--sm,1));font-weight:900;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--cream);text-shadow:0 1px 3px #000,0 0 6px #000}
.seat.me .av{border-color:#fff1b8;animation:glowPulse 1.6s infinite}
.seat .crw{position:absolute;top:-17px;width:26px;height:20px;animation:bob 1.2s infinite}
.seat.sel{transform:translate(-50%,-50%) scale(1.3);z-index:3}.seat.sel .av{border-color:#fff;box-shadow:0 0 0 4px var(--ember),0 0 26px var(--ember)}
.seat .burst{position:absolute;top:50%;left:50%;width:170%;transform:translate(-50%,-62%);z-index:-1;animation:spinSlow 8s linear infinite;pointer-events:none}
.bottle{position:absolute;left:50%;top:50%;width:11%;aspect-ratio:60/150;transform:translate(-50%,-50%);transition:transform 4.2s cubic-bezier(.15,.55,.08,1);filter:drop-shadow(0 10px 8px #000b)}
.bottle svg{width:100%;height:100%}
.panel{position:relative;border-radius:22px;padding:16px;text-align:center;min-height:130px;margin-top:6px;border:3px solid #6b4318;background:var(--wood);box-shadow:inset 0 0 0 1px #d7a55a55,inset 0 0 0 4px #140a04,0 14px 36px #000c}
.who{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0;font-size:21px;font-family:var(--hf);color:var(--cream)}
.task{background:#110a05;border:2px solid #5a3715;border-radius:14px;padding:14px;margin:10px 0;font-size:18px;font-weight:800;line-height:1.35;color:var(--cream);animation:popIn .45s;box-shadow:inset 0 3px 10px #000a}
.emo{width:54px;height:54px;animation:wob 1s infinite}
/* роли и карточки */
.card3d{display:block;margin:6px auto;width:150px;animation:floaty 3.4s ease-in-out infinite;filter:drop-shadow(0 0 20px #ffa83a99)}
.card3d svg{width:100%;height:auto}
.role{position:relative;border-radius:24px;padding:22px 16px;margin:12px 0;border:3px solid #8a5a22;background:var(--wood);box-shadow:inset 0 0 0 1px #d7a55a66,inset 0 0 0 4px #140a04,0 14px 36px #000c;animation:flipIn .7s cubic-bezier(.2,.9,.3,1.1)}
.role .big{font-size:80px;line-height:1.1;display:grid;place-items:center}.role .big .bdg{filter:drop-shadow(0 0 18px #ffb04acc);animation:bob 2.5s ease-in-out infinite}
.role h1{margin:8px 0 6px;font-size:32px}.role p{margin:4px 0;color:#dcb77e;font-weight:700}
.role.bad{border-color:#b9402b}
.role.bad .big .bdg{filter:drop-shadow(0 0 22px #ff4a2acc)}
.emb{display:block;margin:0 auto;width:140px;animation:floaty 3.2s ease-in-out infinite;filter:drop-shadow(0 0 20px #ffb04a99)}
.emb.sm{width:100px}.emb svg{width:100%;height:auto}
.banner{display:block;margin:0 auto;width:230px;transform-origin:50% 0;animation:dropBanner .9s cubic-bezier(.2,.9,.3,1.1) both;filter:drop-shadow(0 10px 14px #000b)}
.timerbox{position:relative;width:240px;height:240px;margin:6px auto}
.timerbox svg.rg2{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timerbox .tg{position:absolute;inset:16%;width:68%;height:68%;opacity:.3;animation:spinSlow 14s linear infinite}
.timerbox .sweep{position:absolute;inset:7%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 300deg,rgba(255,200,90,.38) 360deg);animation:spinSlow 3s linear infinite;-webkit-mask-image:radial-gradient(closest-side,transparent 60%,#000 62%);mask-image:radial-gradient(closest-side,transparent 60%,#000 62%)}
.timer{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hf);font-size:60px;font-variant-numeric:tabular-nums;letter-spacing:2px;color:var(--cream);text-shadow:0 3px 0 #140a04,0 0 26px #ff8a2a77}
.timer.low{color:var(--bad);animation:bl .8s infinite}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.pbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;background:linear-gradient(#34200f,#21130a);border:2px solid #5a3715;box-shadow:inset 0 1px 0 #ffd98a22,0 4px 0 #0d0602,0 8px 16px #000a;color:var(--cream);font-weight:800;font-size:13px;cursor:pointer;transition:transform .12s,box-shadow .2s,border-color .2s;animation:popIn .45s backwards;animation-delay:calc(var(--k,0)*50ms)}
.pbtn:hover{border-color:#b97b30;transform:translateY(-2px)}.pbtn:active{transform:translateY(3px);box-shadow:none}
.pbtn span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn.sel{border-color:var(--gold);background:linear-gradient(#5e3d15,#3a2410);box-shadow:0 0 22px #ff8a2a99,0 4px 0 #0d0602;transform:scale(1.05)}
.pbtn.dead{opacity:.35;filter:grayscale(1);pointer-events:none}
.itemrow{display:flex;justify-content:center;gap:14px;margin:10px 0}
.itemrow .bdg{animation:bob 2.6s ease-in-out infinite}.itemrow .bdg:nth-child(2n){animation-delay:-.8s}.itemrow .bdg:nth-child(3n){animation-delay:-1.6s}
.split{display:block}
/* бомба */
#bview{position:relative;border-radius:24px;padding:6px;background:radial-gradient(circle at 50% 45%,rgba(255,70,20,calc(var(--heat,0)*.6)),transparent 70%)}
.bomb{width:200px;height:220px;display:block;margin:6px auto;filter:drop-shadow(0 0 calc(10px + var(--heat,0)*34px) rgba(255,110,30,.9));animation:jit .12s linear infinite}
.bomb.big{width:240px;height:264px;margin:12px auto}
.bomb.pulse{animation:pl .22s ease-out,jit .12s linear infinite}
.bomb svg,.bm svg,.sad svg{width:100%;height:100%;display:block;overflow:visible}
.bm .b1{transform-origin:100px 100px;animation:spinSlow 9s linear infinite}.bm .b2{transform-origin:100px 100px;animation:spinRev 6s linear infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:sparkle .22s ease-in-out infinite alternate}
.boomwrap{position:relative;height:210px;display:grid;place-items:center;margin-bottom:-14px}
.boomwrap .bm{width:200px;height:200px;animation:bomb-in .7s cubic-bezier(.2,.9,.3,1.1) both;filter:drop-shadow(0 0 30px #ff7a1a)}
.boomwrap .rg{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px;border-radius:50%;border:5px solid #ffb04a;animation:ringPulse 1.1s ease-out both}
.boomwrap .rg:nth-child(2){animation-delay:.18s}.boomwrap .rg:nth-child(3){animation-delay:.36s}
.boom h1,.boom p,.boom .pc{position:relative;z-index:2}
.sad{width:110px;height:121px;animation:cry 1.6s ease-in-out infinite;display:block;margin:0 auto}
.flashov{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:45;animation:flashov .7s ease-out forwards}
.boom{animation:shake .5s}
.mini{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0}
.mini .m{position:relative}.mini .m .sg{position:absolute;right:-8px;bottom:-8px;width:26px;height:28px}


/* ================= ЗОНА НАЖАТИЯ И РАСКЛАДКА ИГР ================= */
.btn{overflow:visible}
.btn::after{border-radius:inherit}
.btn::before{content:"";position:absolute;inset:-6px -4px -12px;border-radius:inherit}
.pbtn,.addb,.stepper button,.seg button,.dots{position:relative}
.pbtn::after,.addb::after,.stepper button::after,.dots::after{content:"";position:absolute;inset:-5px -3px -9px}
.inner #view{display:flex;flex-direction:column;justify-content:center;padding-top:28px}
.inner #view>:not(svg){width:100%;max-width:620px;margin-left:auto;margin-right:auto}
.inner #view>.bgrid,.inner #view>.split{max-width:none}
/* ================= КОМАНДНЫЕ ИГРЫ ================= */
.teams{display:grid;gap:10px;margin:12px 0}
.team{border-radius:18px;padding:10px 12px 6px;border:2px solid rgba(255,255,255,.2);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 60%,#1a0d05),color-mix(in srgb,var(--tc) 22%,#0d0603));box-shadow:inset 0 1px 0 #fff3,0 6px 16px #000a;text-align:left}
.team h4{margin:0 0 8px;font-family:var(--hf);font-weight:400;font-size:20px;color:#fff;display:flex;justify-content:space-between;text-shadow:0 2px 0 #0006}
.tm{display:inline-flex;align-items:center;gap:6px;padding:3px 11px 3px 3px;margin:0 6px 6px 0;border-radius:999px;background:#0007;border:1px solid #fff3;color:#fff;font-weight:800;font-size:14px;cursor:pointer;transition:transform .12s}
.tm:active{transform:scale(.94)}
.tbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.tchip{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:linear-gradient(var(--tc),color-mix(in srgb,var(--tc),#000 45%));color:#fff;font-weight:900;font-size:14px;box-shadow:inset 0 1px 0 #fff5,0 4px 10px #000a;border:2px solid #fff3;transition:transform .2s}
.tchip.on{outline:3px solid var(--gold);outline-offset:2px;transform:scale(1.07)}
.tchip b{font-family:var(--hf);font-size:21px;font-weight:400}
.wcard{position:relative;margin:14px auto;width:min(100%,440px);min-height:200px;border-radius:26px;display:grid;place-items:center;padding:30px 20px;cursor:default;
  background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.35),transparent 60%),linear-gradient(160deg,color-mix(in srgb,var(--tc),#fff 22%),color-mix(in srgb,var(--tc),#000 42%));
  border:4px solid #ffd98a;box-shadow:inset 0 0 0 3px rgba(0,0,0,.3),0 18px 40px #000c,0 0 44px color-mix(in srgb,var(--tc) 55%,transparent);animation:flipIn .45s cubic-bezier(.2,.9,.3,1.1)}
.wcard::before{content:"";position:absolute;inset:10px;border-radius:18px;border:2px dashed rgba(255,230,170,.45);pointer-events:none}
.wcard .w{font-family:var(--hf);font-size:clamp(30px,8vw,48px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 20px rgba(0,0,0,.3);line-height:1.1;text-align:center;word-break:break-word}
.wcard .k{position:absolute;top:16px;left:22px;font-size:12px;font-weight:900;color:rgba(255,255,255,.8);letter-spacing:1px;text-transform:uppercase}
.wcard.hide{cursor:pointer}.wcard.hide .w{filter:blur(16px);opacity:.55}
.wcard .eye{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:13px;font-weight:800;color:rgba(255,255,255,.85)}
.timerbox.sm{width:160px;height:160px}.timerbox.sm .timer{font-size:42px}
.rv{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:7px;border-radius:13px;background:rgba(0,0,0,.25);border:1px solid #4d3014;cursor:pointer;font-weight:800;font-size:17px;transition:background .2s}
.rv .m{margin-left:auto;font-size:20px}
.rv.ok{border-color:#4d7a25;background:rgba(31,52,16,.55)}.rv.no{border-color:#8c3322;background:rgba(74,23,15,.5);text-decoration:line-through;color:#d9a08f}
.bigrow{display:flex;gap:12px}.bigrow .btn{flex:1;min-height:70px;font-size:21px;margin-top:6px}
.cnt{font-family:var(--hf);font-size:20px;color:var(--cream)}

/* ================= ДЕСКТОП ================= */
@media (min-width:900px){
  .hgrid{max-width:1400px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px 44px;align-items:center;align-content:center;padding:84px 40px 40px;min-height:calc(var(--vh)*100)}
  .hcenter{grid-column:1;grid-row:1/3}
  .hcol.left{grid-column:2;grid-row:1;align-self:end}
  .hcol.right{grid-column:2;grid-row:2;align-self:start}
  .hlogo{width:min(100%,500px)}.hero2{width:min(100%,480px);margin-top:-40px}
  .hp{margin-top:18px}.hp-list{max-height:30vh}
  .gcards{margin-top:0;gap:10px}.gl{height:68px}
  .hrow{height:60px}.hrow .av{--s:44px}
  #app.inner{max-width:900px}#app.inner.wide{max-width:1240px}
  .rb{width:58px;height:58px}.rb svg{width:28px;height:28px}
  .inner #view{padding:30px 28px 100px}
  .inner #view>:not(svg){max-width:720px}.inner #view>.split{max-width:1080px}
  .teams{grid-template-columns:1fr 1fr}.wcard{min-height:240px}
  .win{padding:26px 30px}.btn.big{min-height:70px;font-size:26px;max-width:560px;margin-left:auto;margin-right:auto;display:flex}
  .btn.wide{max-width:560px;margin-left:auto;margin-right:auto;display:flex}
  h1{font-size:38px}h2{font-size:28px}
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;min-height:56vh}
  .split .hero{max-width:min(100%,460px);max-height:300px}
  .bgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:44px;align-items:center;min-height:68vh}
  .tw{width:100%;max-width:620px;margin:10px auto 40px}.tw .ring{--sm:1.4}
  .bside .panel{margin-top:0}
  .pgrid{grid-template-columns:repeat(4,1fr);gap:16px}.pbtn{padding:16px 6px;font-size:15px}
  .timerbox{width:290px;height:290px}.timer{font-size:72px}
  .bomb{width:230px;height:253px}.bomb.big{width:290px;height:319px}
  .prow{padding:10px 16px}.prow .nm{font-size:20px}
  .sheet{max-width:580px;border-radius:28px;border-bottom:3px solid #8a5a22;margin-bottom:5vh}
  #modal{align-items:center}
  .role{padding:30px 28px}.role .big .bdg{width:150px;height:165px}
  .emb{width:170px}.emb.sm{width:116px}.card3d{width:180px}
  .task{font-size:21px}.win p,.win .mut{font-size:16px}
  #decor .lanw{right:60px}
}
@media (min-width:1280px){
  .hgrid{grid-template-columns:minmax(320px,1fr) minmax(400px,560px) minmax(320px,1fr);padding:0 48px}
  .hcenter{grid-column:2;grid-row:1}
  .hcol.left{grid-column:1;grid-row:1;align-self:center}
  .hcol.right{grid-column:3;grid-row:1;align-self:center}
  .hlogo{width:min(100%,560px)}.hero2{width:min(100%,540px);margin-top:-46px}
  .hp{margin-top:0}.hp-list{max-height:46vh}.gl{height:72px}
  .hrow{height:64px}.hrow .av{--s:46px}
}
@media (min-width:900px) and (max-height:820px){
  .hlogo{width:min(100%,400px)}.hero2{width:min(100%,400px);margin-top:-34px}
  .hgrid{padding-top:60px;padding-bottom:20px}
}
/*FIT_PATCH*/
@media (max-width:899px){
  .hgrid{display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top)) 14px calc(env(safe-area-inset-bottom) + 28px)}
  .hcol.right{order:2}.hcol.left{order:3}
  .hlogo{width:min(62%,calc(var(--vh)*34))}
  .hero2{width:min(56vw,calc(var(--vh)*24));margin-top:-22px}
  .gcards{margin-top:8px;gap:8px}.gl{height:64px;flex-basis:36%}
  .gcard{padding:8px 12px 8px 10px;gap:10px;min-height:84px}
  .gi2 b{font-size:21px}.gi2 small{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hp{margin-top:20px}.hp-list{max-height:none;overflow:visible}
  .inner #view{padding:10px 14px 18px}
}
/*PERF_PATCH*/
@keyframes riseL{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
html.lite #view>*{animation:riseL .3s ease-out backwards;animation-delay:calc(var(--i,0)*40ms)}
html.lite .btn::after{display:none!important}
html.lite #modal{backdrop-filter:none;-webkit-backdrop-filter:none}
html.lite .plank .gi,html.lite .rank svg,html.lite .hero,html.lite .hlogo,html.lite .laurel,html.lite .card3d,html.lite .emb,
html.lite .role .big .bdg,html.lite .itemrow .bdg,html.lite .spk,html.lite .seat .burst,html.lite .timerbox .tg,
html.lite #decor .lanw::before,html.lite #decor .lanw svg,html.lite .tw .lights,html.lite .seat .crw,html.lite .seat.me .av,html.lite .sad,html.lite .emo{animation:none!important}
html.lite .hero,html.lite .hlogo,html.lite .laurel,html.lite .card3d,html.lite .emb,html.lite .role .big .bdg,html.lite .spk{filter:none}
html.lite .bomb{filter:drop-shadow(0 0 14px rgba(255,110,30,.85))}
html.ultra *,html.ultra *::before,html.ultra *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
/*PERF2*/
html.lite .win,html.lite .hp,html.lite .sheet,html.lite .role{box-shadow:inset 0 0 0 3px #140a04,0 4px 10px #000a}
html.lite .btn{box-shadow:inset 0 -3px 0 #a85d10,0 4px 0 #6d3a0c}
html.lite .plank,html.lite .rb{box-shadow:0 3px 7px #000a}
html.lite .gcard{box-shadow:0 3px 8px #000a}
/*DESIGN2*/
@media (max-width:899px){
  /* главная */
  .hlogo{width:min(58%,calc(var(--vh)*30))}
  .hero2{width:min(46vw,calc(var(--vh)*21));margin-top:-18px}
  .gcards{grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/*NEON*/
/* ===========================================================================================
   НЕОНОВАЯ ТЕМА. Принципы оптимизации:
   1) Цвета интерфейса «перетекают» через ОДИН параметр --p (0→1→0), который анимируется ступенями ≈10 кадров/с
      (steps) — глазу плавно, а перерисовок в 6 раз меньше, чем на 60 fps.
   2) Фон — только transform/opacity (GPU), без blur и без перерисовок. Звёзды рисуются один раз.
   3) На слабых телефонах (html.lite) — меньше слоёв, без цветного свечения, цвета меняются реже.
   =========================================================================================== */
@property --p{syntax:'<number>';inherits:true;initial-value:0}
@property --m1{syntax:'<color>';inherits:true;initial-value:rgba(110,60,255,.35)}
@property --m2{syntax:'<color>';inherits:true;initial-value:rgba(0,200,255,.22)}
@keyframes pshift{to{--p:1}}
:root{
  animation:pshift 24s steps(240) infinite alternate;
  --c1:hsl(calc(182 + 148*var(--p)) 100% 60%);
  --c2:hsl(calc(328 - 108*var(--p)) 100% 66%);
  --c3:hsl(calc(262 + 26*var(--p)) 100% 70%);
  --g1:hsl(calc(182 + 148*var(--p)) 100% 60%/.5);
  --g2:hsl(calc(328 - 108*var(--p)) 100% 66%/.42);
  --gold:var(--c1);--gold2:var(--c2);--cream:#f3eeff;--mut:#a99ad8;--ember:var(--c2);--bad:#ff4d7d;--ok:#4dffb0;
  --hf:"Unbounded","Nunito","Segoe UI",system-ui,sans-serif;
  --surf:linear-gradient(165deg,rgba(44,22,100,.74),rgba(15,7,42,.88));
  --wood:var(--surf);
  --edge:rgba(172,142,255,.30);
  --glow:0 0 26px -8px var(--g1);
  --tglow:0 0 12px var(--g1);
}
html.lite{animation-duration:30s;animation-timing-function:steps(90);--glow:0 0 0 0 transparent;--tglow:none}
html{background:#07031a}
body{--m1:rgba(110,60,255,.35);--m2:rgba(0,200,255,.22)}
body[data-mood=night]{--m1:rgba(255,40,110,.50);--m2:rgba(130,20,170,.42)}
body[data-mood=day]{--m1:rgba(255,150,60,.46);--m2:rgba(255,60,170,.38)}
body[data-mood=tense]{--m1:rgba(0,225,205,.40);--m2:rgba(50,100,255,.40)}

/* ---------- фон ---------- */
#scene{position:fixed;inset:0;z-index:-2;overflow:hidden;background:#07031a}
#scene>*,#scene .bl,#scene .grid{position:absolute}
#scene .base{inset:0;background:radial-gradient(120% 80% at 50% 0%,#1d0c4e 0%,#0a0426 55%,#050216 100%)}
#scene .lay{inset:0;opacity:0;animation:layFade 42s ease-in-out infinite;will-change:opacity}
#scene .lay.B{animation-delay:-14s}#scene .lay.C{animation-delay:-28s}
@keyframes layFade{0%,100%{opacity:0}50%{opacity:.85}}
#scene .bl{width:32vmax;height:32vmax;margin:-16vmax 0 0 -16vmax;border-radius:50%;background:radial-gradient(closest-side,var(--c),transparent);opacity:.55;transform:translate3d(0,0,0) scale(2.4);will-change:transform;animation:drift 34s ease-in-out infinite alternate}
#scene .x1{left:14%;top:22%;--dx:14vw;--dy:10vh}
#scene .x2{left:86%;top:38%;--dx:-16vw;--dy:-8vh;animation-duration:41s}
#scene .x3{left:48%;top:92%;--dx:10vw;--dy:-14vh;animation-duration:47s}
@keyframes drift{to{transform:translate3d(var(--dx),var(--dy),0) scale(3.1)}}
#scene .tint{inset:0;background:radial-gradient(70% 50% at 50% 105%,var(--m1),transparent 70%),radial-gradient(60% 45% at 50% -5%,var(--m2),transparent 70%);transition:--m1 1.6s,--m2 1.6s}
#scene #stars{inset:0;width:100%;height:100%;animation:twk 7s ease-in-out infinite alternate}
@keyframes twk{from{opacity:.4}to{opacity:1}}
#scene .gridw{left:0;right:0;bottom:0;height:40vh;perspective:420px;perspective-origin:50% 0;overflow:hidden;opacity:.5;-webkit-mask-image:linear-gradient(180deg,transparent,#000 60%);mask-image:linear-gradient(180deg,transparent,#000 60%)}
#scene .grid{left:-60%;right:-60%;top:0;height:230%;transform-origin:50% 0;transform:rotateX(68deg);will-change:transform;animation:gridrun 2.6s linear infinite;
  background:linear-gradient(90deg,rgba(125,249,255,.6) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(0deg,rgba(255,107,217,.55) 1px,transparent 1px) 0 0/64px 64px}
@keyframes gridrun{to{transform:rotateX(68deg) translateY(64px)}}
#scene .mote{left:0;bottom:-10px;width:var(--s);height:var(--s);border-radius:50%;background:var(--mc);box-shadow:0 0 8px 2px var(--mc);opacity:0;will-change:transform,opacity;animation:moteUp var(--d) linear var(--dl) infinite}
@keyframes moteUp{0%{transform:translate3d(0,0,0);opacity:0}10%{opacity:.85}90%{opacity:.5}100%{transform:translate3d(var(--dx),-105vh,0);opacity:0}}
#scene .vig{inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 42%,rgba(3,1,14,.72) 100%)}
html.lite #scene .lay.C{display:none}
html.lite #scene .grid{animation:none}
html.lite #scene .tint{transition:none}
html.lite #scene .bl{will-change:auto}

/* ---------- общие анимации (без blur) ---------- */
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
@keyframes breathe{from{transform:scale(.92);opacity:.6}to{transform:scale(1.08);opacity:1}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 3px #7df9ff)}50%{filter:drop-shadow(0 0 12px #ff6bd9)}}
@keyframes hueSway{from{filter:hue-rotate(-25deg)}to{filter:hue-rotate(70deg)}}
@keyframes neonFlick{0%,17%,21%,61%,64%,100%{opacity:1}19%,62%{opacity:.5}}
@keyframes sheen{0%,60%{transform:translateX(-130%) skewX(-20deg)}100%{transform:translateX(330%) skewX(-20deg)}}

/* ---------- типографика ---------- */
h1,h2,h3{font-family:var(--hf)!important;font-weight:700!important;letter-spacing:0!important;color:#fff;text-shadow:var(--tglow),0 0 2px rgba(255,255,255,.5)}

/* ---------- плашка-заголовок ---------- */
.plank{border:0;border-radius:999px;padding:7px 24px;background:linear-gradient(100deg,var(--c1),var(--c3) 55%,var(--c2));color:#0c0420;text-shadow:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),var(--glow);font-weight:900;font-size:16px;letter-spacing:.3px}

/* ---------- стеклянные поверхности ---------- */
.win,.hp,.panel,.sheet,.role,.wcard,.gcard,.team,.bm-topic{backdrop-filter:none}
.win{border:1px solid var(--edge);background:var(--surf);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 40px -18px #000,var(--glow)}
.win::before{display:none}
.hp{border:1px solid var(--edge);border-radius:26px;background:var(--surf);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 48px -18px #000,var(--glow)}
.panel{border:1px solid var(--edge);background:var(--surf);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 40px -18px #000,var(--glow)}
.split .r .win{background:var(--surf);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 36px -16px #000,var(--glow)}

.split .r .win .rtog{color:var(--c1)}
.role{border:1px solid var(--edge);background:var(--surf);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 44px -16px #000,0 0 40px -14px var(--g1)}

.sil2{display:block;width:min(62%,210px);margin:0 auto;animation:floaty 5s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(255,64,110,.6))}
.noir{position:relative;width:min(100%,360px);aspect-ratio:770/625;margin:0 auto;border-radius:26px;overflow:hidden;border:1px solid rgba(255,64,110,.5);box-shadow:0 0 46px -10px rgba(255,64,110,.7)}

/* ---------- кнопки ---------- */
.btn{border:0;border-radius:18px;min-height:54px;color:#0c0420;font-weight:900;letter-spacing:.2px;text-shadow:none;
  background:linear-gradient(100deg,var(--c1),var(--c3) 52%,var(--c2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.16),0 8px 24px -8px var(--g1),0 0 0 1px rgba(255,255,255,.14);
  transition:transform .12s,filter .2s}

.btn:hover{filter:brightness(1.12) saturate(1.1)}

.btn.ghost{color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 18px -10px #000}

.rb{border:1px solid var(--edge);background:rgba(30,14,70,.72);color:var(--c1);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 16px -6px #000c;transition:transform .12s,border-color .2s}
.rb:hover{border-color:var(--c1);box-shadow:0 0 18px -2px var(--g1)}
#bot.top .rb{color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 16px -6px #000c;background:rgba(26,12,62,.78)}
#bot .rb{background:rgba(30,14,70,.78)}
.av{border:2px solid rgba(255,255,255,.22);color:#fff;box-shadow:0 0 0 2px rgba(7,3,26,.55),0 0 14px -4px var(--g1)}

.tag{background:rgba(255,255,255,.07);border:1px solid var(--edge);color:var(--c1)}

.seg{background:rgba(8,3,26,.6);border:1px solid var(--edge);box-shadow:none}

.stepper>div:first-child>b{color:#f3eeff!important}

.stepper button:active{background:rgba(255,255,255,.18)}

#toast{background:rgba(24,10,60,.92);color:#fff;border:1px solid var(--c1);box-shadow:0 0 22px -6px var(--g1)}

/* ---------- главный экран ---------- */
.hlogo{display:flex;flex-direction:column;align-items:center;width:auto!important;max-width:100%;filter:none;line-height:1;text-align:center;animation:logoIn 1s cubic-bezier(.2,.9,.3,1.1) both,floaty 7s 1s ease-in-out infinite}
.hlogo .lg1{font:700 clamp(34px,11.5vw,56px)/1 var(--hf);letter-spacing:.07em;margin-right:-.07em;color:#fff;text-shadow:0 0 5px #fff,0 0 14px var(--c1),0 0 34px var(--c1),0 0 70px var(--g2)}
.hlogo .lg2{margin-top:.28em;font:700 clamp(20px,6.6vw,34px)/1 var(--hf);letter-spacing:.46em;margin-right:-.46em;color:transparent;-webkit-text-stroke:1.4px var(--c2);text-shadow:0 0 12px var(--c2),0 0 34px var(--g2);animation:neonFlick 7s steps(1) infinite}
html.lite .hlogo .lg1{text-shadow:0 0 5px #fff,0 0 16px var(--c1),0 0 40px var(--g2)}
html.lite .hlogo .lg2{text-shadow:0 0 14px var(--c2)}
.hero2{margin-top:-4px}
.hero2::before{content:"";position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 50% 58%,rgba(255,79,216,.5),rgba(110,60,255,.34) 46%,transparent 72%);animation:breathe 5s ease-in-out infinite alternate}
.hero2 .rings{position:absolute;inset:0;animation:hueSway 18s ease-in-out infinite alternate}
.hero2 .rg{position:absolute;border-radius:50%;background:conic-gradient(from 0deg,#00e5ff,transparent 28%,#ff2bd6 52%,transparent 78%,#00e5ff);-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(closest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:spinSlow 16s linear infinite}
.hero2 .r1{inset:2%}.hero2 .r2{inset:12%;animation-duration:24s;animation-direction:reverse;opacity:.8}.hero2 .r3{inset:24%;animation-duration:32s;opacity:.55}
.hero2 .crew{position:absolute;left:-2%;bottom:7%;width:104%;filter:drop-shadow(0 0 16px rgba(255,79,216,.45))}
.spk{filter:drop-shadow(0 0 5px #7df9ff)}
html.lite .hero2 .rings{animation:none}
html.lite .hero2::before{animation:none}
.hrow{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);box-shadow:none}
.hrow:hover{border-color:var(--c1);background:rgba(255,255,255,.09)}
.hrow .nm{color:#fff}
.hrow .st{color:#ffe27a;text-shadow:0 0 10px rgba(255,226,122,.5)}
.dots{border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--c1)}
.dots:hover{border-color:var(--c1)}
.addb{border:1.5px dashed var(--c1);background:rgba(255,255,255,.03);color:var(--c1);box-shadow:none;letter-spacing:.2px;font-weight:900;font-family:"Nunito",sans-serif}
.addb:hover{background:rgba(255,255,255,.08)}
.addb:active{transform:scale(.98);box-shadow:none}
.hlinks button{border:1px solid var(--edge);background:rgba(255,255,255,.05);color:#e8defd}
.hlinks button:active{background:rgba(255,255,255,.12)}
.langs{background:rgba(8,3,26,.6);border:1px solid var(--edge)}
.langs button{color:var(--mut)}
.langs button.on{background:linear-gradient(100deg,var(--c1),var(--c3));color:#0c0420}
.hnote,.empty{color:var(--mut)}

/* карточки игр: у каждой своя неоновая подсветка (статическая — без перерисовок) */
.gcard{border:1px solid rgba(var(--ac),.45);color:#fff;
  background:linear-gradient(160deg,rgba(var(--ac),.22),rgba(18,8,48,.82) 64%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 14px 30px -14px #000,0 0 20px -8px rgba(var(--ac),.75)}
.gcard::before{background:radial-gradient(circle at var(--mx,30%) var(--my,50%),rgba(var(--ac),.3),transparent 58%)}
.gcard:hover{border-color:rgba(var(--ac),.95);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 36px -14px #000,0 0 34px -4px rgba(var(--ac),.85)}
.gl{display:grid;place-items:center;flex:0 0 22%;height:64px}
.gl::before{content:"";position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:radial-gradient(circle,rgba(var(--ac),.5),transparent 68%);animation:breathe 3.6s ease-in-out infinite alternate}
.gic{position:relative;display:block;width:50px;height:50px;color:rgb(var(--ac));filter:drop-shadow(0 0 6px rgba(var(--ac),.95)) drop-shadow(0 0 14px rgba(var(--ac),.55))}
.gic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gi2 b{font-family:var(--hf)!important;font-weight:700!important;font-size:14px;letter-spacing:0;color:#fff;text-shadow:0 0 10px rgba(var(--ac),.8)}
.gi2 small{color:#cfc4f0}
.go{border:1.5px solid rgba(var(--ac),.85);background:rgba(var(--ac),.16);color:rgb(var(--ac))}
.gcard:hover .go{box-shadow:0 0 18px rgba(var(--ac),.8)}
html.lite .gl::before{animation:none}
html.lite .gic{filter:drop-shadow(0 0 5px rgba(var(--ac),.9))}
@media (max-width:899px){
  .gcard .gl{height:70px;flex:none;width:100%}
  .gcard .gi2 b{font-size:13px;line-height:1.15}
  .gcard .gi2 small{color:#cfc4f0}
  .gcard .go{border-width:1.5px}
  .hero2{width:min(66vw,calc(var(--vh)*27))}
}
@media (min-width:900px){
  .hlogo .lg1{font-size:clamp(46px,4.2vw,72px)}.hlogo .lg2{font-size:clamp(26px,2.6vw,44px)}
  .gi2 b{font-size:16px}
}
.nhero{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 auto 10px;text-align:center}
.nhero .gic{width:86px;height:86px}
.nhero b{font:700 clamp(20px,6vw,28px)/1.1 var(--hf);color:#fff;text-shadow:0 0 12px rgba(var(--ac),.9),0 0 30px rgba(var(--ac),.5)}
@media (max-width:899px){.nhero .gic{width:58px;height:58px}.nhero{margin-bottom:6px}}

/* ---------- внутренние экраны ---------- */
.th{color:var(--mut);border-bottom:1px solid rgba(255,255,255,.1)}
.prow{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);box-shadow:none}
.prow:hover{border-color:var(--c1)}
.prow .nm{color:#fff}.prow .sub{color:var(--mut)}
.pts,.rank{color:#ffe27a;text-shadow:0 0 10px rgba(255,226,122,.5)}
.laurel{filter:drop-shadow(0 0 12px var(--g1))}
.cnt{color:#fff}
.who{color:#fff}
.task{background:rgba(8,3,26,.6);border:1px solid var(--edge);border-left:3px solid var(--c2);color:#fff;box-shadow:none}
.pbtn{background:rgba(255,255,255,.06);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);color:#fff}
.pbtn:hover{border-color:var(--c1);transform:translateY(-2px)}
.pbtn:active{transform:scale(.96);box-shadow:none}
.pbtn.sel{border-color:var(--c1);background:rgba(125,249,255,.13);box-shadow:0 0 20px -4px var(--g1);transform:scale(1.05)}

/* карточка игрока */
.pc-fr{position:absolute;left:12%;right:12%;top:3%;bottom:15%;border-radius:calc(var(--w)*.1);background:linear-gradient(165deg,rgba(64,30,150,.82),rgba(14,6,42,.93));border:1.5px solid rgba(125,249,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 22px -6px rgba(125,249,255,.6)}
.pc-ph{z-index:1;box-shadow:0 0 0 2px #0a0420,0 0 0 4px #7df9ff,0 0 18px 2px rgba(125,249,255,.55);color:#fff}
.pc-nm{color:#fff;text-shadow:0 0 10px rgba(125,249,255,.75)}
.pc-st{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#ffe27a;z-index:3}

/* бутылочка: неоновый стол */
.ring{position:relative}
.ring::before{content:"";position:absolute;inset:3%;border-radius:50%;z-index:0;background:radial-gradient(closest-side,rgba(78,34,176,.5),rgba(12,5,38,.88) 82%);box-shadow:0 0 50px -8px rgba(122,61,255,.65),inset 0 0 40px rgba(0,0,0,.5)}
.ring::after{content:"";position:absolute;inset:1%;border-radius:50%;z-index:0;background:conic-gradient(#00e5ff,#7a3dff,#ff2bd6,#7a3dff,#00e5ff);-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(closest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:spinSlow 18s linear infinite,hueSway 14s ease-in-out infinite alternate}
html.lite .ring::after{animation:spinSlow 30s linear infinite}
.seat{z-index:1}
.seat span{color:#fff;text-shadow:0 1px 4px #000,0 0 8px #000}
.seat.me .av{border-color:#fff;animation:glowPulse 2s infinite}
.seat.sel .av{border-color:#fff;box-shadow:0 0 0 4px var(--c2),0 0 26px var(--c2)}
.bottle{z-index:2;filter:drop-shadow(0 0 10px rgba(125,249,255,.55))}
.seat .crw path{fill:#7df9ff}

/* таймер и сцены */
.timer{color:#fff;text-shadow:0 0 14px var(--g1),0 0 34px var(--g2)}
.timer.low{color:var(--bad);text-shadow:0 0 16px rgba(255,77,125,.8)}
.timerbox .sweep{background:conic-gradient(from 0deg,transparent 0 300deg,rgba(125,249,255,.34) 360deg)}
.timerbox .tg{opacity:.35}
.rg2{filter:drop-shadow(0 0 6px var(--g1))}
.emb{filter:drop-shadow(0 0 18px var(--g1))}
.card3d{filter:drop-shadow(0 0 18px var(--g1))}
.itemrow .bdg{filter:drop-shadow(0 0 10px rgba(125,249,255,.4))}

/* бомба */
#bview{background:radial-gradient(circle at 50% 45%,rgba(255,60,170,calc(var(--heat,0)*.55)),transparent 70%)}
.bomb{filter:drop-shadow(0 0 calc(10px + var(--heat,0)*34px) rgba(255,70,170,.9))}
html.lite .bomb{filter:drop-shadow(0 0 14px rgba(255,70,170,.85))}
.boomwrap .bm{filter:drop-shadow(0 0 30px #ff4fd8)}
.boomwrap .rg{border-color:#ff4fd8}
.bm-topic{background:linear-gradient(135deg,#ff4fd8,#7a3dff);box-shadow:0 12px 30px -8px rgba(255,79,216,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.bm-ring{background:radial-gradient(circle,rgba(255,60,170,calc(.16 + var(--heat,0)*.55)),rgba(255,60,170,0) 66%);border:2px dashed rgba(125,249,255,.4)}
.bm-tip{color:#d9cffa}

/* командные игры */
.team{border:1.5px solid color-mix(in srgb,var(--tc) 75%,#fff);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 38%,#0c0424),color-mix(in srgb,var(--tc) 12%,#0a0320));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 20px -8px var(--tc)}
.tchip{border:1.5px solid color-mix(in srgb,var(--tc) 75%,#fff);background:linear-gradient(color-mix(in srgb,var(--tc) 55%,#0c0424),color-mix(in srgb,var(--tc) 22%,#0c0424));box-shadow:0 0 16px -6px var(--tc)}
.tchip.on{outline:2px solid #fff;outline-offset:2px}
.tm{background:rgba(8,3,26,.55);border:1px solid rgba(255,255,255,.25)}
.wcard{border:2px solid color-mix(in srgb,var(--tc) 70%,#fff);background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.22),transparent 60%),linear-gradient(160deg,color-mix(in srgb,var(--tc) 55%,#0c0424),color-mix(in srgb,var(--tc) 16%,#0a0320));box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 18px 40px -14px #000,0 0 40px -8px var(--tc)}
.wcard::before{border-color:rgba(255,255,255,.28)}
.rv{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.rv.ok{border-color:rgba(77,255,176,.6);background:rgba(77,255,176,.1)}
.rv.no{border-color:rgba(255,77,125,.55);background:rgba(255,77,125,.1);color:#ff9ab8}

/* переключатель языка на фоне — нет лишних теней у скроллбара */
.hp-list{scrollbar-color:rgba(172,142,255,.5) transparent}

html.ultra{animation:none}
/* уважаем «меньше движения» */
@media (prefers-reduced-motion:reduce){:root{animation:none}#scene .grid,#scene .bl,#scene .mote,#scene .lay{animation:none!important}}
/*SHELL*/
/* ================= КАРКАС ПО МАКЕТУ: шапка, плитки, нижняя навигация ================= */
:root{--tb:92px}
#app.home,#app.welcome,#app.tabbed{max-width:520px;margin:0 auto;min-height:calc(var(--vh)*100)}
#app.home,#app.tabbed{padding-bottom:calc(var(--tb) + env(safe-area-inset-bottom))!important}
#app.tabbed #view{padding:calc(18px + env(safe-area-inset-top)) 16px 12px!important}
#app.tabbed #view>:not(svg){max-width:none}
#app.home #view{padding:0}
.homev{display:flex;flex-direction:column;gap:14px;padding:calc(14px + env(safe-area-inset-top)) 16px 0}

/* шапка главной */
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.brand{display:flex;align-items:center;gap:8px;font:700 19px/1 var(--hf);letter-spacing:.07em;color:#fff;text-shadow:0 0 12px var(--c1)}
.brand svg{width:24px;height:24px;color:var(--c2);filter:drop-shadow(0 0 6px var(--c2))}
.brand i{font-style:normal;color:transparent;-webkit-text-stroke:1.2px var(--c2);text-shadow:0 0 12px var(--c2)}
.hbtns{display:flex;gap:8px}
.hbtns .rb,.rb.ico{width:42px;height:42px;padding:0}
.hbtns .rb svg{width:21px;height:21px}

/* герой-карточка «Во что играем сегодня?» */
.herocard{position:relative;overflow:hidden;border-radius:26px;padding:18px 16px 16px;min-height:184px;border:1px solid var(--edge);
  background:linear-gradient(135deg,rgba(80,36,184,.78),rgba(18,8,48,.9) 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 18px 40px -18px #000,var(--glow)}
.hc-sun{position:absolute;right:-12%;bottom:-34%;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,170,90,.7),rgba(255,70,170,.4) 45%,transparent 70%);animation:breathe 6s ease-in-out infinite alternate}
.hc-txt{position:relative;z-index:2;max-width:62%}
.herocard small{display:block;font:800 10.5px Nunito,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--c1)}
.herocard h2{margin:6px 0 6px;font-size:clamp(17px,5.2vw,21px)}
.herocard p{margin:0 0 14px;font-size:12.5px;line-height:1.4;color:#cfc4f0;font-weight:600}
.herocard .btn{min-height:44px;padding:0 18px;font-size:14.5px;border-radius:15px;gap:6px}
.herocard .btn svg,.btn svg{width:18px;height:18px;flex:none}
.hc-crew{position:absolute;right:-9%;bottom:-2%;width:54%;z-index:1;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent);filter:drop-shadow(0 0 14px rgba(255,79,216,.4))}

/* полоска «Игроки» */
.crewbar{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:18px;border:1px solid var(--edge);background:rgba(255,255,255,.05);color:#fff;font:inherit;cursor:pointer;text-align:left}
.crewbar b{font-size:15px;font-weight:900}
.crewbar .cn{margin-left:auto;font:900 13px Nunito;color:var(--c1)}
.crewbar>svg{width:18px;height:18px;color:var(--mut);flex:none}
.crewbar .empty-t{flex:1;font-size:14px;font-weight:700;color:var(--mut)}
.avs{display:flex}.avs .av{--s:32px;margin-left:-9px;border-width:2px}.avs .av:first-child{margin-left:0}
.avs .more{margin-left:-9px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:900 11px Nunito;font-style:normal;background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(7,3,26,.6)}

/* плитки игр */
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gtile{--ac:125,249,255;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;aspect-ratio:1.42;padding:8px;border-radius:22px;cursor:pointer;color:#fff;font:inherit;
  border:1px solid rgba(var(--ac),.45);background:linear-gradient(160deg,rgba(var(--ac),.24),rgba(18,8,48,.86) 68%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 12px 26px -14px #000,0 0 18px -8px rgba(var(--ac),.75);
  transition:transform .15s,border-color .2s,box-shadow .25s;animation:rise .5s backwards;animation-delay:calc(var(--k)*70ms + .1s)}
.gtile:hover{border-color:rgba(var(--ac),.95);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 14px 30px -14px #000,0 0 30px -4px rgba(var(--ac),.85)}
.gtile:active{transform:scale(.96)}
.gtile .gic{width:50px;height:50px}
.gtile .gic::before{content:"";position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:radial-gradient(circle,rgba(var(--ac),.4),transparent 68%);z-index:-1;animation:breathe 3.6s ease-in-out infinite alternate}
.gtile b{font:700 13.5px/1.15 var(--hf);text-shadow:0 0 10px rgba(var(--ac),.8)}
.gtile small{font-size:11px;font-weight:700;color:#cfc4f0}
html.lite .gtile .gic::before{animation:none}

/* нижняя навигация */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:30;width:min(496px,calc(100vw - 24px));display:flex;gap:6px;padding:7px;border-radius:26px;
  background:rgba(18,8,48,.93);border:1px solid var(--edge);box-shadow:0 12px 30px -10px #000,var(--glow);touch-action:manipulation}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border:1px solid transparent;border-radius:20px;background:none;color:var(--mut);font:800 12px Nunito,sans-serif;cursor:pointer;transition:color .2s,background .2s}
.tab svg{width:24px;height:24px}
.tab.on{color:#fff;border-color:rgba(255,255,255,.14);background:linear-gradient(135deg,color-mix(in srgb,var(--c3) 55%,#1a0a40),color-mix(in srgb,var(--c2) 45%,#1a0a40));box-shadow:0 0 18px -6px var(--g1)}
.tab.on svg{filter:drop-shadow(0 0 6px var(--c1))}
.tab:active{transform:scale(.95)}

/* «Моя компания» и «История» */
.pghead h2{font-size:clamp(18px,5.4vw,22px);margin:0 0 14px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;font-weight:900;color:#fff}
.chip{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--edge);font:900 12px Nunito,sans-serif;color:var(--c1)}
.clist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.crow{display:flex;align-items:center;gap:12px;height:62px;padding:0 10px;border-radius:17px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);cursor:pointer;transition:opacity .2s,border-color .2s,transform .1s}
.crow:hover{border-color:var(--c1)}.crow:active{transform:scale(.98)}
.crow .nm{flex:1;min-width:0;font-size:16px;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .crown{width:20px;height:20px;color:#ffe27a;filter:drop-shadow(0 0 6px rgba(255,226,122,.7));flex:none}.crow .crown svg{width:100%;height:100%}
.crow .chk{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));color:#0c0420}
.crow .chk svg{width:14px;height:14px;stroke-width:3.4}
.crow.off{opacity:.5}.crow.off .chk{background:transparent;border:1.5px solid var(--edge);color:transparent}.crow.off .av{filter:grayscale(1)}
.btn.add{margin-top:0}
.btn.wide svg{width:19px;height:19px}

/* ---------- шапка игры ---------- */
#bot .rb,#bot.top .rb{border:1px solid var(--edge)}
.btn.ghost{text-shadow:none}
.hbtns .rb{border:1px solid var(--edge)}
#bot.top{align-items:center;gap:10px}
#bot.top .rb{width:44px;height:44px;min-width:44px;padding:0}
#bot.top .rb svg{width:22px;height:22px}
#bot .tt{flex:1;min-width:0;text-align:center;line-height:1.2;pointer-events:none}
#bot .tt b{display:block;font:700 15px var(--hf);color:#fff;text-shadow:var(--tglow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bot .tt small{display:block;font:800 12px Nunito,sans-serif;color:var(--c1);min-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inner.tabbed #view{padding-top:calc(18px + env(safe-area-inset-top))!important}

/* ---------- карточка игры ---------- */
.ginfo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:6px}
.gbig{position:relative;display:grid;place-items:center;width:150px;height:130px}
.gbig::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(var(--ac),.5),transparent 68%);animation:breathe 4s ease-in-out infinite alternate}
.gbig .gic{width:96px;height:96px;animation:floaty 5s ease-in-out infinite}
.gbig.sm{width:90px;height:76px;margin:0 auto}.gbig.sm .gic{width:56px;height:56px;animation:none}
.ginfo h1{font-size:clamp(24px,7.4vw,30px);text-shadow:0 0 14px rgba(var(--ac),.9),0 0 34px rgba(var(--ac),.45)}
.gsub{margin:0;color:#cfc4f0;font-weight:700;font-size:14.5px;line-height:1.35;max-width:300px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;border-radius:20px;border:1px solid var(--edge);background:rgba(255,255,255,.05);padding:12px 0}
.stats>div{display:flex;flex-direction:column;align-items:center;gap:3px;border-left:1px solid rgba(255,255,255,.1);padding:0 4px}.stats>div:first-child{border-left:0}
.stats svg{width:22px;height:22px;color:rgb(var(--ac));filter:drop-shadow(0 0 5px rgba(var(--ac),.8))}
.stats b{font:700 15px var(--hf);color:#fff}.stats b.tg2{font:800 13px Nunito,sans-serif;line-height:1.2}
.stats small{font-size:11.5px;font-weight:800;color:var(--mut)}
.need{width:100%;padding:9px 12px;border-radius:14px;background:rgba(255,64,110,.13);border:1px solid rgba(255,64,110,.5);color:#ff9ab8;font-size:13px;font-weight:800}
.ginfo h3{align-self:flex-start;margin:6px 0 0;font-family:"Nunito",sans-serif!important;font-weight:900!important;font-size:16px;text-shadow:none}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;width:100%;text-align:left}
.steps li{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px;line-height:1.3;color:#efe8ff}
.steps i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:900 13px Nunito,sans-serif;font-style:normal;color:#10062a;background:linear-gradient(135deg,rgb(var(--ac)),rgba(var(--ac),.5));box-shadow:0 0 12px rgba(var(--ac),.6)}
.ginfo .btn.big{margin-top:10px}.ginfo .btn.wide{margin-top:0}
.rules-sheet{text-align:left}.rules-sheet h3{margin:4px 0 12px}

/* ---------- настройка игры ---------- */
.split{display:block!important;min-height:0!important}
.inner #view:has(>.split){justify-content:flex-start}
.split .l{display:block;margin-bottom:12px}
.split .l .itemrow,.split .l .bomb,.split .l .hero{display:none!important}
.split .r .btn.big{margin-top:6px}
.parts{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:18px;border:1px solid var(--edge);background:rgba(255,255,255,.05);color:#fff;font:inherit;cursor:pointer;text-align:left;margin-bottom:10px}
.parts b{font-size:15px;font-weight:900}
.parts .cn{font:900 12px Nunito;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--c1)}
.parts .avs{margin-left:auto}
.parts>svg{width:18px;height:18px;color:var(--mut);flex:none}
.hero{display:none}

/* ---------- передача телефона ---------- */
.pass{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:6px 0 0}
.pass-ico{position:relative;display:grid;place-items:center;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,rgba(var(--ac),.28),rgba(var(--ac),.04) 70%);border:1.5px solid rgba(var(--ac),.5);box-shadow:0 0 38px -6px rgba(var(--ac),.7)}
.pass-ico .gic{width:64px;height:64px}
.pass-ico .gic{color:rgb(var(--ac))}
.chip.secret{padding:4px 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--ac));border-color:rgba(var(--ac),.6);background:rgba(var(--ac),.12)}
.pass h1{font-size:clamp(20px,6.4vw,26px);line-height:1.25}
.pass h1 .nm{color:rgb(var(--ac));text-shadow:0 0 16px rgba(var(--ac),.9)}
.pass-av .av{border-color:rgb(var(--ac));box-shadow:0 0 0 3px rgba(7,3,26,.7),0 0 22px rgba(var(--ac),.65)}
.pass .btn.big{margin-top:6px}

/* ---------- пауза ---------- */
.sheet.pause{text-align:center;border-radius:30px;border-bottom:1px solid var(--edge);margin:auto 14px;width:calc(100% - 28px)}
.pause-ico{display:grid;place-items:center;width:68px;height:68px;margin:2px auto 8px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--c3),var(--c2));box-shadow:0 0 26px -4px var(--g2)}
.pause-ico svg{width:30px;height:30px}
.sheet.pause h1{margin-bottom:8px}
.sheet.pause .btn{margin-top:10px}
.sheet.menu .langs{margin:6px auto 4px}

/* ---------- онбординг ---------- */
.wel{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:calc(var(--vh)*100);padding:calc(26px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));text-align:center}
.wel .hlogo{animation:logoIn 1s cubic-bezier(.2,.9,.3,1.1) both}
.wtag{margin:0;font-weight:700;color:#cfc4f0;font-size:15px}
.wscene{position:relative;width:min(100%,360px);aspect-ratio:1.08;flex:none}
.wscene .hc-sun{right:auto;left:10%;bottom:-18%;width:80%;opacity:.9}
.wscene .rings{position:absolute;inset:0;animation:hueSway 18s ease-in-out infinite alternate}
.wscene .rg{position:absolute;border-radius:50%;background:conic-gradient(from 0deg,#00e5ff,transparent 28%,#ff2bd6 52%,transparent 78%,#00e5ff);-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(closest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:spinSlow 18s linear infinite}
.wscene .r1{inset:4%}.wscene .r2{inset:15%;animation-duration:26s;animation-direction:reverse;opacity:.7}
.wscene .crew{position:absolute;left:0;bottom:4%;width:100%;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);filter:drop-shadow(0 0 16px rgba(255,79,216,.45))}
.feats{list-style:none;margin:0;padding:0;display:grid;gap:11px;width:100%;max-width:300px;text-align:left}
.feats li{display:flex;align-items:center;gap:12px;font-weight:800;font-size:15px;color:#efe8ff}
.fi{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.08);border:1px solid var(--edge);color:var(--c1)}
.fi svg{width:19px;height:19px}
.wel .btn.big{margin-top:auto;max-width:360px}

/* ---------- итоги ---------- */
.trophy{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 auto 4px;animation:popIn .7s cubic-bezier(.2,.9,.3,1.1) both}
.trophy svg{width:104px;height:104px;filter:drop-shadow(0 0 16px rgba(255,200,58,.75));animation:floaty 4s ease-in-out infinite}
.chip.win{padding:5px 16px;font-size:12px;letter-spacing:.12em;color:#fff;border-color:color-mix(in srgb,var(--tc) 70%,#fff);background:color-mix(in srgb,var(--tc) 45%,transparent);box-shadow:0 0 18px -4px var(--tc)}
.banner{width:auto;transform:none;filter:none}

/* ---------- палитры по играм (цвета тоже «перетекают» через --p, но вокруг своего оттенка) ---------- */
body[data-game]{
  --c1:hsl(calc(var(--h) + 18*var(--p)) 100% 62%);
  --c2:hsl(calc(var(--h) + 48 - 14*var(--p)) 100% 66%);
  --c3:hsl(calc(var(--h) - 26 + 8*var(--p)) 100% 68%);
  --g1:hsl(calc(var(--h) + 18*var(--p)) 100% 62%/.5);
  --g2:hsl(calc(var(--h) + 48 - 14*var(--p)) 100% 66%/.42);
}
body[data-game=bottle]{--h:285;--m1:rgba(190,60,255,.42);--m2:rgba(255,70,190,.30)}
body[data-game=spy]{--h:188;--m1:rgba(0,200,255,.36);--m2:rgba(40,110,255,.34)}
body[data-game=mafia]{--h:346;--m1:rgba(255,40,100,.42);--m2:rgba(140,20,150,.36)}
body[data-game=bomb]{--h:24;--m1:rgba(255,110,30,.42);--m2:rgba(255,40,120,.30)}
body[data-game=elias]{--h:150;--m1:rgba(0,230,150,.36);--m2:rgba(0,170,220,.32)}
body[data-game=croc]{--h:42;--m1:rgba(255,170,20,.40);--m2:rgba(255,80,60,.30)}
body[data-game][data-mood=night]{--m1:rgba(255,40,110,.55);--m2:rgba(130,20,170,.45)}
body[data-game][data-mood=day]{--m1:rgba(255,150,60,.50);--m2:rgba(255,60,170,.40)}
body[data-game][data-mood=tense]{--m1:rgba(0,225,205,.40);--m2:rgba(50,100,255,.40)}
body[data-game=mafia] .role:not(.bad) .big .bdg{filter:drop-shadow(0 0 16px var(--g1))}

/* ---------- десктоп: приложение — аккуратная колонка, как на макете ---------- */
@media (min-width:900px){
  #app.inner{max-width:560px}
  #app.inner.wide{max-width:1000px}
  .inner:not(.tabbed) #view{padding:calc(84px + env(safe-area-inset-top)) 20px 40px!important}
  .inner.tabbed #view{padding:30px 20px 12px!important}
  .split{grid-template-columns:none!important}
  #bot.top{left:50%;right:auto;transform:translateX(-50%);width:min(520px,calc(100vw - 24px));top:16px}
  .wel{justify-content:center}
}
html.ultra #scene .grid,html.ultra #scene .mote{display:none}

function fileToAvatar(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement('canvas');
      c.width = c.height = 256;
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .85));
    };
    img.onerror = rej; img.src = url;
  });
}

};
function bombStart() {
  audio();
  const f = FUSES[cv('bFuse', 'm')], ms = (f[0] + Math.random() * (f[1] - f[0])) * 1000, ps = shuffle(players().map(p => p.id));
  G = { phase: 'run', ps, hi: 0, topic: bTopic(), fuse: ms, start: Date.now(), end: Date.now() + ms };

AFTER.bomb = () => {
  if (G.phase === 'who') { later(() => fxAt('.boomwrap', (x, y) => FX.explode(x, y)), 60); return; }
  if (G.phase === 'boom') { later(() => sad(), 200); return; }
  if (G.phase === 'run' && !G.ticking) {
    G.ticking = true; bombTick();
    FX.emitter('fuse', dt => {
      const b = $('#bomb'); if (!b || G.phase !== 'run') return;
      const frac = 1 - (G.end - Date.now()) / G.fuse, r = b.getBoundingClientRect();
      G.acc = (G.acc || 0) + dt * (10 + frac * 50);
      while (G.acc > 1) { G.acc--; FX.spark(r.left + r.width * .75, r.top + r.height * .08, 1); }
    });
  }
};
function bombTick() {
  if (route !== 'bomb' || G.phase !== 'run') return;
  const rem = G.end - Date.now();
  if (rem <= 0) { bombBoom(); return; }
  const frac = 1 - rem / G.fuse, el = $('#bomb');
  setHeat(frac.toFixed(2));
  beep(frac > .75 ? 1200 : 900, .05, .18); vibrate(frac > .75 ? 40 : 15);
  if (el) {
    const em = bEmo(frac); if (el.dataset.e !== em) { el.dataset.e = em; el.innerHTML = bombSVG(em); }
    el.style.setProperty('--sh', frac > .55 ? ((frac - .55) * 14).toFixed(1) : 0);
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  }
  later(bombTick, Math.max(120, 850 - frac * 730));
}
function bombBoom() {
  G.phase = 'who'; G.ticking = false; FX.emitter('fuse', null);
  setHeat(0);
  boomSound(); vibrate([300, 100, 300, 100, 500]); render();
}

function timerHTML(sm) {
  const rem = Math.max(0, G.end - Date.now()), off = (276.5 * (1 - rem / G.total)).toFixed(1);
  return `<div class="timerbox ${sm ? 'sm' : ''}"><svg class="rg2" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="7"/><circle id="ring" cx="50" cy="50" r="44" fill="none" stroke="url(#gg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="${off}"/></svg><div class="sweep"></div><div class="timer" id="tmr">${fmt(rem)}</div></div>`;
}
function runTimer(onEnd) {
  const tk = G.tk = (G.tk || 0) + 1, r0 = route;
  const tick = () => {
    if (route !== r0 || G.phase !== 'play' || G.tk !== tk) return;
    const rem = Math.max(0, G.end - Date.now()), el = $('#tmr'), rg = $('#ring');
    if (el) { el.textContent = fmt(rem); el.classList.toggle('low', rem < 10000); }
    if (rg) rg.style.strokeDashoffset = (276.5 * (1 - rem / G.total)).toFixed(1);
    if (rem <= 5000 && rem > 0 && Math.ceil(rem / 1000) !== G.ls) { G.ls = Math.ceil(rem / 1000); beep(900, .08, .12); }
    if (rem <= 0) { beep(440, .8, .3, 'sawtooth'); vibrate([400, 150, 400]); onEnd(); return; }
    later(tick, 200);
  };
  tick();
}
function teamStart(extra) {
  if (G.teams.some(t => t.length < 2)) { toast('В каждой команде должно быть минимум 2 игрока'); return; }
  setcv('tN', G.teams.length);
  G = Object.assign({ phase: 'ready', teams: G.teams, score: G.teams.map(() => 0), cur: 0, ei: G.teams.map(() => 0), turns: 0, scored: false }, extra);
  lastKey = ''; render();
}
/* после хода команды: следующий ход или победа (по завершении полного круга) */
function teamNext(goal) {
  G.ei[G.cur]++; G.turns++;
  if (G.cur === G.teams.length - 1) {
    const mx = Math.max(...G.score), lead = G.score.filter(x => x === mx).length;
    if (mx >= goal && lead === 1) { teamEnd(G.score.indexOf(mx)); return; }
  }
  G.cur = (G.cur + 1) % G.teams.length; G.phase = 'ready'; G.word = null; G.show = false; render();
}
function teamEnd(w) {
  G.win = w; G.phase = 'over';
  if (!G.scored) { G.scored = true; G.teams[w].forEach(id => addScore(id, route, 2)); }
  render();
}
const teamOver = () => `<div class="center pad">${banner('ПОБЕДА: ' + TEAMC[G.win].n.toUpperCase(), TEAMC[G.win].c)}<h1 style="margin:10px 0">Победили ${TEAMC[G.win].n}!</h1>
