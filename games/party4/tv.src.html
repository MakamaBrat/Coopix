<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Boards Games — Бомбочка</title>
<style>html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas>
<script>
/* Boards Games — мини-версия для «телевизора» Coopix: «Бомбочка».
   За столом у костра шестеро: ты (внизу) и пятеро друзей. Бомба ходит по кругу. Когда она у тебя — тапни (пробел, клик), чтобы передать дальше.
   Не успел — бабах. Фитиль гаснет у кого-то из друзей — он вылетает, тебе очки. Вылетели все — победа и новый раунд, но быстрее. */
(()=>{const c=document.getElementById("c"),x=c.getContext("2d");let W=0,H=0,S=1,OX=0,OY=0;
const fit=()=>{const d=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);S=Math.min(W/320,H/200);OX=(W-320*S)/2;OY=(H-200*S)/2};
addEventListener("resize",fit);fit();
const AVS=/*AV*/[],FLAME=/*FLAME*/"";
const imgs=AVS.map(u=>{const i=new Image();i.src=u;return i}),fl=new Image();fl.src=FLAME;
const N=6,CX=160,CY=100,RX=108,RY=60;
const seat=i=>{const a=Math.PI/2+i*Math.PI*2/N;return[CX+Math.cos(a)*RX,CY+Math.sin(a)*RY+4]};
let st="menu",alive,holder,holdT,holdMax,fuse,level=0,score=0,best=0,youT=0,t=0,parts=[],pops=[],shake=0,msg="",msgT=0,boomI=-1,boomT=0,spin=0;
try{best=+localStorage.getItem("p4.tv")||0}catch(e){}
let AC=null;function beep(f,d,ty,v,f2){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),q=AC.createGain();o.type=ty;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);q.gain.value=v;q.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(q).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const others=ex=>{const r=[];for(let i=0;i<N;i++)if(alive[i]&&i!==ex)r.push(i);return r};
function newFuse(){fuse=Math.max(3.6,rnd(6.5,11)-level*.45)}
function newRound(){alive=[true,true,true,true,true,true];newFuse();give(pick(others(0)))}
function give(i){holder=i;youT=0;holdT=0;holdMax=i===0?0:Math.max(.3,.85-level*.05)+rnd(0,.45);if(i===0)beep(520,.07,"triangle",.05)}
function start(){level=0;score=0;newRound();st="play";msg="";spin=0}
function burst(px,py,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(.6,3.2);parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.6,l:rnd(24,48),c:col||pick(["#ffd36a","#ff8a2a","#ff5a3a","#fff3b0"])})}}
const say=(m,d)=>{msg=m;msgT=d||1.1};
function explode(i){boomI=i;boomT=0;shake=10;beep(120,.5,"sawtooth",.1,40);const[px,py]=seat(i);burst(px,py,30);
  if(i===0){st="boom";if(score>best){best=score;try{localStorage.setItem("p4.tv",best)}catch(e){}}}
  else{alive[i]=false;score+=10;pops.push({x:px,y:py-20,t:0,s:"+10"});
    if(!others(0).length){score+=25;level++;say("ПОБЕДА! Раунд "+(level+1),1.6);pops.push({x:CX,y:CY-10,t:0,s:"+25"});beep(660,.3,"square",.05,990);setTimeout(()=>{if(st==="play")newRound()},1300);holder=-1;return}
    newFuse();give(pick(others(0)))}}
function tap(){if(AC&&AC.state==="suspended")try{AC.resume()}catch(e){}
  if(st==="menu"||st==="over"){start();return}
  if(st!=="play"||holder!==0)return;
  const fast=youT<.3?2:0;score+=1+fast;pops.push({x:seat(0)[0],y:seat(0)[1]-24,t:0,s:fast?"+3":"+1"});beep(760,.06,"square",.05);
  give(pick(others(0)))}
c.addEventListener("pointerdown",e=>{e.preventDefault();tap()});
addEventListener("keydown",e=>{if([" ","Enter","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","z","x"].includes(e.key)||e.key.length===1){e.preventDefault();if(!e.repeat)tap()}});
function step(dt){t+=dt;spin+=dt;if(shake>0)shake=Math.max(0,shake-dt*30);if(msgT>0)msgT-=dt;
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.l--}parts=parts.filter(p=>p.l>0);for(const p of pops)p.t+=dt;pops=pops.filter(p=>p.t<1);
  if(st==="boom"){boomT+=dt;if(boomT>1.1){st="over"}return}
  if(st!=="play"||holder<0)return;
  fuse-=dt;holdT+=dt;
  if(holder===0){youT+=dt;const W=Math.max(.5,1.05-level*.06);if(youT>W||(fuse<=0&&youT>.45)){explode(0);return}}
  else{if(holdT>=holdMax&&fuse>0){const o=others(holder);const to=pick(o.length?o.concat(0,0):[0]);give(to);beep(300+Math.random()*60,.05,"triangle",.03)}
    if(fuse<=0){explode(holder);return}}
  if(fuse<2&&Math.floor(t*(6+(2-fuse)*5))%2===0&&holder!==0&&Math.random()<.05)beep(900,.02,"square",.015)}
function bomb(px,py,s,hot){x.save();x.translate(px,py);x.scale(s,s);
  const k=hot?Math.sin(t*38)*.8:0;x.translate(k,0);
  const g=x.createRadialGradient(-3,-3,1,0,0,9);g.addColorStop(0,"#6a5a6a");g.addColorStop(1,"#15101a");x.fillStyle=g;x.beginPath();x.arc(0,0,8.5,0,6.283);x.fill();
  x.fillStyle="#9a8a9a";x.fillRect(-2.2,-11,4.4,3.4);
  x.strokeStyle="#c9a25a";x.lineWidth=1.3;x.beginPath();x.moveTo(0,-11);x.quadraticCurveTo(5,-15,4,-19);x.stroke();
  const f=.6+.4*Math.sin(t*(12+(fuse<2?30:0)));x.fillStyle="rgba(255,"+(160+f*70|0)+",60,"+(.7+f*.3)+")";x.beginPath();x.arc(4,-19.5,2.2+f*1.6,0,6.283);x.fill();
  x.fillStyle="#fff7c8";x.beginPath();x.arc(4,-19.5,1.2,0,6.283);x.fill();x.restore()}
function draw(){
  x.save();x.clearRect(0,0,W,H);
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#050818");g.addColorStop(.6,"#0d1342");g.addColorStop(1,"#2b1b4c");x.fillStyle=g;x.fillRect(0,0,W,H);
  x.translate(OX+(shake?rnd(-shake,shake)*.3*S:0),OY);x.scale(S,S);
  // звёзды
  for(let i=0;i<26;i++){const a=(Math.sin(i*91.7)*.5+.5),b=(Math.sin(i*37.3)*.5+.5),tw=.4+.6*Math.abs(Math.sin(t*.8+i));x.fillStyle="rgba(255,240,200,"+(.25+tw*.5)+")";x.fillRect(-OX/S+a*(W/S),b*70,1.2,1.2)}
  // стол
  x.fillStyle="rgba(0,0,0,.35)";x.beginPath();x.ellipse(CX,CY+14,RX+26,RY+22,0,0,6.283);x.fill();
  const tg=x.createRadialGradient(CX,CY,10,CX,CY,RX+20);tg.addColorStop(0,"#6b4318");tg.addColorStop(1,"#2e1a0a");x.fillStyle=tg;x.strokeStyle="#a2692a";x.lineWidth=2.5;x.beginPath();x.ellipse(CX,CY+6,RX+20,RY+16,0,0,6.283);x.fill();x.stroke();
  // костёр
  const gl=x.createRadialGradient(CX,CY+4,2,CX,CY+4,46+Math.sin(t*5)*3);gl.addColorStop(0,"rgba(255,170,60,.55)");gl.addColorStop(1,"rgba(255,120,20,0)");x.fillStyle=gl;x.fillRect(CX-60,CY-50,120,110);
  if(fl.complete&&fl.naturalWidth){const w=40+Math.sin(t*6)*1.5,h=w*fl.naturalHeight/fl.naturalWidth;x.drawImage(fl,CX-w/2,CY+14-h,w,h)}
  // игроки
  for(let i=0;i<N;i++){const[px,py]=seat(i),r=17,me=i===0,on=alive[i]!==false||st==="menu";
    x.save();x.globalAlpha=on?1:.32;
    x.fillStyle="rgba(0,0,0,.4)";x.beginPath();x.ellipse(px,py+r-2,r*.9,4,0,0,6.283);x.fill();
    x.beginPath();x.arc(px,py,r,0,6.283);x.save();x.clip();const im=imgs[i];if(im&&im.complete&&im.naturalWidth)x.drawImage(im,px-r,py-r,r*2,r*2);else{x.fillStyle="#7a5a8a";x.fillRect(px-r,py-r,r*2,r*2)}x.restore();
    const hot=holder===i&&st==="play";x.lineWidth=hot?3:2;x.strokeStyle=hot?"#ff6a3a":me?"#8fd45c":"#d29a3a";x.beginPath();x.arc(px,py,r,0,6.283);x.stroke();
    if(!on){x.globalAlpha=.9;x.strokeStyle="#ff8a6a";x.lineWidth=2.5;x.beginPath();x.moveTo(px-8,py-8);x.lineTo(px+8,py+8);x.moveTo(px+8,py-8);x.lineTo(px-8,py+8);x.stroke()}
    x.restore();
    if(me){x.font="bold 8px sans-serif";x.textAlign="center";x.fillStyle="#8fd45c";x.fillText("ТЫ",px,py+r+10)}}
  // бомба
  if(st==="play"&&holder>=0){const[px,py]=seat(holder);const hot=fuse<2;const bob=Math.sin(t*9)*1.2;bomb(px,py-r_(holder)-9+bob,.95,hot);
    if(holder===0){const Wn=Math.max(.5,1.05-level*.06),k=Math.max(0,1-youT/Wn);x.fillStyle="rgba(0,0,0,.45)";x.fillRect(px-26,py+23,52,4);x.fillStyle=k>.4?"#8fd45c":"#ff6a3a";x.fillRect(px-26,py+23,52*k,4);
      x.font="bold 13px sans-serif";x.textAlign="center";x.fillStyle="#ffe9b8";x.globalAlpha=.7+.3*Math.sin(t*14);x.fillText("ТАП!",CX,CY-36);x.globalAlpha=1}}
  // взрыв
  if(boomI>=0&&boomT<.7){const[px,py]=seat(boomI),r=boomT*70;x.globalAlpha=1-boomT/.7;const bg=x.createRadialGradient(px,py,2,px,py,r+4);bg.addColorStop(0,"#fff6c0");bg.addColorStop(.5,"#ff9a2a");bg.addColorStop(1,"rgba(255,60,20,0)");x.fillStyle=bg;x.beginPath();x.arc(px,py,r+4,0,6.283);x.fill();x.globalAlpha=1}
  for(const p of parts){x.globalAlpha=Math.min(1,p.l/20);x.fillStyle=p.c;x.fillRect(p.x,p.y,2.2,2.2)}x.globalAlpha=1;
  for(const p of pops){x.globalAlpha=1-p.t;x.font="bold 11px sans-serif";x.textAlign="center";x.fillStyle="#ffd36a";x.fillText(p.s,p.x,p.y-p.t*18)}x.globalAlpha=1;
  // шапка
  x.font="bold 10px sans-serif";x.textAlign="left";x.fillStyle="#ffe9b8";x.fillText("★ "+score,8,15);x.textAlign="right";x.fillStyle="#cba56a";x.fillText("рекорд "+best+"  ·  раунд "+(level+1),312,15);
  if(msgT>0&&msg){x.textAlign="center";x.font="bold 16px sans-serif";x.fillStyle="#ffd36a";x.strokeStyle="#140a04";x.lineWidth=3;x.strokeText(msg,CX,50);x.fillText(msg,CX,50)}
  if(st==="menu"||st==="over"){x.fillStyle="rgba(5,6,15,.72)";x.fillRect(0,0,320,200);x.textAlign="center";
    x.font="bold 26px sans-serif";x.fillStyle=st==="over"?"#ff8a6a":"#ffd36a";x.strokeStyle="#140a04";x.lineWidth=4;const tt=st==="over"?"БАБАХ!":"БОМБОЧКА";x.strokeText(tt,CX,64);x.fillText(tt,CX,64);
    x.font="bold 11px sans-serif";x.fillStyle="#ffe9b8";
    if(st==="over"){x.fillText("очки: "+score+(score>=best&&score>0?"  — новый рекорд!":"  ·  рекорд: "+best),CX,88)}else x.fillText("передавай бомбу друзьям у костра",CX,88);
    x.font="10px sans-serif";x.fillStyle="#cba56a";x.fillText("Бомба у тебя — тап (клик, пробел), пока не бахнула.",CX,108);x.fillText("Фитиль догорит у друга — он вылетает, тебе очки.",CX,121);
    x.font="bold 13px sans-serif";x.fillStyle="#ffd36a";x.globalAlpha=.6+.4*Math.sin(t*5);x.fillText(st==="over"?"тап — ещё раз":"тап — играть",CX,150);x.globalAlpha=1}
  x.restore()}
const r_=i=>17;
alive=[true,true,true,true,true,true];holder=-1;
let last=performance.now();(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;step(dt);draw();requestAnimationFrame(loop)})(last);
})();
</script></body></html>
