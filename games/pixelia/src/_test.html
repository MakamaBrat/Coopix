<!doctype html><html><head><meta charset="utf-8"><title>test</title>
<style>body{margin:0;background:#222;color:#ccc;font:12px monospace}#f{position:relative;display:inline-block}canvas{position:absolute;left:0;top:0;image-rendering:pixelated}#g{mix-blend-mode:screen;image-rendering:auto}</style></head>
<body><div id="f"><canvas id="bg"></canvas><canvas id="sim"></canvas><canvas id="g"></canvas></div><div id="i"></div>
<script src="elements.js"></script><script src="sim.js"></script><script src="render.js"></script>
<script>
const W=200,H=120,SC=5;
Sim.alloc(W,H);Sim.generate('island');
Render.init(sim,g,bg,W,H);
for(const c of [bg,sim,g]){c.style.width=W*SC+'px';c.style.height=H*SC+'px'}
document.getElementById('f').style.width=W*SC+'px';document.getElementById('f').style.height=H*SC+'px';
let run=true;
function frame(){ if(run){Sim.step();} Render.draw(Sim); requestAnimationFrame(frame);} frame();
window.run=v=>run=v;
window.stepN=n=>{for(let i=0;i<n;i++)Sim.step();Render.draw(Sim)};
window.fps=()=>{const t=performance.now();for(let i=0;i<60;i++){Sim.step();}const a=performance.now()-t;const t2=performance.now();for(let i=0;i<20;i++)Render.draw(Sim);return {step:a/60,draw:(performance.now()-t2)/20}};
</script></body></html>
