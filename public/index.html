:root{
  --bg0:#07040f; --bg1:#0e0820; --ink:#f4ecff; --dim:#9b86d6; --line:#3a2a70; --acc:#a56bff; --acc2:#5b2fd0;
  --font:"Tektur","Pixelify Sans",ui-monospace,"Courier New",monospace;
  --k:.5; --col:min(100vw - 24px, 500px);
  /* Telegram mini app: its own insets (fullscreen header buttons) + system insets, one extra gap inside Telegram */
  --tgt:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
  --top:max(env(safe-area-inset-top,0px),var(--tgt));
  --bot:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
}
html.tg{--top:calc(max(env(safe-area-inset-top,0px),var(--tgt)) + 12px)}
*{box-sizing:border-box;margin:0}
html{font-synthesis:none;background:var(--bg0);color-scheme:dark;-webkit-text-size-adjust:100%}

.top{position:relative;height:clamp(126px,33vw,155px);margin-bottom:6px}

  animation:draw 1.6s .15s cubic-bezier(.2,.7,.2,1) forwards;filter:drop-shadow(0 0 8px #a56bff99)}
@keyframes draw{to{stroke-dashoffset:0}}
.logo{font-family:"Pixelify Sans",ui-monospace,monospace;position:absolute;left:3%;top:13%;z-index:1;font-weight:700;font-size:clamp(30px,10.4vw,51px);line-height:.86;letter-spacing:-.02em;

  filter:drop-shadow(2px 2px 0 #a56bff) drop-shadow(2px 2px 0 #6a35e0) drop-shadow(2px 2px 0 #2d1475) drop-shadow(0 0 13px #8a4dff88)}
.logo span+span{margin-left:.3em;font-size:.88em}
/* mascot: Coopix the pigeon (+ optional planet behind it) */
.mascot{position:absolute;right:0;top:6px;width:clamp(102px,30vw,152px);z-index:2;cursor:pointer;-webkit-user-select:none;user-select:none;
  animation:pgin .95s cubic-bezier(.2,1.3,.4,1) .3s both}
@keyframes pgin{0%{opacity:0;transform:translateY(-60px) scale(.8) rotate(-8deg)}60%{opacity:1}100%{opacity:1;transform:none}}

@keyframes pghop{0%,100%{transform:translateY(0) scale(1.015,.985) rotate(0)}38%{transform:translateY(-7px) scale(.99,1.012) rotate(-1.4deg)}68%{transform:translateY(-2px) scale(1,1) rotate(1deg)}}

  background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);animation:pgglint 4.2s ease-in-out 1.6s infinite}

  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);transition:background .25s}

.shine{position:absolute;inset:0;mix-blend-mode:color-dodge;opacity:0;pointer-events:none;
  -webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;
  background:conic-gradient(from var(--a),#ff6bd5,#ffd36b,#6bffb0,#6bc7ff,#a56bff,#ff6bd5);}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.item.cd .shine{opacity:.5}

.cover{position:absolute;left:0;top:0;width:256px;height:256px;transform-origin:0 0;overflow:hidden;background:#111}
.cover canvas{position:absolute;inset:0;width:100%;height:100%}
.cover canvas.b{clip-path:inset(0 100% 0 0)}
.cover::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.42) 0,rgba(255,255,255,.08) 28%,transparent 46%,rgba(0,0,0,.28) 100%);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.4)}

.info{position:absolute;left:478px;top:0;width:236px;height:100%}
.title{position:absolute;left:0;top:44px;width:100%;font-weight:600;font-size:36px;line-height:44px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-transform:uppercase;color:#fff4ee;text-shadow:0 3px 0 rgba(0,0,0,.45)}
.stars{position:absolute;left:0;top:102px;display:flex;gap:4px}
.stars button{width:38px;height:38px;display:grid;place-items:center;transition:transform .12s}
.stars button:hover{transform:scale(1.18) rotate(-6deg)}
.stars svg{width:34px;height:34px;shape-rendering:crispEdges}
.pill{position:absolute;left:0;top:158px;height:38px;padding:0 22px;display:flex;align-items:center;font-weight:500;font-size:22px;white-space:nowrap;
  color:var(--c3);background:color-mix(in srgb,var(--c2) 78%,#000);border:2px solid var(--c1);border-radius:19px}
.play{position:absolute;left:728px;top:82px;width:154px;height:104px;z-index:5;
  clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px),0 22px);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 70%,#fff),var(--c1) 45%,color-mix(in srgb,var(--c1) 70%,#000));
  display:grid;place-items:center;transition:transform .12s,filter .2s}
.play::before{content:"";position:absolute;inset:4px;clip-path:inherit;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 82%,#fff),var(--c1) 70%)}
.play svg{position:relative;width:58px;height:58px;fill:#140a28;margin-left:6px}
.play:hover{filter:brightness(1.12)}
.play:active{transform:translateY(5px) scale(.97)}
.edit{position:absolute;left:12px;top:8px;z-index:6;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;
  background:rgba(8,4,18,.8);color:var(--c3);border:2px solid var(--c1);opacity:0;transform:scale(.8);transition:.2s}
.edit svg{width:24px;height:24px;fill:currentColor}
.card:hover .edit,.edit:focus-visible,.cardbox:focus-within .edit{opacity:1;transform:none}
@media(hover:none){.edit{opacity:.9;transform:none;width:52px;height:52px}}

.fav{position:absolute;left:838px;top:8px;z-index:6;width:52px;height:52px;display:grid;place-items:center;border-radius:50%;
  background:rgba(8,4,18,.8);color:var(--c3);border:2px solid var(--c1);transition:transform .12s,color .2s,background .2s}
.fav svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round;shape-rendering:crispEdges}
.fav[aria-pressed=true]{color:#ff5ec4;border-color:#ff5ec4}.fav[aria-pressed=true] svg{fill:currentColor}
.fav:hover{transform:scale(1.1)}.fav:active{transform:scale(.92)}
.pg-fav{width:48px;height:48px;margin-left:auto;margin-right:10px;display:grid;place-items:center;color:var(--c3)}
.pg-fav svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.pg-fav[aria-pressed=true]{color:#ff5ec4}.pg-fav[aria-pressed=true] svg{fill:currentColor}
.card.add .shell{background:repeating-linear-gradient(135deg,#4b3a94 0 12px,transparent 12px 20px)}
.card.add .shell-in::before{background:linear-gradient(100deg,#150d33,#0b0716 75%)}
.card.add .shell-in::after{display:none}
.add .slot>canvas,.add .slot .bob>canvas{filter:drop-shadow(0 6px 7px rgba(0,0,0,.5))}
.add .hint{position:absolute;left:478px;top:56px;width:238px;font-size:36px;line-height:42px;font-weight:600;text-transform:uppercase;color:#fff4ee}
.add .hint small{display:block;margin-top:10px;font-size:22px;line-height:28px;font-weight:400;text-transform:none;color:var(--dim)}
.add .play{--c1:#a56bff}
.empty{font-size:20px;color:var(--dim);text-align:center;padding:26px 14px;border:2px dashed var(--line);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px)}

/* intro */
.cardbox.enter{animation:enter .5s cubic-bezier(.2,.9,.2,1) both;animation-delay:var(--i,0s)}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.97)}}

/* ---------- dock ---------- */
.dock{position:fixed;z-index:20;left:50%;bottom:calc(10px + var(--bot));transform:translateX(-50%);width:var(--col);height:clamp(58px,15vw,74px);
  background:linear-gradient(160deg,#6a4cc8,#2a1a66);
  clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px)}
.dock-in{position:absolute;inset:3px;display:grid;grid-template-columns:repeat(4,1fr);background:linear-gradient(#1a1040,#110a2a);
  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px)}
.dock button{position:relative;display:grid;place-items:center;color:#7a5fcf;transition:color .2s}
.dock button+button::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:#33236a}
.dock button svg{width:38%;max-width:30px;height:auto}
.dock button[aria-current=true]{color:#c6a5ff;background:radial-gradient(70% 90% at 50% 100%,rgba(165,107,255,.28),transparent)}
.dock button[aria-current=true]::after{content:"";position:absolute;left:14%;right:14%;bottom:5px;height:4px;border-radius:2px;background:#b98bff;box-shadow:0 0 12px 2px #a56bff}
.dock button:hover{color:#d9c2ff}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;visibility:hidden}
.sheet.open{visibility:visible}
.scrim{position:absolute;inset:0;background:rgba(5,2,12,.72);backdrop-filter:blur(4px);opacity:0;transition:opacity .25s}
.sheet.open .scrim{opacity:1}
.panel{position:relative;width:min(100vw,540px);max-height:calc(100vh - var(--top) - 8px);max-height:calc(100dvh - var(--top) - 8px);display:flex;flex-direction:column;overflow:hidden;padding:0;
  background:linear-gradient(#1a1040,#0f0826);border-top:4px solid var(--acc);
  border-radius:14px 14px 0 0;
  transform:translateY(40px);opacity:0;transition:.3s cubic-bezier(.2,.9,.2,1)}
.sheet.open .panel{transform:none;opacity:1}
@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:14px;border-top:0;box-shadow:0 0 0 3px var(--acc)}}
.panel h2{font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.x{width:44px;height:44px;display:grid;place-items:center;color:var(--dim)}
.x svg{width:22px;height:22px;fill:currentColor}.x:hover{color:#fff}
.pv{margin-bottom:16px}

/* editor / settings sheet: fixed header + fixed footer, only the middle scrolls */
.panel>.ph{flex:none;margin:0;padding:14px 8px 6px 18px}
.pfix{flex:none;padding:0 18px 8px}
.pbody{flex:0 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:6px 18px 16px}
.pbody::-webkit-scrollbar{width:6px}.pbody::-webkit-scrollbar-thumb{background:#3a2a70}
.pfoot{flex:none;padding:12px 18px calc(14px + var(--bot));border-top:3px solid #2a1a66;background:#0f0826}
.pfoot .row{margin-top:0}
.pfix .pv{margin-bottom:0}
.lbl small{float:right;font-size:inherit;color:var(--dim)}
/* dropdown (context) menu button + popup */
.sel{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:50px;padding:0 14px;font-size:21px;color:#fff;text-align:left;background:#120a2a;border:3px solid var(--line);transition:border-color .15s}
.sel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel::after{content:"";flex:none;width:8px;height:8px;margin:-4px 3px 0 0;border-right:3px solid var(--acc);border-bottom:3px solid var(--acc);transform:rotate(45deg);transition:transform .15s}
.sel:hover,.sel[aria-expanded=true]{border-color:var(--acc)}
.sel[aria-expanded=true]::after{transform:rotate(225deg);margin-top:4px}
.menu{position:fixed;z-index:70;overflow-y:auto;overscroll-behavior:contain;padding:6px;background:#1a1040;border:3px solid var(--acc);box-shadow:0 14px 34px rgba(0,0,0,.65);animation:mnu .14s ease-out}
@keyframes mnu{from{opacity:0;transform:translateY(-4px)}}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 12px;font-size:20px;color:var(--ink);text-align:left}
.menu button::before{content:"";flex:none;width:12px;height:12px;border:3px solid var(--line)}
.menu button:hover,.menu button:focus-visible{background:#2a1a66;outline-offset:-3px}
.menu button[aria-checked=true]{background:#2a1a66;color:#fff}
.menu button[aria-checked=true]::before{background:var(--acc);border-color:#fff}
/* tags */
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:50px;padding:6px 8px;background:#120a2a;border:3px solid var(--line);cursor:text;transition:border-color .15s}
.tagbox:focus-within{border-color:var(--acc)}
.tagbox input{flex:1 1 90px;min-width:80px;height:34px;padding:0 4px;font:inherit;font-size:20px;color:#fff;background:none;border:0;outline:none}
.tagbox input[hidden]{display:none}
.tchip{display:inline-flex;align-items:center;gap:2px;height:34px;padding:0 3px 0 12px;font-size:18px;color:#fff;background:#2a1a66;border:2px solid var(--line);border-radius:17px}
.tchip.main{border-color:var(--acc)}
.tchip button{width:26px;height:26px;display:grid;place-items:center;color:var(--dim)}
.tchip button:hover{color:#ff5c7a}.tchip svg{width:11px;height:11px;fill:currentColor}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sugg[hidden]{display:none}
.sg{height:32px;padding:0 12px;font-size:17px;color:var(--dim);border:2px dashed var(--line);border-radius:16px}
.sg:hover,.sg:active{color:#fff;border-color:var(--acc)}
.sg.new{color:#fff;border-style:solid;border-color:var(--acc)}
.fld{display:block;margin:0 0 14px}
.lbl{display:block;font-size:17px;color:var(--dim);margin-bottom:7px}
.drop{display:grid;place-items:center;gap:4px;text-align:center;padding:16px;border:3px dashed var(--line);background:#120a2a;color:var(--dim);font-size:19px;cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:var(--acc);color:#fff;background:#1a1040}
.drop b{color:#fff;font-weight:600}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{height:50px;border:3px solid var(--line);background:#120a2a;color:var(--dim);font-size:16px;padding:0 2px;transition:.15s}
.chip[aria-checked=true]{border-color:var(--acc);background:#2a1a66;color:#fff}
.chip:hover{color:#fff}
.in{width:100%;height:50px;padding:0 14px;font:inherit;font-size:21px;color:#fff;background:#120a2a;border:3px solid var(--line);border-radius:0;outline:none}
.in:focus{border-color:var(--acc)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#a56bff 50%),linear-gradient(135deg,#a56bff 50%,transparent 50%);background-position:calc(100% - 22px) 22px,calc(100% - 16px) 22px;background-size:6px 6px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button,.sw label{width:42px;height:42px;border:3px solid var(--line);background:var(--c,#444);position:relative;cursor:pointer}
.sw button[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.sw .auto{width:auto;padding:0 14px;background:#120a2a;color:var(--dim);font-size:18px}
.sw .auto[aria-pressed=true]{color:#fff}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.sw .pick{background:conic-gradient(#f55,#fd5,#5f9,#5cf,#a6f,#f5c,#f55)}
.row{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;height:54px;font-size:22px;font-weight:600;text-transform:uppercase;color:#140a28;background:linear-gradient(#cfb0ff,#9a63ff);
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);transition:.12s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(3px)}
.cm-more{display:flex;width:100%;height:46px;margin:14px 0 0;font-size:18px;align-items:center;justify-content:center}.cm-more[hidden]{display:none}
.btn.ghost{flex:0 0 auto;padding:0 20px;background:#2a1a66;color:#e5d6ff}
.btn.danger{background:#ff5c7a;color:#2a0510}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 4px;font-size:21px;border-bottom:2px solid #2a1a66;text-align:left}
.toggle i{width:54px;height:28px;background:#2a1a66;position:relative;flex:none;transition:.2s}
.toggle i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;background:#9b86d6;transition:.2s}
.toggle[aria-checked=true] i{background:var(--acc)}
.toggle[aria-checked=true] i::after{left:29px;background:#fff}

/* ---------- toast ---------- */
.toast{position:fixed;z-index:80;left:50%;top:calc(14px + var(--top));transform:translate(-50%,-220%);visibility:hidden;min-width:200px;max-width:92vw;padding:12px 22px 14px;text-align:center;font-size:20px;
  background:#1a1040;border:3px solid var(--acc);color:#fff;transition:transform .35s cubic-bezier(.2,1.2,.3,1);
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast .bar{display:block;margin-top:8px;height:8px;background:#2a1a66;position:relative;overflow:hidden}
.toast .bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--acc) 0 8px,transparent 8px 10px);transform:translateX(-100%)}
.toast.load .bar::after{animation:load 1.1s steps(12) forwards}
@keyframes load{to{transform:none}}

.boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg0);font-size:22px;color:var(--dim);transition:opacity .5s .1s}
.boot.done{opacity:0;pointer-events:none}
.boot>div{text-align:center}
.boot .lite{display:block;margin:22px auto 0;height:46px;padding:0 20px;border:3px solid var(--line);background:#120a2a;color:#fff;font-size:18px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
.boot .lite:active{transform:translateY(2px)}.boot .lite:disabled{opacity:.5;cursor:default}
.boot .lite-h{margin-top:8px;font-size:14px;opacity:.7}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .swoosh ellipse{stroke-dashoffset:0}
}

/* CD: rainbow diffraction sheen */
.item.cd .shine{opacity:.85;mix-blend-mode:color;animation:cdsheen 5.5s ease-in-out infinite alternate;
  background:conic-gradient(from var(--a),#0000 0deg,#ff4fb8 18deg,#ffd23f 42deg,#4dff9a 66deg,#3fc4ff 90deg,#8a5cff 114deg,#0000 140deg,#0000 180deg,#ff4fb8 198deg,#ffd23f 222deg,#4dff9a 246deg,#3fc4ff 270deg,#8a5cff 294deg,#0000 320deg,#0000 360deg)}
.card:hover .item.cd .shine{animation-duration:2.2s;opacity:1}
/* the disc itself really spins (cover wedges + hub, see Card.cdMake); the rainbow glint stays put and sweeps across it */
@keyframes cdsheen{from{--a:-55deg}to{--a:65deg}}
@keyframes cdwob{0%,100%{rotate:-2.2deg}50%{rotate:2.2deg}}
.cdw{position:absolute;display:none;pointer-events:none;mix-blend-mode:multiply}
.item.cd .cdw{display:block}
.cdw canvas{display:block;width:100%;height:100%;will-change:transform}
.item.cd .bob{isolation:isolate;animation:bob 5s ease-in-out infinite,cdwob 7s ease-in-out infinite;animation-delay:var(--bd,0s),var(--bd,0s)}
/* handheld: noisy screen */
.noise{position:absolute;inset:0;display:none;pointer-events:none;mix-blend-mode:overlay;overflow:hidden;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),var(--nz) 0 0/96px 96px;image-rendering:pixelated;animation:nz .45s steps(1) infinite}
.noise::after{content:"";position:absolute;left:0;top:0;right:0;height:30%;background:linear-gradient(transparent,rgba(255,255,255,.35),transparent);animation:roll 3.2s linear infinite}
.item.hh .noise{display:block}
@keyframes nz{0%{background-position:0 0,0 0}20%{background-position:0 0,-34px 18px}40%{background-position:0 0,22px -40px}60%{background-position:0 0,-12px -22px}80%{background-position:0 0,40px 30px}}
@keyframes roll{from{transform:translateY(-120%)}to{transform:translateY(340%)}}

/* ---------- app page ---------- */
.card{cursor:pointer}
textarea.in{height:auto;min-height:92px;padding:10px 14px;resize:vertical;line-height:1.25}
.page{--c1:#a56bff;--c2:#2b1170;--c3:#efe3ff;position:fixed;top:0;left:0;right:0;bottom:0;-webkit-overflow-scrolling:touch;z-index:30;overflow-y:auto;overscroll-behavior:contain;visibility:hidden;opacity:0;transform:translateY(28px);
  transition:transform .35s cubic-bezier(.2,.9,.2,1),opacity .15s,visibility 0s .35s;
  background:radial-gradient(90% 38% at 50% 0,color-mix(in srgb,var(--c1) 28%,transparent),transparent 70%),linear-gradient(#0c0720,#07040f);background-color:#09051a}
.page.open{visibility:visible;opacity:1;transform:none;transition-delay:0s}
.pg{width:var(--col);margin:0 auto;padding:var(--top) 0 calc(130px + var(--bot))}
.pg-top{display:flex;align-items:center;justify-content:space-between;height:56px}
.back{width:48px;height:48px;display:grid;place-items:center;color:var(--c3)}
.back svg{width:26px;height:26px;fill:currentColor}.back:hover{color:#fff}
.beta{font-size:16px;letter-spacing:.08em;padding:4px 14px;color:#140a28;background:var(--c1);clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.pg-hero{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;margin:2px 0 6px}
.pg-cov{width:96px;height:96px;image-rendering:pixelated;border:3px solid var(--c1);box-shadow:0 0 18px color-mix(in srgb,var(--c1) 55%,transparent)}
.pg-t{font-size:30px;font-weight:600;line-height:1.05;text-transform:uppercase;color:#fff4ee;text-shadow:0 3px 0 rgba(0,0,0,.45);overflow-wrap:anywhere}
.pg-m{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:18px;color:var(--dim)}
.pg-stars{display:flex;gap:2px}.pg-stars svg{width:20px;height:20px}

/* TV */
.tvw{position:relative;margin:18px 0 0;padding-top:40px}
.tvw::before{content:"";position:absolute;left:8px;right:8px;top:48px;bottom:6px;border-radius:26px;box-shadow:0 0 30px 4px color-mix(in srgb,var(--c1) 40%,transparent)}
.ant{position:absolute;left:50%;top:0;width:0;height:44px;pointer-events:none}
.ant::before,.ant::after{content:"";position:absolute;bottom:0;left:-2px;width:4px;height:48px;background:linear-gradient(var(--c3),var(--c1));transform-origin:bottom}
.ant::before{transform:rotate(-30deg)}.ant::after{transform:rotate(26deg)}
.tv{position:relative;padding:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--c1) 62%,#2a2038),color-mix(in srgb,var(--c2) 85%,#000));
  clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px),0 22px)}
.tv-row{display:grid;grid-template-columns:1fr 44px;gap:12px;align-items:start}
.scr{position:relative;height:0;padding-bottom:75%;background:#05030a;border-radius:18px/16px;overflow:hidden;cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;
  box-shadow:inset 0 0 0 3px #0a0612,0 0 0 3px rgba(0,0,0,.55)}
.scr.playing{touch-action:none}
/* hiss: TV is showing snow while the game loads; it powers on when ready */
.scr.hiss canvas.g{opacity:0}
html .tv .scr.hiss::before{display:block;opacity:.9;mix-blend-mode:normal;animation:nz1 .12s steps(1) infinite}
.scr.hiss .tvn{opacity:1;animation-duration:.1s}
.scr.hiss .ov{z-index:5;place-items:center;padding:0}
.scr.hiss .ov span{display:inline-block;padding:3px 10px;background:rgba(5,3,10,.78)}

@keyframes tvg{0%,91%,100%{transform:none}92%{transform:translateX(3px) skewX(-1.5deg)}94%{transform:translateX(-4px)}96%{transform:translateX(1px) skewX(1deg)}}

.tvn{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:overlay;opacity:.95;overflow:hidden;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px),var(--nz) 0 0/96px 96px;image-rendering:pixelated;animation:nz .45s steps(1) infinite;transition:opacity .2s}
.tvn::after{content:"";position:absolute;left:0;top:0;right:0;height:30%;background:linear-gradient(transparent,rgba(255,255,255,.3),transparent);animation:roll 3.2s linear infinite}
.scr::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen;opacity:.13;background:var(--nz) 0 0/64px 64px;image-rendering:pixelated;animation:nz1 .3s steps(1) infinite}
@keyframes nz1{0%{background-position:0 0}25%{background-position:-34px 18px}50%{background-position:22px -40px}75%{background-position:40px 30px}}
.scr::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(120% 100% at 50% 45%,transparent 52%,rgba(0,0,0,.6)),linear-gradient(115deg,rgba(255,255,255,.13),transparent 28%)}
.tv.clean .tvn{opacity:.3}.tv.clean .scr::before{opacity:.04}
.scr.burst .tvn{opacity:1;animation-duration:.08s}.scr.burst::before{opacity:.7}
.ov{position:absolute;inset:0;z-index:2;display:grid;place-items:end center;padding:0 8px 7%;text-align:center;font-weight:600;text-transform:uppercase;color:#fff;text-shadow:0 0 10px var(--c1),2px 2px 0 var(--c2)}

/* sections */

.cm .pf-av.cm-av i{clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
.cmx-top{display:flex;gap:16px;align-items:center;margin:4px 0 14px}

.cmx-b em{font-style:normal;text-align:right}.cmx-b:hover{color:#fff}
.cmx-b[aria-pressed=true]{border-color:var(--acc);background:#2a1a66;color:#fff}

/* play bar */

  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px);transition:transform .12s,filter .2s}

.bigplay svg{width:26px;height:26px;fill:#140a28}.bigplay:hover{filter:brightness(1.1)}.bigplay:active{transform:translateY(4px)}

/* ---------- quality tiers (data-q: 2 high, 1 mid, 0 low) ---------- */
.card.off .stage,.card.off .bob,.card.off .halo,.card.off .shine,.card.off .noise,.card.off .noise::after{animation-play-state:paused}
body.pgopen .app,body.pgopen .dock{visibility:hidden}
body.pgopen .mascot,body.pgopen .mascot *{animation-play-state:paused}
[data-q="1"] .stage,[data-q="0"] .stage{animation:none}
[data-q="1"] .beam,[data-q="0"] .beam,[data-q="1"] .gl,[data-q="0"] .gl{display:none}
[data-q="1"] .halo,[data-q="0"] .halo{animation:none;mix-blend-mode:normal;opacity:.5}
[data-q="1"] .noise,[data-q="0"] .noise{mix-blend-mode:normal;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px),var(--nza) 0 0/96px 96px}
[data-q="1"] .scrim,[data-q="0"] .scrim{backdrop-filter:none;background:rgba(5,2,12,.86)}
[data-q="1"] .tvn,[data-q="0"] .tvn{mix-blend-mode:normal;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px),var(--nza) 0 0/96px 96px}
[data-q="1"] .scr::before,[data-q="0"] .scr::before{display:none}
[data-q="1"] .scr canvas.g,[data-q="0"] .scr canvas.g{filter:none}
[data-q="0"] .noise,[data-q="0"] .item.cd .shine,[data-q="0"] .bob,[data-q="0"] .spark,[data-q="0"] .planet{animation:none}
[data-q="0"] .noise::after,[data-q="0"] .tvn::after{display:none}
[data-q="0"] .tvn{animation-duration:.9s}
[data-q="0"] .planet{filter:none}
[data-q="0"] .slot>canvas,[data-q="0"] .slot .bob>canvas{filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}

/* ---------- fallbacks for browsers without color-mix() / inset ---------- */
.ov,.tvn,.scr::before,.scr::after,.scr canvas.g,.fx,.beam,.gl,.noise,.shine,.cover::after,.shell,.shell-in,.shell-in::before,.shell-in::after,.scrim,.sheet{top:0;left:0;right:0;bottom:0}
@supports not (background:color-mix(in srgb,red,blue)){
 .page{background-image:linear-gradient(#0c0720,#07040f)}
 .pill,.tag{background:var(--c2)}
 .play,.bigplay{background:var(--c1)}.gow .bigplay{background:none}.play::before{background:var(--c1)}
 .halo{background:radial-gradient(closest-side,var(--c1),transparent);opacity:.35}
 .floor{background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent)}
 .shell-in::before{background:linear-gradient(100deg,var(--c2),#0b0716 70%)}
 .tv{background:linear-gradient(160deg,var(--c1),var(--c2))}
 .tvw::before{box-shadow:0 0 30px 4px var(--glow)}

 .slot>canvas,.slot .bob>canvas{filter:drop-shadow(0 7px 7px rgba(0,0,0,.55))}
}
[data-q="0"] body.scan::after{display:none}
/* lite mode (Q=0, picked by Auto on weak phones or by hand): no extra visuals, only flat static art */

[data-q="0"] .floor{filter:none;opacity:.5}
[data-q="0"] .card::before,[data-q="0"] .tvw::before{box-shadow:none}
[data-q="0"] .pbar{filter:none}

[data-q="0"] .card:hover{transform:none}
[data-q="0"] .planet{display:none}
[data-q="0"] .mascot,[data-q="0"] .mwrap,[data-q="0"] .pshadow{animation:none}[data-q="0"] .mwrap{filter:none}[data-q="0"] .glint,[data-q="0"] .sglow,[data-q="0"] .pgeyes,[data-q="0"] .pshadow{display:none}
html[data-q="0"] .tvn{background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);animation:none;opacity:.7}
html[data-q="0"] .scr canvas.g,html[data-q="0"] .scr.pon canvas.g{animation:none}

/* ---------- home: title screen (one screen, no scrolling) ---------- */
:root{--vh:100vh}
@supports (height:100dvh){:root{--vh:100dvh}}
body.onhome .app{padding-bottom:calc(clamp(58px,15vw,74px) + 20px + var(--bot))}

:root{--hh:clamp(104px,min(33vw,17.5vh),155px)}
body.onhome .top{margin-bottom:4px;height:var(--hh)}
body.onhome .mascot{width:clamp(86px,min(30vw,15vh),152px)}

.home{--c1:#a56bff;--c2:#2b1170;--c3:#efe3ff;display:none}

  min-height:calc(var(--vh) - var(--top) - 6px - var(--hh) - 4px - clamp(58px,15vw,74px) - 20px - var(--bot))}

.gad:nth-child(odd){margin-bottom:8px;height:92%}
.gad .bob{display:block}
.gad canvas{display:block;height:100%;width:auto;filter:drop-shadow(0 0 9px var(--g)) drop-shadow(0 7px 7px rgba(0,0,0,.55))}

.hero-t{font-size:clamp(22px,7.4vw,36px);font-weight:700;line-height:1.08;text-transform:uppercase;letter-spacing:.02em;color:#fff7ee;overflow-wrap:anywhere;text-shadow:0 3px 0 rgba(0,0,0,.5)}

@keyframes gonudge{50%{transform:translateX(4px) rotate(45deg)}}
[data-q="0"] .gow .bigplay::after{animation:none}
@keyframes goglow{50%{filter:brightness(1.14)}}
.ts .spark{z-index:0}
.pn{flex:none;display:flex;flex-direction:column;gap:8px}
.home .sec{margin-top:0}

.home .sec h3 small{font-size:14px}

.dots button[aria-current=true]{background:linear-gradient(#b98bff,#b98bff) center/100% 6px no-repeat}
/* home tweaks: logo -20% (header height unchanged), hero title -10%, news card slightly larger */
body.onhome .logo{font-size:clamp(22px,min(8.32vw,4.6vh),40.8px)}
/* средний блок главной (гаджеты + заголовок + кнопка) -10%, освободившееся место отдано новостям: в карточке влезает 3 строки текста */

/* ---------- график «Пульс маркета» (вкладка кубка) ---------- */
.chc{padding:12px 12px 12px;background:linear-gradient(180deg,#171040,#120a2c);border:3px solid var(--line)}
.chc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chc-t{white-space:nowrap;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#cdbfff;font-weight:700}
.chc-t em{font-style:normal;margin-left:6px;padding:0 6px;font-size:11px;font-weight:500;color:#ffb23f;border:1px solid #ffb23f66}
.chc-v{display:inline-block;white-space:nowrap;font-size:clamp(30px,8.5vw,40px);font-weight:700;line-height:1.05;color:#fff;margin-top:6px;margin-right:12px}
.chc-v small{margin-left:8px;font-size:.42em;font-weight:500;color:var(--dim)}
.chc-d{display:inline-block;font-size:14px;margin-top:2px;font-weight:500}.chc-d.up{color:#5dff8a}.chc-d.dn{color:#ff5e7a}
.chc-p{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;padding:3px;background:#0d0724;border:2px solid #2a1f5e}
.chc-p button{height:28px;font-size:14px;font-weight:500;color:var(--dim);background:transparent;border:0;transition:background .18s,color .18s}
.chc-p button[aria-pressed=true]{color:#140a28;font-weight:700;background:var(--acc)}
.chw{position:relative;margin-top:6px}
.chc svg{display:block;width:100%;height:auto;touch-action:pan-y;-webkit-user-select:none;user-select:none;overflow:visible}
.chc svg text{font-family:"Tektur",ui-monospace,monospace;fill:#8f82c4;font-size:11px}
.chc svg text.pt{fill:#cdbfff;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.chc .glow{filter:drop-shadow(0 0 5px rgba(165,107,255,.75))}
/* «Пульс маркета»: цвета серий проверены валидатором палитры на фоне #150d34 (линия, действия, звёзды) */
.chc{--cl:#e8489f;--cb:#7a62f0;--cs:#bf8a00;--surf:#150d34}
.chc svg:focus{outline:none}.chc svg:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
.chc .gl{stroke:#231a50;stroke-width:1}.chc .gb{stroke:#3a2c78;stroke-width:1}
.chc svg text.ax{fill:#8f82c4;font-size:11px;font-variant-numeric:tabular-nums}
.chc svg text.lab{fill:#a99be0;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.chc .ln{fill:none;stroke:var(--cl);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chc .ar{fill:var(--cl);fill-opacity:.1;stroke:none}
.chc .ed{fill:var(--cl);stroke:var(--surf);stroke-width:2}
.chc .bar{fill:var(--cb);transition:fill .12s}.chc .bar.hl{fill:#a593ff}
.chc .cn{fill:var(--cs)}.chc .cnh{fill:#e2b43c}
.chc .xh{stroke:#efe3ff;stroke-opacity:.35;stroke-width:1}.chc .xd{fill:var(--cl);stroke:var(--surf);stroke-width:2}
.chc .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:chdraw 1s cubic-bezier(.3,.7,.2,1) forwards}
.chc .fi{animation:chfade .9s ease both}
.chc .pul{transform-box:fill-box;transform-origin:center;animation:chpul 1.8s ease-out infinite}
@keyframes chdraw{to{stroke-dashoffset:0}}@keyframes chfade{from{opacity:0}}
@keyframes chpul{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.5);opacity:0}}
/* плашка: число главное и белое, подпись тише, рядом ключ серии в форме её метки (черта, столбик, монетка) */
.chc-tip{position:absolute;top:0;left:0;z-index:2;pointer-events:none;padding:8px 10px;background:rgba(14,9,38,.97);border:1px solid #3a2c78;box-shadow:0 6px 20px rgba(0,0,0,.45);color:#a99be0;font-size:13px;line-height:1.45;white-space:nowrap;opacity:0;transition:opacity .12s}
.chc-tip.on{opacity:1}.chc-tip .tt{display:block;margin-bottom:3px;font-size:12px;color:#8f82c4}
.chc-tip div{display:flex;align-items:center;gap:6px}.chc-tip div b{font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
.chc-tip .k{flex:none;display:inline-block}.chc-tip .kl{width:12px;height:2px;background:#e8489f}.chc-tip .kb{width:8px;height:10px;border-radius:2px 2px 0 0;background:#7a62f0}.chc-tip .ks{width:8px;height:8px;background:#bf8a00;box-shadow:inset 0 2px #e2b43c}
.chc-g{margin-top:10px}
.chc-gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}.chc-gh b{font-size:15px;color:#ffd23f;letter-spacing:0}
.chc-gb{position:relative;height:12px;margin-top:5px;background:#0d0724;border:2px solid #2a1f5e;overflow:hidden}
.chc-gb i{position:absolute;left:0;top:0;bottom:0;width:var(--w,3%);background:repeating-linear-gradient(90deg,#ff8fd8 0 8px,#a56bff 8px 16px,#6fa2ff 16px 24px);background-size:48px 100%;box-shadow:0 0 10px rgba(165,107,255,.8);transition:width .9s cubic-bezier(.2,.9,.2,1);animation:chflow 1.4s linear infinite}
.chc-gp{margin-top:4px;font-size:13px;color:#cdbfff}
@keyframes chflow{to{background-position:48px 0}}
[data-q="0"] .chc-gb i{animation:none}
@media (prefers-reduced-motion:reduce){.chc-gb i{animation:none}}
.chc-d.nu{color:#cdbfff}
.chc svg text.tt{fill:#ffd23f;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.chc svg text.hd{fill:#fff;font-size:14px;font-weight:700}.chc svg text.hs{fill:#a99be0;font-size:12px}
.chc .gh{opacity:.55}
.chc-hint{margin-top:8px;font-size:13px;text-align:center;color:var(--dim);transition:opacity .3s}.chc.used .chc-hint{opacity:0}
.chc-s{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;padding-top:10px;border-top:1px solid #2a2160;text-align:center}
.chc-tb{margin-top:10px;font-size:13px;color:var(--dim)}.chc-tb summary{cursor:pointer;color:#cdbfff;width:max-content}
.chc-tb [data-tb]{max-height:260px;overflow:auto;margin-top:6px}
.chc-tb table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.chc-tb th,.chc-tb td{padding:5px 6px;text-align:right;border-bottom:1px solid #231a50;white-space:nowrap}.chc-tb th{position:sticky;top:0;background:#130b31;color:#a99be0;font-weight:500}
.chc-tb th:first-child,.chc-tb td:first-child{text-align:left}.chc-tb td{color:#e9ddff}
.chc-s b{display:block;font-size:17px;color:#fff;line-height:1.05}.chc-s span{display:block;margin-top:2px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.chc-n{margin-top:8px;font-size:13px;line-height:1.3;color:var(--dim)}
.chc-lg{display:flex;gap:12px;font-size:12px;color:var(--dim);white-space:nowrap}.chc-lg span{display:inline-flex;align-items:center;gap:5px}
.chc-lg i{display:inline-block;font-style:normal}.chc-lg .ll{width:14px;height:2px;background:#e8489f}.chc-lg .lb{width:8px;height:11px;border-radius:2px 2px 0 0;background:#7a62f0}.chc-lg .ls2{width:9px;height:9px;background:#bf8a00;box-shadow:inset 0 2px #e2b43c}.chc-lg .la{width:8px;height:12px;border-radius:2px;background:linear-gradient(#c9a4ff,#6a35e0)}.chc-lg .ls{color:#ffd23f;font-size:13px;line-height:1}.chc-lg .lc{width:14px;height:3px;border-radius:2px;background:linear-gradient(90deg,#ffb23f,#ff5ec4)}
.chc-s .gold b{color:#ffd23f}.chc-tip em{font-style:normal;color:#ffd23f}
.chc .sst{filter:drop-shadow(0 0 4px rgba(255,210,63,.7))}
@media(max-width:420px){.chc-h{flex-direction:column;align-items:flex-start}.chc-lg{gap:10px;font-size:11px}}

[data-q="0"] .chc .glow{filter:none}[data-q="0"] .chc .dr,[data-q="0"] .chc .fi,[data-q="0"] .chc .pul{animation:none}[data-q="0"] .chc .dr{stroke-dashoffset:0}
@media (prefers-reduced-motion:reduce){.chc .dr,.chc .fi,.chc .pul{animation:none}.chc .dr{stroke-dashoffset:0}}

.cl-hero small{display:block;margin-top:14px;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* ============ layout modes ============
   phone (html.phone): always portrait; in landscape a cover asks to rotate back (and the orientation lock is requested).
   PC / wide screens (html.desk, set by the script in <head>, width >= 900px): every window gets a horizontal layout. */
.pg-l,.pg-r{display:contents}
.rot{display:none}
html.rotate .rot{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;

.rot i{display:block;width:46px;height:78px;border:4px solid var(--acc);border-radius:9px;position:relative;box-shadow:0 0 18px rgba(165,107,255,.5);animation:rotph 2.4s ease-in-out infinite}
.rot i::after{content:"";position:absolute;left:50%;bottom:5px;width:14px;height:4px;margin-left:-7px;background:var(--acc);border-radius:2px}
@keyframes rotph{0%,25%{transform:rotate(90deg)}60%,100%{transform:rotate(0)}}
html.rotate,html.rotate body{overflow:hidden}

html.desk{--col:min(100vw - 64px,1400px);--pgw:min(100vw - 64px,1240px)}
/* shell: tabs + search share one row, every view spans the full width */
html.desk .app{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,380px);column-gap:28px;align-items:center;align-content:start;padding-top:18px}
html.desk .app>.top,html.desk .app>.list,html.desk .app>.home,html.desk .app>.club,html.desk .app>.prof{grid-column:1/-1}
html.desk .tabs{grid-column:1;width:100%;max-width:700px;margin:0 0 18px}
html.desk .tab{height:58px}
html.desk .sbar{grid-column:2;height:58px;margin:0 0 18px}
html.desk .dock{width:min(var(--col),600px);height:66px}

/* Store: cards in a grid */
html.desk .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:22px}
/* большой монитор: две широкие колонки вместо трёх мелких (карточка масштабируется по ширине) */

html.desk .list>.empty,html.desk .list>.nofound{grid-column:1/-1}

/* Home: hero on the left, news + links on the right */
html.desk body.onhome .top{width:min(440px,100%);justify-self:center;margin-bottom:6px}
html.desk body.onhome .home{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:center;
  min-height:calc(var(--vh) - var(--top) - 18px - var(--hh) - 6px - 74px - 20px - var(--bot))}
html.desk .ts{zoom:1;flex:none}
html.desk .ts .hero-t{font-size:clamp(28px,5vh,46px)}
html.desk .shelf{height:clamp(90px,17vh,150px)}
html.desk .gow{max-width:460px}
html.desk .gow .bigplay{height:64px;font-size:clamp(22px,3.2vh,30px)}
html.desk .pn{gap:18px}
html.desk .ns .nw-in{padding:14px 18px 16px 24px}
html.desk .ns .nw h4{font-size:23px}
html.desk .ns .nw p{font-size:17px;-webkit-line-clamp:3}
html.desk .ns .nw-tag{font-size:14px}html.desk .ns .nw-h time{font-size:15px}
html.desk .lnks .lbtn{height:58px;font-size:24px}
/* Home on big screens: header, hero and news scale with the window height (phone caps no longer apply), no dead space under the logo.
   Header keeps the phone proportions: width = 2.84 x height, logo = .263 x height, pigeon = .98 x height. */
html.desk{--hh:clamp(150px,22vh,250px)}
html.desk body.onhome .top{width:min(calc(var(--hh)*2.84),100%);margin-bottom:0}
html.desk body.onhome .logo{font-size:calc(var(--hh)*.263)}
html.desk body.onhome .mascot{width:calc(var(--hh)*.98)}
html.desk body.onhome .home{gap:clamp(40px,4.5vw,96px);grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
html.desk .ts{gap:clamp(14px,2.4vh,30px)}
html.desk .shelf{height:clamp(110px,20vh,230px)}
html.desk .ts .hero-t{font-size:clamp(30px,4.3vh,54px);text-wrap:balance}
html.desk .ts .tags{gap:10px}
html.desk .ts .tag{height:clamp(30px,3.6vh,40px);padding:0 16px;font-size:clamp(16px,2vh,21px)}
html.desk .gow{max-width:clamp(440px,30vw,580px)}
html.desk .gow .bigplay{height:clamp(62px,7vh,84px);font-size:clamp(24px,3.4vh,36px)}
html.desk .pn{gap:clamp(18px,3vh,30px)}
html.desk .home .sec h3{font-size:clamp(16px,2vh,21px);margin-bottom:10px}
html.desk .ns .nw-in{padding:clamp(14px,2vh,24px) clamp(18px,1.6vw,30px) clamp(16px,2.2vh,26px) clamp(24px,2vw,34px)}
html.desk .ns .nw h4{font-size:clamp(23px,3.2vh,34px)}
html.desk .ns .nw p{font-size:clamp(17px,2.2vh,23px);margin-top:6px}
html.desk .ns .nw-tag{font-size:clamp(14px,1.7vh,18px)}
html.desk .ns .nw-h time{font-size:clamp(15px,1.8vh,19px)}
html.desk .lnks{gap:14px}
html.desk .lnks .lbtn{height:clamp(58px,7.4vh,84px);font-size:clamp(24px,3.1vh,32px)}
html.desk .lnks .lbtn svg{width:clamp(24px,3vh,32px);height:clamp(24px,3vh,32px)}
/* Десктоп, главная, одна композиция по центру экрана: слева крупная шапка (логотип + голубь) прямо над витриной,
   справа новости и ссылки на всю высоту. .home растворяется (display:contents), её колонки встают в сетку .app,
   поэтому нет отдельной узкой полосы с маленьким логотипом и пустоты по бокам. */
html.desk{--hh:clamp(160px,25vh,300px)}
html.desk body.onhome .app{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:auto auto;column-gap:clamp(40px,5vw,120px);row-gap:clamp(4px,1.5vh,20px);
  align-content:center;min-height:calc(var(--vh) - var(--top));padding-top:clamp(12px,3vh,36px)}
html.desk body.onhome .home{display:contents}
html.desk body.onhome .app>.top{grid-column:1;grid-row:1;justify-self:center;align-self:end}
html.desk body.onhome .ts{grid-column:1;grid-row:2;align-self:start}
html.desk body.onhome .pn{grid-column:2;grid-row:1/span 2;align-self:center;width:100%;max-width:640px;justify-self:start}

/* Community: slogan + help button + chart | sponsors */

html.desk .club>section:nth-of-type(2){grid-column:1/-1;grid-row:3;margin-top:8px}
html.desk .cl-slogan{font-size:clamp(36px,4.6vw,64px)}

/* Profile: card + level on the left, medals on the right */
html.desk body.onprof .prof{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px 56px;align-items:start;padding-top:8px}
html.desk .prof>.pf-card{grid-column:1;grid-row:1}
html.desk .prof>.pf-lv{grid-column:1;grid-row:2}
html.desk .prof>.pf-set{grid-column:1;grid-row:3}
html.desk .prof>section{grid-column:2;grid-row:1/span 3;margin-top:0!important}
html.desk .mdl{grid-template-columns:repeat(6,minmax(0,1fr));gap:16px 8px} /* 12 медалей = 2 ровных ряда */

/* App page: game + TV on the left (sticky), description + reviews on the right */
html.desk #pgBody>.pg{width:var(--pgw);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);column-gap:48px;align-items:start}
html.desk #pgBody>.pg>.pg-top{grid-column:1/-1}
html.desk #pgBody>.pg>.pg-l{display:block;grid-column:1}
html.desk #pgBody>.pg>.pg-r{display:block;grid-column:2;grid-row:2;min-width:0}
html.desk .pg-r>.sec:first-child{margin-top:6px}
@media(min-height:820px){html.desk #pgBody>.pg>.pg-l{position:sticky;top:12px}}
html.desk .pbar{left:calc(50% - var(--pgw)/2);transform:none;width:calc((var(--pgw) - 48px)*5/11)}
html.desk .pfade{left:calc(50% - var(--pgw)/2 - 24px);right:auto;width:calc((var(--pgw) - 48px)*5/11 + 48px)}
html.desk .page{scrollbar-width:thin;scrollbar-color:#3a2a70 transparent}

/* windows (dialogs): centered, wider, content in two columns */
html.desk .sheet{align-items:center}
html.desk .panel{width:min(100vw - 64px,720px);border-radius:14px;border-top:0;box-shadow:0 0 0 3px var(--acc)}
html.desk .panel:has(.pfix){width:min(100vw - 64px,1080px)}
html.desk .panel:has(.cmx){width:min(100vw - 64px,1040px)}

/* Профиль другого игрока в окне на компьютере: две колонки (карточка и уровень | пост и медали), медали ровными рядами 6×2,
   всё помещается без прокрутки на ноутбуке (раньше одна длинная колонка и 5 редких столбцов: 5+5+2) */
/* класс, а не :has(.pfv): профиль подставляется в уже открытое окно, и Chrome не пересчитывает :has после innerHTML */
html.desk .panel.pw{width:min(100vw - 64px,960px)}
html.desk .pfv{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-rows:auto 1fr;gap:12px 28px;align-items:start;align-content:start}
html.desk .pfv>.pf-card{grid-column:1;grid-row:1}
html.desk .pfv>.pf-lv{grid-column:1;grid-row:2;margin-top:0}
html.desk .pfv>.pf-sec{grid-column:2;grid-row:1/span 2;margin-top:0!important}
html.desk .pfv .mdl{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 4px}
html.desk .pfv .md b{font-size:10.5px;letter-spacing:-.03em}
html.desk .pfv .md-info{min-height:64px}
/* card editor */
html.desk .pfix .pv{max-width:640px;margin:0 auto}
html.desk .pbody:has(#name){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;align-content:start}
html.desk .pbody:has(#name)>.fld{margin:0 0 14px!important}
html.desk .pbody:has(#name)>.two{grid-column:1/-1}
html.desk .pbody:has(#name)>.hint2{grid-column:1/-1}
html.desk .pbody>.fld:has(#name){order:1}
html.desk .pbody>.fld:has(#tagbox){order:2}
html.desk .pbody:has(#name)>.two{order:3}
html.desk .pbody:has(#name)>.hint2{order:4}
html.desk .pbody>.fld:has(#sw){order:5}
html.desk .pbody>.fld:has(#drop){order:6}
html.desk .pbody>.fld:has(#desc){order:7}
html.desk .pbody>.fld:has(#chg){order:8}
html.desk .pbody>.fld:has(#author){order:9}
html.desk .pbody>.fld:has(#ver){order:10}
html.desk .pbody>.fld:has(#dl){order:11}
html.desk .pbody>.fld:has(#dlink){order:12}
/* settings */
html.desk .pbody:has(.toggle){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:36px;align-content:start}
html.desk .pbody:has(.toggle)>.toggle{grid-column:1}
html.desk .pbody:has(.toggle)>.fld{grid-column:2;margin-top:0!important}
html.desk .pbody:has(.toggle)>.fld:first-of-type{grid-row:1/span 2}
html.desk .pbody:has(.toggle)>.fld:last-of-type{grid-row:3/span 2}

.pf-subh b{display:block;font-size:20px;text-transform:uppercase;color:#fff;text-shadow:2px 2px 0 #6a35e0}.pf-subh span{display:block;font-size:15px;line-height:1.3;color:var(--dim);margin-top:2px}
.pf-sub .btn{flex:none;width:100%;height:46px;font-size:18px}.pf-subb svg{display:inline-block;width:20px;height:20px;fill:currentColor;vertical-align:-3px}.pf-subr{display:flex;gap:10px}.pf-subr .btn{flex:1;min-width:0;height:42px}

/* ---- profile tabs (post / medals), post card, review avatars as links, action log ---- */
.stars span{width:38px;height:38px;display:grid;place-items:center}
.pg-m:has(#pgPlays),.pg-m:has(#pgDl){font-size:16px;margin-top:4px}.pg-m:has(#pgRate) #pgRate{color:#e5d9ff}
.pf-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 0 12px;padding:4px;background:#0d0724;border:2px solid #2a1f5e}

.pf-pane[hidden]{display:none}

.lg{border:3px solid var(--line);background:#120a2a}

html.desk .club>section:nth-of-type(3){grid-column:1/-1;grid-row:4}
/* спасибо автору */

/* сортировка и фильтры магазина */
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-6px 0 14px}
.fsort,.fchip{height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:15px;color:#cdbfff;background:#150d33;border:2px solid #3a2a70;border-radius:18px;white-space:nowrap}
.fsort span{color:var(--dim)}.fsort b{color:#fff;font-weight:600}
.fchip[aria-pressed="true"]{color:#140a28;background:#ffd23f;border-color:#ffd23f}.fchip[data-f="r4"][aria-pressed="true"]{background:#c9a4ff;border-color:#c9a4ff}
.fchip .fst{font-style:normal;color:#c9a4ff}.fchip[aria-pressed="true"] .fst{color:#140a28}
body.onhome .fbar,body.onclub .fbar,body.onprof .fbar{display:none}
html.desk .fbar{grid-column:1/-1;margin:-8px 0 18px}
@media(max-width:380px){.fsort span{display:none}}
/* отзывы | моды */
.pgtabs{display:flex;gap:0;margin-bottom:14px;border:3px solid var(--line);background:#0c0720}
.pgtabs button{flex:1;height:46px;font-size:18px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.pgtabs button[aria-selected="true"]{color:#140a28;background:linear-gradient(90deg,var(--c3),var(--c1))}.pgtabs small{font-size:.8em;opacity:.8}
/* моды: свои классы mod-*, потому что .md уже занят медалями профиля (их стили ломали карточку мода) */
.mod{display:block;text-align:left;padding:12px 14px;margin-bottom:10px;background:#120a2a;border:2px solid var(--line);border-left:6px solid var(--c1)}
.mod-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.mod-h b{font-size:19px;font-weight:700;color:#fff;overflow-wrap:anywhere}.mod-v{flex:none;font-size:14px;color:var(--c3)}
.mod p{margin:6px 0 0;font-size:16px;line-height:1.35;color:#ddd2ff;white-space:pre-line}
.mod-f{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}.mod-f time{font-size:13px;color:var(--dim)}.mod-f .cm-av{width:30px;height:30px}
.mod-b{display:flex;gap:8px;margin-left:auto}.mod-b .btn{flex:none;height:38px;padding:0 14px;font-size:15px}
.mod-own{margin-bottom:10px;padding:8px 12px;font-size:15px;background:#1c1146;border-left:6px solid #ffd23f;color:#e9ddff}.mod-own.st-rejected{border-left-color:#ff7a8a}
.mod-new{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;flex:none}.mod-new svg{flex:none;width:20px;height:20px;fill:currentColor}
/* своя фоновая картинка: под эффектом, эффект поверх слабый */
.bgi{position:absolute;inset:0;background:var(--bgi,none) center/cover no-repeat;display:none}
.card.hasbg .bgi{display:block}.card.hasbg .fx{opacity:.32;mix-blend-mode:screen}
.page.hasbg{background:linear-gradient(180deg,rgba(9,5,26,.35) 0,rgba(9,5,26,.82) 46vh,#09051a 78vh),var(--pgbg) center top/cover no-repeat,#09051a}
.bgpick{display:flex;gap:10px}.bgpick .btn{flex:1}
/* каталог: заметки редактора и метки доступа (их видит только главный админ) */
.ednote{margin:0 0 14px;padding:10px 12px;font-size:14px;line-height:1.35;color:#e9ddff;background:#1c1146;border-left:6px solid #ffb23f}
.ednote.adm{border-left-color:#5dff8a}.ednote span{display:block;margin-top:4px;color:var(--dim)}.ednote .st-approved{color:#5dff8a}.ednote .st-rejected{color:#ff7a8a}.ednote .st-new{color:#ffd23f}
.fld.off .tagbox{opacity:.6}.in:disabled{opacity:.6;cursor:not-allowed}
.cardbox[data-acc]{position:relative}.cardbox[data-acc]::after{position:absolute;right:calc(var(--k,1)*120px);top:calc(var(--k,1)*10px);z-index:7;padding:2px 8px;font:700 12px/1.4 "Tektur",sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#140a28;pointer-events:none}
.cardbox[data-acc="staff"]::after{content:"Только админы";background:#ffd23f}.cardbox[data-acc="off"]::after{content:"Скрыта";background:#ff7a8a}
.cardbox[data-acc="off"] .card{filter:grayscale(.6) brightness(.8)}
html.desk .chc svg text{font-size:13px}html.desk .chc svg text.pt{font-size:12px}

/* ============ профиль: уровень, звание, медали ============ */
/* XP: игра +5, очки в игре (до +30), отзыв +20, новая игра в избранном +5, своя карточка +25, заход в новый день +10, медали дают бонус */

const MEDALS=[
 {id:"first",n:"Первый запуск",d:"Запустите любую игру",c:"#4dd2ff",ic:"play",xp:10,v:p=>p.plays,need:1},

 {id:"rev5",n:"Голос маркета",d:"Напишите 5 отзывов",c:"#ff8a3d",ic:"chat",xp:40,v:p=>p.reviews,need:5},
 {id:"fav3",n:"Коллекционер",d:"Добавьте 3 игры в избранное",c:"#ff5e7a",ic:"heart",xp:25,v:p=>p.favs.length,need:3},
 {id:"make1",n:"Создатель",d:"Добавьте свою карточку",c:"#7fb2ff",ic:"plus",xp:30,v:p=>p.made,need:1},
 {id:"me",n:"Личность",d:"Смените аватар или цвет рамки",c:"#ff5ec4",ic:"user",xp:10,v:p=>p.custom,need:1},
 {id:"days3",n:"Постоянный гость",d:"Зайдите в 3 разных дня",c:"#4dd2ff",ic:"star",xp:20,v:p=>p.days,need:3},
 {id:"days7",n:"Свой в маркете",d:"Зайдите в 7 разных дней",c:"#ffe27a",ic:"star",xp:50,v:p=>p.days,need:7}];
const dayKey=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const PROF=Object.assign({name:"Игрок",color:AVC[0],photo:"",reg:Date.now(),xp:0,plays:0,ids:[],best:0,reviews:0,favs:[],made:0,custom:0,days:0,last:"",medals:{},post:null},store.get("am.profile",{}));
if(!store.get("am.profile",null)){PROF.plays=DATA.reduce((a,d)=>a+(d.played||0),0);PROF.ids=DATA.filter(d=>d.played).map(d=>d.id);PROF.xp=PROF.plays*5;PROF.favs=DATA.filter(d=>d.fav).map(d=>d.id)}
const saveProf=()=>{store.set("am.profile",PROF);queuePush()};
let profQ=[],profT=0;
function profSay(m){profQ.push(m);if(profT)return;const go=()=>{const x=profQ.shift();if(!x){profT=0;return}toast(x);profT=setTimeout(go,2300)};profT=setTimeout(go,1500)}
function profCheck(){let again=true;
  while(again){again=false;
    for(const m of MEDALS){if(!PROF.medals[m.id]&&m.v(PROF)>=m.need){PROF.medals[m.id]=Date.now();const l0=lvOf(PROF.xp);PROF.xp+=m.xp;again=true;profSay("Медаль: <b>"+m.n+"</b> · +"+m.xp+" XP");act("medal",null,{m:m.id});if(lvOf(PROF.xp)>l0){profSay("Уровень "+lvOf(PROF.xp)+" · "+RANKS[lvOf(PROF.xp)-1]);act("level",null,{lv:lvOf(PROF.xp)})}}}}
  saveProf()}
function addXp(n){const l0=lvOf(PROF.xp);PROF.xp+=n;if(lvOf(PROF.xp)>l0){profSay("Уровень "+lvOf(PROF.xp)+" · звание «"+RANKS[lvOf(PROF.xp)-1]+"»");act("level",null,{lv:lvOf(PROF.xp)})}profCheck()}
function profPlay(id){PROF.plays++;if(!PROF.ids.includes(id))PROF.ids.push(id);addXp(5)}
function profScore(s){if(s>PROF.best)PROF.best=s;addXp(Math.min(30,Math.floor(s/10)))}
function profReview(){PROF.reviews++;addXp(20)}
function profFav(id,on){act(on?"fav":"unfav",id);if(on&&!PROF.favs.includes(id)){PROF.favs.push(id);addXp(5)}}

function profVisit(){const k=dayKey();if(PROF.last!==k){PROF.last=k;PROF.days++;PROF.xp+=PROF.days>1?10:0;profCheck()}}
const fmtDate=t=>{const d=new Date(t),p=n=>String(n).padStart(2,"0");return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()};
/* безопасные значения для style="": фото только JPEG data-URL, цвет только #rrggbb (в том числе то, что пришло с сервера) */

const animBar=(root,pct)=>requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=root.querySelector(".pf-bar i");if(f)f.style.setProperty("--w",pct+"%")}));

/* ============ график «Пульс маркета» (вкладка кубка) ============ */
/* Очки активности копятся из действий игроков (веса WEIGHTS в api/_lib/hub.js); денег на графике нет. */
const CAP={price:1,res:"COOP"};
const PER=[["24ч"],["7д"],["30д"],["Всё"]];
const nf=n=>Math.round(n).toLocaleString("ru-RU");
const cf=n=>n>=1e6?(n/1e6).toFixed(1).replace(".",",")+"M":n>=1e3?(n/1e3).toFixed(n>=1e5?0:1).replace(".",",")+"К":Math.round(n)+"";
const HM=210,HA=200,CW=340;
/* данные графика: CAP.series.act[период] = [{a: действий, res: ресурс, cap: капитализация, t: подпись}] из журнала действий (loadActivity) */
const getAct=pi=>((CAP.series&&CAP.series.act)||[])[pi]||[];
const GOALS=[100,500,1e3,2500,5e3,1e4,25e3,5e4,1e5,25e4,5e5,1e6,5e6,1e7];
/* формат малых чисел: <10 с десятыми, <1000 целые, дальше К/M */
const fv=v=>{const a=Math.abs(v);return a>=1e3?cf(v):a>=10||Number.isInteger(v)?String(Math.round(v)):v.toFixed(1).replace(".",",")};
const fx=v=>Math.abs(v)>=10||Number.isInteger(v)?nf(v):v.toFixed(1).replace(".",",");
/* «красивая» шкала: шаги 1/2/2.5/5·10^k, для растущих с нуля данных всегда от нуля */
function nscale(lo,hi,k){const r=(hi-lo)||1,raw=r/k,e=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/e,st=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;return{lo:Math.floor(lo/st+1e-9)*st,hi:Math.ceil(hi/st-1e-9)*st,st}}
function scaleOf(vals){const mn=Math.min(...vals),mx=Math.max(...vals);
  if(mx<=0)return nscale(0,8,4);
  if(mn>=0&&mn<mx*.6)return nscale(0,mx*1.12,4);
  const pad=(mx-mn||mx)*.14;return nscale(Math.max(0,mn-pad),mx+pad,4)}
const sticks=sc=>{const o=[];for(let v=sc.lo;v<=sc.hi+sc.st/2;v+=sc.st)o.push(v);return o};
/* плавная монотонная кривая (без «перелётов» между точками) */
function curve(xs,ys){const n=xs.length,f=v=>v.toFixed(1);if(n<3)return xs.map((x,i)=>(i?"L":"M")+f(x)+" "+f(ys[i])).join("");
  const d=[],m=[];for(let i=0;i<n-1;i++)d[i]=(ys[i+1]-ys[i])/(xs[i+1]-xs[i]);m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=m[i+1]=0;continue}const a=m[i]/d[i],b=m[i+1]/d[i],q=a*a+b*b;if(q>9){const t=3/Math.sqrt(q);m[i]=t*a*d[i];m[i+1]=t*b*d[i]}}
  let o="M"+f(xs[0])+" "+f(ys[0]);for(let i=0;i<n-1;i++){const h=xs[i+1]-xs[i];o+="C"+f(xs[i]+h/3)+" "+f(ys[i]+m[i]*h/3)+" "+f(xs[i+1]-h/3)+" "+f(ys[i+1]-m[i+1]*h/3)+" "+f(xs[i+1])+" "+f(ys[i+1])}return o}
const chPer=()=>`<div class="chc-p" data-p>${PER.map((p,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===1}">${p[0]}</button>`).join("")}</div>`;
const chBody=(h,label,goal)=>`<div class="chc-v" data-v></div><div class="chc-d" data-d></div>${goal?'<div class="chc-g" data-g></div>':""}${chPer()}<div class="chw"><svg viewBox="0 0 ${CW} ${h}" role="img" tabindex="0" aria-label="${label}"></svg><div class="chc-tip" data-tip role="status" aria-live="polite"></div></div>`;
/* «Пульс маркета»: три полосы на общей оси времени. Сверху линия «очки активности» (накопленный итог действий),
   ниже столбцы «действия» за отрезок, внизу строка «звёзды» (поддержка авторов). Цвета проверены валидатором палитры
   (тёмный фон #150d34: светлота, насыщенность, различимость при дальтонизме, контраст). */
function chartsHTML(){return `<section class="sec enter" style="--i:.3s"><h3>Пульс маркета</h3>
  <div class="chc" id="chA"><div class="chc-h"><div class="chc-t">Очки активности</div><div class="chc-lg" aria-hidden="true"><span><i class="ll"></i>всего очков</span><span><i class="lb"></i>ключевые действия</span><span><i class="ls2"></i>звёзды</span></div></div>${chBody(HA,"График: очки активности, действия игроков и звёзды авторам. Стрелки влево и вправо листают отрезки времени")}
    <div class="chc-s" data-s></div>
    <p class="chc-n">Считаются только ключевые действия: регистрация, отзыв, первый запуск и первая загрузка игры.</p>
    <details class="chc-tb"><summary>Таблица</summary><div data-tb></div></details></div></section>`}
function initCharts(root){
  let W=CW;const anim=()=>!RM&&Q>0;
  const wire=(box,draw)=>{let pi=1;const svg=box.querySelector("svg");
    const run=()=>{W=Math.max(280,Math.round(svg.parentElement.clientWidth)||CW);svg.setAttribute("viewBox",`0 0 ${W} ${W>700?260:HA+20}`);
      box.querySelectorAll("[data-p] button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.i===pi));box._off&&box._off();draw(pi,svg,box)};
    if(window.ResizeObserver){let lw=0;const ro=new ResizeObserver(()=>{if(!box.isConnected){ro.disconnect();return}const w=Math.round(svg.parentElement.clientWidth);if(lw&&Math.abs(w-lw)>8)run();lw=w});ro.observe(svg.parentElement)}
    box.querySelector("[data-p]").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;sfx.tap();pi=+b.dataset.i;run()});
    const out=e=>{if(!box.isConnected){document.removeEventListener("pointerdown",out);return}if(!e.target.closest||e.target.closest("svg")!==svg)box._off&&box._off()};document.addEventListener("pointerdown",out);run()};
  /* ведение пальцем: плашка с цифрами остаётся после отрыва пальца, скрывается касанием вне графика; мышь: наведение показывает, клик закрепляет */
  /* Плашка встаёт сбоку от перекрестья (у правого края — слева от него), чтобы не закрывать точку, на которую смотрят.
     Клавиатура: фокус на графике, стрелки листают отрезки, Home/End — края, Esc — убрать. */
  const attach=(box,svg,n,pl,pr,show,hide)=>{const tip=box.querySelector("[data-tip]");let pin=false,cur=-1;
    const idx=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;return clamp(Math.round((px-pl)/(W-pl-pr)*(n-1)),0,n-1)};
    const go=i=>{cur=i;box.classList.add("used");const o=show(i);tip.innerHTML=o.html;tip.classList.add("on");
      const sw=svg.clientWidth,w=tip.offsetWidth,px=o.x/W*sw,gap=12,right=px+gap+w<=sw;
      tip.style.left=(right?px+gap:clamp(px-gap-w,0,Math.max(0,sw-w)))+"px"};
    const off=()=>{pin=false;cur=-1;tip.classList.remove("on");hide()};box._off=off;
    svg.onpointerdown=e=>{pin=true;go(idx(e))};svg.onpointermove=e=>{if(e.pointerType==="mouse"||pin)go(idx(e))};
    svg.onpointerleave=e=>{if(e.pointerType==="mouse"&&!pin)off()};
    svg.onfocus=()=>{if(cur<0)go(n-1)};svg.onblur=()=>{if(!pin)off()};
    svg.onkeydown=e=>{const k=e.key,m={ArrowLeft:-1,ArrowRight:1}[k];
      if(m){e.preventDefault();go(clamp((cur<0?n-1:cur)+m,0,n-1))}else if(k==="Home"){e.preventDefault();go(0)}else if(k==="End"){e.preventDefault();go(n-1)}else if(k==="Escape")off()}};
  const ticks=n=>[...new Set([0,.25,.5,.75,1].map(k=>Math.round(k*(n-1))))];
  const empty=(box,svg,h)=>{svg.innerHTML=`<text class="hs" x="${W/2}" y="${h/2}" text-anchor="middle">Нет данных за период</text>`;box.querySelector("[data-v]").textContent="—";box.querySelector("[data-d]").textContent="";box.querySelector("[data-s]").innerHTML="";const t=box.querySelector("[data-tb]");t&&(t.innerHTML="");box._off=null};
  /* изменение за период: от нуля процент не считаем (деление на 0), показываем прирост в очках */
  const delta=(el,a,b,tail,unit)=>{
    if(a>0){const ch=(b/a-1)*100,up=ch>=0,big=Math.abs(ch)>=1000;el.className="chc-d "+(up?"up":"dn");el.textContent=big?"▲ ×"+(b/a).toFixed(0)+" "+tail:(up?"▲ +":"▼ ")+Math.abs(ch).toFixed(1).replace(".",",")+"% "+tail}
    else if(b>0){el.className="chc-d up";el.textContent="▲ +"+fx(b-a)+" "+unit+" "+tail}
    else{el.className="chc-d nu";el.textContent="● Старт положен · ждём первых игроков"}};
  /* Пульс маркета: три полосы на общей оси времени (у каждой своя шкала, поэтому они не смешиваются в один график).
     1) линия «очки активности»: накопленный итог, 2px, лёгкая заливка ~10%, точка в конце с кольцом цвета фона;
     2) столбцы «действия» за отрезок: до 24px, скруглён только верх, 2px зазор между соседями, справа максимум шкалы;
     3) строка «звёзды»: пиксельные монетки, сторона растёт с суммой (корень, чтобы крупная сумма не заслоняла остальное).
     Сетка сплошная и тихая; без svg-фильтров свечения и бесконечных анимаций: линия прорисовывается один раз. */
  const colPath=(x,y,w,h)=>{const r=Math.min(3,w/2,h),f=v=>v.toFixed(1);
    return `M${f(x)} ${f(y+h)}V${f(y+r)}Q${f(x)} ${f(y)} ${f(x+r)} ${f(y)}H${f(x+w-r)}Q${f(x+w)} ${f(y)} ${f(x+w)} ${f(y+r)}V${f(y+h)}Z`};
  const coin=(x,y,s)=>{const h=s/2,p=Math.max(1.5,s/5),f=v=>v.toFixed(1);
    return `<rect class="cn" x="${f(x-h)}" y="${f(y-h)}" width="${f(s)}" height="${f(s)}"/><rect class="cnh" x="${f(x-h)}" y="${f(y-h)}" width="${f(s)}" height="${f(p)}"/>`};
  /* таблица: те же цифры без наведения (строится только когда её открыли) */
  const table=(box,dt)=>{const el=box.querySelector("[data-tb]"),dd=box.querySelector("details");if(!el||!dd)return;
    const fill=()=>{el.innerHTML=`<table><thead><tr><th>Время</th><th>Ключевые действия</th><th>Звёзды</th><th>Очки, всего</th></tr></thead><tbody>${dt.slice().reverse().map(o=>`<tr><td>${o.tf||o.t}</td><td>${nf(o.a)}</td><td>${nf(o.s||0)}</td><td>${nf(o.res)}</td></tr>`).join("")}</tbody></table>`};
    dd.ontoggle=()=>{if(dd.open)fill()};if(dd.open)fill();else el.innerHTML=""};
  const PLA=["действие","действия","действий"],PLS=["звезда","звезды","звёзд"],PLO=["очко","очка","очков"];
  wire(root.querySelector("#chA"),(pi,svg,box)=>{

    const narrow=W<420,pl=2,pr=narrow?40:50,lT=12,lB=Math.round(H*.48),aT=lB+30,sY=H-30,aB=sY-15,xB=H-4,
      acts=dt.map(o=>o.a),stars=dt.map(o=>o.s||0),rv=dt.map(o=>o.res),mxA=Math.max(...acts),mxS=Math.max(...stars),

      X=i=>pl+slot*(i+.5),Y=v=>lT+(lB-lT)*(1-(v-lo)/((hi-lo)||1)),xs=rv.map((_,i)=>X(i)),ys=rv.map(Y),d=curve(xs,ys),

      x0=pl,x1=W-pr,cx=(x0+x1)/2,ax=x1+6;

    const tk=sticks(sc),keep=tk.length<=3?tk:[tk[0],tk[Math.round((tk.length-1)/2)],tk[tk.length-1]];
    let g="";
    keep.forEach(v=>{const y=Y(v).toFixed(1);g+=`<line class="${v===lo?"gb":"gl"}" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}"/><text class="ax" x="${ax}" y="${(+y+4).toFixed(1)}">${fv(v)}</text>`});
    /* полоса действий: подпись, верх шкалы и базовая линия */
    g+=`<text class="lab" x="${x0}" y="${aT-9}">Ключевые действия</text><line class="gl" x1="${x0}" x2="${x1}" y1="${aT}" y2="${aT}"/><text class="ax" x="${ax}" y="${aT+4}">${fv(sa.hi)}</text><line class="gb" x1="${x0}" x2="${x1}" y1="${aB}" y2="${aB}"/>`;
    /* строка звёзд: тонкая дорожка и сумма за период справа */
    g+=`<line class="gl" x1="${x0}" x2="${x1}" y1="${sY}" y2="${sY}"/><text class="ax" x="${ax}" y="${sY+4}">★${fv(totS)}</text>`;
    const bars=acts.map((a,i)=>a>0?`<path class="bar" data-i="${i}" d="${colPath(xs[i]-bw/2,aB-Math.max(2,(aB-aT)*a/sa.hi),bw,Math.max(2,(aB-aT)*a/sa.hi))}"/>`:"").join("");
    const coins=mxS>0?stars.map((v,i)=>v?coin(xs[i],sY,Math.min(Math.max(slot-2,4),6+8*Math.sqrt(v/mxS))):"").join(""):"";
    const tix=[...new Set((narrow?[0,.5,1]:[0,.25,.5,.75,1]).map(k=>Math.round(k*(n-1))))];
    const tx=tix.map(i=>`<text class="ax" x="${xs[i].toFixed(1)}" y="${xB}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}">${dt[i].t}</text>`).join("");

      <path class="ln${an?" dr":""}" pathLength="1" d="${d}"/>
      <circle class="ed" cx="${xs[n-1].toFixed(1)}" cy="${ys[n-1].toFixed(1)}" r="4"/>
      <g class="${an?"fi":""}">${bars}${coins}</g>

  $("#sbF").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;
    if(f.size>SUB_MAX){err("Файл больше 1,5 МБ");e.target.value="";return}
    const r=new FileReader();r.onload=()=>{file={name:f.name,size:f.size,text:String(r.result)};$("#sbFN").textContent=f.name+" · "+Math.round(f.size/1024)+" КБ";err("")};r.readAsText(f)});
  $("#sbMine").addEventListener("click",()=>{sfx.tap();openMine()});
  $("#sbSend").addEventListener("click",async()=>{
    const t=$("#sbT").value.trim(),d=$("#sbD").value.trim();
    if(!t||!d){err("Заполните название и описание");return}
    if(!file||!/<(html|body|script|canvas)/i.test(file.text)){err("Загрузите корректный HTML-файл");return}
    const s={id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),authorId:meId(),author:PROF.name,tg:(tgU()&&tgU().username)||"",
      title:t,genre:$("#sbG").value,desc:d,ver:$("#sbV").value.trim()||"0.1",contact:$("#sbC").value.trim(),file,at:Date.now(),status:"new",comment:"",upd:Date.now()};
    try{await SUBS.add(s)}catch(e){err(e.message==="429"?"Слишком много заявок за сутки, попробуйте завтра":e.message==="401"?"Откройте приложение из Telegram, чтобы отправить заявку":"Не удалось отправить заявку (нет связи или файл слишком большой)");return}
    sfx.tap();act("submit");toast("Заявка отправлена");openMine()})}
async function openMine(){
  let all=[];try{all=(await SUBS.list()).filter(s=>s.authorId===meId())}catch(e){toast("Не удалось загрузить заявки")}
  openSheet(sbHead("Мои заявки")+`<div class="pbody" lang="ru">${all.length?all.map(s=>`<div class="sbi" style="--c:${SST[s.status].c}">${sbBadge(s.status)}<h4>${esc(s.title)}</h4><p>${esc(s.genre)} · v${esc(s.ver)} · ${fmtDate(s.at)}</p>${s.comment?`<p class="cm">Комментарий: ${esc(s.comment)}</p>`:""}</div>`).join(""):`<p class="sbk">Заявок пока нет.</p>`}</div>
  <div class="pfoot"><div class="row"><button class="btn ghost" data-close>Закрыть</button><button class="btn" id="sbNew" type="button">Новая заявка</button></div></div>`);
  $("#sbNew").addEventListener("click",()=>{sfx.tap();openSubmit()})}
async function openAdmin(){
  let all=[],q="",f="all",cur=null;
  const draw=()=>{
    if(cur){const s=all.find(x=>x.id===cur);let st=s.status;
      panel.innerHTML=sbHead("Заявка")+`<div class="pbody" lang="ru">${sbBadge(s.status)}<h3 style="margin:8px 0 2px;font-size:26px">${esc(s.title)}</h3>
      <p class="sbk"><b>Автор:</b> ${esc(s.author)}${s.tg?" (@"+esc(s.tg)+")":""} · id ${esc(s.authorId)}<br><b>Контакт:</b> ${esc(s.contact||"—")}<br><b>Жанр:</b> ${esc(s.genre)} · v${esc(s.ver)} · ${fmtDate(s.at)}<br><b>Файл:</b> ${esc(s.file.name)} · ${Math.round(s.file.size/1024)} КБ</p>
      <p style="font-size:19px;line-height:1.35;margin:10px 0;white-space:pre-wrap">${esc(s.desc)}</p>
      <div class="row" style="margin:6px 0"><button class="btn ghost" id="adOpen" type="button">Открыть HTML</button><button class="btn ghost" id="adDl" type="button">Скачать</button></div>
      <span class="lbl">Статус</span><div class="sbc" id="adSt">${Object.keys(SST).map(k=>`<button type="button" class="chip" data-k="${k}" aria-pressed="${k===st}">${SST[k].t}</button>`).join("")}</div>
      <span class="lbl">Комментарий автору</span><textarea class="sbt" id="adCm" maxlength="400" placeholder="Что поправить или почему принято">${esc(s.comment||"")}</textarea></div>
      <div class="pfoot"><div class="row"><button class="btn ghost" id="adBack" type="button">Назад</button><button class="btn" id="adSave" type="button">Сохранить</button></div></div>`;
      $("#adOpen").onclick=async()=>{try{sbView(await SUBS.text(s))}catch(e){toast("Не удалось загрузить файл")}};
      $("#adDl").onclick=async()=>{try{const t=await SUBS.text(s),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/html"}));a.download=s.file.name;a.click()}catch(e){toast("Не удалось загрузить файл")}};
      $("#adSt").onclick=e=>{const b=e.target.closest("button");if(!b)return;st=b.dataset.k;panel.querySelectorAll("#adSt .chip").forEach(x=>x.setAttribute("aria-pressed",x===b));sfx.tap()};
      $("#adBack").onclick=()=>{cur=null;draw()};
      $("#adSave").onclick=async()=>{const p={status:st,comment:$("#adCm").value.trim()};try{await SUBS.upd(s.id,p)}catch(e){toast("Не удалось сохранить");return}Object.assign(s,p);toast("Сохранено");sfx.tap();cur=null;draw()};
    }else{
      const ql=q.toLowerCase(),list=all.filter(s=>(f==="all"||s.status===f)&&(!ql||[s.title,s.author,s.tg,s.contact,s.genre,s.authorId].join(" ").toLowerCase().includes(ql)));
      const cnt=k=>k==="all"?all.length:all.filter(s=>s.status===k).length;
      panel.innerHTML=sbHead("Админ-панель")+`<div class="pbody" lang="ru"><input class="in" id="adQ" type="search" placeholder="Поиск: игра, автор, контакт" value="${esc(q)}" autocomplete="off">
      <div class="sbc" id="adF">${["all",...Object.keys(SST)].map(k=>`<button type="button" class="chip" data-k="${k}" aria-pressed="${k===f}">${k==="all"?"Все":SST[k].t} · ${cnt(k)}</button>`).join("")}</div>
      <div id="adL">${list.length?list.map(s=>`<button type="button" class="sbi" data-id="${s.id}" style="--c:${SST[s.status].c}">${sbBadge(s.status)}<h4>${esc(s.title)}</h4><p>${esc(s.author)} · ${esc(s.genre)} · ${fmtDate(s.at)}</p></button>`).join(""):`<p class="sbk" style="margin-top:12px">Ничего не найдено.</p>`}</div></div>
      <div class="pfoot"><div class="row"><button class="btn" data-close>Закрыть</button></div></div>`;
      const inp=$("#adQ");inp.oninput=e=>{q=e.target.value;const p=inp.selectionStart;draw();const n=$("#adQ");n.focus();n.setSelectionRange(p,p)};
      $("#adF").onclick=e=>{const b=e.target.closest("button");if(!b)return;f=b.dataset.k;sfx.tap();draw()};
      $("#adL").onclick=e=>{const b=e.target.closest(".sbi");if(!b)return;cur=b.dataset.id;sfx.tap();draw()}}
    fitSheet()};
  openSheet(sbHead("Админ-панель")+`<div class="pbody"><p class="sbk">Загрузка…</p></div>`);
  try{all=await SUBS.list()}catch(e){}
  draw()}

(async()=>{
  document.body.classList.toggle("scan",SET.scan);bgResize();
  /* сеть и картинки параллельно: /config (доступ, роль, новости) уходит, пока декодируются спрайты и шрифты */
  const cfgP=accessInit();
  await Promise.all([loadSprites(),document.fonts?document.fonts.ready:0,
    Promise.all([document.fonts.load('500 20px "Tektur"','Аб Ab'),document.fonts.load('700 36px "Tektur"','Аб Ab'),document.fonts.load('700 36px "Pixelify Sans"')]).catch(()=>{})]);
  if(!(await cfgP)){const b=$("#boot");b&&b.remove();return}
  {const n=tgName();if(n)PROF.name=n} /* ник из Telegram сразу, до первого рендера */
  profVisit();sync();if(!SUB_API)tgIdentity();
  if(SUB_API){
    if(!CFG_ROLE)await Promise.race([adminProbe(),wait(1500)]); /* старый сервер без роли в /config */
    /* есть кэш прошлого запуска: показываем его почти сразу, свежий каталог и счётчики приходят следом */
    const cached=restoreCatalog(),cat=loadCatalog().then(loadStats);
    await Promise.race([cat,wait(cached?250:3500)])}
  await render(true);BOOTED=true;act("visit");if(SUB_API){flushActs();pullProfile()}
  $("#boot").classList.add("done");setTimeout(()=>$("#boot").remove(),800);
  requestAnimationFrame(frame);
})();
})();
