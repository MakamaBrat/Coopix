<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0618">
<meta name="robots" content="noindex,nofollow">
<title>Coopix · Админ-панель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:"Tektur";font-weight:100 599;font-display:swap;src:url(assets/fonts/tektur-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Tektur";font-weight:100 599;font-display:swap;src:url(assets/fonts/tektur-cyrillic-500-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Tektur";font-weight:600 900;font-display:swap;src:url(assets/fonts/tektur-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Tektur";font-weight:600 900;font-display:swap;src:url(assets/fonts/tektur-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

:root{
  --bg0:#07040f;--bg1:#0e0820;--card:#120a2a;--card2:#1b1141;--ink:#f4ecff;--dim:#9b86d6;--line:#3a2a70;--line2:#2a1d55;
  --acc:#a56bff;--acc2:#5b2fd0;--ok:#5dff8a;--warn:#ffb23f;--bad:#ff5e7a;--info:#4dd2ff;
  --font:"Tektur",ui-monospace,"Courier New",monospace;
  --top:max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px));
  --bot:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg0);color:var(--ink);color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font:500 16px/1.4 var(--font);background:radial-gradient(1200px 500px at 50% -200px,#2a1670 0,transparent 70%),var(--bg0);padding-bottom:calc(30px + var(--bot))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
h1,h2,h3{margin:0;font-weight:700}

/* шапка и вкладки */
.top{position:sticky;top:0;z-index:20;background:rgba(10,6,24,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--line);padding:calc(10px + var(--top)) 16px 0}
.top-in{max-width:1120px;margin:0 auto}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-size:20px;letter-spacing:.02em}.bar h1 em{font-style:normal;color:var(--acc)}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--dim)}
.back{color:var(--dim);text-decoration:none;font-size:15px;padding:6px 0}.back:hover{color:#fff}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 16px;background:none;border:0;border-bottom:4px solid transparent;color:var(--dim);cursor:pointer;font-weight:700;font-size:16px;white-space:nowrap}
.tab:hover{color:#fff}.tab[aria-selected=true]{color:#fff;border-bottom-color:var(--acc)}
.tab .n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;font-size:13px;color:#140a28;background:var(--warn);text-align:center}
main{max-width:1120px;margin:0 auto;padding:18px 16px}

/* общие элементы */
.badge{display:inline-block;padding:2px 9px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#140a28;background:var(--c,var(--acc))}
.panel{background:var(--card);border:2px solid var(--line);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 18px;background:var(--acc);border:2px solid var(--acc);color:#140a28;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:var(--acc)}
.btn.bad{background:var(--bad);border-color:var(--bad)}.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.in{width:100%;min-height:44px;padding:9px 12px;background:var(--bg1);border:2px solid var(--line);border-radius:0;outline:none}
.in:focus{border-color:var(--acc)}textarea.in{min-height:90px;resize:vertical}
.lbl{display:block;margin:12px 0 5px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;background:transparent;border:2px solid var(--line);cursor:pointer;font-size:15px}
.chip:hover{border-color:var(--acc)}.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#140a28;font-weight:700}
.muted{color:var(--dim)}.small{font-size:14px}
.empty{padding:40px 16px;text-align:center;color:var(--dim)}
.err{color:var(--bad);min-height:20px;font-size:14px;margin-top:6px}
.hint{font-size:14px;color:var(--dim);margin-top:6px}
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.sec-h h2{font-size:22px}.sec-h .sp{margin-left:auto}

/* статистика */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.st{padding:14px 16px;background:var(--card);border:2px solid var(--line);border-left:6px solid var(--c,var(--acc))}
.st b{display:block;font-size:30px;line-height:1.1}.st span{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}

/* пользователи */
.tools{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px}
.ut{background:var(--card);border:2px solid var(--line)}
.ur{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1.15fr) minmax(0,1.15fr) minmax(0,1.1fr) 108px;gap:12px;align-items:center;padding:12px 14px;border-bottom:2px solid var(--line2)}
.ur:last-child{border-bottom:0}
.uh{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);background:var(--bg1);padding-top:9px;padding-bottom:9px}
.ur.ban{background:rgba(255,94,122,.07)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.av{flex:none;width:40px;height:40px;display:grid;place-items:center;font-weight:700;font-size:18px;color:#140a28;background:var(--c,var(--acc))}
.who .t{min-width:0}.who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cid{background:none;border:0;padding:0;color:var(--dim);cursor:pointer;font-size:13px;text-decoration:underline dotted}.cid:hover{color:#fff}
.dot{display:inline-block;width:9px;height:9px;margin-right:7px;background:var(--dim)}.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.reason{display:block;margin-top:4px;font-size:13px;color:#ff9aa8;word-break:break-word}
.c-a{text-align:right}
.more{display:block;width:100%;margin-top:12px}

/* заявки, новости, команда */
.item{display:block;width:100%;text-align:left;margin-top:10px;padding:12px 14px;background:var(--card);border:2px solid var(--line);border-left:8px solid var(--c,var(--acc));cursor:pointer}
.item:hover{border-color:var(--acc);border-left-color:var(--c)}
.item h4{margin:6px 0 2px;font-size:19px}.item p{margin:0;font-size:15px;color:var(--dim)}
.nws{display:grid;gap:12px}
.nw{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 16px;background:var(--card);border:2px solid var(--line);border-left:8px solid var(--c,var(--acc))}
.nw h4{margin:6px 0 2px;font-size:19px}.nw p{margin:0;font-size:15px;color:#e5d9ff;word-break:break-word}
.nw .lk{margin-top:8px;font-size:14px;color:var(--dim);word-break:break-all}.nw .lk b{color:var(--info);font-weight:500}
.nw .acts{display:flex;flex-direction:column;gap:6px}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button{width:34px;height:34px;border:3px solid transparent;background:var(--c);cursor:pointer}.sw button[aria-pressed=true]{border-color:#fff}
.sw input[type=color]{width:42px;height:34px;padding:0;border:2px solid var(--line);background:none;cursor:pointer}
.pv{margin-top:14px;padding:12px 14px;background:linear-gradient(#1b1141,#120a2c);border:2px solid var(--line);border-left:8px solid var(--c)}
.pv h4{margin:6px 0 2px;font-size:19px;text-transform:uppercase}.pv p{margin:0;font-size:15px;color:#e5d9ff}.pv .lk{margin-top:6px;font-size:13px;color:var(--dim)}
.addr{margin-top:8px;padding:14px;background:var(--bg1);border:2px solid var(--line);word-break:break-all;font-size:19px;user-select:all}
.team{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--line2)}.team:last-child{border-bottom:0}.team .g{flex:1;min-width:0}
.perm{width:100%;border-collapse:collapse;font-size:14px}.perm th,.perm td{padding:8px 10px;border-bottom:2px solid var(--line2);text-align:left}.perm th{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.perm td:not(:first-child),.perm th:not(:first-child){text-align:center;width:120px}

/* окна и тосты */
.ov{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(5,2,14,.78);overflow:auto}
.md{width:100%;max-width:520px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--bg1);border:3px solid var(--acc)}
.md-h{display:flex;align-items:center;padding:14px 16px;border-bottom:2px solid var(--line)}.md-h h3{font-size:20px;flex:1}
.md-x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--dim)}.md-x:hover{color:#fff}
.md-b{padding:4px 16px 16px;overflow:auto}.md-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:2px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--bot));z-index:200;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:12px 20px;background:#fff;color:#140a28;font-weight:700;box-shadow:0 6px 30px rgba(0,0,0,.5)}
.toast.bad{background:var(--bad)}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px}.center div{max-width:440px}.center .ic{font-size:60px;line-height:1}.center h2{margin:12px 0 8px;font-size:26px}.center p{color:var(--dim)}

@media(max-width:820px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .uh{display:none}
  .ur{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"u a" "r r" "s s" "t t";gap:6px 12px}
  .c-u{grid-area:u}.c-a{grid-area:a}.c-r{grid-area:r}.c-s{grid-area:s}.c-t{grid-area:t}
  .ur [data-l]:not(.c-u):not(.c-a)::before{content:attr(data-l) ": ";color:var(--dim);font-size:13px}
  .tools{grid-template-columns:1fr}
  .nw{grid-template-columns:1fr}.nw .acts{flex-direction:row;flex-wrap:wrap}
  .perm td:not(:first-child),.perm th:not(:first-child){width:auto}
}
@media(max-width:480px){.me .nm{display:none}.bar h1{font-size:18px}}
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="top-in">
    <div class="bar">
      <h1>Coopix <em>Админ</em></h1>
      <span class="badge" id="roleB"></span>
      <div class="me"><span class="nm" id="meName"></span><a class="back" href="/">← В маркет</a></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Разделы"></nav>
  </div>
</header>
<main id="view"><div class="empty">Загрузка…</div></main>

<script>
"use strict";
/* ---------- утилиты ---------- */
const tg = window.Telegram && Telegram.WebApp;
try { tg && tg.ready(); tg && tg.expand(); } catch (e) {}
try { if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(() => { location.href = "/"; }); } } catch (e) {}
const INIT = (tg && tg.initData) || "";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const fmt = t => { if (!t) return "—"; const d = new Date(t); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const ago = t => { const s = Math.max(0, (Date.now() - t) / 1000); if (s < 120) return "только что"; if (s < 3600) return Math.floor(s / 60) + " мин назад"; if (s < 86400) return Math.floor(s / 3600) + " ч назад"; if (s < 86400 * 30) return Math.floor(s / 86400) + " дн назад"; return fmt(t).slice(0, 10); };
const debounce = (f, ms) => { let h; return (...a) => { clearTimeout(h); h = setTimeout(() => f(...a), ms); }; };
const TRON = /^T[1-9A-HJ-NP-Za-km-z]{33}$/;
const LINK = /^https:\/\/[^\s"'<>]+$/i;
const COLORS = ["#ff5ec4", "#ffb23f", "#4dd2ff", "#5dff8a", "#a56bff", "#ff5e7a"];
const AVC = ["#a56bff", "#ff5ec4", "#4dd2ff", "#5dff8a", "#ffb23f", "#ff5e7a"];

const ERR = {
  banned: "Аккаунт заблокирован", forbidden: "Недостаточно прав для этого действия", bad_address: "Неверный адрес: нужен TRON (TRC20), начинается с T, 34 символа",
  bad_news: "Проверьте новость: заголовок обязателен, ссылка только https://", cannot_ban_self: "Нельзя заблокировать самого себя",
  cannot_ban_staff: "Нельзя заблокировать админа или модератора", not_found: "Не найдено", already_main: "Этот человек уже главный админ",
  bad_id: "Неверный Telegram id (только цифры)", unauthorized: "Откройте панель из Telegram",
  title_required: "Введите название игры", bad_tags: "Укажите от 1 до 3 тегов", bad_item: "Неизвестный носитель", bad_cover: "Неизвестная обложка",
  bad_bg: "Неизвестный фон", bad_link: "Ссылка: только https://, до 300 символов", bad_tint: "Цвет: оттенок 0–360, насыщенность 0–1",
  bad_access: "Неизвестный режим доступа", empty_patch: "Нечего сохранять: ничего не изменилось", already_published: "Эта заявка уже опубликована в маркете",
  bad_status: "Неверный статус", already_done: "Эти правки уже проверены", bad_json: "Неверные данные запроса",
};
const errText = e => ERR[e.message] || (e.status === 401 ? ERR.unauthorized : "Ошибка сети или сервера, попробуйте ещё раз");

async function api(path, { method = "GET", body } = {}) {
  const r = await fetch("/api" + path, { method, headers: { "X-Tg-Init": INIT, ...(body !== undefined ? { "Content-Type": "application/json" } : {}) }, body: body !== undefined ? JSON.stringify(body) : undefined });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error((j && j.error) || String(r.status)); e.status = r.status; throw e; }
  return j;
}

let toastT;
function toast(msg, bad) {
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.setAttribute("role", "status"); t.textContent = msg;
  document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200);
}

/* окно: buttons = [{t, cls, fn(ctl)}]; fn может вернуть false, чтобы окно осталось открытым */
function modal(title, body, buttons = []) {
  const ov = document.createElement("div"); ov.className = "ov";
  ov.innerHTML = `<div class="md" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="md-h"><h3>${esc(title)}</h3><button class="md-x" type="button" aria-label="Закрыть">×</button></div><div class="md-b">${body}</div>${buttons.length ? `<div class="md-f"></div>` : ""}</div>`;
  const ctl = { el: ov, $: s => $(s, ov), close() { ov.remove(); document.removeEventListener("keydown", onKey); } };
  const onKey = e => { if (e.key === "Escape") ctl.close(); };
  document.addEventListener("keydown", onKey);
  ov.addEventListener("mousedown", e => { if (e.target === ov) ctl.close(); });
  $(".md-x", ov).onclick = ctl.close;
  const f = $(".md-f", ov);
  buttons.forEach(b => { const x = document.createElement("button"); x.type = "button"; x.className = "btn " + (b.cls || ""); x.textContent = b.t; x.onclick = async () => { x.disabled = true; try { if (b.fn && (await b.fn(ctl)) === false) { x.disabled = false; return; } } catch (e) { x.disabled = false; throw e; } ctl.close(); }; f.append(x); });
  document.body.append(ov);
  const first = $("input,textarea,select", ov); first && setTimeout(() => first.focus(), 30);
  return ctl;
}
const confirmBox = (title, text, label, cls, fn) => modal(title, `<p style="margin:12px 0 0">${text}</p>`, [{ t: "Отмена", cls: "ghost" }, { t: label, cls, fn }]);

function screen(icon, title, text) {
  $("#top").hidden = true;
  $("#view").innerHTML = `<div class="center"><div><div class="ic">${icon}</div><h2>${esc(title)}</h2><p>${esc(text)}</p></div></div>`;
}
/* HTML игры: только в iframe без allow-same-origin, код игры не видит панель и initData */
function preview(html) {
  const o = document.createElement("div"); o.style.cssText = "position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column";
  const fr = document.createElement("iframe"); fr.setAttribute("sandbox", "allow-scripts allow-pointer-lock");
  fr.style.cssText = "flex:1;border:0;width:100%;background:#fff"; fr.srcdoc = html;
  const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = "Закрыть превью"; b.style.cssText = "flex:none;width:100%"; b.onclick = () => o.remove();
  o.append(fr, b); document.body.append(o);
}
const copy = async t => { try { await navigator.clipboard.writeText(t); toast("Скопировано: " + t); } catch (e) { toast("Не удалось скопировать", true); } };

/* ---------- каркас ---------- */
let ME = null, TAB = null, SUBS_NEW = 0, EDITS_NEW = 0;
const TABS = [
  { id: "users", label: "Пользователи", main: true, render: viewUsers },
  { id: "subs", label: "Заявки", render: viewSubs },
  { id: "games", label: "Игры", main: true, render: viewGames },
  { id: "edits", label: "Правки", render: viewEdits },
  { id: "news", label: "Новости", main: true, render: viewNews },
  { id: "wallet", label: "Помощь · донат", main: true, render: viewWallet },
  { id: "team", label: "Команда", main: true, render: viewTeam },
];
const tabsFor = () => TABS.filter(t => !t.main || ME.role === "main");

function drawTabs() {
  const list = tabsFor();
  $("#tabs").innerHTML = list.map(t => `<button class="tab" role="tab" data-id="${t.id}" aria-selected="${t.id === TAB}">${t.label}${t.id === "subs" && SUBS_NEW ? `<span class="n">${SUBS_NEW}</span>` : ""}${t.id === "edits" && EDITS_NEW ? `<span class="n">${EDITS_NEW}</span>` : ""}</button>`).join("");
  $("#tabs").hidden = list.length < 2;
}
function go(id) {
  TAB = id; $("#view").onclick = null; drawTabs(); $("#view").innerHTML = `<div class="empty">Загрузка…</div>`;
  tabsFor().find(t => t.id === id).render($("#view")).catch(e => { $("#view").innerHTML = `<div class="empty">${esc(errText(e))}<br><br><button class="btn ghost" id="retry" type="button">Повторить</button></div>`; $("#retry").onclick = () => go(id); });
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b && b.dataset.id !== TAB) go(b.dataset.id); });

/* ===================== ПОЛЬЗОВАТЕЛИ ===================== */
async function viewUsers(root) {
  const S = { q: "", filter: "all", sort: "seen", rows: [], total: 0, busy: false };
  root.innerHTML = `
    <div class="stats" id="stats"></div>
    <div class="tools">
      <input class="in" id="uq" type="search" placeholder="Поиск: имя, @username или Telegram id" autocomplete="off">
      <select class="in" id="us" aria-label="Сортировка" style="width:auto"><option value="seen">Сначала недавно активные</option><option value="reg">Сначала новые</option></select>
    </div>
    <div class="chips" id="uf" style="margin-bottom:12px">
      <button class="chip" type="button" data-k="all" aria-pressed="true">Все</button>
      <button class="chip" type="button" data-k="active" aria-pressed="false">Активные за 24 ч</button>
      <button class="chip" type="button" data-k="banned" aria-pressed="false">Забаненные</button>
    </div>
    <div id="ul"></div>
    <p class="hint">В списке игроки, которые уже заходили в приложение после подключения панели. Дата регистрации = первый заход.</p>`;

  const stats = async () => {
    try {
      const s = await api("/admin?r=stats");
      $("#stats").innerHTML = [["Всего игроков", s.total, "#a56bff"], ["Активны за 24 ч", s.active24h, "#5dff8a"], ["Новых за 7 дней", s.new7d, "#4dd2ff"], ["Забанено", s.banned, "#ff5e7a"]]
        .map(([l, v, c]) => `<div class="st" style="--c:${c}"><b>${v}</b><span>${l}</span></div>`).join("");
    } catch (e) { $("#stats").innerHTML = ""; }
  };

  const rowHTML = u => {
    const c = AVC[Number(u.id) % AVC.length], on = Date.now() - u.seen < 5 * 60e3;
    const role = u.role === "main" ? `<span class="badge" style="--c:#ffd23f">Гл. админ</span> ` : u.role === "moderator" ? `<span class="badge" style="--c:#4dd2ff">Модератор</span> ` : "";
    const st = u.banned ? `<span class="badge" style="--c:var(--bad)">Забанен</span>${u.reason ? `<span class="reason">${esc(u.reason)}</span>` : ""}` : `<span class="badge" style="--c:var(--ok)">Активен</span>`;
    return `<div class="ur${u.banned ? " ban" : ""}" data-id="${esc(u.id)}">
      <div class="c-u who"><div class="av" style="--c:${c}">${esc((u.name || u.username || "?").trim().charAt(0).toUpperCase() || "?")}</div>
        <div class="t"><b>${esc(u.name || "Без имени")}</b><small>${u.username ? "@" + esc(u.username) + " · " : ""}<button class="cid" type="button" data-copy="${esc(u.id)}" title="Скопировать id">id ${esc(u.id)}</button></small></div></div>
      <div class="c-r" data-l="Регистрация">${fmt(u.reg)}</div>
      <div class="c-s" data-l="Активность" title="${fmt(u.seen)}"><span class="dot${on ? " on" : ""}"></span>${on ? "онлайн" : ago(u.seen)}</div>
      <div class="c-t" data-l="Статус">${role}${st}</div>
      <div class="c-a">${u.role ? "" : u.banned ? `<button class="btn sm ok" data-act="unban" type="button">Разбанить</button>` : `<button class="btn sm bad" data-act="ban" type="button">Забанить</button>`}</div></div>`;
  };

  const draw = () => {
    const head = `<div class="ur uh"><div>Игрок</div><div>Регистрация</div><div>Последняя активность</div><div>Статус</div><div></div></div>`;
    $("#ul").innerHTML = S.rows.length
      ? `<div class="ut">${head}${S.rows.map(rowHTML).join("")}</div>${S.rows.length < S.total ? `<button class="btn ghost more" id="more" type="button">Показать ещё · ${S.rows.length} из ${S.total}</button>` : `<p class="hint">Показано: ${S.total}</p>`}`
      : `<div class="ut"><div class="empty">${S.busy ? "Загрузка…" : "Никого не найдено"}</div></div>`;
  };

  const load = async (append) => {
    S.busy = true; if (!append) { S.rows = []; draw(); }
    const qs = new URLSearchParams({ r: "users", q: S.q, filter: S.filter, sort: S.sort, limit: 50, offset: append ? S.rows.length : 0 });
    try { const r = await api("/admin?" + qs); S.rows = append ? S.rows.concat(r.rows) : r.rows; S.total = r.total; }
    catch (e) { toast(errText(e), true); }
    S.busy = false; draw();
  };

  $("#uq").oninput = debounce(e => { S.q = e.target.value.trim(); load(); }, 300);
  $("#us").onchange = e => { S.sort = e.target.value; load(); };
  $("#uf").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; S.filter = b.dataset.k; root.querySelectorAll("#uf .chip").forEach(x => x.setAttribute("aria-pressed", x === b)); load(); };
  $("#ul").onclick = e => {
    if (e.target.closest("#more")) return load(true);
    const cp = e.target.closest("[data-copy]"); if (cp) return copy(cp.dataset.copy);
    const b = e.target.closest("[data-act]"); if (!b) return;
    const u = S.rows.find(x => x.id === b.closest(".ur").dataset.id); if (!u) return;
    b.dataset.act === "ban" ? banDialog(u) : unbanDialog(u);
  };

  const apply = async (u, body, okMsg) => {
    try { const n = await api("/admin?r=user&id=" + encodeURIComponent(u.id), { method: "PATCH", body }); Object.assign(u, n); toast(okMsg); draw(); stats(); }
    catch (e) { toast(errText(e), true); return false; }
  };
  function banDialog(u) {
    const m = modal("Забанить игрока", `<p style="margin:12px 0 0"><b>${esc(u.name || "Без имени")}</b> ${u.username ? "@" + esc(u.username) : ""} · id ${esc(u.id)}</p>
      <p class="hint">Игрок увидит экран «Доступ ограничен», маркет у него не загрузится, новые заявки он отправить не сможет.</p>
      <span class="lbl">Причина (увидит игрок)</span><input class="in" id="br" maxlength="200" placeholder="Например: спам в заявках">
      <div class="chips" style="margin-top:8px">${["Спам", "Нарушение правил", "Читерство"].map(r => `<button class="chip" type="button" data-r="${r}">${r}</button>`).join("")}</div>`,
      [{ t: "Отмена", cls: "ghost" }, { t: "Забанить", cls: "bad", fn: c => apply(u, { banned: true, reason: c.$("#br").value.trim() }, "Игрок забанен") }]);
    m.el.addEventListener("click", e => { const c = e.target.closest("[data-r]"); if (c) m.$("#br").value = c.dataset.r; });
  }
  const unbanDialog = u => confirmBox("Разбанить игрока?", `Вернуть доступ игроку <b>${esc(u.name || u.id)}</b>?`, "Разбанить", "ok", () => apply(u, { banned: false }, "Игрок разбанен"));

  stats(); await load();
}

/* ===================== ЗАЯВКИ ===================== */
const SST = { new: { t: "Не просмотрено", c: "#ffb23f" }, seen: { t: "Просмотрено", c: "#4dd2ff" }, pub: { t: "Опубликовано", c: "#5dff8a" } };
const sBadge = k => `<span class="badge" style="--c:${SST[k].c}">${SST[k].t}</span>`;

async function viewSubs(root) {
  let all = await api("/subs"), q = "", f = "all";
  const countNew = () => { SUBS_NEW = all.filter(s => s.status === "new").length; drawTabs(); };
  countNew();

  const list = () => {
    const ql = q.toLowerCase();
    const rows = all.filter(s => (f === "all" || s.status === f) && (!ql || [s.title, s.author, s.tg, s.contact, s.genre, s.authorId].join(" ").toLowerCase().includes(ql)));
    const cnt = k => k === "all" ? all.length : all.filter(s => s.status === k).length;
    root.innerHTML = `<div class="sec-h"><h2>Заявки на игры</h2><button class="btn ghost sm sp" id="rf" type="button">Обновить</button></div>
      <input class="in" id="sq" type="search" placeholder="Поиск: игра, автор, контакт" value="${esc(q)}" autocomplete="off">
      <div class="chips" id="sf" style="margin-top:12px">${["all", ...Object.keys(SST)].map(k => `<button class="chip" type="button" data-k="${k}" aria-pressed="${k === f}">${k === "all" ? "Все" : SST[k].t} · ${cnt(k)}</button>`).join("")}</div>
      <div id="sl">${rows.length ? rows.map(s => `<button type="button" class="item" data-id="${esc(s.id)}" style="--c:${SST[s.status].c}">${sBadge(s.status)}<h4>${esc(s.title)}</h4><p>${esc(s.author)}${s.tg ? " @" + esc(s.tg) : ""} · ${esc(s.genre)} · v${esc(s.ver)} · ${fmt(s.at)}</p></button>`).join("") : `<div class="empty">Заявок нет</div>`}</div>`;
    const inp = $("#sq"); inp.oninput = e => { q = e.target.value; const p = inp.selectionStart; list(); const n = $("#sq"); n.focus(); n.setSelectionRange(p, p); };
    $("#sf").onclick = e => { const b = e.target.closest(".chip"); if (b) { f = b.dataset.k; list(); } };
    $("#sl").onclick = e => { const b = e.target.closest(".item"); if (b) detail(all.find(x => x.id === b.dataset.id)); };
    $("#rf").onclick = async () => { try { all = await api("/subs"); countNew(); list(); toast("Обновлено"); } catch (e) { toast(errText(e), true); } };
  };

  const text = async s => (await api("/subs/" + encodeURIComponent(s.id) + "/file")).text;

  function detail(s) {
    let st = s.status;
    root.innerHTML = `<button class="btn ghost sm" id="bk" type="button">← К списку</button>
      <div class="panel" style="margin-top:12px">${sBadge(s.status)}<h2 style="margin:8px 0 4px">${esc(s.title)}</h2>
      <p class="muted small" style="margin:0"><b style="color:#fff">Автор:</b> ${esc(s.author)}${s.tg ? " (@" + esc(s.tg) + ")" : ""} · id ${esc(s.authorId)}<br><b style="color:#fff">Контакт:</b> ${esc(s.contact || "—")}<br><b style="color:#fff">Жанр:</b> ${esc(s.genre)} · v${esc(s.ver)} · ${fmt(s.at)}<br><b style="color:#fff">Файл:</b> ${esc(s.file.name)} · ${Math.round(s.file.size / 1024)} КБ</p>
      <p style="white-space:pre-wrap;margin:12px 0">${esc(s.desc)}</p>
      <div class="row"><button class="btn ghost" id="o" type="button">Открыть HTML</button><button class="btn ghost" id="d" type="button">Скачать</button>${ME.role === "main" && s.status !== "pub" ? `<button class="btn ok" id="pb" type="button">Опубликовать в маркет</button>` : ""}</div>
      <span class="lbl">Статус</span><div class="chips" id="st">${Object.keys(SST).map(k => `<button class="chip" type="button" data-k="${k}" aria-pressed="${k === st}">${SST[k].t}</button>`).join("")}</div>
      <span class="lbl">Комментарий автору (придёт ему от бота)</span><textarea class="in" id="cm" maxlength="400" placeholder="Что поправить или почему принято">${esc(s.comment || "")}</textarea>
      <div class="row" style="margin-top:14px"><button class="btn" id="sv" type="button">Сохранить</button></div></div>`;
    $("#bk").onclick = list;
    $("#o").onclick = async () => { try { preview(await text(s)); } catch (e) { toast("Не удалось загрузить файл", true); } };
    $("#d").onclick = async () => { try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([await text(s)], { type: "text/html" })); a.download = s.file.name; a.click(); } catch (e) { toast("Не удалось загрузить файл", true); } };
    const pb = $("#pb");
    if (pb) pb.onclick = () => {
      let acc = "staff";
      const m = modal("Опубликовать в маркет", `<p style="margin:12px 0 0">Игра <b>${esc(s.title)}</b> появится в каталоге с HTML-файлом из заявки. Автор получит сообщение от бота и сможет предлагать правки страницы.</p>
        <span class="lbl">Кто увидит</span><div class="chips" id="pa">${GACC_PUB.map(k => `<button class="chip" type="button" data-k="${k}" aria-pressed="${k === acc}">${GACC[k].t}</button>`).join("")}</div>
        <p class="hint">«Только команда»: игру видят админы и модераторы, чтобы проверить перед выходом. Открыть всем можно потом во вкладке «Игры».</p>`,
        [{ t: "Отмена", cls: "ghost" }, { t: "Опубликовать", cls: "ok", fn: async () => {
          try { await api("/admin?r=publish", { method: "POST", body: { submission: s.id, access: acc } }); }
          catch (e) { toast(errText(e), true); return false; }
          s.status = "pub"; toast(acc === "public" ? "Игра в маркете, видна всем" : "Игра в маркете, пока видна только команде"); countNew(); detail(s);
        } }]);
      m.$("#pa").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; acc = b.dataset.k; m.el.querySelectorAll("#pa .chip").forEach(x => x.setAttribute("aria-pressed", x === b)); };
    };
    $("#st").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; st = b.dataset.k; root.querySelectorAll("#st .chip").forEach(x => x.setAttribute("aria-pressed", x === b)); };
    $("#sv").onclick = async () => {
      const p = { status: st, comment: $("#cm").value.trim() };
      try { await api("/subs/" + encodeURIComponent(s.id), { method: "PATCH", body: p }); Object.assign(s, p); toast("Сохранено"); countNew(); list(); }
      catch (e) { toast(errText(e), true); }
    };
  }
  list();
}

/* ===================== КАТАЛОГ ИГР (только главный админ) ===================== */
const GACC = { public: { t: "Все игроки", c: "#5dff8a" }, staff: { t: "Только команда", c: "#ffb23f" }, off: { t: "Скрыта", c: "#ff5e7a" } };
const GACC_PUB = ["staff", "public"];
const GITEMS = { cassette: "Кассета", cd: "CD", floppy: "Дискета", handheld: "Приставка" };
const GCOVERS = { "b:retro": "Retro", "b:space": "Space", "b:toxic": "Toxic", "b:blocks": "Blocks" };
const GBGS = { auto: "Авто", 0: "Волны", 1: "Мозаика", 2: "Закат", 3: "Дождь" };
const opts = (o, cur) => Object.entries(o).map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(cur) ? " selected" : ""}>${esc(l)}</option>`).join("");
const aBadge = k => `<span class="badge" style="--c:${(GACC[k] || GACC.off).c}">${(GACC[k] || GACC.off).t}</span>`;

async function viewGames(root) {
  let games = await api("/admin?r=games");
  const draw = () => {
    root.innerHTML = `<div class="sec-h"><h2>Каталог игр</h2><span class="muted small">${games.length}</span><button class="btn sp" id="ga" type="button">+ Добавить игру</button></div>
      <div class="nws" id="gl">${games.length ? games.map((g, i) => `<div class="nw" data-id="${esc(g.id)}" style="--c:${(GACC[g.access] || GACC.off).c}">
        <div>${aBadge(g.access)} <span class="muted small">${esc(g.id)} · порядок ${g.sort}${g.file ? " · HTML-файл" : " · встроенная"}</span>
          <h4>${esc(g.title)}</h4><p>${esc((g.tags || []).join(" · "))} · v${esc(g.ver)} · ${esc(g.author || "—")}${g.authorId ? ` <span class="muted small">(id ${esc(g.authorId)})</span>` : ""}</p>
          <div class="chips" style="margin-top:8px">${Object.keys(GACC).map(k => `<button class="chip" type="button" data-acc="${k}" aria-pressed="${k === g.access}">${GACC[k].t}</button>`).join("")}</div></div>
        <div class="acts"><button class="btn ghost sm" data-a="up" type="button" ${i === 0 ? "disabled" : ""} aria-label="Выше">↑</button><button class="btn ghost sm" data-a="down" type="button" ${i === games.length - 1 ? "disabled" : ""} aria-label="Ниже">↓</button><button class="btn ghost sm" data-a="edit" type="button">Изменить</button>${g.file ? `<button class="btn ghost sm" data-a="play" type="button">Открыть</button>` : ""}<button class="btn ghost sm" data-a="del" type="button" style="color:var(--bad)">Удалить</button></div></div>`).join("") : `<div class="empty">Каталог пуст: в маркете не будет ни одной игры. Выполните supabase/schema.sql (добавит 4 встроенные) или добавьте игру.</div>`}</div>
      <p class="hint">«Все игроки» = игра в маркете. «Только команда» = видят админы и модераторы (проверка перед выходом). «Скрыта» = не видит никто. Порядок здесь = порядок в маркете.</p>`;
    $("#ga").onclick = () => form(null);
  };
  const reload = async () => { games = await api("/admin?r=games"); draw(); };
  const patch = async (id, body, okMsg) => {
    try { const n = await api("/admin?r=game&id=" + encodeURIComponent(id), { method: "PATCH", body }); Object.assign(games.find(g => g.id === id), n); if (okMsg) toast(okMsg); draw(); }
    catch (e) { toast(errText(e), true); return false; }
  };
  root.onclick = async e => {
    const row = e.target.closest(".nw"); if (!row) return;
    const g = games.find(x => x.id === row.dataset.id); if (!g) return;
    const ac = e.target.closest("[data-acc]");
    if (ac) { if (ac.dataset.acc !== g.access) patch(g.id, { access: ac.dataset.acc }, "Доступ: " + GACC[ac.dataset.acc].t); return; }
    const b = e.target.closest("[data-a]"); if (!b) return;
    const a = b.dataset.a, i = games.indexOf(g);
    if (a === "edit") return form(g);
    if (a === "play") { try { const t = (await api("/hub?r=gamefile&id=" + encodeURIComponent(g.id))).text; preview(t); } catch (er) { toast(er.status === 404 ? "Файл недоступен: откройте доступ «Только команда» или «Все игроки»" : errText(er), true); } return; }
    if (a === "del") return confirmBox("Удалить игру?", `«${esc(g.title)}» исчезнет из маркета вместе с правками страницы. Отзывы и счётчики останутся в базе. Это не отменить.`, "Удалить", "bad", async () => {
      try { await api("/admin?r=game&id=" + encodeURIComponent(g.id), { method: "DELETE" }); toast("Игра удалена"); await reload(); } catch (er) { toast(errText(er), true); return false; } });
    // порядок: переставляем и раздаём sort = 10, 20, 30…; сохраняем только изменившиеся
    const j = a === "up" ? i - 1 : i + 1; if (j < 0 || j >= games.length) return;
    const next = games.slice(); [next[i], next[j]] = [next[j], next[i]];
    root.querySelectorAll("[data-a=up],[data-a=down]").forEach(x => { x.disabled = true; });
    try { for (const [k, x] of next.entries()) if (x.sort !== (k + 1) * 10) await api("/admin?r=game&id=" + encodeURIComponent(x.id), { method: "PATCH", body: { sort: (k + 1) * 10 } }); toast("Порядок сохранён"); }
    catch (er) { toast(errText(er), true); }
    await reload();
  };

  function form(g) {
    const n = g || { title: "", tags: ["Arcade"], desc: "", changes: "", ver: "0.1", author: "", item: "cassette", cover: "b:retro", bg: "auto", link: "", access: "staff", sort: (games.length + 1) * 10 };
    const m = modal(g ? "Игра: " + g.title : "Новая игра", `
      <span class="lbl">Название *</span><input class="in" id="gt" maxlength="40" value="${esc(n.title)}">
      <span class="lbl">Теги через запятую (до 3, первый = жанр и мини-игра)</span><input class="in" id="gg" maxlength="50" value="${esc((n.tags || []).join(", "))}" placeholder="Arcade, Retro">
      <span class="lbl">Описание</span><textarea class="in" id="gd" maxlength="600">${esc(n.desc)}</textarea>
      <span class="lbl">Последние изменения (по одному на строку)</span><textarea class="in" id="gc" maxlength="200">${esc(n.changes)}</textarea>
      <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div style="flex:1"><span class="lbl">Версия</span><input class="in" id="gv" maxlength="12" value="${esc(n.ver)}"></div><div style="flex:2"><span class="lbl">Автор (подпись)</span><input class="in" id="gu" maxlength="24" value="${esc(n.author)}"></div></div>
      <span class="lbl">Ссылка на скачивание (https, необязательно)</span><input class="in" id="gl2" type="url" maxlength="300" value="${esc(n.link)}" placeholder="https://…">
      <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div style="flex:1"><span class="lbl">Носитель</span><select class="in" id="gi">${opts(GITEMS, n.item)}</select></div><div style="flex:1"><span class="lbl">Обложка</span><select class="in" id="go">${opts(GCOVERS, n.cover)}</select></div><div style="flex:1"><span class="lbl">Фон</span><select class="in" id="gb">${opts(GBGS, n.bg)}</select></div></div>
      <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div style="flex:2"><span class="lbl">Кто видит</span><select class="in" id="gs">${opts(Object.fromEntries(Object.entries(GACC).map(([k, v]) => [k, v.t])), n.access)}</select></div><div style="flex:1"><span class="lbl">Порядок</span><input class="in" id="gn" inputmode="numeric" maxlength="6" value="${esc(n.sort)}"></div></div>
      ${g && g.authorId ? `<p class="hint">Автор-игрок: id ${esc(g.authorId)}. Он может предлагать правки описания, версии, ссылки, носителя и фона (вкладка «Правки»).</p>` : ""}
      <div class="err" id="ge"></div>`,
      [{ t: "Отмена", cls: "ghost" }, { t: g ? "Сохранить" : "Добавить", fn: async c => {
        const v = s => c.$(s).value.trim();
        const tags = v("#gg").split(",").map(x => x.trim()).filter(Boolean);
        const link = v("#gl2");
        if (!v("#gt")) { c.$("#ge").textContent = ERR.title_required; return false; }
        if (!tags.length || tags.length > 3) { c.$("#ge").textContent = ERR.bad_tags; return false; }
        if (link && !LINK.test(link)) { c.$("#ge").textContent = ERR.bad_link; return false; }
        const body = { title: v("#gt"), tags, desc: v("#gd"), changes: v("#gc"), ver: v("#gv"), author: v("#gu"), link, item: v("#gi"), cover: v("#go"), bg: v("#gb"), access: v("#gs"), sort: Number(v("#gn")) || 0 };
        // при правке отправляем только изменившиеся поля
        const send = g ? Object.fromEntries(Object.entries(body).filter(([k, x]) => JSON.stringify(x) !== JSON.stringify(g[k]))) : body;
        if (g && !Object.keys(send).length) { c.$("#ge").textContent = ERR.empty_patch; return false; }
        try {
          if (g) await api("/admin?r=game&id=" + encodeURIComponent(g.id), { method: "PATCH", body: send });
          else await api("/admin?r=game", { method: "POST", body: send });
        } catch (e) { c.$("#ge").textContent = errText(e); return false; }
        toast(g ? "Сохранено, в маркете уже обновилось" : "Игра добавлена" + (body.access === "public" ? "" : " (пока не видна игрокам)")); await reload();
      } }]);
  }
  draw();
}

/* ===================== ПРАВКИ СТРАНИЦ ОТ АВТОРОВ (админ и модератор) ===================== */
const EST = { new: { t: "Новые", c: "#ffb23f" }, approved: { t: "Одобрено", c: "#5dff8a" }, rejected: { t: "Отклонено", c: "#ff5e7a" } };
const EFIELD = { desc: "Описание", changes: "Изменения", ver: "Версия", link: "Ссылка", item: "Носитель", bg: "Фон", tint: "Цвет" };
const eVal = (k, v) => {
  if (v == null || v === "") return `<span class="muted">—</span>`;
  if (k === "item") return esc(GITEMS[v] || v);
  if (k === "bg") return esc(GBGS[v] || v);
  if (k === "tint") return `<span style="display:inline-block;width:14px;height:14px;vertical-align:middle;background:hsl(${+v.h || 0} ${Math.round((+v.s || 0) * 100)}% 55%)"></span> ${esc(v.h)}° · ${esc(v.s)}`;
  return `<span style="white-space:pre-wrap;word-break:break-word">${esc(v)}</span>`;
};
async function loadEditsCount() { try { EDITS_NEW = (await api("/admin?r=edits&status=new")).length; drawTabs(); } catch (e) {} }

async function viewEdits(root) {
  let f = "new", all = [];
  const load = async () => { all = await api("/admin?r=edits" + (f === "all" ? "" : "&status=" + f)); if (f === "new") { EDITS_NEW = all.length; drawTabs(); } };
  const draw = () => {
    root.innerHTML = `<div class="sec-h"><h2>Правки страниц от авторов</h2><button class="btn ghost sm sp" id="er" type="button">Обновить</button></div>
      <div class="chips" id="ef">${[["new", "Новые"], ["approved", "Одобрено"], ["rejected", "Отклонено"], ["all", "Все"]].map(([k, l]) => `<button class="chip" type="button" data-k="${k}" aria-pressed="${k === f}">${l}</button>`).join("")}</div>
      <div id="el">${all.length ? all.map(e => `<div class="panel" style="margin-top:12px;border-left:8px solid ${EST[e.status].c}" data-id="${esc(e.id)}">
        <span class="badge" style="--c:${EST[e.status].c}">${EST[e.status].t}</span> <span class="muted small">${fmt(e.at)} · ${esc(e.author || "игрок")} · id ${esc(e.authorId)}</span>
        <h4 style="margin:6px 0 8px;font-size:19px">${esc(e.title)}${e.current ? "" : ` <span class="muted small">(игра удалена)</span>`}</h4>
        <table class="perm"><thead><tr><th>Поле</th><th style="text-align:left;width:auto">Сейчас</th><th style="text-align:left;width:auto">Предлагает автор</th></tr></thead><tbody>
          ${Object.keys(e.patch || {}).map(k => `<tr><td>${esc(EFIELD[k] || k)}</td><td style="text-align:left;width:auto">${eVal(k, e.current && e.current[k])}</td><td style="text-align:left;width:auto;color:#fff">${eVal(k, e.patch[k])}</td></tr>`).join("")}</tbody></table>
        ${e.status === "new" ? `<span class="lbl">Комментарий автору (придёт от бота)</span><textarea class="in" data-cm maxlength="400" placeholder="Необязательно"></textarea>
          <div class="row" style="margin-top:10px"><button class="btn ok" data-s="approved" type="button" ${e.current ? "" : "disabled"}>Одобрить и применить</button><button class="btn bad" data-s="rejected" type="button">Отклонить</button></div>`
          : e.comment ? `<p class="hint">Комментарий: ${esc(e.comment)}</p>` : ""}</div>`).join("") : `<div class="empty">${f === "new" ? "Новых правок нет" : "Пусто"}</div>`}</div>
      <p class="hint">Одобренные правки сразу появляются на странице игры. Автор может менять только описание, изменения, версию, ссылку, носитель, фон и цвет: название и доступ меняет главный админ.</p>`;
  };
  root.onclick = async ev => {
    if (ev.target.id === "er") { try { await load(); draw(); toast("Обновлено"); } catch (e) { toast(errText(e), true); } return; }
    const c = ev.target.closest("#ef .chip"); if (c) { f = c.dataset.k; try { await load(); } catch (e) { toast(errText(e), true); } draw(); return; }
    const b = ev.target.closest("[data-s]"); if (!b) return;
    const box = b.closest("[data-id]"), id = box.dataset.id, status = b.dataset.s, comment = $("[data-cm]", box).value.trim();
    box.querySelectorAll("[data-s]").forEach(x => { x.disabled = true; });
    try { await api("/admin?r=edit&id=" + encodeURIComponent(id), { method: "PATCH", body: { status, comment } }); toast(status === "approved" ? "Одобрено: страница игры обновлена" : "Отклонено, автору ушло сообщение"); }
    catch (e) { toast(errText(e), true); }
    try { await load(); } catch (e) {} draw();
  };
  await load(); draw();
}

/* ===================== НОВОСТИ ===================== */
async function viewNews(root) {
  let items = (await api("/admin?r=news")).items;
  const MAXN = 10;

  const commit = async next => {
    try { items = (await api("/admin?r=news", { method: "PUT", body: { items: next } })).items; toast("Сохранено, на сайте уже обновилось"); draw(); }
    catch (e) { toast(errText(e), true); return false; }
  };

  const draw = () => {
    root.innerHTML = `<div class="sec-h"><h2>Новости на главной</h2><span class="muted small">${items.length} из ${MAXN}</span>
      <button class="btn sp" id="add" type="button" ${items.length >= MAXN ? "disabled" : ""}>+ Добавить новость</button></div>
      <div class="nws" id="nl">${items.length ? items.map((n, i) => `<div class="nw" data-i="${i}" style="--c:${esc(n.c)}">
        <div><span class="badge" style="--c:${esc(n.c)}">${esc(n.tag)}</span> <span class="muted small">${esc(n.date)}</span>
          <h4>${esc(n.title)}</h4>${n.text ? `<p>${esc(n.text)}</p>` : ""}
          <div class="lk">${n.link ? `При нажатии открывает: <b>${esc(n.link)}</b>` : "Без ссылки: по нажатию ничего не происходит"}</div></div>
        <div class="acts"><button class="btn ghost sm" data-a="up" type="button" ${i === 0 ? "disabled" : ""} aria-label="Выше">↑</button><button class="btn ghost sm" data-a="down" type="button" ${i === items.length - 1 ? "disabled" : ""} aria-label="Ниже">↓</button><button class="btn ghost sm" data-a="edit" type="button">Изменить</button><button class="btn ghost sm" data-a="del" type="button" style="color:var(--bad)">Удалить</button></div></div>`).join("") : `<div class="empty">Новостей нет. На главной будет написано «Новостей пока нет».</div>`}</div>
      <p class="hint">Порядок здесь = порядок на главной (первая показывается первой). Каждое изменение сохраняется сразу.</p>`;
    $("#add").onclick = () => form(null);
    $("#nl").onclick = e => {
      const b = e.target.closest("[data-a]"); if (!b) return;
      const i = +b.closest(".nw").dataset.i, a = b.dataset.a, next = items.slice();
      if (a === "edit") return form(i);
      if (a === "del") return confirmBox("Удалить новость?", `«${esc(items[i].title)}» исчезнет с главной.`, "Удалить", "bad", () => commit(items.filter((_, j) => j !== i)));
      const j = a === "up" ? i - 1 : i + 1; [next[i], next[j]] = [next[j], next[i]]; commit(next);
    };
  };

  function form(i) {
    const n = Object.assign({ id: "n" + Date.now().toString(36), tag: "Новое", c: COLORS[0], date: `${pad(new Date().getDate())}.${pad(new Date().getMonth() + 1)}`, title: "", text: "", link: "" }, i === null ? {} : items[i]);
    const m = modal(i === null ? "Новая новость" : "Редактировать новость", `
      <div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div style="flex:1;min-width:0"><span class="lbl">Тег</span><input class="in" id="nt" maxlength="14" value="${esc(n.tag)}"></div>
        <div style="width:110px"><span class="lbl">Дата</span><input class="in" id="nd" maxlength="10" value="${esc(n.date)}" placeholder="10.11"></div></div>
      <span class="lbl">Цвет тега</span><div class="sw" id="nc">${COLORS.map(c => `<button type="button" style="--c:${c}" data-c="${c}" aria-pressed="${c === n.c}" aria-label="${c}"></button>`).join("")}<input type="color" id="ncc" value="${esc(n.c)}" aria-label="Свой цвет"></div>
      <span class="lbl">Заголовок *</span><input class="in" id="nh" maxlength="60" value="${esc(n.title)}" placeholder="Коротко и ясно">
      <span class="lbl">Текст</span><textarea class="in" id="nx" maxlength="200" placeholder="До 200 символов">${esc(n.text)}</textarea>
      <span class="lbl">Ссылка при нажатии (необязательно)</span><input class="in" id="nl2" type="url" maxlength="300" value="${esc(n.link)}" placeholder="https://t.me/coopix_market">
      <div class="hint">Оставьте пустым: новость не будет нажиматься. Принимаются только ссылки https://</div><div class="err" id="ne"></div>
      <div class="pv" id="pv"></div>`,
      [{ t: "Отмена", cls: "ghost" }, { t: "Сохранить", fn: async c => {
        const v = read(c); if (v.err) { c.$("#ne").textContent = v.err; return false; }
        const next = items.slice(); i === null ? next.push(v.n) : next[i] = v.n;
        return commit(next);
      } }]);
    const read = c => {
      const g = s => c.$(s).value.trim(), link = g("#nl2");
      const col = (c.$("#nc [aria-pressed=true]") || {}).dataset?.c || c.$("#ncc").value;
      if (!g("#nh")) return { err: "Введите заголовок" };
      if (link && !LINK.test(link)) return { err: "Ссылка должна начинаться с https://" };
      return { n: { ...n, tag: g("#nt") || "Новое", date: g("#nd"), c: col, title: g("#nh"), text: g("#nx"), link } };
    };
    const pv = () => {
      const g = s => m.$(s).value.trim(), col = (m.$("#nc [aria-pressed=true]") || {}).dataset?.c || m.$("#ncc").value, link = g("#nl2");
      m.$("#pv").style.setProperty("--c", col);
      m.$("#pv").innerHTML = `<span class="badge" style="--c:${esc(col)}">${esc(g("#nt") || "Новое")}</span> <span class="muted small">${esc(g("#nd"))}</span><h4>${esc(g("#nh") || "Заголовок")}</h4>${g("#nx") ? `<p>${esc(g("#nx"))}</p>` : ""}<div class="lk">${link ? (LINK.test(link) ? "→ откроется ссылка" : "ссылка некорректна") : "без нажатия"}</div>`;
    };
    m.el.addEventListener("input", e => { if (e.target.id === "ncc") m.el.querySelectorAll("#nc button").forEach(b => b.setAttribute("aria-pressed", "false")); pv(); });
    m.$("#nc").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; m.el.querySelectorAll("#nc button").forEach(x => x.setAttribute("aria-pressed", x === b)); m.$("#ncc").value = b.dataset.c; pv(); });
    pv();
  }
  draw();
}

/* ===================== ПОМОЩЬ · ДОНАТ ===================== */
async function viewWallet(root) {
  let w = await api("/admin?r=wallet");
  const draw = () => {
    root.innerHTML = `<div class="sec-h"><h2>Помощь · адрес доната</h2></div>
      <div class="panel"><span class="lbl" style="margin-top:0">Сейчас игроки видят в окне «Помочь»</span>
        ${w.addr ? `<div class="addr">${esc(w.addr)}</div><p class="hint">USDT · сеть TRON (TRC20)</p>` : `<div class="addr muted">Адрес не задан: в окне написано «Адрес пока не добавлен»</div>`}
        ${w.updatedAt ? `<p class="hint">Изменён: ${fmt(w.updatedAt)}${w.updatedBy ? " · id " + esc(w.updatedBy) : ""}</p>` : ""}
        <span class="lbl">Новый адрес</span><input class="in" id="wa" maxlength="60" placeholder="T…" autocomplete="off" spellcheck="false" value="">
        <div class="hint" id="wh">TRON (TRC20): начинается с T, 34 символа</div>
        <div class="row" style="margin-top:14px"><button class="btn" id="ws" type="button" disabled>Сохранить адрес</button>${w.addr ? `<button class="btn ghost" id="wc" type="button">Скрыть адрес</button>` : ""}</div></div>
      <p class="hint">При смене адреса бот пришлёт сообщение всем главным админам: подмену нельзя сделать незаметно. Проверяйте адрес целиком: деньги, отправленные не туда, не вернуть.</p>`;
    const inp = $("#wa"), hint = $("#wh"), btn = $("#ws");
    inp.oninput = () => {
      const v = inp.value.trim(), ok = TRON.test(v) && v !== w.addr;
      hint.textContent = !v ? "TRON (TRC20): начинается с T, 34 символа" : !TRON.test(v) ? "Адрес не подходит по формату" : v === w.addr ? "Это текущий адрес" : "Формат верный ✓";
      hint.style.color = !v || ok ? "" : "var(--bad)"; if (ok) hint.style.color = "var(--ok)"; btn.disabled = !ok;
    };
    const save = addr => async () => {
      try { await api("/admin?r=wallet", { method: "PUT", body: { addr } }); w = await api("/admin?r=wallet"); toast(addr ? "Адрес обновлён" : "Адрес скрыт"); draw(); }
      catch (e) { toast(errText(e), true); return false; }
    };
    btn.onclick = () => { const v = inp.value.trim(); modal("Сменить адрес доната?", `<p style="margin:12px 0 4px">Новый адрес увидят все игроки:</p><div class="addr" style="font-size:17px">${esc(v)}</div><p class="hint">Сверьте каждый символ с кошельком. Другим админам уйдёт уведомление.</p>`, [{ t: "Отмена", cls: "ghost" }, { t: "Да, сменить", fn: save(v) }]); };
    const c = $("#wc"); if (c) c.onclick = () => confirmBox("Скрыть адрес?", "Игроки увидят «Адрес пока не добавлен».", "Скрыть", "bad", save(""));
  };
  draw();
}

/* ===================== КОМАНДА ===================== */
async function viewTeam(root) {
  const t = await api("/admin?r=team");
  const nm = u => esc(u.name || u.note || "Без имени") + (u.username ? ` <span class="muted small">@${esc(u.username)}</span>` : "");
  root.innerHTML = `<div class="sec-h"><h2>Команда</h2></div>
    <div class="panel"><span class="lbl" style="margin-top:0">Главные админы · ${t.main.length}</span>
      ${t.main.map(u => `<div class="team"><span class="badge" style="--c:#ffd23f">Гл. админ</span><div class="g"><b>${nm(u)}</b><div class="muted small">id ${esc(u.id)}</div></div></div>`).join("")}
      <p class="hint">Главные админы задаются в Vercel: переменная ADMIN_IDS (нужен Redeploy). Из панели их не удалить, чтобы случайно не потерять доступ.</p></div>
    <div class="panel" style="margin-top:14px"><span class="lbl" style="margin-top:0">Модераторы · ${t.moderators.length}</span>
      ${t.moderators.length ? t.moderators.map(u => `<div class="team"><span class="badge" style="--c:#4dd2ff">Модератор</span><div class="g"><b>${nm(u)}</b><div class="muted small">id ${esc(u.id)} · с ${fmt(u.at)}</div></div><button class="btn ghost sm" data-del="${esc(u.id)}" type="button" style="color:var(--bad)">Убрать</button></div>`).join("") : `<div class="empty" style="padding:18px">Модераторов нет</div>`}
      <span class="lbl">Добавить модератора</span>
      <div class="row" style="flex-wrap:nowrap"><input class="in" id="mi" inputmode="numeric" placeholder="Telegram id" style="max-width:200px"><input class="in" id="mn" maxlength="60" placeholder="Заметка (имя), необязательно"><button class="btn" id="ma" type="button">Добавить</button></div>
      <div class="hint">Свой id человек узнаёт у бота @userinfobot. В списке пользователей id копируется нажатием.</div><div class="err" id="me2"></div></div>
    <div class="panel" style="margin-top:14px"><span class="lbl" style="margin-top:0">Что кому доступно</span>
      <table class="perm"><thead><tr><th>Действие</th><th>Гл. админ</th><th>Модератор</th></tr></thead><tbody>
        ${[["Обрабатывать заявки на игры", 1, 1], ["Одобрять правки страниц игр", 1, 1], ["Публиковать заявки и управлять каталогом игр", 1, 0], ["Просмотр и бан пользователей", 1, 0], ["Редактировать новости и ссылки", 1, 0], ["Менять адрес в «Помочь»", 1, 0], ["Управлять командой", 1, 0]].map(([a, x, y]) => `<tr><td>${a}</td><td style="color:var(--${x ? "ok" : "bad"})">${x ? "✓" : "—"}</td><td style="color:var(--${y ? "ok" : "bad"})">${y ? "✓" : "—"}</td></tr>`).join("")}</tbody></table></div>`;
  root.onclick = async e => {
    const d = e.target.closest("[data-del]");
    if (d) return confirmBox("Убрать модератора?", `Доступ id ${esc(d.dataset.del)} к заявкам будет закрыт.`, "Убрать", "bad", async () => {
      try { await api("/admin?r=team&id=" + encodeURIComponent(d.dataset.del), { method: "DELETE" }); toast("Модератор убран"); go("team"); } catch (er) { toast(errText(er), true); return false; } });
    if (e.target.id === "ma") {
      const id = $("#mi").value.trim(); $("#me2").textContent = "";
      if (!/^\d{1,15}$/.test(id)) { $("#me2").textContent = ERR.bad_id; return; }
      try { await api("/admin?r=team", { method: "POST", body: { id, note: $("#mn").value.trim() } }); toast("Модератор добавлен"); go("team"); } catch (er) { $("#me2").textContent = errText(er); }
    }
  };
}

/* ---------- старт ---------- */
(async () => {

  if (ME.banned) return screen("⛔", "Доступ ограничен", ME.reason ? "Причина: " + ME.reason : "Ваш аккаунт заблокирован.");

  $("#roleB").textContent = ME.role === "main" ? "Гл. админ" : "Модератор"; $("#roleB").style.setProperty("--c", ME.role === "main" ? "#ffd23f" : "#4dd2ff");
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user; $("#meName").textContent = u ? (u.first_name || "") + (u.username ? " @" + u.username : "") : "";
  go(ME.role === "main" ? "users" : "subs");
  loadEditsCount();
})();
