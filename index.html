<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0618">
<title>App Market</title>
<meta name="description" content="Retro app market. Drop a cover, pick an item, and the whole card takes its colours.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0618'/%3E%3Crect x='3' y='5' width='10' height='7' fill='%23a56bff'/%3E%3Crect x='5' y='3' width='6' height='2' fill='%23a56bff'/%3E%3Crect x='6' y='7' width='1' height='3' fill='%230a0618'/%3E%3Crect x='5' y='8' width='3' height='1' fill='%230a0618'/%3E%3Crect x='10' y='7' width='1' height='1' fill='%230a0618'/%3E%3Crect x='11' y='9' width='1' height='1' fill='%230a0618'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Pixelify Sans";font-weight:400;font-display:swap;src:url(assets/fonts/pixelify-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Pixelify Sans";font-weight:600;font-display:swap;src:url(assets/fonts/pixelify-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Pixelify Sans";font-weight:700;font-display:swap;src:url(assets/fonts/pixelify-sans-latin-700-normal.woff2) format("woff2")}

:root{
  --bg0:#07040f; --bg1:#0e0820; --ink:#f4ecff; --dim:#9b86d6; --line:#3a2a70; --acc:#a56bff; --acc2:#5b2fd0;
  --font:"Pixelify Sans",ui-monospace,"Courier New",monospace;
  --k:.5; --col:min(100vw - 24px, 500px);
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg0);color-scheme:dark;-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) 0 0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
svg{display:block}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated}
body.scan::after{content:"";position:fixed;inset:0;z-index:90;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.0) 0 2px,rgba(0,0,0,.10) 2px 3px);mix-blend-mode:multiply}

.app{position:relative;z-index:1;width:var(--col);margin:0 auto;padding:6px 0 140px}

/* ---------- header ---------- */
.top{position:relative;height:clamp(150px,36vw,176px);margin-bottom:6px}
.swoosh{position:absolute;left:-4%;top:-6%;width:78%;height:100%;overflow:visible;pointer-events:none}
.swoosh ellipse{fill:none;stroke:url(#swg);stroke-width:5;stroke-linecap:round;stroke-dasharray:640 260;stroke-dashoffset:640;
  animation:draw 1.6s .15s cubic-bezier(.2,.7,.2,1) forwards;filter:drop-shadow(0 0 8px #a56bff99)}
@keyframes draw{to{stroke-dashoffset:0}}
.logo{position:absolute;left:3%;top:14%;font-weight:700;font-size:clamp(50px,15.4vw,76px);line-height:.86;letter-spacing:-.02em;
  transform:skewX(-9deg);transform-origin:left bottom;color:#fff7ee;text-transform:uppercase;
  text-shadow:2px 2px 0 #a56bff,4px 4px 0 #6a35e0,6px 6px 0 #2d1475,0 0 26px #8a4dff88}
.logo span{display:block}
.logo span+span{margin-left:.5em;font-size:.94em}
.planet{position:absolute;right:-1%;top:-4%;width:clamp(120px,34vw,168px);aspect-ratio:1;image-rendering:pixelated;animation:float 6s ease-in-out infinite;
  filter:drop-shadow(0 0 16px #7c3aedaa)}
@keyframes float{50%{transform:translateY(7px) rotate(-1.5deg)}}
.spark{position:absolute;width:var(--s,18px);aspect-ratio:1;color:#ffcf5a;animation:tw 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.spark svg{width:100%;height:100%;fill:currentColor}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.05) rotate(20deg)}}

/* ---------- tabs ---------- */
.tabs{display:grid;grid-template-columns:1.18fr repeat(4,1fr);gap:7px;margin:4px 0 20px;position:relative}
.tabcell{position:relative}
.tab{position:relative;display:grid;place-items:center;width:100%;height:clamp(50px,13.6vw,64px);
  --cut:#150d33;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
  background:linear-gradient(160deg,#5a3fb8,#2a1a66);color:#8366d6;transition:color .2s,transform .12s}
.tab::before{content:"";position:absolute;inset:2px;background:linear-gradient(#1b1141,#120a2c);
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);transition:background .25s}
.tab svg{position:relative;width:46%;max-width:30px;aspect-ratio:1}
.tab:active{transform:scale(.96)}
.tab[aria-selected=true]{color:#1a0d40;--cut:#b996ff;background:linear-gradient(160deg,#d6bcff,#8a52f5)}
.tab[aria-selected=true]::before{background:linear-gradient(#bf9bff,#8d57f7)}
.tab:hover:not([aria-selected=true]){color:#b79cff}
.notch{position:absolute;left:50%;bottom:-9px;width:18px;height:11px;margin-left:-9px;background:#8d57f7;
  clip-path:polygon(0 0,100% 0,50% 100%);transform:scaleY(0);transform-origin:top;transition:transform .2s}
.tab[aria-selected=true]+.notch{transform:scaleY(1)}

/* ---------- cards ---------- */
.list{display:flex;flex-direction:column;gap:clamp(10px,3vw,16px)}
.cardbox{width:100%;position:relative}
.card{--c1:#a56bff;--c2:#2b1170;--c3:#efe3ff;--glow:rgba(165,107,255,.35);
  position:relative;width:100%;height:calc(220px*var(--k));filter:drop-shadow(0 0 calc(14px*var(--k)*2) var(--glow));
  transition:transform .25s cubic-bezier(.2,.8,.2,1);-webkit-user-select:none;user-select:none}
.card:hover{transform:translateY(-2px)}
.card.drag{filter:drop-shadow(0 0 22px #fff)}
.stage{position:absolute;left:0;top:0;width:905px;height:220px;transform:scale(var(--k));transform-origin:0 0}
.shell{position:absolute;inset:0;background:linear-gradient(120deg,var(--c1),var(--c2) 55%,var(--c1));
  clip-path:polygon(26px 0,calc(100% - 26px) 0,100% 26px,100% calc(100% - 26px),calc(100% - 26px) 100%,26px 100%,0 calc(100% - 26px),0 26px)}
.shell-in{position:absolute;inset:4px;background:#0b0716;overflow:hidden;
  clip-path:polygon(23px 0,calc(100% - 23px) 0,100% 23px,100% calc(100% - 23px),calc(100% - 23px) 100%,23px 100%,0 calc(100% - 23px),0 23px)}
.shell-in::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 140% at 8% 60%,color-mix(in srgb,var(--c1) 38%,transparent),transparent 62%),
  linear-gradient(100deg,color-mix(in srgb,var(--c2) 70%,#0b0716),#0b0716 70%)}
.fx{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated}
.shell-in::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent 52%,rgba(7,4,15,.78) 100%),linear-gradient(180deg,rgba(255,255,255,.08),transparent 22%,transparent 80%,rgba(0,0,0,.35))}
.stripes{position:absolute;right:20px;top:14px;display:flex;gap:11px;transform:skewX(-34deg);pointer-events:none}
.stripes b{width:14px;height:26px;background:var(--c1);opacity:.9}
.stripes b:nth-child(2){opacity:.65}.stripes b:nth-child(3){opacity:.4}

.slot{position:absolute;filter:drop-shadow(0 0 1px color-mix(in srgb,var(--c3) 80%,transparent)) drop-shadow(0 0 9px color-mix(in srgb,var(--c1) 60%,transparent)) drop-shadow(0 7px 7px rgba(0,0,0,.55))}
@property --sw{syntax:"<length>";inherits:true;initial-value:-300px}
@keyframes sweep{0%{--sw:-300px}55%,100%{--sw:1250px}}
.stage{animation:sweep 6.5s linear infinite}
.halo{position:absolute;top:0;width:560px;height:220px;pointer-events:none;mix-blend-mode:screen;opacity:.55;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--c1) 60%,transparent),transparent);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.95;transform:scale(1.06)}}
.floor{position:absolute;height:30px;pointer-events:none;border-radius:50%;filter:blur(3px);opacity:.8;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--c1) 55%,#000),transparent)}
.beam{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.2;
  background:linear-gradient(90deg,transparent calc(var(--sw) - 160px),var(--c3) var(--sw),transparent calc(var(--sw) + 160px))}
.gl{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;
  background:linear-gradient(90deg,transparent calc(var(--sw) - var(--gx,0px) - 60px),rgba(255,255,255,.7) calc(var(--sw) - var(--gx,0px)),transparent calc(var(--sw) - var(--gx,0px) + 60px)) 0 0/905px 100% no-repeat}
.pt{position:absolute;left:0;top:0;width:905px;height:220px;z-index:3;pointer-events:none;image-rendering:pixelated}
.slot canvas{display:block;width:100%;height:100%}
.slot.item{z-index:1}.slot.case{z-index:2}
.hv{width:100%;height:100%;transition:transform .45s cubic-bezier(.2,.9,.2,1)}
.card:hover .hv,.cardbox:focus-within .hv{transform:translateX(var(--hx,0px))}
.bob{width:100%;height:100%;position:relative;animation:bob 5s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes bob{50%{translate:0 -4px}}
.shine{position:absolute;inset:0;mix-blend-mode:color-dodge;opacity:0;pointer-events:none;
  -webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;
  background:conic-gradient(from var(--a),#ff6bd5,#ffd36b,#6bffb0,#6bc7ff,#a56bff,#ff6bd5);animation:spin 7s linear infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.item.cd .shine{opacity:.5}

.cover{position:absolute;left:0;top:0;width:256px;height:256px;transform-origin:0 0;overflow:hidden;background:#111}
.cover canvas{position:absolute;inset:0;width:100%;height:100%}
.cover canvas.b{clip-path:inset(0 100% 0 0)}
.cover::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.42) 0,rgba(255,255,255,.08) 28%,transparent 46%,rgba(0,0,0,.28) 100%);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.4)}

.info{position:absolute;left:478px;top:0;width:236px;height:100%}
.title{position:absolute;left:0;top:44px;width:100%;font-weight:600;font-size:36px;line-height:44px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-transform:uppercase;color:#fff4ee;text-shadow:0 3px 0 rgba(0,0,0,.45)}
.stars{position:absolute;left:0;top:102px;display:flex;gap:4px}
.stars button{width:38px;height:38px;display:grid;place-items:center;transition:transform .12s}
.stars button:hover{transform:scale(1.18) rotate(-6deg)}
.stars svg{width:34px;height:34px;shape-rendering:crispEdges}
.pill{position:absolute;left:0;top:158px;height:38px;padding:0 22px;display:flex;align-items:center;font-weight:500;font-size:22px;white-space:nowrap;
  color:var(--c3);background:color-mix(in srgb,var(--c2) 78%,#000);border:2px solid var(--c1);border-radius:19px}
.play{position:absolute;left:728px;top:82px;width:154px;height:104px;z-index:5;
  clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px),0 22px);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 70%,#fff),var(--c1) 45%,color-mix(in srgb,var(--c1) 70%,#000));
  display:grid;place-items:center;transition:transform .12s,filter .2s}
.play::before{content:"";position:absolute;inset:4px;clip-path:inherit;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 82%,#fff),var(--c1) 70%)}
.play svg{position:relative;width:58px;height:58px;fill:#140a28;margin-left:6px}
.play:hover{filter:brightness(1.12)}
.play:active{transform:translateY(5px) scale(.97)}
.edit{position:absolute;left:12px;top:8px;z-index:6;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;
  background:rgba(8,4,18,.8);color:var(--c3);border:2px solid var(--c1);opacity:0;transform:scale(.8);transition:.2s}
.edit svg{width:24px;height:24px;fill:currentColor}
.card:hover .edit,.edit:focus-visible,.cardbox:focus-within .edit{opacity:1;transform:none}
@media(hover:none){.edit{opacity:.9;transform:none;width:52px;height:52px}}

.card.add .shell{background:repeating-linear-gradient(135deg,#4b3a94 0 12px,transparent 12px 20px)}
.card.add .shell-in::before{background:linear-gradient(100deg,#150d33,#0b0716 75%)}
.card.add .shell-in::after{display:none}
.add .slot.case{filter:drop-shadow(0 6px 7px rgba(0,0,0,.5))}
.add .hint{position:absolute;left:478px;top:56px;width:238px;font-size:36px;line-height:42px;font-weight:600;text-transform:uppercase;color:#fff4ee}
.add .hint small{display:block;margin-top:10px;font-size:22px;line-height:28px;font-weight:400;text-transform:none;color:var(--dim)}
.add .play{--c1:#a56bff}
.empty{font-size:20px;color:var(--dim);text-align:center;padding:26px 14px;border:2px dashed var(--line);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px)}

/* intro */
.cardbox.enter{animation:enter .5s cubic-bezier(.2,.9,.2,1) both;animation-delay:var(--i,0s)}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.97)}}

/* ---------- dock ---------- */
.dock{position:fixed;z-index:20;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:var(--col);height:clamp(58px,15vw,74px);
  background:linear-gradient(160deg,#6a4cc8,#2a1a66);
  clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px)}
.dock-in{position:absolute;inset:3px;display:grid;grid-template-columns:repeat(4,1fr);background:linear-gradient(#1a1040,#110a2a);
  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px)}
.dock button{position:relative;display:grid;place-items:center;color:#7a5fcf;transition:color .2s}
.dock button+button::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:#33236a}
.dock button svg{width:38%;max-width:30px;aspect-ratio:1}
.dock button[aria-current=true]{color:#c6a5ff;background:radial-gradient(70% 90% at 50% 100%,rgba(165,107,255,.28),transparent)}
.dock button[aria-current=true]::after{content:"";position:absolute;left:14%;right:14%;bottom:5px;height:4px;border-radius:2px;background:#b98bff;box-shadow:0 0 12px 2px #a56bff}
.dock button:hover{color:#d9c2ff}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:end center;visibility:hidden}
.sheet.open{visibility:visible}
.scrim{position:absolute;inset:0;background:rgba(5,2,12,.72);backdrop-filter:blur(4px);opacity:0;transition:opacity .25s}
.sheet.open .scrim{opacity:1}
.panel{position:relative;width:min(100vw,540px);max-height:94dvh;overflow:auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom));
  background:linear-gradient(#1a1040,#0f0826);border-top:4px solid var(--acc);
  clip-path:polygon(24px 0,calc(100% - 24px) 0,100% 24px,100% 100%,0 100%,0 24px);
  transform:translateY(40px);opacity:0;transition:.3s cubic-bezier(.2,.9,.2,1)}
.sheet.open .panel{transform:none;opacity:1}
@media(min-width:700px){.sheet{place-items:center}.panel{clip-path:polygon(24px 0,calc(100% - 24px) 0,100% 24px,100% calc(100% - 24px),calc(100% - 24px) 100%,24px 100%,0 calc(100% - 24px),0 24px);border-top:0;box-shadow:0 0 0 3px var(--acc)}}
.panel h2{font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.x{width:44px;height:44px;display:grid;place-items:center;color:var(--dim)}
.x svg{width:22px;height:22px;fill:currentColor}.x:hover{color:#fff}
.pv{margin-bottom:16px}
.fld{display:block;margin:0 0 14px}
.lbl{display:block;font-size:17px;color:var(--dim);margin-bottom:7px}
.drop{display:grid;place-items:center;gap:4px;text-align:center;padding:16px;border:3px dashed var(--line);background:#120a2a;color:var(--dim);font-size:19px;cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:var(--acc);color:#fff;background:#1a1040}
.drop b{color:#fff;font-weight:600}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{height:50px;border:3px solid var(--line);background:#120a2a;color:var(--dim);font-size:16px;padding:0 2px;transition:.15s}
.chip[aria-checked=true]{border-color:var(--acc);background:#2a1a66;color:#fff}
.chip:hover{color:#fff}
.in{width:100%;height:50px;padding:0 14px;font:inherit;font-size:21px;color:#fff;background:#120a2a;border:3px solid var(--line);border-radius:0;outline:none}
.in:focus{border-color:var(--acc)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#a56bff 50%),linear-gradient(135deg,#a56bff 50%,transparent 50%);background-position:calc(100% - 22px) 22px,calc(100% - 16px) 22px;background-size:6px 6px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button,.sw label{width:42px;height:42px;border:3px solid var(--line);background:var(--c,#444);position:relative;cursor:pointer}
.sw button[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.sw .auto{width:auto;padding:0 14px;background:#120a2a;color:var(--dim);font-size:18px}
.sw .auto[aria-pressed=true]{color:#fff}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.sw .pick{background:conic-gradient(#f55,#fd5,#5f9,#5cf,#a6f,#f5c,#f55)}
.row{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;height:54px;font-size:22px;font-weight:600;text-transform:uppercase;color:#140a28;background:linear-gradient(#cfb0ff,#9a63ff);
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);transition:.12s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(3px)}
.btn.ghost{flex:0 0 auto;padding:0 20px;background:#2a1a66;color:#e5d6ff}
.btn.danger{background:#ff5c7a;color:#2a0510}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 4px;font-size:21px;border-bottom:2px solid #2a1a66;text-align:left}
.toggle i{width:54px;height:28px;background:#2a1a66;position:relative;flex:none;transition:.2s}
.toggle i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;background:#9b86d6;transition:.2s}
.toggle[aria-checked=true] i{background:var(--acc)}
.toggle[aria-checked=true] i::after{left:29px;background:#fff}

/* ---------- toast ---------- */
.toast{position:fixed;z-index:80;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-220%);visibility:hidden;min-width:200px;max-width:92vw;padding:12px 22px 14px;text-align:center;font-size:20px;
  background:#1a1040;border:3px solid var(--acc);color:#fff;transition:transform .35s cubic-bezier(.2,1.2,.3,1);
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast .bar{display:block;margin-top:8px;height:8px;background:#2a1a66;position:relative;overflow:hidden}
.toast .bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--acc) 0 8px,transparent 8px 10px);transform:translateX(-100%)}
.toast.load .bar::after{animation:load 1.1s steps(12) forwards}
@keyframes load{to{transform:none}}

.boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg0);font-size:22px;color:var(--dim);transition:opacity .5s .1s}
.boot.done{opacity:0;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .swoosh ellipse{stroke-dashoffset:0}
}
</style>
</head>
<body class="scan">
<canvas id="bg" aria-hidden="true"></canvas>

/* ============ colour ============ */
function hsl2rgb(h,s,l){h=((h%360)+360)%360/360;const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return [f(0)*255,f(8)*255,f(4)*255]}
function palette(h,s){
  s=clamp(s,.35,1);
  return {D:hsl2rgb(h,s*.8,.07),M:hsl2rgb(h,s,.46),L:hsl2rgb(h+(h>200&&h<300?-6:6),s*.5,.93),A:hsl2rgb(h,s,.62),B:hsl2rgb(h,s*.9,.2),h,s}}
function lerpPal(a,b,t){const o={};for(const k of["D","M","L","A","B"])o[k]=a[k].map((v,i)=>lerp(v,b[k][i],t));return o}
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
function dominant(canvas){
  const c=document.createElement("canvas");c.width=c.height=40;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(canvas,0,0,40,40);
  const d=x.getImageData(0,0,40,40).data,bins=new Array(36).fill(0).map(()=>({w:0,s:0,n:0}));let tot=0,gl=0;
  for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,df=mx-mn;gl+=l;
    if(df<.12||l<.1||l>.94)continue;const s=df/(1-Math.abs(2*l-1));let h=mx===r?((g-b)/df)%6:mx===g?(b-r)/df+2:(r-g)/df+4;h=((h*60)+360)%360;
    const w=s*s*(1-Math.abs(l-.5));const bi=(h/10)|0;const B=bins[bi];B.w+=w;B.s+=s*w;B.n++;tot+=w}
  if(tot<4)return {h:265,s:.18,cands:[{h:265,s:.18}]};
  const sm=bins.map((b,i)=>b.w+(bins[(i+35)%36].w+bins[(i+1)%36].w)*.5);
  const order=sm.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]),cands=[];
  for(const [v,i] of order){if(v<tot*.04)break;const h=i*10+5;if(cands.every(c=>Math.min(Math.abs(c.h-h),360-Math.abs(c.h-h))>38)){const b=bins[i];cands.push({h,s:clamp(b.w?b.s/b.w:.7,.5,1)});if(cands.length>=4)break}}
  return {h:cands[0].h,s:cands[0].s,cands}
}
function recolor(sp,cv,pal,gamma){
  const {w,h,lum,al}=sp;if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  const x=cv.getContext("2d"),id=x.createImageData(w,h),o=id.data,D=pal.D,M=pal.M,L=pal.L;
  for(let i=0;i<w*h;i++){let t=(lum[i]-.12)/.83;t=t<0?0:t>1?1:t;t=Math.pow(t,gamma);let a,b,u;
    if(t<.5){a=D;b=M;u=t*2}else{a=M;b=L;u=(t-.5)*2}
    const j=i*4;o[j]=a[0]+(b[0]-a[0])*u;o[j+1]=a[1]+(b[1]-a[1])*u;o[j+2]=a[2]+(b[2]-a[2])*u;o[j+3]=al[i]}
  x.putImageData(id,0,0)}

const COVERS={

     if(py<0&&Math.hypot(rx,ry)<r)continue;R(x,py<0?"#ff9ad8":"#ffd0f0",(cx+rx)|0,(cy+ry)|0,1,1)}
   R(x,"#ff7bc0",0,52,64,12);for(let i=0;i<9;i++){const w=8+(i*7%9);R(x,"#ffd0e6",i*8-3,50+(i%3),w,4);R(x,"#ff9ac8",i*8-1,54+(i%2),w+2,3)}

   const rn=seedRand(3);for(let i=0;i<30;i++)R(x,"#8dff6a",rn()*64|0,rn()*64|0,1,1);

const COVER_SRC={};
const coverSrc=k=>COVER_SRC[k]||(COVER_SRC[k]=COVERS[k]());

/* ============ cover cache ============ */
const CCACHE=new Map();
function resolveCover(ref){
  if(CCACHE.has(ref))return CCACHE.get(ref);
  const src=ref.startsWith("b:")?coverSrc(ref.slice(2)):ref;
  const p=new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
    x.imageSmoothingEnabled=!ref.startsWith("b:");const s=Math.max(256/im.width,256/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(256-w)/2,(256-h)/2,w,h);
    res({canvas:c,dom:dominant(c)})};im.onerror=()=>{const c=document.createElement("canvas");c.width=c.height=256;res({canvas:c,dom:{h:265,s:.2,cands:[{h:265,s:.2}]}})};im.src=src});
  CCACHE.set(ref,p);return p}
async function fileToCover(file){
  const url=URL.createObjectURL(file);
  try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");const s=Math.max(256/im.width,256/im.height),w=im.width*s,h=im.height*s;
    x.fillStyle="#111";x.fillRect(0,0,256,256);x.drawImage(im,(256-w)/2,(256-h)/2,w,h);return c.toDataURL("image/jpeg",.86)}finally{URL.revokeObjectURL(url)}}

/* homography: unit-rect (w,h) -> quad TL,TR,BR,BL */
function quadCSS(w,h,q){const [x0,y0,x1,y1,x2,y2,x3,y3]=q.flat();
  const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3,den=dx1*dy2-dx2*dy1;
  const g=(dx3*dy2-dx2*dy3)/den,hh=(dx1*dy3-dx3*dy1)/den,a=x1-x0+g*x1,b=x3-x0+hh*x3,d=y1-y0+g*y1,e=y3-y0+hh*y3;
  return `matrix3d(${a/w},${d/w},0,${g/w},${b/h},${e/h},0,${hh/h},0,0,1,0,${x0},${y0},0,1)`}

/* ============ sound ============ */
let AC;function beep(f,d=.08,type="square",v=.05,at=0){if(!SET.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+at;
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}

];
const GENRES=["Arcade","Music","Shooter","Puzzle","Adventure","Racing","Sport","Photo"];
let DATA=store.get("am.cards.v1",null)||DEFAULTS.map(d=>({...d}));
function persist(){if(!store.set("am.cards.v1",DATA))toast("Storage is full — new covers won't be saved")}

/* ============ list / tabs / dock ============ */
const TABS=[["pad","Home",()=>true],["grid","Games",c=>c.genre!=="Music"],["music","Music",c=>c.genre==="Music"],["image","Mine",c=>!c.built],["gear","Settings",null]];
const DOCK=[["bag","Store",()=>true],["star","Top rated",c=>c.rating>=5],["dl","Installed",c=>c.played>0],["user","Profile",null]];
let tab=0,view=0;const listEl=$("#list");let LIVE=[];
$("#tabs").innerHTML=TABS.map((t,i)=>`<div class="tabcell"><button class="tab" role="tab" aria-selected="${i===tab}" aria-label="${t[1]}" data-i="${i}">${IC[t[0]]}</button><i class="notch"></i></div>`).join("");
$("#dock").innerHTML=DOCK.map((t,i)=>`<button aria-label="${t[1]}" aria-current="${i===view}" data-i="${i}">${IC[t[0]]}</button>`).join("");
$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;const i=+b.dataset.i;sfx.tap();
  if(TABS[i][2]===null){openSettings();return}tab=i;view=0;sync();render()});
$("#dock").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i;sfx.tap();
  if(DOCK[i][2]===null){openSettings();return}view=i;tab=0;sync();render();scrollTo({top:0,behavior:RM?"auto":"smooth"})});
function sync(){document.querySelectorAll(".tab").forEach((b,i)=>b.setAttribute("aria-selected",i===tab&&view===0));
  document.querySelectorAll("#dock button").forEach((b,i)=>b.setAttribute("aria-current",i===view))}

function emptyMsg(){return view===1?"No 5-star picks yet. Tap the stars on a card to rate it.":view===2?"Nothing installed yet. Press play on a card to install it.":""}
async function render(intro){
  LIVE.forEach(c=>c.destroy());LIVE=[];listEl.innerHTML="";
  const f=view>0?DOCK[view][2]:TABS[tab][2];
  const rows=DATA.filter(f);
  if(!rows.length&&emptyMsg()){const p=document.createElement("p");p.className="empty";p.textContent=emptyMsg();listEl.append(p)}
  rows.forEach((m,i)=>{const box=document.createElement("div");box.className="cardbox enter";box.style.setProperty("--i",(i*.09)+"s");listEl.append(box);
    const c=new Card(box,m,{onPlay:launch,onEdit:c=>openEditor(c.m.id),onRate:(c,n)=>{const d=DATA.find(x=>x.id===c.m.id);d.rating=n;persist();c.set({...d})},
      onDropCover:(c,url)=>{const d=DATA.find(x=>x.id===c.m.id);d.cover=url;d.tint=null;persist();c.set({...d})}});
    c.mid=m.id;LIVE.push(c);c.set({...m},{intro:true,delay:250+i*140})});
  if(view===0)addCard();
}
function addCard(){
  const box=document.createElement("div");box.className="cardbox enter";box.style.setProperty("--i","0.45s");listEl.append(box);
  const el=document.createElement("article");el.className="card add";el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-label","Add your own cover");
  const A=SPR.case_e,B=SPR.case_f;
  el.innerHTML=`<div class="stage">
    <div class="shell"><div class="shell-in"></div></div>
    <div class="slot case" style="left:60px;top:${116-A.h/2}px;width:${A.w}px;height:${A.h}px"><div class="bob" style="--bd:-1s"><canvas></canvas></div></div>
    <div class="slot case" style="left:${60+A.w-34}px;top:${112-B.h/2}px;width:${B.w}px;height:${B.h}px"><div class="bob" style="--bd:-3s"><canvas></canvas></div></div>
    <div class="hint">Add yours<small>Pick a cover and an item. The card takes its colours.</small></div>
    <span class="play" style="--c1:#a56bff">${IC.plus}</span></div>`;
  box.append(el);box.style.setProperty("--k",box.clientWidth/905);
  const pal=palette(268,.5);recolor(A,el.querySelectorAll("canvas")[0],pal,1.9);recolor(B,el.querySelectorAll("canvas")[1],pal,1.9);
  el.addEventListener("click",()=>openEditor(null));el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openEditor(null)}});
  el.addEventListener("dragover",e=>e.preventDefault());el.addEventListener("drop",async e=>{e.preventDefault();const f=[...e.dataTransfer.files].find(f=>f.type.startsWith("image/"));if(f){openEditor(null,await fileToCover(f))}})}
addEventListener("resize",()=>{bgResize();LIVE.forEach(c=>c.resize());document.querySelectorAll(".card.add").forEach(el=>el.parentElement.style.setProperty("--k",el.parentElement.clientWidth/905));PV&&PV.resize()});

async function launch(c){
  const d=DATA.find(x=>x.id===c.m.id);if(d){d.played=(d.played||0)+1;persist()}
  toast("Loading "+(c.m.title||"app"),true);sfx.in();
  await c.slide(true);await wait(1100);sfx.play();toast("Ready · "+(c.m.title||"app"));await c.slide(false)}

/* ============ sheet ============ */
const sheet=$("#sheet"),panel=$("#panel");let PV=null,lastFocus=null,onKey=null;
function openSheet(html){lastFocus=document.activeElement;panel.innerHTML=html;sheet.classList.add("open");sheet.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";
  onKey=e=>{if(e.key==="Escape")closeSheet()};addEventListener("keydown",onKey);setTimeout(()=>panel.querySelector("input,button,select")?.focus({preventScroll:true}),60)}
function closeSheet(){sheet.classList.remove("open");sheet.setAttribute("aria-hidden","true");document.body.style.overflow="";removeEventListener("keydown",onKey);
  if(PV){PV.destroy();PV=null}lastFocus&&lastFocus.focus&&lastFocus.focus({preventScroll:true});removeEventListener("paste",onPaste)}
sheet.addEventListener("click",e=>{if(e.target.closest("[data-close]"))closeSheet()});
let onPaste=null;

function openSettings(){
  const rows=[["shader","Animated card shader"],["stars","Starfield"],["scan","Scanlines"],["sound","Sound effects"]];
  openSheet(`<div class="ph"><h2 id="sheetTitle">Settings</h2><button class="x" data-close aria-label="Close">${IC.x}</button></div>
   ${rows.map(([k,l])=>`<button class="toggle" role="switch" aria-checked="${SET[k]}" data-k="${k}"><span>${l}</span><i></i></button>`).join("")}
   <div class="row" style="margin-top:18px"><button class="btn ghost" id="reset">Reset cards</button><button class="btn" data-close>Done</button></div>`);
  panel.querySelectorAll(".toggle").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.k;SET[k]=!SET[k];b.setAttribute("aria-checked",SET[k]);saveSet();
    document.body.classList.toggle("scan",SET.scan);if(k==="sound")sfx.tap();if(k==="shader"){closeSheet();render()}}));
  $("#reset").addEventListener("click",()=>{DATA=DEFAULTS.map(d=>({...d}));persist();closeSheet();tab=0;view=0;sync();render();toast("Cards reset")})}

function openEditor(id,preCover){
  const existing=id?DATA.find(d=>d.id===id):null;
  const draft=existing?{...existing}:{id:"u"+Date.now().toString(36),title:"",genre:"Arcade",rating:4,item:"cassette",cover:preCover||"b:retro",tint:null,built:0};
  if(!existing&&!preCover)draft.cover="b:space";
  let cands=[];
  openSheet(`<div class="ph"><h2 id="sheetTitle">${existing?"Edit card":"New card"}</h2><button class="x" data-close aria-label="Close">${IC.x}</button></div>
   <div class="pv" id="pv"></div>
   <label class="fld"><span class="lbl">Cover</span><label class="drop" id="drop"><input type="file" accept="image/*" hidden id="file"><span><b>Choose an image</b> or drop one here</span><span>You can also paste from the clipboard</span></label></label>
   <div class="fld"><span class="lbl">Item</span><div class="chips" role="radiogroup" aria-label="Item" id="chips">${Object.entries(ITEMS).map(([k,v])=>`<button class="chip" role="radio" aria-checked="${k===draft.item}" data-k="${k}">${v.label}</button>`).join("")}</div></div>
   <div class="two"><label class="fld"><span class="lbl">Name</span><input class="in" id="name" maxlength="14" placeholder="My game" value="${(draft.title||"").replace(/"/g,"&quot;")}"></label>
   <label class="fld"><span class="lbl">Genre</span><select class="in" id="genre">${GENRES.map(g=>`<option${g===draft.genre?" selected":""}>${g}</option>`).join("")}</select></label></div>
   <div class="fld"><span class="lbl">Colour</span><div class="sw" id="sw"></div></div>
   <div class="row">${existing?`<button class="btn ghost danger" id="del">Delete</button>`:""}<button class="btn" id="save">${existing?"Save":"Add to market"}</button></div>`);
  const pv=$("#pv");PV=new Card(pv,draft,{preview:true});PV.set({...draft},{});
  pv.style.setProperty("--k",pv.clientWidth/905);
  const upd=()=>PV.set({...draft});
  const drawSw=async()=>{const info=await resolveCover(draft.cover);cands=info.dom.cands||[];
    const sw=$("#sw");sw.innerHTML=`<button class="auto" aria-pressed="${!draft.tint}" data-auto>Auto</button>`+cands.map((c,i)=>{const col=rgb(palette(c.h,c.s).A);const on=draft.tint&&Math.abs(draft.tint.h-c.h)<2;return `<button style="--c:${col}" aria-pressed="${!!on}" data-i="${i}" aria-label="Colour ${i+1}"></button>`}).join("")+
      `<label class="pick" aria-label="Custom colour"><input type="color" id="cc" value="#a56bff"></label>`;
    sw.querySelector("[data-auto]").onclick=()=>{draft.tint=null;upd();drawSw()};
    sw.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{const c=cands[+b.dataset.i];draft.tint={h:c.h,s:c.s};upd();drawSw()});
    sw.querySelector("#cc").oninput=e=>{const v=e.target.value,r=parseInt(v.slice(1,3),16)/255,g=parseInt(v.slice(3,5),16)/255,b=parseInt(v.slice(5,7),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;
      let h=d===0?265:mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360;const s=d===0?.2:d/(1-Math.abs(2*l-1));draft.tint={h,s:clamp(s,.3,1)};upd()}};
  drawSw();
  const setFile=async f=>{if(!f||!f.type.startsWith("image/"))return;draft.cover=await fileToCover(f);draft.tint=null;upd();drawSw();sfx.tap()};
  $("#file").onchange=e=>setFile(e.target.files[0]);
  const drop=$("#drop");["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove("over")));drop.addEventListener("drop",e=>{e.preventDefault();setFile(e.dataTransfer.files[0])});
  onPaste=e=>{const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith("image/"));if(f)setFile(f)};addEventListener("paste",onPaste);
  $("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;draft.item=b.dataset.k;$("#chips").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-checked",x===b));upd()});
  $("#name").addEventListener("input",e=>{draft.title=e.target.value;PV.r.title.textContent=draft.title||"Untitled";PV.m.title=draft.title});
  $("#genre").addEventListener("change",e=>{draft.genre=e.target.value;PV.r.pill.textContent=draft.genre;PV.m.genre=draft.genre});
  $("#save").addEventListener("click",()=>{draft.title=(draft.title||"").trim()||"Untitled";sfx.play();
    if(existing)Object.assign(existing,draft);else DATA.push(draft);persist();closeSheet();
    if(!existing||view>0||tab===1&&draft.genre==="Music"){tab=0;view=0;sync()}render();if(!existing)setTimeout(()=>scrollTo({top:document.body.scrollHeight,behavior:RM?"auto":"smooth"}),200);toast(existing?"Saved":"Added to the market")});
  $("#del")&&$("#del").addEventListener("click",()=>{DATA=DATA.filter(d=>d.id!==draft.id);persist();closeSheet();render();toast("Deleted")})}

/* ============ boot ============ */
(async()=>{
  document.body.classList.toggle("scan",SET.scan);bgResize();
  await Promise.all([loadSprites(),document.fonts?document.fonts.ready:0]);
  try{await document.fonts.load('600 36px "Pixelify Sans"')}catch(e){}
  sync();await render(true);
  $("#boot").classList.add("done");setTimeout(()=>$("#boot").remove(),800);
  requestAnimationFrame(frame);
})();
})();
</script>
</body>
</html>
