:root{
  --bg0:#07040f; --bg1:#0e0820; --ink:#f4ecff; --dim:#9b86d6; --line:#3a2a70; --acc:#a56bff; --acc2:#5b2fd0;
  --font:"Tektur","Pixelify Sans",ui-monospace,"Courier New",monospace;
  --k:.5; --col:min(100vw - 24px, 500px);
  /* Telegram mini app: its own insets (fullscreen header buttons) + system insets, one extra gap inside Telegram */
  --tgt:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
  --top:max(env(safe-area-inset-top,0px),var(--tgt));
  --bot:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
}
html.tg{--top:calc(max(env(safe-area-inset-top,0px),var(--tgt)) + 12px)}
*{box-sizing:border-box;margin:0}
html{font-synthesis:none;background:var(--bg0);color-scheme:dark;-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  padding:var(--top) 0 0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
svg{display:block}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated}
body.scan::after{content:"";position:fixed;inset:0;z-index:90;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.0) 0 2px,rgba(0,0,0,.10) 2px 3px)}

html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.app{position:relative;z-index:1;width:var(--col);margin:0 auto;padding:6px 0 140px}

/* ---------- header ---------- */
.top{position:relative;height:clamp(126px,33vw,155px);margin-bottom:6px}
/* games window (Store): header with logo + pigeon shrunk by 40%, centered; the freed height is pulled back with a negative margin */
body:not(.onhome) .top{--ts:.6;transform:scale(var(--ts));transform-origin:50% 0;margin-bottom:calc(6px - clamp(126px,33vw,155px)*(1 - var(--ts)))}
.swoosh{position:absolute;left:-4%;top:-6%;width:78%;height:100%;overflow:visible;pointer-events:none}
.swoosh ellipse{fill:none;stroke:url(#swg);stroke-width:5;stroke-linecap:round;stroke-dasharray:640 260;stroke-dashoffset:640;
  animation:draw 1.6s .15s cubic-bezier(.2,.7,.2,1) forwards;filter:drop-shadow(0 0 8px #a56bff99)}
@keyframes draw{to{stroke-dashoffset:0}}
.logo{font-family:"Pixelify Sans",ui-monospace,monospace;position:absolute;left:3%;top:13%;z-index:1;font-weight:700;font-size:clamp(30px,10.4vw,51px);line-height:.86;letter-spacing:-.02em;
  transform:skewX(-9deg);transform-origin:left bottom;color:#fff7ee;text-transform:none;
  text-shadow:2px 2px 0 #a56bff,4px 4px 0 #6a35e0,6px 6px 0 #2d1475,0 0 26px #8a4dff88}
.logo span{display:block}
/* the font's c is almost an o (1-pixel gap), so the first letter is a vector c with a real opening; same face + extruded shadows as the text */
.lc{display:inline-block;width:.603em;height:.478em;margin-right:-.02em;vertical-align:-.011em;overflow:visible;fill:currentColor;
  filter:drop-shadow(2px 2px 0 #a56bff) drop-shadow(2px 2px 0 #6a35e0) drop-shadow(2px 2px 0 #2d1475) drop-shadow(0 0 13px #8a4dff88)}
.logo span+span{margin-left:.3em;font-size:.88em}
/* mascot: Coopix the pigeon (+ optional planet behind it) */
.mascot{position:absolute;right:0;top:6px;width:clamp(102px,30vw,152px);z-index:2;cursor:pointer;-webkit-user-select:none;user-select:none;
  animation:pgin .95s cubic-bezier(.2,1.3,.4,1) .3s both}
@keyframes pgin{0%{opacity:0;transform:translateY(-60px) scale(.8) rotate(-8deg)}60%{opacity:1}100%{opacity:1;transform:none}}
.mjump{transform-origin:50% 100%}
.mwrap{position:relative;transform-origin:50% 100%;animation:pghop 2.4s ease-in-out infinite;filter:drop-shadow(0 0 14px #7c3aed88)}
@keyframes pghop{0%,100%{transform:translateY(0) scale(1.015,.985) rotate(0)}38%{transform:translateY(-7px) scale(.99,1.012) rotate(-1.4deg)}68%{transform:translateY(-2px) scale(1,1) rotate(1deg)}}
.pgn{display:block;width:100%;height:auto;-webkit-user-drag:none}
.pshadow{position:absolute;left:28%;width:46%;bottom:-3%;height:7%;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);animation:pgsh 2.4s ease-in-out infinite}
@keyframes pgsh{0%,100%{transform:scale(1.05);opacity:.9}38%{transform:scale(.8);opacity:.55}68%{transform:scale(.95);opacity:.75}}
/* visor glint sweeps across the goggles */
.glint{position:absolute;left:45.7%;top:7.6%;width:18.2%;height:8.3%;overflow:hidden;pointer-events:none;mix-blend-mode:screen;
  clip-path:polygon(1% 17%,95% 0%,100% 50%,74% 83%,27% 100%,0% 54%)}
.glint::before{content:"";position:absolute;top:-30%;bottom:-30%;width:32%;left:0;transform:translateX(-160%) skewX(-24deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);animation:pgglint 4.2s ease-in-out 1.6s infinite}
@keyframes pgglint{0%{transform:translateX(-160%) skewX(-24deg)}30%,100%{transform:translateX(420%) skewX(-24deg)}}
/* the bag screen: glow pulse + blinking smiley */
.sglow{position:absolute;left:58.6%;top:59%;width:16.6%;height:14.2%;pointer-events:none;border-radius:6%;mix-blend-mode:screen;
  box-shadow:0 0 12px 2px rgba(63,230,255,.55),inset 0 0 10px rgba(63,230,255,.25);animation:pgsg 2.4s ease-in-out infinite}
@keyframes pgsg{0%,100%{opacity:.25}50%{opacity:.9}}
.pgeyes{position:absolute;left:64.6%;top:64.3%;width:6.7%;height:2.1%;pointer-events:none;background:#2a2a56;opacity:0;animation:pgblink 3.9s steps(1) 1s infinite}
.pgeyes::before,.pgeyes::after{content:"";position:absolute;top:44%;height:14%;width:27%;background:#43a8b5}
.pgeyes::before{left:0}.pgeyes::after{right:0}
@keyframes pgblink{0%,92%,100%{opacity:0}93%,96%{opacity:1}}
/* the planet, when it sits behind the pigeon */
.planet{position:absolute;right:-6%;top:-6%;width:52%;height:auto;image-rendering:pixelated;animation:float 7s ease-in-out infinite;filter:drop-shadow(0 0 22px #7c3aedcc)}
@keyframes float{50%{transform:translateY(7px) rotate(-1.5deg)}}
/* tap confetti */
.cf{position:absolute;left:50%;top:46%;width:7px;height:7px;background:var(--c);pointer-events:none;z-index:3;animation:cfly .85s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cfly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.spark{position:absolute;width:var(--s,18px);height:var(--s,18px);color:#ffcf5a;animation:tw 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.spark svg{width:100%;height:100%;fill:currentColor}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.05) rotate(20deg)}}

/* ---------- tabs ---------- */
.tabs{display:grid;grid-template-columns:1.18fr repeat(4,1fr);gap:7px;margin:4px 0 12px;position:relative}
.tabcell{position:relative}
.tab{position:relative;display:grid;place-items:center;width:100%;height:clamp(50px,13.6vw,64px);
  --cut:#150d33;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
  background:linear-gradient(160deg,#5a3fb8,#2a1a66);color:#8366d6;transition:color .2s,transform .12s}
.tab::before{content:"";position:absolute;inset:2px;background:linear-gradient(#1b1141,#120a2c);
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);transition:background .25s}
.tab svg{position:relative;width:46%;max-width:30px;height:auto}
.tab:active{transform:scale(.96)}
.tab[aria-selected=true]{color:#1a0d40;--cut:#b996ff;background:linear-gradient(160deg,#d6bcff,#8a52f5)}
.tab[aria-selected=true]::before{background:linear-gradient(#bf9bff,#8d57f7)}
.tab:hover:not([aria-selected=true]){color:#b79cff}
.notch{position:absolute;left:50%;bottom:-9px;width:18px;height:11px;margin-left:-9px;background:#8d57f7;
  clip-path:polygon(0 0,100% 0,50% 100%);transform:scaleY(0);transform-origin:top;transition:transform .2s}
.tab[aria-selected=true]+.notch{transform:scaleY(1)}

/* ---------- cards ---------- */
.sbar{--cut:#150d33;position:relative;display:flex;align-items:center;height:clamp(48px,12.4vw,58px);margin:0 0 16px;color:#8366d6;transition:filter .2s,color .2s;
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
  background:linear-gradient(160deg,#5a3fb8,#2a1a66)}
.sbar::before{content:"";position:absolute;inset:2px;background:linear-gradient(#1b1141,#120a2c);
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.sbar:focus-within{color:#d6bcff;background:linear-gradient(160deg,#d6bcff,#8a52f5);filter:drop-shadow(0 0 10px rgba(165,107,255,.55))}
.sbar svg{position:relative;flex:none;width:24px;height:24px;fill:currentColor}
.sbar .si{display:grid;place-items:center;width:52px;height:100%;position:relative}
.sbar input{position:relative;flex:1;min-width:0;height:100%;padding:0;font:inherit;font-size:21px;letter-spacing:.03em;color:#fff;background:none;border:0;outline:0;border-radius:0;-webkit-appearance:none;appearance:none}
.sbar input::placeholder{color:#6f58bf;opacity:1}
.sbar input::-webkit-search-cancel-button,.sbar input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.sbar .sx{position:relative;display:grid;place-items:center;width:48px;height:100%;color:#b79cff}
.sbar .sx[hidden]{display:none}.sbar .sx svg{width:18px;height:18px}.sbar .sx:hover{color:#fff}
.list{display:flex;flex-direction:column;gap:clamp(10px,3vw,16px)}
.cardbox{width:100%;position:relative}
.card{--c1:#a56bff;--c2:#2b1170;--c3:#efe3ff;--glow:rgba(165,107,255,.35);
  position:relative;width:100%;height:calc(220px*var(--k));isolation:isolate;
  transition:transform .25s cubic-bezier(.2,.8,.2,1);-webkit-user-select:none;user-select:none}
.card:hover{transform:translateY(-2px)}
.card::before{content:"";position:absolute;inset:3px;z-index:-1;pointer-events:none;border-radius:calc(30px*var(--k));box-shadow:0 0 calc(28px*var(--k) + 10px) calc(3px*var(--k)) var(--glow)}
.card.drag::before{box-shadow:0 0 26px 6px #fff}
.stage{position:absolute;left:0;top:0;width:905px;height:220px;transform:scale(var(--k));transform-origin:0 0}
.shell{position:absolute;inset:0;background:linear-gradient(120deg,var(--c1),var(--c2) 55%,var(--c1));
  clip-path:polygon(26px 0,calc(100% - 26px) 0,100% 26px,100% calc(100% - 26px),calc(100% - 26px) 100%,26px 100%,0 calc(100% - 26px),0 26px)}
.shell-in{position:absolute;inset:4px;background:#0b0716;overflow:hidden;
  clip-path:polygon(23px 0,calc(100% - 23px) 0,100% 23px,100% calc(100% - 23px),calc(100% - 23px) 100%,23px 100%,0 calc(100% - 23px),0 23px)}
.shell-in::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 140% at 8% 60%,color-mix(in srgb,var(--c1) 38%,transparent),transparent 62%),
  linear-gradient(100deg,color-mix(in srgb,var(--c2) 70%,#0b0716),#0b0716 70%)}
.fx{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated}
.shell-in::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent 52%,rgba(7,4,15,.78) 100%),linear-gradient(180deg,rgba(255,255,255,.08),transparent 22%,transparent 80%,rgba(0,0,0,.35))}
.stripes{position:absolute;right:20px;top:14px;display:flex;gap:11px;transform:skewX(-34deg);pointer-events:none}
.stripes b{width:14px;height:26px;background:var(--c1);opacity:.9}
.stripes b:nth-child(2){opacity:.65}.stripes b:nth-child(3){opacity:.4}

.slot{position:absolute}
.slot>canvas,.slot .bob>canvas{filter:drop-shadow(0 0 1px color-mix(in srgb,var(--c3) 80%,transparent)) drop-shadow(0 0 9px color-mix(in srgb,var(--c1) 60%,transparent)) drop-shadow(0 7px 7px rgba(0,0,0,.55))}
@property --sw{syntax:"<length>";inherits:true;initial-value:-300px}
@keyframes sweep{0%{--sw:-300px}55%,100%{--sw:1250px}}
.stage{animation:sweep 6.5s linear infinite}
.halo{position:absolute;top:0;width:560px;height:220px;pointer-events:none;mix-blend-mode:screen;opacity:.55;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--c1) 60%,transparent),transparent);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.95;transform:scale(1.06)}}
.floor{position:absolute;height:30px;pointer-events:none;border-radius:50%;filter:blur(3px);opacity:.8;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--c1) 55%,#000),transparent)}
.beam{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.2;
  background:linear-gradient(90deg,transparent calc(var(--sw) - 160px),var(--c3) var(--sw),transparent calc(var(--sw) + 160px))}
.gl{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;
  background:linear-gradient(90deg,transparent calc(var(--sw) - var(--gx,0px) - 60px),rgba(255,255,255,.7) calc(var(--sw) - var(--gx,0px)),transparent calc(var(--sw) - var(--gx,0px) + 60px)) 0 0/905px 100% no-repeat}
.pt{position:absolute;left:0;top:0;width:905px;height:220px;z-index:3;pointer-events:none;image-rendering:pixelated}
.slot canvas{display:block;width:100%;height:100%}
.slot.item{z-index:1}.slot.case{z-index:2}
.hv{width:100%;height:100%;transition:transform .45s cubic-bezier(.2,.9,.2,1)}
.card:hover .hv,.cardbox:focus-within .hv{transform:translateX(var(--hx,0px))}
.bob{width:100%;height:100%;position:relative;animation:bob 5s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes bob{50%{translate:0 -4px}}
.shine{position:absolute;inset:0;mix-blend-mode:color-dodge;opacity:0;pointer-events:none;
  -webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;
  background:conic-gradient(from var(--a),#ff6bd5,#ffd36b,#6bffb0,#6bc7ff,#a56bff,#ff6bd5);}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.item.cd .shine{opacity:.5}

.cover{position:absolute;left:0;top:0;width:256px;height:256px;transform-origin:0 0;overflow:hidden;background:#111}
.cover canvas{position:absolute;inset:0;width:100%;height:100%}
.cover canvas.b{clip-path:inset(0 100% 0 0)}
.cover::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.42) 0,rgba(255,255,255,.08) 28%,transparent 46%,rgba(0,0,0,.28) 100%);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.4)}

.info{position:absolute;left:478px;top:0;width:236px;height:100%}
.title{position:absolute;left:0;top:44px;width:100%;font-weight:600;font-size:36px;line-height:44px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-transform:uppercase;color:#fff4ee;text-shadow:0 3px 0 rgba(0,0,0,.45)}
.stars{position:absolute;left:0;top:102px;display:flex;gap:4px}
.stars button{width:38px;height:38px;display:grid;place-items:center;transition:transform .12s}
.stars button:hover{transform:scale(1.18) rotate(-6deg)}
.stars svg{width:34px;height:34px;shape-rendering:crispEdges}
.pill{position:absolute;left:0;top:158px;height:38px;padding:0 22px;display:flex;align-items:center;font-weight:500;font-size:22px;white-space:nowrap;
  color:var(--c3);background:color-mix(in srgb,var(--c2) 78%,#000);border:2px solid var(--c1);border-radius:19px}
.play{position:absolute;left:728px;top:82px;width:154px;height:104px;z-index:5;
  clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px),0 22px);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 70%,#fff),var(--c1) 45%,color-mix(in srgb,var(--c1) 70%,#000));
  display:grid;place-items:center;transition:transform .12s,filter .2s}
.play::before{content:"";position:absolute;inset:4px;clip-path:inherit;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 82%,#fff),var(--c1) 70%)}
.play svg{position:relative;width:58px;height:58px;fill:#140a28;margin-left:6px}
.play:hover{filter:brightness(1.12)}
.play:active{transform:translateY(5px) scale(.97)}
.edit{position:absolute;left:12px;top:8px;z-index:6;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;
  background:rgba(8,4,18,.8);color:var(--c3);border:2px solid var(--c1);opacity:0;transform:scale(.8);transition:.2s}

.card.add .shell{background:repeating-linear-gradient(135deg,#4b3a94 0 12px,transparent 12px 20px)}

/* intro */

/* ---------- dock ---------- */
.dock{position:fixed;z-index:20;left:50%;bottom:calc(10px + var(--bot));transform:translateX(-50%);width:var(--col);height:clamp(58px,15vw,74px);
  background:linear-gradient(160deg,#6a4cc8,#2a1a66);
  clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px)}
.dock-in{position:absolute;inset:3px;display:grid;grid-template-columns:repeat(4,1fr);background:linear-gradient(#1a1040,#110a2a);
  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px)}
.dock button{position:relative;display:grid;place-items:center;color:#7a5fcf;transition:color .2s}
.dock button+button::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:#33236a}

.dock button[aria-current=true]::after{content:"";position:absolute;left:14%;right:14%;bottom:5px;height:4px;border-radius:2px;background:#b98bff;box-shadow:0 0 12px 2px #a56bff}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;visibility:hidden}

.scrim{position:absolute;inset:0;background:rgba(5,2,12,.72);backdrop-filter:blur(4px);opacity:0;transition:opacity .25s}

.panel{position:relative;width:min(100vw,540px);max-height:calc(100vh - var(--top) - 8px);max-height:calc(100dvh - var(--top) - 8px);display:flex;flex-direction:column;overflow:hidden;padding:0;
  background:linear-gradient(#1a1040,#0f0826);border-top:4px solid var(--acc);

/* dropdown (context) menu button + popup */
.sel{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:50px;padding:0 14px;font-size:21px;color:#fff;text-align:left;background:#120a2a;border:3px solid var(--line);transition:border-color .15s}
.sel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel::after{content:"";flex:none;width:8px;height:8px;margin:-4px 3px 0 0;border-right:3px solid var(--acc);border-bottom:3px solid var(--acc);transform:rotate(45deg);transition:transform .15s}

.menu button:hover,.menu button:focus-visible{background:#2a1a66;outline-offset:-3px}
.menu button[aria-checked=true]{background:#2a1a66;color:#fff}
.menu button[aria-checked=true]::before{background:var(--acc);border-color:#fff}
/* tags */
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:50px;padding:6px 8px;background:#120a2a;border:3px solid var(--line);cursor:text;transition:border-color .15s}

.tagbox input{flex:1 1 90px;min-width:80px;height:34px;padding:0 4px;font:inherit;font-size:20px;color:#fff;background:none;border:0;outline:none}

.tchip{display:inline-flex;align-items:center;gap:2px;height:34px;padding:0 3px 0 12px;font-size:18px;color:#fff;background:#2a1a66;border:2px solid var(--line);border-radius:17px}

.tchip button{width:26px;height:26px;display:grid;place-items:center;color:var(--dim)}
.tchip button:hover{color:#ff5c7a}.tchip svg{width:11px;height:11px;fill:currentColor}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sugg[hidden]{display:none}
.sg{height:32px;padding:0 12px;font-size:17px;color:var(--dim);border:2px dashed var(--line);border-radius:16px}
.sg:hover,.sg:active{color:#fff;border-color:var(--acc)}
.sg.new{color:#fff;border-style:solid;border-color:var(--acc)}
.fld{display:block;margin:0 0 14px}
.lbl{display:block;font-size:17px;color:var(--dim);margin-bottom:7px}
.drop{display:grid;place-items:center;gap:4px;text-align:center;padding:16px;border:3px dashed var(--line);background:#120a2a;color:var(--dim);font-size:19px;cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:var(--acc);color:#fff;background:#1a1040}
.drop b{color:#fff;font-weight:600}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{height:50px;border:3px solid var(--line);background:#120a2a;color:var(--dim);font-size:16px;padding:0 2px;transition:.15s}
.chip[aria-checked=true]{border-color:var(--acc);background:#2a1a66;color:#fff}
.chip:hover{color:#fff}
.in{width:100%;height:50px;padding:0 14px;font:inherit;font-size:21px;color:#fff;background:#120a2a;border:3px solid var(--line);border-radius:0;outline:none}
.in:focus{border-color:var(--acc)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#a56bff 50%),linear-gradient(135deg,#a56bff 50%,transparent 50%);background-position:calc(100% - 22px) 22px,calc(100% - 16px) 22px;background-size:6px 6px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button,.sw label{width:42px;height:42px;border:3px solid var(--line);background:var(--c,#444);position:relative;cursor:pointer}
.sw button[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.sw .auto{width:auto;padding:0 14px;background:#120a2a;color:var(--dim);font-size:18px}
.sw .auto[aria-pressed=true]{color:#fff}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.sw .pick{background:conic-gradient(#f55,#fd5,#5f9,#5cf,#a6f,#f5c,#f55)}
.row{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;height:54px;font-size:22px;font-weight:600;text-transform:uppercase;color:#140a28;background:linear-gradient(#cfb0ff,#9a63ff);
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);transition:.12s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(3px)}
.cm-more{display:flex;width:100%;height:46px;margin:14px 0 0;font-size:18px;align-items:center;justify-content:center}.cm-more[hidden]{display:none}
.btn.ghost{flex:0 0 auto;padding:0 20px;background:#2a1a66;color:#e5d6ff}
.btn.danger{background:#ff5c7a;color:#2a0510}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 4px;font-size:21px;border-bottom:2px solid #2a1a66;text-align:left}
.toggle i{width:54px;height:28px;background:#2a1a66;position:relative;flex:none;transition:.2s}
.toggle i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;background:#9b86d6;transition:.2s}
.toggle[aria-checked=true] i{background:var(--acc)}
.toggle[aria-checked=true] i::after{left:29px;background:#fff}

/* ---------- toast ---------- */
.toast{position:fixed;z-index:80;left:50%;top:calc(14px + var(--top));transform:translate(-50%,-220%);visibility:hidden;min-width:200px;max-width:92vw;padding:12px 22px 14px;text-align:center;font-size:20px;
  background:#1a1040;border:3px solid var(--acc);color:#fff;transition:transform .35s cubic-bezier(.2,1.2,.3,1);
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast .bar{display:block;margin-top:8px;height:8px;background:#2a1a66;position:relative;overflow:hidden}
.toast .bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--acc) 0 8px,transparent 8px 10px);transform:translateX(-100%)}
.toast.load .bar::after{animation:load 1.1s steps(12) forwards}
@keyframes load{to{transform:none}}

.boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg0);font-size:22px;color:var(--dim);transition:opacity .5s .1s}
.boot.done{opacity:0;pointer-events:none}
.boot>div{text-align:center}
.boot .lite{display:block;margin:22px auto 0;height:46px;padding:0 20px;border:3px solid var(--line);background:#120a2a;color:#fff;font-size:18px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
.boot .lite:active{transform:translateY(2px)}.boot .lite:disabled{opacity:.5;cursor:default}
.boot .lite-h{margin-top:8px;font-size:14px;opacity:.7}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .swoosh ellipse{stroke-dashoffset:0}
}

/* CD: rainbow diffraction sheen */
.item.cd .shine{opacity:.85;mix-blend-mode:color;animation:cdsheen 5.5s ease-in-out infinite alternate;
  background:conic-gradient(from var(--a),#0000 0deg,#ff4fb8 18deg,#ffd23f 42deg,#4dff9a 66deg,#3fc4ff 90deg,#8a5cff 114deg,#0000 140deg,#0000 180deg,#ff4fb8 198deg,#ffd23f 222deg,#4dff9a 246deg,#3fc4ff 270deg,#8a5cff 294deg,#0000 320deg,#0000 360deg)}
.card:hover .item.cd .shine{animation-duration:2.2s;opacity:1}
/* the disc itself really spins (cover wedges + hub, see Card.cdMake); the rainbow glint stays put and sweeps across it */
@keyframes cdsheen{from{--a:-55deg}to{--a:65deg}}
@keyframes cdwob{0%,100%{rotate:-2.2deg}50%{rotate:2.2deg}}
.cdw{position:absolute;display:none;pointer-events:none;mix-blend-mode:multiply}
.item.cd .cdw{display:block}
.cdw canvas{display:block;width:100%;height:100%;will-change:transform}
.item.cd .bob{isolation:isolate;animation:bob 5s ease-in-out infinite,cdwob 7s ease-in-out infinite;animation-delay:var(--bd,0s),var(--bd,0s)}
/* handheld: noisy screen */
.noise{position:absolute;inset:0;display:none;pointer-events:none;mix-blend-mode:overlay;overflow:hidden;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),var(--nz) 0 0/96px 96px;image-rendering:pixelated;animation:nz .45s steps(1) infinite}
.noise::after{content:"";position:absolute;left:0;top:0;right:0;height:30%;background:linear-gradient(transparent,rgba(255,255,255,.35),transparent);animation:roll 3.2s linear infinite}
.item.hh .noise{display:block}
@keyframes nz{0%{background-position:0 0,0 0}20%{background-position:0 0,-34px 18px}40%{background-position:0 0,22px -40px}60%{background-position:0 0,-12px -22px}80%{background-position:0 0,40px 30px}}
@keyframes roll{from{transform:translateY(-120%)}to{transform:translateY(340%)}}

/* ---------- app page ---------- */
.card{cursor:pointer}
textarea.in{height:auto;min-height:92px;padding:10px 14px;resize:vertical;line-height:1.25}
.page{--c1:#a56bff;--c2:#2b1170;--c3:#efe3ff;position:fixed;top:0;left:0;right:0;bottom:0;-webkit-overflow-scrolling:touch;z-index:30;overflow-y:auto;overscroll-behavior:contain;visibility:hidden;opacity:0;transform:translateY(28px);
  transition:transform .35s cubic-bezier(.2,.9,.2,1),opacity .15s,visibility 0s .35s;
  background:radial-gradient(90% 38% at 50% 0,color-mix(in srgb,var(--c1) 28%,transparent),transparent 70%),linear-gradient(#0c0720,#07040f);background-color:#09051a}
.page.open{visibility:visible;opacity:1;transform:none;transition-delay:0s}
.pg{width:var(--col);margin:0 auto;padding:var(--top) 0 calc(130px + var(--bot))}

.back{width:48px;height:48px;display:grid;place-items:center;color:var(--c3)}
.back svg{width:26px;height:26px;fill:currentColor}.back:hover{color:#fff}
.beta{font-size:16px;letter-spacing:.08em;padding:4px 14px;color:#140a28;background:var(--c1);clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.pg-hero{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;margin:2px 0 6px}

.pg-stars{display:flex;gap:2px}.pg-stars svg{width:20px;height:20px}

/* TV */
.tvw{position:relative;margin:18px 0 0;padding-top:40px}
.tvw::before{content:"";position:absolute;left:8px;right:8px;top:48px;bottom:6px;border-radius:26px;box-shadow:0 0 30px 4px color-mix(in srgb,var(--c1) 40%,transparent)}
.ant{position:absolute;left:50%;top:0;width:0;height:44px;pointer-events:none}
.ant::before,.ant::after{content:"";position:absolute;bottom:0;left:-2px;width:4px;height:48px;background:linear-gradient(var(--c3),var(--c1));transform-origin:bottom}
.ant::before{transform:rotate(-30deg)}.ant::after{transform:rotate(26deg)}
.tv{position:relative;padding:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--c1) 62%,#2a2038),color-mix(in srgb,var(--c2) 85%,#000));
  clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px),0 22px)}
.tv-row{display:grid;grid-template-columns:1fr 44px;gap:12px;align-items:start}
.scr{position:relative;height:0;padding-bottom:75%;background:#05030a;border-radius:18px/16px;overflow:hidden;cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;
  box-shadow:inset 0 0 0 3px #0a0612,0 0 0 3px rgba(0,0,0,.55)}

/* hiss: TV is showing snow while the game loads; it powers on when ready */
.scr.hiss canvas.g{opacity:0}
html .tv .scr.hiss::before{display:block;opacity:.9;mix-blend-mode:normal;animation:nz1 .12s steps(1) infinite}

.scr.hiss .ov{z-index:5;place-items:center;padding:0}
.scr.hiss .ov span{display:inline-block;padding:3px 10px;background:rgba(5,3,10,.78)}
html[data-q="0"] .scr.hiss .tvn{animation:nz .2s steps(1) infinite}
.scr canvas.g{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;filter:saturate(1.15) contrast(1.06);animation:tvg 5s steps(1) infinite}
.scr.pon canvas.g{animation:pon .6s ease-out,tvg 5s .6s steps(1) infinite}
@keyframes tvg{0%,91%,100%{transform:none}92%{transform:translateX(3px) skewX(-1.5deg)}94%{transform:translateX(-4px)}96%{transform:translateX(1px) skewX(1deg)}}
@keyframes pon{0%{transform:scale(.55,.01);filter:brightness(6)}55%{transform:scale(1,.06);filter:brightness(4)}100%{transform:none}}
.tvn{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:overlay;opacity:.95;overflow:hidden;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px),var(--nz) 0 0/96px 96px;image-rendering:pixelated;animation:nz .45s steps(1) infinite;transition:opacity .2s}
.tvn::after{content:"";position:absolute;left:0;top:0;right:0;height:30%;background:linear-gradient(transparent,rgba(255,255,255,.3),transparent);animation:roll 3.2s linear infinite}
.scr::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen;opacity:.13;background:var(--nz) 0 0/64px 64px;image-rendering:pixelated;animation:nz1 .3s steps(1) infinite}
@keyframes nz1{0%{background-position:0 0}25%{background-position:-34px 18px}50%{background-position:22px -40px}75%{background-position:40px 30px}}
.scr::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(120% 100% at 50% 45%,transparent 52%,rgba(0,0,0,.6)),linear-gradient(115deg,rgba(255,255,255,.13),transparent 28%)}
.tv.clean .tvn{opacity:.3}.tv.clean .scr::before{opacity:.04}
.scr.burst .tvn{opacity:1;animation-duration:.08s}.scr.burst::before{opacity:.7}
.ov{position:absolute;inset:0;z-index:2;display:grid;place-items:end center;padding:0 8px 7%;text-align:center;font-weight:600;text-transform:uppercase;color:#fff;text-shadow:0 0 10px var(--c1),2px 2px 0 var(--c2)}
.ov.end{place-items:center;padding:0;background:rgba(5,3,10,.62)}
.ov b{display:block;font-size:clamp(20px,6.4vw,32px);line-height:1;margin-bottom:6px;overflow-wrap:anywhere}
.ov span{display:block;font-size:clamp(15px,4.4vw,21px)}
.ov small{display:block;margin-top:4px;font-size:13px;color:var(--c3);opacity:.8}
.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.scr.playing .ov{display:none}
.rec,.chn{position:absolute;top:8px;z-index:3;font-size:14px;color:#fff;pointer-events:none;text-shadow:0 0 6px #000}
.rec{left:12px}.rec::first-letter{color:#ff4d4d}.chn{right:12px;color:var(--c3)}
.ctl{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px}
.knob{width:38px;height:38px;border-radius:50%;position:relative;background:conic-gradient(#e6e6e6,#7a7a7a,#e6e6e6,#7a7a7a,#e6e6e6);border:3px solid rgba(0,0,0,.5);box-shadow:inset 0 0 0 5px #2c2c34;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.knob::after{content:"";position:absolute;left:50%;top:2px;width:3px;height:11px;margin-left:-1.5px;background:#ff6b6b}
.tv.clean .knob{transform:rotate(-85deg)}
.lab{font-size:12px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.05em}
.spk{width:28px;height:50px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.55) 0 3px,transparent 3px 7px);margin-top:6px}
.led{width:10px;height:10px;border-radius:50%;background:#5a2020;transition:.2s}.led.on{background:#5dff8a;box-shadow:0 0 9px #5dff8a}
.pg-au{font-size:16px;color:var(--dim)}.pg-au b{font-weight:600;color:#e5d9ff}
.chg{margin-top:12px;padding:6px 10px 7px;background:#120a2a;border:2px solid var(--line);border-left:5px solid var(--c1,#a56bff)}
.chg-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.chg ul{margin:3px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.25;color:#e5d9ff;max-height:5.1em;overflow-y:auto}
.chg li::before{content:"+ ";color:var(--c1,#a56bff)}
.hint2{margin-top:14px;text-align:center;font-size:16px;color:var(--dim)}

/* sections */
.sec{margin-top:24px}
.sec h3{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#fff}
.sec h3 small{font-size:18px;color:var(--dim);font-weight:400}
.sec h3::after{content:"";flex:1;height:3px;background:repeating-linear-gradient(90deg,var(--c1) 0 6px,transparent 6px 9px);opacity:.55}
.desc{font-size:21px;line-height:1.35;color:#e5d9ff;white-space:pre-line;overflow-wrap:anywhere}.desc.dim{color:var(--dim)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{height:32px;padding:0 14px;display:flex;align-items:center;font-size:17px;border:2px solid var(--c1);color:var(--c3);border-radius:16px;background:color-mix(in srgb,var(--c2) 60%,#000)}
.cm{content-visibility:auto;contain-intrinsic-size:auto 92px;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0;border-bottom:2px solid #2a1a66}
.av{width:40px;height:40px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:22px;color:#140a28;background:var(--hc);
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
.cm-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:19px}.cm-h b{font-weight:600;color:#fff}
.cm-h time{margin-left:auto;font-size:16px;color:var(--dim)}
.cm-s{display:flex}.cm-s svg{width:15px;height:15px}
.cm p{margin-top:4px;font-size:20px;line-height:1.3;color:#e5d9ff;white-space:pre-line;overflow-wrap:anywhere}
.del{margin-top:4px;font-size:15px;color:var(--dim);text-decoration:underline}.del:hover{color:#ff5c7a}
.cm-more.cm-all{margin:0 0 8px}
.cm .pf-av.cm-av{width:44px;height:44px;padding:2px;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.cm .pf-av.cm-av i{clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
.cmx-top{display:flex;gap:16px;align-items:center;margin:4px 0 14px}
.cmx-avg{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:92px}.cmx-avg b{font-size:50px;line-height:1;font-weight:700;color:#fff}.cmx-avg small{font-size:16px;color:var(--dim)}
.cmx-bars{flex:1;display:grid;gap:3px;min-width:0}
.cmx-b{display:grid;grid-template-columns:14px 1fr 30px;align-items:center;gap:8px;height:32px;padding:0 6px;border:2px solid transparent;color:var(--dim);font-size:16px;text-align:left}
.cmx-b i{display:block;height:10px;background:#120a2a;border:2px solid var(--line)}.cmx-b u{display:block;height:100%;background:#ffc83d}
.cmx-b em{font-style:normal;text-align:right}.cmx-b:hover{color:#fff}
.cmx-b[aria-pressed=true]{border-color:var(--acc);background:#2a1a66;color:#fff}
.cmx-f{display:grid;gap:8px}.cmx-r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmx .sel{font-size:18px;padding:0 10px}.cmx .chip{font-size:18px}.cmx input[type=search]{-webkit-appearance:none;appearance:none}
.cmx-n{margin:10px 0 0;font-size:16px;color:var(--dim)}
.wr{margin-top:18px;padding:14px;background:#120a2a;border:3px solid var(--line)}
.wr .in,.wr textarea{margin-top:10px}
.spick{display:flex;gap:2px;margin-top:6px}.spick button{width:38px;height:38px;display:grid;place-items:center}.spick svg{width:30px;height:30px}
.wr .row{align-items:center}.cnt{flex:1;font-size:16px;color:var(--dim)}.wr .btn{flex:0 0 150px;height:48px}

/* play bar */
.pfade{position:fixed;left:0;right:0;bottom:0;height:120px;pointer-events:none;background:linear-gradient(transparent,#07040f 72%)}
.pbar{position:fixed;z-index:2;left:50%;bottom:calc(10px + var(--bot));transform:translateX(-50%);width:var(--col);filter:drop-shadow(0 0 14px color-mix(in srgb,var(--c1) 55%,transparent))}
.bigplay{width:100%;height:64px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#140a28;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 65%,#fff),var(--c1) 50%,color-mix(in srgb,var(--c1) 70%,#000));
  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px);transition:transform .12s,filter .2s}
.pbar{display:flex;gap:10px}.pbar .bigplay{flex:1 1 0;width:auto;min-width:0;height:54px;font-size:21px;gap:8px;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}
.pbar .bigplay svg{width:22px;height:22px}
.pbar .dlbtn,.pbar .dlbtn:hover{background:#2a1a66;color:#e5d6ff}.pbar .dlbtn svg{fill:#e5d6ff}
.bigplay svg{width:26px;height:26px;fill:#140a28}.bigplay:hover{filter:brightness(1.1)}.bigplay:active{transform:translateY(4px)}

/* ---------- quality tiers (data-q: 2 high, 1 mid, 0 low) ---------- */
.card.off .stage,.card.off .bob,.card.off .halo,.card.off .shine,.card.off .noise,.card.off .noise::after{animation-play-state:paused}
body.pgopen .app,body.pgopen .dock{visibility:hidden}
body.pgopen .mascot,body.pgopen .mascot *{animation-play-state:paused}
[data-q="1"] .stage,[data-q="0"] .stage{animation:none}
[data-q="1"] .beam,[data-q="0"] .beam,[data-q="1"] .gl,[data-q="0"] .gl{display:none}
[data-q="1"] .halo,[data-q="0"] .halo{animation:none;mix-blend-mode:normal;opacity:.5}
[data-q="1"] .noise,[data-q="0"] .noise{mix-blend-mode:normal;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px),var(--nza) 0 0/96px 96px}
[data-q="1"] .scrim,[data-q="0"] .scrim{backdrop-filter:none;background:rgba(5,2,12,.86)}
[data-q="1"] .tvn,[data-q="0"] .tvn{mix-blend-mode:normal;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px),var(--nza) 0 0/96px 96px}
[data-q="1"] .scr::before,[data-q="0"] .scr::before{display:none}
[data-q="1"] .scr canvas.g,[data-q="0"] .scr canvas.g{filter:none}
[data-q="0"] .noise,[data-q="0"] .item.cd .shine,[data-q="0"] .bob,[data-q="0"] .spark,[data-q="0"] .planet{animation:none}
[data-q="0"] .noise::after,[data-q="0"] .tvn::after{display:none}
[data-q="0"] .tvn{animation-duration:.9s}
[data-q="0"] .planet{filter:none}
[data-q="0"] .slot>canvas,[data-q="0"] .slot .bob>canvas{filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}

/* ---------- fallbacks for browsers without color-mix() / inset ---------- */
.ov,.tvn,.scr::before,.scr::after,.scr canvas.g,.fx,.beam,.gl,.noise,.shine,.cover::after,.shell,.shell-in,.shell-in::before,.shell-in::after,.scrim,.sheet{top:0;left:0;right:0;bottom:0}
@supports not (background:color-mix(in srgb,red,blue)){
 .page{background-image:linear-gradient(#0c0720,#07040f)}
 .pill,.tag{background:var(--c2)}
 .play,.bigplay{background:var(--c1)}.gow .bigplay{background:none}.play::before{background:var(--c1)}
 .halo{background:radial-gradient(closest-side,var(--c1),transparent);opacity:.35}
 .floor{background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent)}
 .shell-in::before{background:linear-gradient(100deg,var(--c2),#0b0716 70%)}
 .tv{background:linear-gradient(160deg,var(--c1),var(--c2))}
 .tvw::before{box-shadow:0 0 30px 4px var(--glow)}
 .pg-cov{box-shadow:0 0 18px var(--glow)}
 .pbar{filter:none}
 .slot>canvas,.slot .bob>canvas{filter:drop-shadow(0 7px 7px rgba(0,0,0,.55))}
}
[data-q="0"] body.scan::after{display:none}
/* lite mode (Q=0, picked by Auto on weak phones or by hand): no extra visuals, only flat static art */
[data-q="0"] .stripes,[data-q="0"] .halo,[data-q="0"] .shine,[data-q="0"] .gl,[data-q="0"] .beam,[data-q="0"] .pt,[data-q="0"] .noise,[data-q="0"] .spark{display:none}
[data-q="0"] .floor{filter:none;opacity:.5}
[data-q="0"] .card::before,[data-q="0"] .tvw::before{box-shadow:none}
[data-q="0"] .pbar{filter:none}
[data-q="0"] .slot>canvas,[data-q="0"] .slot .bob>canvas,[data-q="0"] .add .slot>canvas,[data-q="0"] .add .slot .bob>canvas{filter:none}
[data-q="0"] .card:hover{transform:none}
[data-q="0"] .planet{display:none}
[data-q="0"] .mascot,[data-q="0"] .mwrap,[data-q="0"] .pshadow{animation:none}[data-q="0"] .mwrap{filter:none}[data-q="0"] .glint,[data-q="0"] .sglow,[data-q="0"] .pgeyes,[data-q="0"] .pshadow{display:none}
html[data-q="0"] .tvn{background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);animation:none;opacity:.7}
html[data-q="0"] .scr canvas.g,html[data-q="0"] .scr.pon canvas.g{animation:none}
html[data-q="0"] .scr::after{background:none}
html[data-q="0"] .tv.clean .tvn{opacity:.2}
html[data-q="0"] .scr.burst .tvn{animation:none}

/* ---------- home: title screen (one screen, no scrolling) ---------- */
:root{--vh:100vh}
@supports (height:100dvh){:root{--vh:100dvh}}
body.onhome .app{padding-bottom:calc(clamp(58px,15vw,74px) + 20px + var(--bot))}
/* на широком и невысоком экране (десктопный Telegram: ~466x735) размеры шапки и заголовка считаются и от высоты, иначе кнопки уезжают под нижнюю панель */
:root{--hh:clamp(104px,min(33vw,17.5vh),155px)}
body.onhome .top{margin-bottom:4px;height:var(--hh)}
body.onhome .mascot{width:clamp(86px,min(30vw,15vh),152px)}
body.onhome .tabs,body.onhome .list,body.onhome .sbar{display:none}
.home{--c1:#a56bff;--c2:#2b1170;--c3:#efe3ff;display:none}
body.onhome .home{display:flex;flex-direction:column;gap:12px;
  min-height:calc(var(--vh) - var(--top) - 6px - var(--hh) - 4px - clamp(58px,15vw,74px) - 20px - var(--bot))}
.home .enter{animation:enter .5s cubic-bezier(.2,.9,.2,1) both;animation-delay:var(--i,0s)}
.ts{position:relative;isolation:isolate;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.9vh,18px);text-align:center}
.ts::before{content:"";position:absolute;z-index:-1;left:-12%;right:-12%;top:2%;bottom:2%;pointer-events:none;background:radial-gradient(closest-side,rgba(138,77,255,.32),transparent)}
.shelf{position:relative;display:flex;justify-content:center;align-items:flex-end;height:clamp(58px,min(12.5vh,21vw),106px);margin-bottom:4px}
.gad{position:relative;z-index:1;height:100%;margin:0 -3%;transform:rotate(var(--r,0deg))}
.gad:nth-child(odd){margin-bottom:8px;height:92%}
.gad .bob{display:block}
.gad canvas{display:block;height:100%;width:auto;filter:drop-shadow(0 0 9px var(--g)) drop-shadow(0 7px 7px rgba(0,0,0,.55))}
.shelf .floor{left:6%;right:6%;bottom:-6px;background:radial-gradient(closest-side,rgba(165,107,255,.55),transparent)}
.hero-t{font-size:clamp(22px,7.4vw,36px);font-weight:700;line-height:1.08;text-transform:uppercase;letter-spacing:.02em;color:#fff7ee;overflow-wrap:anywhere;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.hero-t em{display:block;margin-top:5px;font-style:normal;color:#d6bcff;text-shadow:2px 2px 0 #6a35e0,4px 4px 0 #2d1475,0 0 22px #8a4dff88}
.ts .tags{justify-content:center;margin:0;gap:6px}
.ts .tag{height:28px;padding:0 11px;font-size:15px}
.gow{width:100%;margin-top:2px;filter:drop-shadow(0 0 12px rgba(165,107,255,.55))}
.gow .bigplay{height:clamp(54px,8vh,64px);font-size:clamp(20px,6vw,26px);font-weight:700;animation:goglow 2.6s ease-in-out infinite;
  /* no block behind the label: plain glowing text + pixel chevron */
  background:none;clip-path:none;color:#fff7ee;gap:10px;text-shadow:2px 2px 0 #6a35e0,4px 4px 0 #2d1475,0 0 22px #8a4dff88}
.gow .bigplay::after{content:"";width:.5em;height:.5em;border:solid #d6bcff;border-width:.16em .16em 0 0;transform:rotate(45deg);margin-left:-.1em;animation:gonudge 1.3s steps(4) infinite}
@keyframes gonudge{50%{transform:translateX(4px) rotate(45deg)}}
[data-q="0"] .gow .bigplay::after{animation:none}
@keyframes goglow{50%{filter:brightness(1.14)}}
.ts .spark{z-index:0}
.pn{flex:none;display:flex;flex-direction:column;gap:8px}
.home .sec{margin-top:0}
.home .sec h3{margin-bottom:6px;font-size:16px;font-weight:400;letter-spacing:.08em;color:var(--dim)}
.home .sec h3 small{font-size:14px}
/* news slider */
.ns{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.ns::-webkit-scrollbar{display:none}
.ns-i{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always}
.nw{--nc:#a56bff;position:relative;padding:2px;background:linear-gradient(160deg,#5a3fb8,#2a1a66);
  background:linear-gradient(160deg,color-mix(in srgb,var(--nc) 75%,#2a1a66),#2a1a66);
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);transition:transform .12s,filter .2s}
.nw-in{position:relative;padding:10px 14px 12px 22px;background:linear-gradient(#1b1141,#120a2c);
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}
.nw-in::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--nc)}
.nw[role=button]{cursor:pointer}
.nw[role=button]:hover{filter:brightness(1.12)}.nw[role=button]:active{transform:scale(.985)}
.nw-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.nw-tag{padding:2px 12px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#140a28;background:var(--nc);clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.nw-h time{margin-left:auto;font-size:15px;color:var(--dim)}
.nw-h svg{width:12px;height:12px;fill:var(--nc)}
.nw h4{font-size:21px;font-weight:700;line-height:1.1;text-transform:uppercase;color:#fff4ee;text-shadow:0 2px 0 rgba(0,0,0,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nw p{margin-top:4px;font-size:16px;line-height:1.25;color:#e5d9ff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ns .nw-in{padding:7px 12px 8px 19px}
.ns .nw-in::before{width:6px}
.ns .nw-h{gap:8px;margin-bottom:3px}
.ns .nw-tag{padding:1px 10px;font-size:12px}
.ns .nw-h time{font-size:13px}
.ns .nw h4{font-size:17px;line-height:1.1}
.ns .nw p{margin-top:2px;font-size:14px;line-height:1.2;-webkit-line-clamp:2}
.lnks .lbtn{height:48px}
.dots{display:flex;justify-content:center;gap:4px;margin-top:0}
.dots button{width:26px;height:14px;background:linear-gradient(#3a2a70,#3a2a70) center/100% 6px no-repeat;transition:background-color .2s}
.dots button[aria-current=true]{background:linear-gradient(#b98bff,#b98bff) center/100% 6px no-repeat}
/* home tweaks: logo -20% (header height unchanged), hero title -10%, news card slightly larger */
body.onhome .logo{font-size:clamp(22px,min(8.32vw,4.6vh),40.8px)}
/* средний блок главной (гаджеты + заголовок + кнопка) -10%, освободившееся место отдано новостям: в карточке влезает 3 строки текста */
.ts{zoom:.9}
.ns .nw p{-webkit-line-clamp:3}
.ts .hero-t{font-size:clamp(18px,min(6.66vw,4vh),32.4px)}
.ns .nw-in{padding:9px 14px 10px 21px}
.ns .nw h4{font-size:19px}
.ns .nw p{font-size:15.5px;margin-top:3px}
.ns .nw-tag{font-size:13px}
.ns .nw-h time{font-size:14px}
/* sponsors */
.sprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px}
.sprow::-webkit-scrollbar{display:none}
.spc{--nc:#a56bff;flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 5px;font-size:17px;text-transform:uppercase;color:#fff;text-decoration:none;white-space:nowrap;background:#120a2a;border:2px solid var(--nc);border-radius:20px;transition:transform .12s,filter .2s}
.spc:hover{filter:brightness(1.15)}.spc:active{transform:scale(.96)}
.spc i{display:grid;place-items:center;width:28px;height:28px;font-style:normal;font-size:18px;color:#140a28;background:var(--nc);clip-path:polygon(5px 0,calc(100% - 5px) 0,100% 5px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px),0 5px)}
.spc.me{border-style:dashed;border-color:var(--line);color:var(--dim)}
.spc.me i{background:#2a1a66;color:#e5d6ff}
/* link buttons */
.lnks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbtn{--lc:#a56bff;position:relative;display:flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 8px;text-decoration:none;
  font-size:clamp(19px,5.6vw,24px);text-transform:uppercase;letter-spacing:.03em;color:#140a28;background:var(--lc);
  background:linear-gradient(180deg,color-mix(in srgb,var(--lc) 65%,#fff),var(--lc) 50%,color-mix(in srgb,var(--lc) 70%,#000));
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);transition:transform .12s,filter .2s}
.lbtn svg{flex:none;width:24px;height:24px;fill:#140a28}
.lbtn:hover{filter:brightness(1.1)}.lbtn:active{transform:translateY(4px)}
.lw{filter:drop-shadow(0 0 12px rgba(165,107,255,.45))}
.lw.pk{filter:drop-shadow(0 0 12px rgba(255,94,196,.45))}
/* short phones: drop extras instead of scrolling */
@media(max-height:760px){.ts .tags{display:none}.nw p{-webkit-line-clamp:1}.ns .nw p{-webkit-line-clamp:3}.pn{gap:6px}.lbtn,.lnks .lbtn{height:46px}}
@media(max-height:650px){.shelf{height:52px}}

/* ============ графики капитализации ============ */
/* ВНИМАНИЕ: цифры демонстрационные. Настоящие значения подставьте в CAP ниже (now = текущая капитализация, ресурс/цена считаются от активности) */
const CAP={cur:"₽",now:184500,res:"COOP",rate:"1 игра = 5 COOP · 1 отзыв = 20 COOP"};
const PER=[["24ч",24,3,.012,.0015,36e5],["7д",28,5,.03,.004,6*36e5],["30д",30,7,.06,.012,864e5],["Всё",40,9,.12,.045,7*864e5]];
const rng=seed=>()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;
const nf=n=>Math.round(n).toLocaleString("ru-RU");
const cf=n=>n>=1e6?(n/1e6).toFixed(1).replace(".",",")+"M":n>=1e3?(n/1e3).toFixed(n>=1e5?0:1).replace(".",",")+"К":Math.round(n)+"";
const lbl=(i,n,step)=>{const d=new Date(Date.now()-(n-1-i)*step),p=x=>String(x).padStart(2,"0");return step<=36e5?p(d.getHours())+":00":p(d.getDate())+"."+p(d.getMonth()+1)};
function mkMoney(pi){const [,n,seed,vol,tr,step]=PER[pi],r=rng(seed*7+3);let v=[1];for(let i=1;i<n;i++)v.push(Math.max(.15,v[i-1]*(1+(r()-.45)*vol+tr)));const k=CAP.now/v[n-1];
  return v.map((x,i)=>({v:x*k,t:lbl(i,n,step)}))}
function mkAct(pi){const [,n,seed,vol,tr,step]=PER[pi],r=rng(seed*13+5),per=Math.max(1,step/864e5),base=Math.max(6,Math.round(120*Math.pow(per,.55)));
  let res=CAP.now/1.8*Math.pow(.62,Math.max(0,PER[3][1]-n)/20),out=[];
  for(let i=0;i<n;i++){const a=Math.round(base*(.55+r()*.9)*(1+i/n*.5));res+=a*5+Math.round(a*.08)*20;const price=1.1+i/n*.4+a/(base*3)*.2;out.push({a,res,cap:res*price,t:lbl(i,n,step)})}
  const k=CAP.now*1.35/out[n-1].cap;out.forEach(o=>o.cap*=k);return out}
const HM=210,HA=304,CW=340;
/* реальные данные: CAP.series={money:[[{v,t}…] на каждый период],act:[[{a,res,cap,t}…]]}; без series показываются демо-данные */
const getMoney=pi=>CAP.series?((CAP.series.money||[])[pi]||[]):mkMoney(pi);
const getAct=pi=>CAP.series?((CAP.series.act||[])[pi]||[]):mkAct(pi);
const GOALS=[100,500,1e3,2500,5e3,1e4,25e3,5e4,1e5,25e4,5e5,1e6,5e6,1e7];
/* формат малых чисел: <10 с десятыми, <1000 целые, дальше К/M */

const fx=v=>Math.abs(v)>=10||Number.isInteger(v)?nf(v):v.toFixed(1).replace(".",",");
/* «красивая» шкала: шаги 1/2/2.5/5·10^k, для растущих с нуля данных всегда от нуля */
function nscale(lo,hi,k){const r=(hi-lo)||1,raw=r/k,e=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/e,st=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;return{lo:Math.floor(lo/st+1e-9)*st,hi:Math.ceil(hi/st-1e-9)*st,st}}
function scaleOf(vals){const mn=Math.min(...vals),mx=Math.max(...vals);
  if(mx<=0)return nscale(0,8,4);
  if(mn>=0&&mn<mx*.6)return nscale(0,mx*1.12,4);
  const pad=(mx-mn||mx)*.14;return nscale(Math.max(0,mn-pad),mx+pad,4)}

/* плавная монотонная кривая (без «перелётов» между точками) */
function curve(xs,ys){const n=xs.length,f=v=>v.toFixed(1);if(n<3)return xs.map((x,i)=>(i?"L":"M")+f(x)+" "+f(ys[i])).join("");
  const d=[],m=[];for(let i=0;i<n-1;i++)d[i]=(ys[i+1]-ys[i])/(xs[i+1]-xs[i]);m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=m[i+1]=0;continue}const a=m[i]/d[i],b=m[i+1]/d[i],q=a*a+b*b;if(q>9){const t=3/Math.sqrt(q);m[i]=t*a*d[i];m[i+1]=t*b*d[i]}}

const chPer=()=>`<div class="chc-p" data-p>${PER.map((p,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===1}">${p[0]}</button>`).join("")}</div>`;

    const it=[...el.children],i=it.indexOf(document.activeElement);it[(i+(k==="ArrowDown"?1:-1)+it.length)%it.length].focus()});

const KP=p=>({D:rgb(p.D),M:rgb(p.M),L:rgb(p.L),A:rgb(p.A),B:rgb(p.B)});
/*GAMES*/
const GAMES={
 arcade(inp,p){const C=KP(p),W=160,H=120;let px=80,bx=80,by=88,vx=46,vy=-62,bk=[],g;
  const fill=()=>{bk=[];for(let r=0;r<4;r++)for(let c=0;c<8;c++)bk.push({x:6+c*18,y:14+r*8,r})};fill();
  return g={score:0,over:false,
   step(dt){px=clamp(inp.x*W,14,W-14);bx+=vx*dt;by+=vy*dt;
    if(bx<2||bx>W-2){vx=-vx;bx=clamp(bx,2,W-2);tone(300)}
    if(by<2){vy=Math.abs(vy);by=2}
    if(vy>0&&by>H-12&&by<H-7&&Math.abs(bx-px)<16){vy=-Math.abs(vy);vx=clamp((bx-px)*5,-90,90);tone(440)}
    for(let i=0;i<bk.length;i++){const b=bk[i];if(bx>b.x&&bx<b.x+16&&by>b.y&&by<b.y+6){bk.splice(i,1);vy=-vy;g.score+=10;tone(600+b.r*80);break}}
    if(!bk.length){fill();vy=-Math.min(130,Math.abs(vy)*1.12);vx*=1.1;by=88}
    if(by>H+4)g.over=true},
   draw(x){R(x,C.D,0,0,W,H);bk.forEach(b=>{R(x,[C.A,C.L,C.M,C.A][b.r],b.x,b.y,16,6);R(x,C.D,b.x,b.y+5,16,1)});
    R(x,C.L,px-14,H-8,28,4);R(x,C.A,px-14,H-8,28,1);R(x,C.L,bx-1,by-1,3,3)}}},
 music(inp,p){const C=KP(p),W=160,H=120,LY=H-20,NT=[262,330,392,523],KM={L:0,D:1,U:2,R:3};let ns=[],sp=.5,fl=[0,0,0,0],ms=0,g;
  return g={score:0,over:false,
   step(dt){sp-=dt;if(sp<=0){ns.push({l:Math.random()*4|0,y:-6});sp=Math.max(.28,.7-g.score*.0008)+Math.random()*.25}
    const v=46+Math.min(50,g.score*.12);
    for(let i=ns.length-1;i>=0;i--){const n=ns[i];n.y+=v*dt;if(n.y>H-4){ns.splice(i,1);ms++;tone(110,.15,1);if(ms>=5)g.over=true}}
    for(const e of inp.q){const l=e.t==="dn"?clamp(e.x*4|0,0,3):e.t==="k"?KM[e.k]:undefined;if(l==null)continue;fl[l]=.18;
     const i=ns.findIndex(n=>n.l===l&&Math.abs(n.y-LY)<12);if(i>=0){ns.splice(i,1);g.score+=10;tone(NT[l]*2,.14,1)}else tone(NT[l],.1,1)}
    for(let i=0;i<4;i++)fl[i]=Math.max(0,fl[i]-dt)},
   draw(x){R(x,C.D,0,0,W,H);for(let i=0;i<4;i++)R(x,i%2?C.B:C.D,i*40,0,40,H);R(x,C.M,0,LY,W,1);
    ns.forEach(n=>{R(x,C.L,n.l*40+6,n.y-3,28,6);R(x,C.A,n.l*40+6,n.y-3,28,2)});
    for(let i=0;i<4;i++){R(x,fl[i]>0?C.L:C.M,i*40+3,H-14,34,10);R(x,C.A,i*40+3,H-14,34,2)}
    for(let i=0;i<5;i++)R(x,i<5-ms?C.L:C.B,W-8-i*6,4,4,4)}}},
 shooter(inp,p){const C=KP(p),W=160,H=120;let bl=[],en=[],fi=0,sp=.6,px=80,g;
  return g={score:0,over:false,
   step(dt){px=clamp(inp.x*W,6,W-6);fi-=dt;if(fi<=0){bl.push({x:px,y:H-14});fi=.2;tone(700,.03)}
    sp-=dt;if(sp<=0){en.push({x:8+Math.random()*(W-16),y:-6,ph:Math.random()*6});sp=Math.max(.28,.85-g.score*.0035)}

    for(const e of en){e.y+=v*dt;e.x+=Math.sin(e.ph+e.y*.09)*18*dt}
    for(let i=en.length-1;i>=0;i--){const e=en[i],j=bl.findIndex(b=>Math.abs(b.x-e.x)<6&&Math.abs(b.y-e.y)<6);
     if(j>=0){bl.splice(j,1);en.splice(i,1);g.score+=10;tone(200,.06);continue}

    <p class="cmx-n" id="cmxCnt" aria-live="polite"></p><div id="cmxList"></div><button class="btn ghost cm-more" id="cmxMore" type="button" hidden></button></div>`);
  const sum=()=>{const L=A(),rated=L.filter(c=>c.r),avg=rated.length?rated.reduce((t,c)=>t+c.r,0)/rated.length:0,cnt=[0,0,0,0,0,0];rated.forEach(c=>cnt[c.r]++);
    $("#cmxSum").innerHTML=`<div class="cmx-top"><div class="cmx-avg"><b>${avg?avg.toFixed(1).replace(".",","):"–"}</b><span class="cm-s">${starRow(Math.round(avg))}</span><small>${L.length} ${plr(L.length,["отзыв","отзыва","отзывов"])}</small></div>
     <div class="cmx-bars">${[5,4,3,2,1].map(n=>`<button type="button" class="cmx-b" data-s="${n}" aria-pressed="${X.stars===n}" aria-label="Оценка ${n}: ${cnt[n]}"><span>${n}</span><i><u style="width:${rated.length?cnt[n]/rated.length*100:0}%"></u></i><em>${cnt[n]}</em></button>`).join("")}</div></div>`};
  const list=()=>{const L=A(),now=Date.now(),per=CMX_PER.find(x=>x[0]===X.per)[2],qs=X.q.trim().toLowerCase();
    const r=L.map((c,i)=>({c,i})).filter(({c})=>(!X.stars||c.r===X.stars)&&(!per||now-c.d<=per)&&(!X.mine||c.me)&&(!qs||(c.n+" "+c.t).toLowerCase().includes(qs)));
    const so=X.sort;r.sort((p,o)=>so==="old"?p.c.d-o.c.d:so==="hi"?(o.c.r-p.c.r)||(o.c.d-p.c.d):so==="lo"?((p.c.r||9)-(o.c.r||9))||(o.c.d-p.c.d):o.c.d-p.c.d);
    const shown=r.slice(0,X.n),left=r.length-shown.length;
    $("#cmxCnt").textContent=L.length?"Найдено "+r.length+" из "+L.length:"";
    const mb=$("#cmxMore");mb.hidden=left<=0;mb.textContent="Показать ещё "+Math.min(20,left)+" · осталось "+left;
    $("#cmxList").innerHTML=r.length?shown.map(({c,i})=>`<article class="cm">${cmAv(c)}<div><div class="cm-h"><b>${esc(c.n)}</b>${c.r?`<span class="cm-s">${starRow(c.r)}</span>`:""}<time>${ago(c.d)}</time></div><p>${esc(c.t)}</p>${c.me?`<button class="del" data-del="${i}">Удалить</button>`:""}</div></article>`).join("")
     :`<p class="empty" style="margin-top:12px">${L.length?"Ничего не найдено. Измените фильтры или нажмите «Сбросить».":"Отзывов пока нет."}</p>`};
  const all=()=>{sum();list()};all();
  const reset=()=>{Object.assign(X,{stars:0,sort:"new",per:"all",q:"",mine:false,n:20});$("#cmxQ").value="";$("#cmxSort").firstElementChild.textContent=CMX_SORT[0][1];$("#cmxPer").firstElementChild.textContent=CMX_PER[0][1];$("#cmxMine").setAttribute("aria-checked","false");all()};
  const set=(k,v)=>{X[k]=v;X.n=20;all()};
  panel.querySelector(".cmx-bars").addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(!b)return;sfx.tap();set("stars",X.stars===+b.dataset.s?0:+b.dataset.s)});
  let T;$("#cmxQ").addEventListener("input",e=>{clearTimeout(T);const v=e.target.value;T=setTimeout(()=>set("q",v),120)});
  $("#cmxSort").addEventListener("click",e=>openMenu(e.currentTarget,CMX_SORT,X.sort,v=>{sfx.tap();set("sort",v)}));
  $("#cmxPer").addEventListener("click",e=>openMenu(e.currentTarget,CMX_PER.map(x=>[x[0],x[1]]),X.per,v=>{sfx.tap();set("per",v)}));
  $("#cmxMine").addEventListener("click",e=>{const on=e.currentTarget.getAttribute("aria-checked")!=="true";e.currentTarget.setAttribute("aria-checked",on);sfx.tap();set("mine",on)});
  $("#cmxReset").addEventListener("click",()=>{sfx.tap();reset()});
  $("#cmxMore").addEventListener("click",()=>{X.n+=20;sfx.tap();list()});
  $("#cmxList").addEventListener("click",e=>{const b=e.target.closest("[data-del]");if(!b)return;A().splice(+b.dataset.del,1);saveCM();all();renderCM()})}

function setOv(mode,nb){const o=$("#ov"),t=esc(PG.m.title||"Untitled");
  if(mode==="load"){o.className="ov";o.innerHTML=`<div><span class="blink">LOADING…</span></div>`}
  else if(mode==="idle"){o.className="ov";o.innerHTML=`<div><b>${t}</b><span class="blink">TAP TO START</span><small>beta · micro build</small></div>`}
  else{o.className="ov end";o.innerHTML=`<div><b>Game over</b><span class="blink">TAP TO RETRY</span></div>`}}
function tvIdle(){const x=$("#tvc").getContext("2d");x.imageSmoothingEnabled=false;
  const g=x.createLinearGradient(0,0,0,120);g.addColorStop(0,rgb(PG.pal.B));g.addColorStop(1,rgb(PG.pal.D));x.fillStyle=g;x.fillRect(0,0,160,120);
  x.drawImage(PG.art,46,8,68,68);setOv("idle")}
async function tvBoot(me){
  /* real prep first (cover is ready, one painted frame), then a short minimum of snow so the hiss reads as a TV */
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  await wait(Q?900:500);if(PG!==me)return;
  me.ready=true;const s=$("#scr");if(!s)return;s.classList.remove("hiss");tvIdle();tvPower();sfx.play();
  if(me.want){me.want=false;playBeta()}}
function tvPower(){const s=$("#scr");if(RM)return;s.classList.remove("pon");void s.offsetWidth;s.classList.add("pon")}
function burst(){const s=$("#scr");s.classList.add("burst");setTimeout(()=>s.classList.remove("burst"),380)}
function startGame(){
  if(!PG||!PG.pal)return;if(!PG.ready){PG.want=true;return}stopGame();const c=$("#tvc"),x=c.getContext("2d"),inp=PG.inp;x.imageSmoothingEnabled=false;
  Object.assign(inp,{x:.5,l:0,r:0,q:[]});PG.game=GAMES[PG.kind](inp,PG.pal);PG.score=0;PG.run=true;
  $("#scr").classList.add("playing");$("#led").classList.add("on");burst();sfx.in();
  let last=performance.now();
  const loop=now=>{if(!PG||!PG.run)return;if(Q<2&&now-last<(Q?30:45)){PG.raf=requestAnimationFrame(loop);return}const dt=Math.min(.05,(now-last)/1e3);last=now;
    inp.x=clamp(inp.x+(inp.r-inp.l)*dt*.9,0,1);const g=PG.game;g.step(dt);g.draw(x);inp.q.length=0;
    if(g.score!==PG.score)PG.score=g.score;
    if(g.over){endGame();return}PG.raf=requestAnimationFrame(loop)};
  PG.raf=requestAnimationFrame(loop)}
function stopGame(){if(!PG)return;PG.run=false;cancelAnimationFrame(PG.raf);const s=$("#scr"),l=$("#led");s&&s.classList.remove("playing");l&&l.classList.remove("on")}
function endGame(){
  const s=PG.score,b=store.get("am.best",{}),nb=s>(b[PG.m.id]||0);
  if(nb){b[PG.m.id]=s;store.set("am.best",b);PG.best=s}
  profScore(s);stopGame();PG.endT=performance.now();burst();setOv("end",nb&&s>0);sfx.out()}
async function playBeta(){
  const me=PG;if(!me||!me.pal)return;if(!me.ready){me.want=true;return}
  const d=DATA.find(x=>x.id===me.m.id);if(d){d.played=(d.played||0)+1;persist();profPlay(d.id);$("#pgPlays").textContent=d.played+" игр"}
  sfx.in();stopGame();setOv("idle");
  $("#scr").scrollIntoView({block:"center",behavior:RM?"auto":"smooth"});tvPower();
  await wait(450);if(PG!==me)return;startGame()}
$("#bigplay").addEventListener("click",()=>{if(PG&&PG.pal)playBeta()});
$("#dlbtn").addEventListener("click",()=>{if(!PG)return;const d=DATA.find(x=>x.id===PG.m.id),u=((d&&d.link)||DL_LINKS[PG.m.id]||"").trim();
  if(!/^(https?:\/\/|\.?\/?[\w-])/i.test(u)||!u){toast("Файл для скачивания пока не добавлен");return}
  if(d){d.downloads=(d.downloads!=null&&d.downloads!==""?+d.downloads:DOWNLOADS[d.id]||0)+1;persist();const n=d.downloads;$("#pgDl").textContent=nfmt(n)+" "+plr(n,["загрузка","загрузки","загрузок"])}
  const a=document.createElement("a");a.href=u;a.download="";a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();sfx.play();toast("Загрузка началась")});

/* ============ no page zoom (iOS ignores user-scalable, so block gestures by hand) ============ */
(()=>{const no=e=>e.preventDefault(),o={passive:false};
  ["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,no,o));
  document.addEventListener("touchmove",e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},o);
  addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},o);
  addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&["+","-","=","_","0"].includes(e.key))e.preventDefault()})})();

/* ============ mascot: tap the pigeon ============ */
(()=>{const m=$("#mascot"),mj=m&&m.querySelector(".mjump");if(!m||!mj)return;const COL=["#ff5ec4","#ffd23f","#4dff9a","#3fc4ff","#a56bff","#ffffff"];let last=0;
  const JUMP=[{transform:"none"},{transform:"translateY(-15px) scale(.96,1.07) rotate(-4deg)",offset:.3},{transform:"translateY(0) scale(1.08,.9)",offset:.55},{transform:"translateY(-6px) scale(.99,1.02) rotate(2deg)",offset:.75},{transform:"none"}];
  m.addEventListener("click",()=>{
    sfx.tap();beep(660,.06,"square",.04);beep(520,.09,"square",.04,.07);
    if(RM||Q===0)return;
    if(mj.animate)mj.animate(JUMP,{duration:620,easing:"cubic-bezier(.3,.9,.4,1)"});
    const now=performance.now();if(now-last<160||m.querySelectorAll(".cf").length>30)return;last=now;
    for(let i=0;i<14;i++){const c=document.createElement("i");c.className="cf";const a=Math.random()*6.283,d=50+Math.random()*70;
      c.style.cssText=`--c:${COL[i%6]};--dx:${Math.cos(a)*d|0}px;--dy:${Math.sin(a)*d-30|0}px;--r:${Math.random()*360|0}deg;width:${i%3?5:8}px;height:${i%3?5:8}px`;
      m.append(c);setTimeout(()=>c.remove(),900)}})})();

/* ============ boot ============ */
(async()=>{
  document.body.classList.toggle("scan",SET.scan);bgResize();
  await Promise.all([loadSprites(),document.fonts?document.fonts.ready:0]);
  try{await Promise.all([document.fonts.load('500 20px "Tektur"','Аб Ab'),document.fonts.load('700 36px "Tektur"','Аб Ab'),document.fonts.load('700 36px "Pixelify Sans"')])}catch(e){}
  profVisit();sync();await render(true);
  $("#boot").classList.add("done");setTimeout(()=>$("#boot").remove(),800);
  requestAnimationFrame(frame);
})();
})();
</script>
